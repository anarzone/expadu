# The civilian spine — the steps every resident owes regardless of why they
# came. Previously six near-identical cards per concept, one per branch, of
# which only the `core` copy was ever reviewed; the other five sat unapproved
# and every mainstream branch fell through to the unreviewed catalogue.
#
# They were never duplicates: the EU card explains freedom of movement, the
# student card ties registration to enrolment, the family card says "including
# children". Merging them used to mean rewriting all of that into one paragraph.
# With `description_variants` it does not — every sentence below was MOVED from
# the branch card that already carried it, unchanged, and the shared paragraph
# is core.anmeldung's own approved prose.
#
# NOT APPROVED. Nothing here reaches the verified plan until a human reviews it
# and adds the approval block; see
# docs/bureaucracy-gaps/2026-08-23-civilian-spine-per-branch-approval.md.
situation:
  - core
  - eu_employee
  - non_eu_employee
  - non_eu_employee_blue_card
  - non_eu_employee_chancenkarte
  - student
  - freelancer
  - freelancer_gewerbe
  - family_reunification
  - family_reunification_of_german
  - family_reunification_of_eu_citizen

tasks:
  - title: Register your address (Anmeldung)
    key: spine.anmeldung
    depends_on: []
    # Moved verbatim from core.anmeldung, the copy that was reviewed.
    description: |
      Every resident in Germany must register their address within 2 weeks of
      moving in (§17 BMG). The Meldebescheinigung is the document everything
      else hangs off — tax ID, bank account, insurance. Missing the deadline
      is technically finable (up to €1,000), but in practice tolerated when no
      appointment was available — register as soon as you can, don't panic.
    description_variants:
      # Each body below is the sentence its own branch card already carried.
      - applies_if: [{citizenship_group: eu}]
        body: |
          As an EU citizen you don't need a visa or residence permit — freedom of
          movement covers you. This is the one thing you can't skip.
      - applies_if: [{citizenship_group: non_eu}]
        body: |
          Without the Meldebescheinigung you can't get a Steuer-ID, open a bank
          account, or finalise your residence permit. Arriving from abroad you
          must appear in person — the proxy route only exists for moves within
          Germany.
      - applies_if: [{purpose: study}]
        body: |
          Without the Meldebescheinigung you can't enrol at university. Slots fill
          fast in September and October — try booking as soon as you have a
          housing contract. If you're in a dorm, the Studierendenwerk issues the
          landlord confirmation.
      - applies_if: [{purpose: family}]
        body: |
          Every family member must be registered — including children. Book a
          single appointment for the whole family and say how many people are
          coming, so the Bürgeramt allocates enough time. Each person receives
          their own Meldebescheinigung, needed for school, daycare, health
          insurance and the permit applications.
      - applies_if: [{purpose: freelance}]
        body: |
          For freelancers it's doubly important — the Meldebescheinigung is the
          key to your Steuer-ID, your bank account, and the tax office knowing
          where to send your Steuernummer.
    phase: arrival
    urgency: critical
    deadline_type: days_since_move_in
    deadline_days: 14
    booking_service_key: anmeldung
    documents_required:
      - label: Passport or EU ID card
        note: Bring the passport if you have one — the current address gets entered into it.
      - label: Wohnungsgeberbescheinigung (Cologne form, signed by landlord/main tenant)
        note: A rental contract or informal letter is NOT sufficient, the move-in date may not be in the future, and it cannot be submitted later — without it the registration simply doesn't happen that day.
        tone: warn
      # Scoped: only handed to the people who actually need them. Previously
      # these lived on the family and non-EU cards; a single person moving alone
      # was never shown them, and must not be now.
      - label: Residence documents you already hold
        note: eAT, visa, or Fiktionsbescheinigung — bring whatever you have.
        applies_if: [{citizenship_group: non_eu}]
      - label: ID documents of ALL persons moving in
        note: For every person 16+, a signed registration form is needed — plus a power of attorney if they don't appear in person.
        applies_if: [{purpose: family}]
      - label: Marriage or partnership certificate
        note: Foreign certificates need a translation by a publicly appointed/sworn translator in Germany — originals + translations must be shown. Getting originals and apostilles from abroad later is the single most painful retrofit, so bring them now.
        applies_if: [{purpose: family}]
      - label: Birth certificates for children moving with you
        note: Same sworn-translation rule. A minor moving with only one parent also needs the other parent's consent declaration (Cologne form).
        applies_if: [{purpose: family}]
    links:
      - https://www.stadt-koeln.de/service/produkte/00415/index.html
    how_to_steps:
      - title: Get the Wohnungsgeberbescheinigung from your landlord
        body: It's Cologne's own form (Formular-Server 02-F17) — send it to your landlord or main tenant before moving day. If you live in your own property, the self-declaration on the same form suffices. This is the number-one trap; chase it early.
      - title: Pick your route — online, walk-in, or appointment
        body: Cologne now offers Anmeldung fully online via the Serviceportal ("Gemeinsam Online"). In person, Kundenzentren take walk-ins on Mondays and Wednesdays; Tuesday, Thursday and Friday require an appointment. Registration is free either way.
        link: https://termine.stadt-koeln.de/
      - title: Mind the religion field on the form
        body: Declaring a recognized denomination (Catholic, Protestant, Jewish…) enrols you in church tax — 9% of your income tax in NRW, deducted automatically. Leaving later requires a formal, fee-charged Kirchenaustritt at the Amtsgericht. Answer accurately, but know what it means.
      - title: Make digital copies of the Meldebescheinigung
        body: You get it on the spot. Photograph it and back it up — you'll need it for almost everything else on this list.
