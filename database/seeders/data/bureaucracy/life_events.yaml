situation:
  - core
  - eu_employee
  - non_eu_employee
  - non_eu_employee_blue_card
  - non_eu_employee_chancenkarte
  - student
  - freelancer
  - freelancer_gewerbe
  - family_reunification
  - family_reunification_of_german
  - family_reunification_of_eu_citizen

tasks:
  - title: "Your baby's residence status — check citizenship first"
    key: le.child_permit
    trigger: child_born
    eu_filter: non_eu_only
    depends_on: []
    # Source-checked (claims verified daily). Not approved: a life-event card's date ({trigger}_at) isn't a registered fact.
    review_status: legacy
    jurisdiction: de-nrw-cologne
    reviewed_by: automated_source_check
    content_version: 2026-10-30.1
    source_verification: quote_checked
    legal_sources:
      - {kind: primary, label: '§4 StAG — Erwerb durch Geburt', url: 'https://www.gesetze-im-internet.de/stag/__4.html'}
      - {kind: primary, label: '§33 AufenthG — Geburt eines Kindes im Bundesgebiet', url: 'https://www.gesetze-im-internet.de/aufenthg_2004/__33.html'}
      - {kind: primary, label: '§81 AufenthG — Beantragung des Aufenthaltstitels', url: 'https://www.gesetze-im-internet.de/aufenthg_2004/__81.html'}
      - {kind: primary, label: '§18 PStG — Anzeige', url: 'https://www.gesetze-im-internet.de/pstg/__18.html'}
      - {kind: primary, label: '§1626a BGB — Elterliche Sorge nicht miteinander verheirateter Eltern; Sorgeerklärungen', url: 'https://www.gesetze-im-internet.de/bgb/__1626a.html'}
      - {kind: primary, label: '§1626b BGB — Besondere Wirksamkeitsvoraussetzungen der Sorgeerklärung', url: 'https://www.gesetze-im-internet.de/bgb/__1626b.html'}
      - {kind: implementation, label: 'Stadt Köln — Erwerb der deutschen Staatsangehörigkeit durch Geburt in Deutschland', url: 'https://www.stadt-koeln.de/service/produkte/00479/index.html'}
      - {kind: implementation, label: 'Stadt Köln — Beurkundung von Geburten', url: 'https://www.stadt-koeln.de/service/produkt/beurkundung-von-geburten-1'}
      - {kind: implementation, label: 'Stadt Köln — Aufenthaltserlaubnis für Kinder von ausländischen Staatsangehörigen', url: 'https://www.stadt-koeln.de/service/produkte/20336/index.html'}
    claims:
      - id: citizenship-five-years
        states: a parent has lawfully lived in Germany for five years
        source: '§4 StAG — Erwerb durch Geburt'
        quote: seit fünf Jahren rechtmäßig seinen gewöhnlichen Aufenthalt im Inland hat
      - id: citizenship-permanent-right
        states: has a permanent right of residence
        source: '§4 StAG — Erwerb durch Geburt'
        quote: ein unbefristetes Aufenthaltsrecht
      - id: citizenship-niederlassungserlaubnis
        states: such as a Niederlassungserlaubnis
        source: 'Stadt Köln — Erwerb der deutschen Staatsangehörigkeit durch Geburt in Deutschland'
        quote: oder eine Niederlassungserlaubnis besitzt.
      - id: citizenship-eu
        states: EU/EEA citizen with free-movement rights
        source: 'Stadt Köln — Erwerb der deutschen Staatsangehörigkeit durch Geburt in Deutschland'
        quote: freizügigkeitsberechtigte Unionsbürger
      - id: citizenship-eea
        states: EU/EEA citizen
        source: 'Stadt Köln — Erwerb der deutschen Staatsangehörigkeit durch Geburt in Deutschland'
        quote: Staatsangehörige*r eines EWR
      - id: citizenship-registered-by-standesamt
        states: The Standesamt that certifies the birth registers German citizenship
        source: 'Stadt Köln — Erwerb der deutschen Staatsangehörigkeit durch Geburt in Deutschland'
        quote: Der Erwerb der deutschen Staatsangehörigkeit wird durch das für die Beurkundung der Geburt des Kindes zuständige Standesamt eingetragen.
      - id: permit-ex-officio-both-parents
        states: at the birth both parents (or the parent with sole custody) held a German residence permit (an Aufenthaltserlaubnis, a Niederlassungserlaubnis or an Erlaubnis zum Daueraufenthalt – EU), the child gets its own residence permit without a formal application (§33 AufenthG)
        source: '§33 AufenthG — Geburt eines Kindes im Bundesgebiet'
        quote: Wenn zum Zeitpunkt der Geburt beide Elternteile oder der allein personensorgeberechtigte Elternteil eine Aufenthaltserlaubnis, eine Niederlassungserlaubnis oder eine Erlaubnis zum Daueraufenthalt – EU besitzen, wird dem im Bundesgebiet geborenen Kind die Aufenthaltserlaubnis von Amts wegen erteilt.
      - id: permit-section-33
        states: If not German, get the §33 permit
        source: '§33 AufenthG — Geburt eines Kindes im Bundesgebiet'
        quote: Einem Kind, das im Bundesgebiet geboren wird, kann abweichend von den §§ 5 und 29 Abs. 1 Nr. 2 von Amts wegen eine Aufenthaltserlaubnis erteilt werden
      - id: permit-one-parent
        states: If only one parent holds such a permit, the authorities can issue it without an application, but don't have to
        source: '§33 AufenthG — Geburt eines Kindes im Bundesgebiet'
        quote: kann abweichend von den §§ 5 und 29 Abs. 1 Nr. 2 von Amts wegen eine Aufenthaltserlaubnis erteilt werden, wenn ein Elternteil eine Aufenthaltserlaubnis, eine Niederlassungserlaubnis oder eine Erlaubnis zum Daueraufenthalt – EU besitzt
      - id: apply-within-six-months
        states: apply for the permit within six months of the birth
        source: '§81 AufenthG — Beantragung des Aufenthaltstitels'
        quote: Für ein im Bundesgebiet geborenes Kind, dem nicht von Amts wegen ein Aufenthaltstitel zu erteilen ist, ist der Antrag innerhalb von sechs Monaten nach der Geburt zu stellen.
      - id: apply-section-81
        states: (§81 AufenthG)
        source: '§81 AufenthG — Beantragung des Aufenthaltstitels'
        quote: ist der Antrag innerhalb von sechs Monaten nach der Geburt zu stellen
      - id: apply-deadline
        covers: deadline
        source: '§81 AufenthG — Beantragung des Aufenthaltstitels'
        quote: ist der Antrag innerhalb von sechs Monaten nach der Geburt zu stellen
      - id: parent-on-visa
        states: If a parent held a visa or was allowed to stay visa-free at the birth, the child's stay counts as permitted only until that visa or visa-free stay ends
        source: '§33 AufenthG — Geburt eines Kindes im Bundesgebiet'
        quote: Der Aufenthalt eines im Bundesgebiet geborenen Kindes, dessen Mutter oder Vater zum Zeitpunkt der Geburt im Besitz eines Visums ist oder sich visumfrei aufhalten darf, gilt bis zum Ablauf des Visums oder des rechtmäßigen visumfreien Aufenthalts als erlaubt.
      - id: birth-report-one-week
        states: The birth must be reported to the Standesamt within one week
        source: '§18 PStG — Anzeige'
        quote: Die Geburt eines Kindes ist dem Standesamt, in dessen Zuständigkeitsbereich es geboren ist, binnen einer Woche anzuzeigen
      - id: hospital-registers
        states: If your baby is born in a Cologne hospital, the clinic handles the registration
        source: 'Stadt Köln — Beurkundung von Geburten'
        quote: Kommt Ihr Kind in einem Kölner Krankenhaus zur Welt, wickeln die Kliniken die Formalitäten der Anmeldung mit uns ab.
      - id: meldeamt-informed
        states: The Standesamt then informs your Meldeamt
        source: 'Stadt Köln — Beurkundung von Geburten'
        quote: Ihr Meldeamt erhält von uns eine Mitteilung über die Geburt Ihres Kindes.
      - id: child-registered
        states: that completes your child's registration at your address
        source: 'Stadt Köln — Beurkundung von Geburten'
        quote: Die Anmeldung ist damit erfolgt.
      - id: no-visit
        states: No visit is needed
        source: 'Stadt Köln — Erwerb der deutschen Staatsangehörigkeit durch Geburt in Deutschland'
        quote: Eine Vorsprache ist nicht erforderlich.
      - id: checked-ex-officio
        states: the city checks this on its own
        source: 'Stadt Köln — Erwerb der deutschen Staatsangehörigkeit durch Geburt in Deutschland'
        quote: Wir prüfen den Erwerb der deutschen Staatsangehörigkeit von Amts wegen.
      - id: check-free
        states: free of charge
        source: 'Stadt Köln — Erwerb der deutschen Staatsangehörigkeit durch Geburt in Deutschland'
        quote: Für die Prüfung auf Erwerb der deutschen Staatsangehörigkeit durch Geburt im Inland fallen keine Gebühren an.
      - id: told-unasked
        states: tells you without being asked if your child is German
        source: 'Stadt Köln — Erwerb der deutschen Staatsangehörigkeit durch Geburt in Deutschland'
        quote: Wenn Ihr Kind die deutsche Staatsangehörigkeit erworben hat, werden wir Sie unaufgefordert darüber informieren.
      - id: check-takes-weeks
        states: The check takes some weeks
        source: 'Stadt Köln — Erwerb der deutschen Staatsangehörigkeit durch Geburt in Deutschland'
        quote: da die Prüfung auf Erwerb der deutschen Staatsangehörigkeit einige Wochen in Anspruch nimmt
      - id: home-consulate
        states: register your child with your home consulate
        source: 'Stadt Köln — Erwerb der deutschen Staatsangehörigkeit durch Geburt in Deutschland'
        quote: ist es grundsätzlich erforderlich, dass Sie es auch bei Ihrem zuständigen Heimatkonsulat anmelden
      - id: permit-passport
        states: a valid passport from your child's country, recognised in Germany
        source: 'Stadt Köln — Aufenthaltserlaubnis für Kinder von ausländischen Staatsangehörigen'
        quote: Anerkannter und gültiger Nationalpass des Kindes
      - id: permit-photo
        states: Digital biometric passport photo
        source: 'Stadt Köln — Aufenthaltserlaubnis für Kinder von ausländischen Staatsangehörigen'
        quote: Digitales biometrisches Passfoto
      - id: paternity-for-birth-certificate
        states: For the father to be entered on the birth certificate straight away, the Standesamt needs the Vaterschaftsanerkennung when it certifies the birth
        source: 'Stadt Köln — Beurkundung von Geburten'
        quote: Soll der Vater direkt in die Geburtsurkunde eingetragen werden, benötigen wir zur Beurkundung Ihre Geburtsurkunde, die Geburtsurkunde des Vaters, Ihre Ausweise und die Vaterschaftsanerkennung.
      - id: paternity-where
        states: you can do it at the Standesamt or the Bezirksjugendamt
        source: 'Stadt Köln — Beurkundung von Geburten'
        quote: Die Vaterschaftsanerkennung können Sie bei uns oder im Bezirksjugendamt erledigen.
      - id: custody-unmarried
        states: you share custody only through Sorgeerklärungen, by marrying or by a family court order
        source: '§1626a BGB — Elterliche Sorge nicht miteinander verheirateter Eltern; Sorgeerklärungen'
        quote: Sind die Eltern bei der Geburt des Kindes nicht miteinander verheiratet, so steht ihnen die elterliche Sorge gemeinsam zu,
      - id: custody-mother
        states: otherwise the mother has custody
        source: '§1626a BGB — Elterliche Sorge nicht miteinander verheirateter Eltern; Sorgeerklärungen'
        quote: Im Übrigen hat die Mutter die elterliche Sorge.
      - id: sorge-before-birth
        states: You can make the Sorgeerklärung before the birth
        source: '§1626b BGB — Besondere Wirksamkeitsvoraussetzungen der Sorgeerklärung'
        quote: Die Sorgeerklärung kann schon vor der Geburt des Kindes abgegeben werden.
      - id: sorge-where
        states: at the Bezirksjugendamt or with a notary (for a fee), not at the Standesamt
        source: 'Stadt Köln — Beurkundung von Geburten'
        quote: Diese können Sie nur im Bezirksjugendamt oder durch Notar*innen (gebührenpflichtig) beurkunden lassen.
    description: |
      Before any permit paperwork: your child may be German by birth. That is the case if, at the birth,
      a parent has lawfully lived in Germany for five years and also has a permanent right of residence,
      such as a Niederlassungserlaubnis, or by being an EU/EEA citizen with free-movement rights. Both conditions
      apply to EU/EEA parents too. The Standesamt that certifies the birth registers German citizenship.
      If the child isn't German and at the birth both parents (or the parent with sole custody) held a German residence permit (an Aufenthaltserlaubnis, a Niederlassungserlaubnis or an Erlaubnis zum Daueraufenthalt – EU), the child gets its own residence permit without a formal application (§33 AufenthG).
      You still need to get in touch with the Ausländeramt for it; the city's child-permit page is in the links.
      In every other case, apply for the permit within six months of the birth (§81 AufenthG).
    phase: ongoing
    urgency: high
    deadline_type: days_since_event
    deadline_days: 181
    documents_required:
      - label: Child's birth certificate
        note: Issued by the Standesamt when it certifies the birth (see the first step).
      - label: "Child's passport"
        note: Needs to be a valid passport from your child's country, recognised in Germany. Getting it from your home consulate is often what takes longest, so don't wait for it before contacting the Ausländeramt.
      - label: Digital biometric passport photo
    links:
      - https://www.gesetze-im-internet.de/aufenthg_2004/__33.html
      - https://www.gesetze-im-internet.de/aufenthg_2004/__81.html
      - https://www.stadt-koeln.de/service/produkte/00479/index.html
      - https://www.stadt-koeln.de/service/produkt/beurkundung-von-geburten-1
      - https://www.stadt-koeln.de/service/produkte/20336/index.html
      - https://www.gesetze-im-internet.de/bgb/__1626a.html
    how_to_steps:
      - title: Let the Standesamt certify the birth
        body: The birth must be reported to the Standesamt within one week. If your baby is born in a Cologne hospital, the clinic handles the registration. The Standesamt then informs your Meldeamt, and that completes your child's registration at your address.
      - title: The city checks whether your child is German
        body: No visit is needed — the city checks this on its own, free of charge, and tells you without being asked if your child is German. The check takes some weeks, so register your child with your home consulate soon.
      - title: If not German, get the §33 permit
        body: When both parents (or the parent with sole custody) held one of the residence permits named above at the birth, the permit comes without a formal application, but contact the Ausländeramt anyway (city page in the links). If only one parent holds such a permit, the authorities can issue it without an application, but don't have to — so apply for the permit within six months of the birth. If a parent held a visa or was allowed to stay visa-free at the birth, the child's stay counts as permitted only until that visa or visa-free stay ends. That can be sooner than the application deadline, so in that case apply before it ends.
      - title: Not married to each other? Sort paternity and custody
        body: For the father to be entered on the birth certificate straight away, the Standesamt needs the Vaterschaftsanerkennung when it certifies the birth, so sort it out early; you can do it at the Standesamt or the Bezirksjugendamt. Paternity alone doesn't give joint custody — you share custody only through Sorgeerklärungen, by marrying or by a family court order; otherwise the mother has custody. This decides who has sole custody for the permit rule above. You can make the Sorgeerklärung before the birth, at the Bezirksjugendamt or with a notary (for a fee), not at the Standesamt.

  - title: Reserve a Kita place via LITTLE BIRD
    key: le.kita
    trigger: child_born
    depends_on: []
    # Source-checked (claims verified daily). Not approved: a life-event card's date ({trigger}_at) isn't a registered fact.
    review_status: legacy
    jurisdiction: de-nrw-cologne
    reviewed_by: automated_source_check
    content_version: 2026-10-30.1
    source_verification: quote_checked
    legal_sources:
      - {kind: primary, label: '§24 SGB VIII — Anspruch auf Förderung in Tageseinrichtungen und in Kindertagespflege', url: 'https://www.gesetze-im-internet.de/sgb_8/__24.html'}
      - {kind: implementation, label: 'Stadt Köln — Häufig gestellte Fragen zu LITTLE BIRD', url: 'https://www.stadt-koeln.de/artikel/65229/index.html'}
      - {kind: implementation, label: 'Stadt Köln — Vormerkung eines Kindergartenplatzes', url: 'https://www.stadt-koeln.de/service/produkt/vormerkung-eines-kindergartenplatzes'}
      - {kind: implementation, label: 'Stadt Köln — Elternbeiträge für Kindertageseinrichtungen und OGTS', url: 'https://www.stadt-koeln.de/service/produkt/elternbeitraege-fuer-kindertageseinrichtungen-ogts'}
      - {kind: implementation, label: 'Stadt Köln — Kinderbetreuung', url: 'https://www.stadt-koeln.de/leben-in-koeln/familie/betreuung'}
    claims:
      - id: right-after-birth
        states: You can reserve a place for your child right after the birth
        source: 'Stadt Köln — Vormerkung eines Kindergartenplatzes'
        quote: Bereits unmittelbar nach der Geburt haben Sie die Möglichkeit, Ihr Kind für einen Platz bei uns vorzumerken.
      - id: online-or-in-writing
        states: online or in writing at the Kita
        source: 'Stadt Köln — Vormerkung eines Kindergartenplatzes'
        quote: Dies können Sie online oder schriftlich in der jeweiligen Kindertageseinrichtung erledigen.
      - id: not-before-birth
        states: You cannot send a request for an unborn child
        source: 'Stadt Köln — Häufig gestellte Fragen zu LITTLE BIRD'
        quote: Warum ist es nicht möglich, eine Betreuungsanfrage für ein ungeborenes Kind zu stellen?
      - id: legal-right-age-one
        states: From age 1, children have a legal right
        source: 'Stadt Köln — Vormerkung eines Kindergartenplatzes'
        quote: Seit 1. August 2013 haben Kinder ab dem vollendeten 1. Lebensjahr einen Rechtsanspruch auf einen Platz in einer Kindertageseinrichtung oder eine Betreuung in der Kindertagespflege.
      - id: legal-basis
        states: a legal right (§24 SGB VIII) to a place in a Kita or with a childminder (Kindertagespflege)
        source: '§24 SGB VIII — Anspruch auf Förderung in Tageseinrichtungen und in Kindertagespflege'
        quote: Anspruch auf frühkindliche Förderung in einer Tageseinrichtung oder in Kindertagespflege
      - id: as-early-as-possible
        states: Register your child as early as possible
        source: 'Stadt Köln — Häufig gestellte Fragen zu LITTLE BIRD'
        quote: Sie sollten Ihr Kind so früh wie möglich für einen Betreuungsplatz anmelden.
      - id: six-months-notice
        states: You must state your child's care need at least six months before the start you want
        source: 'Stadt Köln — Häufig gestellte Fragen zu LITTLE BIRD'
        quote: spätestens sechs Monate vor Inanspruchnahme
      - id: central-allocation
        states: The city's Amt für Kinder, Jugend und Familie hands out places in city-run Kitas centrally
        source: 'Stadt Köln — Vormerkung eines Kindergartenplatzes'
        quote: Die Vergabe der städtischen Betreuungsplätze erfolgt zentral durch das Amt für Kinder, Jugend und Familie.
      - id: free-carriers
        states: Kitas not run by the city (free carriers) mostly hand out their places themselves
        source: 'Stadt Köln — Häufig gestellte Fragen zu LITTLE BIRD'
        quote: Die Platzvergabe bei Einrichtungen in freier Trägerschaft erfolgt überwiegend dezentral in der jeweiligen Einrichtung.
      - id: six-requests
        states: You can hold up to six active requests per child per care year
        source: 'Stadt Köln — Häufig gestellte Fragen zu LITTLE BIRD'
        quote: Sie können für jedes Kind bis zu sechs aktive Betreuungsanfragen pro Betreuungsjahr stellen.
      - id: care-year
        states: A care year runs from 1 August to 31 July
        source: 'Stadt Köln — Häufig gestellte Fragen zu LITTLE BIRD'
        quote: Ein Betreuungsjahr beginnt immer am 1. August und endet am 31. Juli des Folgejahres.
      - id: no-claim-to-reserved-place
        states: A reservation does not give you a right to a place at that specific Kita
        source: 'Stadt Köln — Häufig gestellte Fragen zu LITTLE BIRD'
        quote: Sie haben keinen Anspruch auf den vorgemerkten Betreuungsplatz in einer konkreten Einrichtung.
      - id: city-kita-age
        states: City-run Kitas only take children registered in Köln aged 1 to 6 years
        source: 'Stadt Köln — Vormerkung eines Kindergartenplatzes'
        quote: Einen Platz in einer städtischen Kindertageseinrichtung gibt es nur für in Köln gemeldete Kinder im Alter von 1 bis 6 Jahren.
      - id: reserve-before-moving
        states: You can reserve before you live in Köln
        source: 'Stadt Köln — Vormerkung eines Kindergartenplatzes'
        quote: Wenn Sie noch nicht in Köln wohnen, können Sie Ihr Kind schon vormerken lassen.
      - id: erstwohnsitz
        states: you only get an offer once at least one parent or guardian is registered with their main residence (Erstwohnsitz) in Köln
        source: 'Stadt Köln — Vormerkung eines Kindergartenplatzes'
        quote: Ein Platzangebot kann aber erst erfolgen, wenn mindestens ein Elternteil, eine Erziehungsberechtigte oder ein Erziehungsberechtigter mit Erstwohnsitz in Köln gemeldet ist.
      - id: free-reservation
        states: Reserving is free
        source: 'Stadt Köln — Vormerkung eines Kindergartenplatzes'
        quote: Für die Vormerkung werden keine Gebühren erhoben.
      - id: income-based
        states: the parent contribution depends on your income and the care time you choose
        source: 'Stadt Köln — Elternbeiträge für Kindertageseinrichtungen und OGTS'
        quote: orientiert sich an Ihrem Einkommen und an der von Ihnen gewählten Betreuungsdauer
      - id: account-needed
        states: Once you are registered in the parent portal, you can reserve your child at the Kita you prefer
        source: 'Stadt Köln — Häufig gestellte Fragen zu LITTLE BIRD'
        quote: Wenn Sie im Elternportal registriert sind, haben Sie die Möglichkeit, Ihr Kind bei Ihrer bevorzugten Einrichtung vorzumerken.
      - id: no-ranking
        states: All your requests count the same; there is no ranking
        source: 'Stadt Köln — Häufig gestellte Fragen zu LITTLE BIRD'
        quote: Nein, die Anfragen sind alle gleichwertig.
      - id: other-place
        states: if there is no place at the Kita you named, the city offers you another place or a place with a childminder
        source: 'Stadt Köln — Vormerkung eines Kindergartenplatzes'
        quote: Sollte in der von Ihnen genannten Kindertageseinrichtung kein Platz zur Verfügung stehen, unterbreiten wir Ihnen ein anderes Platzangebot oder bieten einen Platz in der Kindertagespflege an.
      - id: offer-locks
        states: When you get an offer, all your reservations for that care period are locked
        source: 'Stadt Köln — Häufig gestellte Fragen zu LITTLE BIRD'
        quote: Durch das Platzangebot werden alle Ihre Vormerkungen, die in den Betreuungszeitraum fallen, gesperrt.
      - id: two-weeks-to-answer
        states: You have two weeks to accept or decline the offer in your profile
        source: 'Stadt Köln — Häufig gestellte Fragen zu LITTLE BIRD'
        quote: Sie haben innerhalb von zwei Wochen die Möglichkeit, in Ihrem Profil das Platzangebot anzunehmen oder abzulehnen.
      - id: decline-city-offer
        states: If you decline an offer from a city-run Kita, your locked reservations at city-run Kitas stay switched off
        source: 'Stadt Köln — Häufig gestellte Fragen zu LITTLE BIRD'
        quote: Lehnen Sie ein Platzangebot in einer städtischen Kindertageseinrichtung ab, gilt außerdem, dass alle durch das Platzangebot gesperrten Vormerkungen in städtischen Kindertageseinrichtungen auch nach der Ablehnung deaktiviert bleiben.
      - id: request-again
        states: if you still want them, you must request them again
        source: 'Stadt Köln — Häufig gestellte Fragen zu LITTLE BIRD'
        quote: Bei weiterem Interesse müssen Sie diese erneut anfragen.
      - id: after-rejection
        states: If your requests are rejected, you can send further requests to other Kitas
        source: 'Stadt Köln — Häufig gestellte Fragen zu LITTLE BIRD'
        quote: Wenn Ihre Betreuungsanfragen abgelehnt wurden, haben Sie die Möglichkeit, weitere Betreuungsanfragen bei anderen Einrichtungen zu stellen
      - id: care-bands
        states: Depending on what the Kita offers, you can choose a weekly care time of 25, 35 or 45 hours
        source: 'Stadt Köln — Häufig gestellte Fragen zu LITTLE BIRD'
        quote: Sie können, je nach aktuellem Angebot der gewünschten Kindertagesstätte, eine wöchentliche Betreuungszeit von 25, 35 oder 45 Stunden auswählen.
      - id: familienbuero
        states: The city's Familienbüro helps with questions about childcare
        source: 'Stadt Köln — Kinderbetreuung'
        quote: Familienbüro – bei Fragen zur Kinderbetreuung
    description: |
      Cologne hands out childcare places through the LITTLE BIRD parent portal.
      You can reserve a place for your child right after the birth, online or in writing at the Kita.
      You cannot send a request for an unborn child.

      From age 1, children have a legal right (§24 SGB VIII) to a place in a Kita or with a childminder (Kindertagespflege).

      Register your child as early as possible. You must state your child's care need at least six months before the start you want.
    phase: ongoing
    urgency: high
    deadline_type: none
    documents_required:
      - label: LITTLE BIRD account (only for online requests)
    links:
      - https://portal-koeln.little-bird.de/
      - https://www.stadt-koeln.de/service/produkt/vormerkung-eines-kindergartenplatzes
      - https://www.stadt-koeln.de/artikel/65229/index.html
      - https://www.stadt-koeln.de/leben-in-koeln/familie/betreuung
    how_to_steps:
      - title: Check who can get a place
        body: City-run Kitas only take children registered in Köln aged 1 to 6 years. You can reserve before you live in Köln, but you only get an offer once at least one parent or guardian is registered with their main residence (Erstwohnsitz) in Köln.
      - title: Register and send your requests
        body: Once you are registered in the parent portal, you can reserve your child at the Kita you prefer. You can hold up to six active requests per child per care year. A care year runs from 1 August to 31 July. All your requests count the same; there is no ranking. A reservation does not give you a right to a place at that specific Kita.
      - title: Ask city-run and free-carrier Kitas
        body: The city's Amt für Kinder, Jugend und Familie hands out places in city-run Kitas centrally. Kitas not run by the city (free carriers) mostly hand out their places themselves, so send requests to them too. Choose Kitas near home and near work. For a city-run Kita, if there is no place at the Kita you named, the city offers you another place or a place with a childminder.
      - title: Answer an offer in time
        body: When you get an offer, all your reservations for that care period are locked. You have two weeks to accept or decline the offer in your profile. If you decline an offer from a city-run Kita, your locked reservations at city-run Kitas stay switched off; if you still want them, you must request them again.
      - title: If a Kita says no
        body: If your requests are rejected, you can send further requests to other Kitas.
      - title: Know your care time and costs
        body: Depending on what the Kita offers, you can choose a weekly care time of 25, 35 or 45 hours. Reserving is free; the parent contribution depends on your income and the care time you choose.
      - title: Questions? Ask the Familienbüro
        body: The city's Familienbüro helps with questions about childcare. See the city's childcare page in the links.

