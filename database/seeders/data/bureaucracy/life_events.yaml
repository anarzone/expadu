        source: 'Stadt Köln — Eltern-Geld (Leichte Sprache)'
        quote: dann brauchen wir die Einkommens-Nachweise für beide Einkommens-Arten.
      - id: residence-title-doc
        states: 'Non-EU citizens: a valid residence title including the supplementary sheet'
        source: 'Stadt Köln — Elterngeld'
        quote: Wenn Sie aus einem Staat kommen, der nicht zur Europäischen Union gehört, ist ein gültiger Aufenthaltstitel inklusive Zusatzblatt beizufügen.
      - id: prepare-online
        states: You can start the online application before the birth
        source: 'Stadt Köln — Eltern-Geld (Leichte Sprache)'
