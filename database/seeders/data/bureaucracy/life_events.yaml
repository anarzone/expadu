      - {kind: implementation, label: 'Stadt Köln — Aufenthaltserlaubnis zu Studienzwecken', url: 'https://www.stadt-koeln.de/service/produkte/00973/index.html'}
      - {kind: implementation, label: 'Stadt Köln — Informationen zu Fiktionsbescheinigungen', url: 'https://www.stadt-koeln.de/artikel/71447/index.html'}
      - {kind: implementation, label: 'BAMF — Fachkräfte mit akademischer Ausbildung', url: 'https://www.bamf.de/DE/Themen/MigrationAufenthalt/ZuwandererDrittstaaten/Arbeit/Hochschulabsolvent/hochschulabsolvent-node.html'}
    claims:
      - id: title-law
        states: job-search permit after graduating (§20 AufenthG)
        source: '§20 AufenthG — Arbeitsplatzsuche im Anschluss an Aufenthalte im Bundesgebiet'
        quote: wird einem Ausländer nach erfolgreichem Abschluss eines Studiums im Bundesgebiet im Rahmen eines Aufenthalts nach § 16b oder § 16c eine Aufenthaltserlaubnis erteilt
      - id: duration
        states: a residence permit of up to 18 months
        source: '§20 AufenthG — Arbeitsplatzsuche im Anschluss an Aufenthalte im Bundesgebiet'
        quote: für einen Zeitraum von bis zu 18 Monaten erteilt
      - id: qualified-job
        states: to find a job that matches your qualification
        source: 'Stadt Köln — Aufenthaltserlaubnis zu Studienzwecken'
        quote: Diese Zeit können Sie nutzen, um einen Arbeitsplatz zu finden, der Ihrer Qualifikation entspricht.
      - id: may-work
        states: You may work during this time
        source: 'BAMF — Fachkräfte mit akademischer Ausbildung'
        quote: Sie dürfen während dieser Zeit arbeiten.
      - id: no-extension
        states: The permit cannot be extended
        source: 'Stadt Köln — Aufenthaltserlaubnis zu Studienzwecken'
        quote: Eine Verlängerung der Aufenthaltserlaubnis zur Arbeitsplatzsuche ist nicht möglich.
      - id: livelihood
        states: your living costs must be covered for the whole time
        source: 'Stadt Köln — Aufenthaltserlaubnis zu Studienzwecken'
        quote: Ihr Lebensunterhalt muss während der gesamten Dauer der Aufenthaltserlaubnis gesichert sein.
      - id: apply-before
        states: Apply before your student permit expires
        source: 'Stadt Köln — Informationen zu Fiktionsbescheinigungen'
        quote: Wenn Sie rechtzeitig einen Antrag auf Verlängerung oder einen neuen Aufenthaltstitel gestellt haben, das heißt vor Ablauf der Befristung
      - id: permit-continues
        states: your current permit counts as continuing until a decision is made
        source: '§81 AufenthG'
        quote: gilt der bisherige Aufenthaltstitel vom Zeitpunkt seines Ablaufs bis zur Entscheidung der Ausländerbehörde als fortbestehend
      - id: fiktion
        states: A Fiktionsbescheinigung is temporary proof that you may stay in Germany while your application is processed
        source: 'Stadt Köln — Informationen zu Fiktionsbescheinigungen'
        quote: Die Fiktionsbescheinigung ist ein vorübergehender Nachweis, dass Sie während der Bearbeitung Ihres Antrags auf Aufenthaltstitel weiterhin in Deutschland bleiben dürfen.
      - id: self-employment
        states: you can also use the permit to build up self-employed or freelance work
        source: 'Stadt Köln — Aufenthaltserlaubnis zu Studienzwecken'
        quote: Sie haben außerdem die Möglichkeit sich während der Dauer der Aufenthaltserlaubnis eine selbstständige oder freiberufliche Tätigkeit aufzubauen.
      - id: not-linked
        states: The job you find does not have to be linked to your degree
        source: 'Stadt Köln — Aufenthaltserlaubnis zu Studienzwecken'
        quote: Ab diesem Zeitpunkt muss die von Ihnen gefundene Arbeitsstelle keinen Zusammenhang mit Ihrem Studienabschluss erkennen lassen.
      - id: switch-options
        states: meet the requirements for a permit as a skilled worker with an academic degree or for the EU Blue Card, among others
        source: 'Stadt Köln — Aufenthaltserlaubnis zu Studienzwecken'
        quote: Es genügt, wenn Sie die Voraussetzungen zum Erhalt einer Aufenthaltserlaubnis als Fachkraft mit akademischer Ausbildung, zur Forschung, als Beamter oder die Voraussetzungen der Blauen Karte
      - id: skilled-worker-18b
        states: The skilled-worker permit (§18b AufenthG) is for any qualified job
        source: '§18b AufenthG — Fachkräfte mit akademischer Ausbildung'
        quote: Einer Fachkraft mit akademischer Ausbildung wird eine Aufenthaltserlaubnis zur Ausübung jeder qualifizierten Beschäftigung erteilt.
      - id: blue-card-salary
        states: With a certain minimum salary you are entitled to an EU Blue Card
        source: 'BAMF — Fachkräfte mit akademischer Ausbildung'
        quote: Wenn Sie ein bestimmtes Mindestgehalt erhalten, haben Sie einen Rechtsanspruch auf die Erteilung einer Blauen Karte
      - id: doc-degree
        states: Proof that you successfully completed your studies in Germany
        source: 'BAMF — Fachkräfte mit akademischer Ausbildung'
        quote: Haben Sie Ihr Studium in Deutschland erfolgreich abgeschlossen
      - id: doc-livelihood
        states: Proof that you can cover your living costs
        source: '§20 AufenthG — Arbeitsplatzsuche im Anschluss an Aufenthalte im Bundesgebiet'
        quote: Die Erteilung einer Aufenthaltserlaubnis nach Absatz 1 setzt die Lebensunterhaltssicherung voraus.
      - id: doc-insurance
        states: Proof of adequate health insurance
        source: '§2 AufenthG — Begriffsbestimmungen'
        quote: einschließlich ausreichenden Krankenversicherungsschutzes ohne Inanspruchnahme öffentlicher Mittel
      - id: insurance-part-of-livelihood
        states: Health insurance counts as part of your living costs
        source: '§2 AufenthG — Begriffsbestimmungen'
        quote: Der Lebensunterhalt eines Ausländers ist gesichert, wenn er ihn einschließlich ausreichenden Krankenversicherungsschutzes ohne Inanspruchnahme öffentlicher Mittel bestreiten kann.
      - id: student-insurance-ends
        states: Your statutory student health insurance ends at the end of the last semester you enrolled for
        source: '§190 SGB V'
        quote: Die Mitgliedschaft versicherungspflichtiger Studenten endet mit Ablauf des Semesters, für das sie sich zuletzt eingeschrieben oder zurückgemeldet haben
    description: |
      After completing your degree in Germany you can get a residence permit of up to 18 months
      to find a job that matches your qualification.
      You may work during this time.
      The permit cannot be extended, and your living costs must be covered for the whole time.
      Apply before your student permit expires.
    phase: ongoing
    urgency: critical
    deadline_type: none
    booking_service_key: auslaenderbehoerde
    documents_required:
      - label: Proof that you successfully completed your studies in Germany
      - label: Proof of adequate health insurance
        note: Health insurance counts as part of your living costs. Your statutory student health insurance ends at the end of the last semester you enrolled for, so arrange your new cover in time and budget for its cost.
        tone: warn
      - label: Proof that you can cover your living costs
    links:
      - https://www.stadt-koeln.de/service/produkte/00973/index.html
      - https://www.stadt-koeln.de/service/onlinedienste/auslaenderamt/index.html
      - https://www.bamf.de/DE/Themen/MigrationAufenthalt/ZuwandererDrittstaaten/Arbeit/Hochschulabsolvent/hochschulabsolvent-node.html
    how_to_steps:
      - title: Apply before your student permit expires
        body: Apply while your current permit is still valid. If you applied in time, your current permit counts as continuing until a decision is made. A Fiktionsbescheinigung is temporary proof that you may stay in Germany while your application is processed, so ask the Ausländerbehörde about one.
      - title: Work while you search
        body: You may work during this time, and you can also use the permit to build up self-employed or freelance work.
      - title: Found a job? Switch to a work permit
        body: The job you find does not have to be linked to your degree. It is enough to meet the requirements for a permit as a skilled worker with an academic degree or for the EU Blue Card, among others. The skilled-worker permit (§18b AufenthG) is for any qualified job. With a certain minimum salary you are entitled to an EU Blue Card.
