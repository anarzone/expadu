        source: '§1 BEEG — Berechtigte'
        quote: Ein nicht freizügigkeitsberechtigter Ausländer oder eine nicht freizügigkeitsberechtigte Ausländerin ist nur anspruchsberechtigt, wenn diese Person
      - id: settlement-permit
        states: for example a settlement permit
        source: '§1 BEEG — Berechtigte'
        quote: eine Niederlassungserlaubnis oder eine Erlaubnis zum Daueraufenthalt-EU besitzt
      - id: six-months-work
        states: an EU Blue Card or a residence permit that allows work for at least six months
        source: '§1 BEEG — Berechtigte'
        quote: eine Blaue Karte EU, eine ICT-Karte, eine Mobiler-ICT-Karte oder eine Aufenthaltserlaubnis besitzt, die für einen Zeitraum von mindestens sechs Monaten zur Ausübung einer Erwerbstätigkeit berechtigen oder berechtigt haben oder diese erlauben
      - id: never-count
        states: permits for au-pair or seasonal work
        source: '§1 BEEG — Berechtigte'
        quote: nach § 19c Absatz 1 des Aufenthaltsgesetzes zum Zweck der Beschäftigung als Au-Pair oder zum Zweck der Saisonbeschäftigung
      - id: study-job-search
        states: only if you work, take parental leave (Elternzeit) or get certain job-agency benefits
        source: '§1 BEEG — Berechtigte'
        quote: und die Person ist weder erwerbstätig noch nimmt sie Elternzeit nach § 15 dieses Gesetzes oder laufende Geldleistungen nach dem Dritten Buch Sozialgesetzbuch in Anspruch
      - id: war-permits
        states: granted because of a war in your home country
        source: '§1 BEEG — Berechtigte'
        quote: nach § 23 Absatz 1 des Aufenthaltsgesetzes wegen eines Krieges im Heimatland dieser Person
    description: |
      You apply at Cologne's Elterngeld office (Elterngeldstelle), which only takes applications from people living in Cologne.
      You can apply online, or fill in a paper form.
      You can only apply from the day of the birth, and
      back payments are made only for the last three months before the month in which your application arrives, so don't wait.
      No Elterngeld if your taxable income was over €175,000.
      What counts is the last completed tax year before the birth; if you have a partner who also qualifies, both incomes are added together.
    phase: ongoing
    urgency: critical
    deadline_type: days_since_event
    deadline_days: 89
    documents_required:
      - label: 'The original of the special birth-certificate copy titled "Zur Beantragung von Elterngeld"'
        note: Send your application as soon as it arrives.
        tone: warn
      - label: 'If you got maternity pay (Mutterschaftsgeld): a certificate from your health insurer (Krankenkasse)'
        note: Covering the full period before and after the birth.
      - label: 'If your employer topped up your maternity pay: their certificate on the top-up'
        note: Or payslips covering the entire maternity protection period (Mutterschutz).
      - label: 'Employees: payslips from before the month of birth'
        note: 'Mothers: the last 14 payslips. Fathers: the last 12 payslips.'
      - label: 'Self-employed: the relevant tax assessment or records of business income and expenses'
        note: Also fill in the extra forms for the self-employed. Mixed income needs proof for both kinds of income.
      - label: 'Non-EU citizens: a valid residence title including the supplementary sheet (Zusatzblatt)'
    links:
      - https://www.stadt-koeln.de/service/produkte/00793/index.html
      - https://familienportal.nrw/elterngeld
      - https://www.gesetze-im-internet.de/beeg/__1.html
    how_to_steps:
      - title: Get ready during pregnancy
        body: Gather the documents you already can, such as payslips, in one folder. You can start the online application before the birth and save it at any time in the Familienportal.
      - title: Send it as soon as the birth certificate arrives
        body: 'You can only apply from the day of the birth. Send your application as soon as you have the special birth-certificate copy. If you applied online, then send the signed signature page with your documents to the Elterngeldstelle. Couples: both parents must sign.'
      - title: Choose your months in the application
        body: In the form you choose for which months of your child's life you take basic Elterngeld (Basiselterngeld), ElterngeldPlus or the partnership bonus (Partnerschaftsbonus). This choice is yours; we don't recommend any split.
      - title: Non-EU citizens — check your residence title first
        body: |
          Non-EU citizens without EU free-movement rights can only get Elterngeld with certain titles.
          Counts: for example a settlement permit, an EU Blue Card or a residence permit that allows work for at least six months.
          Never counts, for example: permits for au-pair or seasonal work.
          Some permits, such as study or some job-search permits, count only if you work, take parental leave (Elternzeit) or get certain job-agency benefits.
          Extra conditions apply to others, for example permits granted because of a war in your home country.
          If unsure, ask the Elterngeldstelle before planning around the money.

  - title: Apply for Kindergeld
    key: le.kindergeld
