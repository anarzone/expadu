      - id: non-eu-permits-only
        states: Non-EU citizens without EU free-movement rights can get it only with certain residence permits
        source: '§62 EStG — Anspruchsberechtigte'
        quote: Ein nicht freizügigkeitsberechtigter Ausländer erhält Kindergeld nur, wenn er
      - id: settlement-permit
        states: a settlement permit (Niederlassungserlaubnis)
        source: '§62 EStG — Anspruchsberechtigte'
        quote: eine Niederlassungserlaubnis oder eine Erlaubnis zum Daueraufenthalt-EU besitzt
      - id: blue-card-work-permit
        states: an EU Blue Card, or a residence permit that allows you to work for at least six months
        source: '§62 EStG — Anspruchsberechtigte'
        quote: eine Blaue Karte EU, eine ICT-Karte, eine Mobiler-ICT-Karte oder eine Aufenthaltserlaubnis besitzt, die für einen Zeitraum von mindestens sechs Monaten zur Ausübung einer Erwerbstätigkeit berechtigen
      - id: study-permit
        states: With a study or job-search permit
        source: '§62 EStG — Anspruchsberechtigte'
        quote: zum Zweck eines Studiums
      - id: job-search-permit
        states: job-search permit
        source: '§62 EStG — Anspruchsberechtigte'
        quote: zur Suche nach einer Erwerbstätigkeit
      - id: study-job-search-condition
        states: you only qualify if you also work, are on parental leave (Elternzeit) or get unemployment-insurance payments
        source: '§62 EStG — Anspruchsberechtigte'
        quote: und er ist weder erwerbstätig noch nimmt er Elternzeit nach § 15 des Bundeselterngeld- und Elternzeitgesetzes oder laufende Geldleistungen nach dem Dritten Buch Sozialgesetzbuch in Anspruch
      - id: backdating
        states: Payments are backdated only for the six months before the month your application arrives
        source: '§70 EStG — Festsetzung und Zahlung des Kindergeldes'
        quote: Die Auszahlung von festgesetztem Kindergeld erfolgt rückwirkend nur für die letzten sechs Monate vor Beginn des Monats, in dem der Antrag auf Kindergeld eingegangen ist.
      - id: both-steuer-ids
        states: You need the Steuer-ID of both the child and the applicant
        source: 'BZSt — Professional Supervision of the Family Benefits Offices'
        quote: of the child and the applicant is required for the application
      - id: applicant-steuer-id
        states: must be identified by their own Steuer-ID
        source: '§62 EStG — Anspruchsberechtigte'
        quote: dass der Berechtigte durch die an ihn vergebene Identifikationsnummer (§ 139b der Abgabenordnung) identifiziert wird
      - id: one-person-per-child
        states: Only one person is paid Kindergeld for each child
        source: '§64 EStG — Zusammentreffen mehrerer Ansprüche'
        quote: Für jedes Kind wird nur einem Berechtigten Kindergeld gezahlt.
      - id: parents-decide
        states: they decide between themselves who that is
        source: '§64 EStG — Zusammentreffen mehrerer Ansprüche'
        quote: so bestimmen diese untereinander den Berechtigten
      - id: online-or-writing
        states: submitted online via the eServices of the Familienkasse or in writing
        source: 'BZSt — Professional Supervision of the Family Benefits Offices'
        quote: The application can be submitted online via the eServices of the family benefits office or in writing to the responsible family benefits office.
    description: |
      Kindergeld is paid monthly for each child: {{figure:kindergeld_monthly}}.
      It is paid by the Familienkasse (part of the Federal Employment Agency).
      In general, anyone who lives in Germany can get it. Check the first step to see if you qualify.
      Payments are backdated only for the six months before the month your application arrives, so apply without delay.
      You need the Steuer-ID of both the child and the applicant.
    phase: ongoing
    urgency: high
    deadline_type: none
    documents_required:
      - label: "Child's Steuer-ID"
        note: Required for the application.
      - label: Your own Steuer-ID
        note: The parent who applies must be identified by their own Steuer-ID.
      - label: Residence permit(s), if non-EU
        note: Only certain residence permits give entitlement (see the first step).
    links:
      - https://www.arbeitsagentur.de/familie-und-kinder/kindergeld
      - https://www.gesetze-im-internet.de/estg/__62.html
      - https://www.bzst.de/EN/Private_individuals/Supervision_family_benefits_offices/supervision_family_benefits_offices_node.html
    how_to_steps:
      - title: Check who qualifies
        body: EU/EEA citizens who move here can't get it for the first three months, unless they show they earn income in Germany, for example from a job or a business. Non-EU citizens without EU free-movement rights can get it only with certain residence permits, for example a settlement permit (Niederlassungserlaubnis), an EU Blue Card, or a residence permit that allows you to work for at least six months. With a study or job-search permit, you only qualify if you also work, are on parental leave (Elternzeit) or get unemployment-insurance payments.
      - title: Decide which parent applies
        body: Only one person is paid Kindergeld for each child. If both parents live with the child, they decide between themselves who that is.
      - title: Apply online or in writing
        body: The application can be submitted online via the eServices of the Familienkasse or in writing to your Familienkasse.

