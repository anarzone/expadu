      - id: eu-first-three-months
        states: EU/EEA citizens who move here can't get it for the first three months
        source: '§62 EStG — Anspruchsberechtigte'
        quote: so hat er für die ersten drei Monate ab Begründung des Wohnsitzes oder des gewöhnlichen Aufenthalts keinen Anspruch auf Kindergeld
      - id: eu-income-exception
        states: unless they show they earn income in Germany, for example from a job or a business
        source: '§62 EStG — Anspruchsberechtigte'
