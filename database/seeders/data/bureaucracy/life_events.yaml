      - id: paid-by-familienkasse
        states: paid by the Familienkasse
        source: '§70 EStG — Festsetzung und Zahlung des Kindergeldes'
        quote: Das Kindergeld nach § 62 wird von den Familienkassen durch Bescheid festgesetzt und ausgezahlt.
      - id: familienkasse-agency
        states: part of the Federal Employment Agency
        source: 'BZSt — Professional Supervision of the Family Benefits Offices'
        quote: the family benefits offices of the Federal Employment Agency
      - id: lives-in-germany
        states: In general, anyone who lives in Germany can get it
