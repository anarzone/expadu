      - id: self-employed-forms
        states: Also fill in the extra forms for the self-employed
        source: 'Stadt Köln — Elterngeld'
        quote: Selbstständige müssen ergänzend die Zusatzformulare für Selbstständige ausfüllen.
      - id: mixed-income
