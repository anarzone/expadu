# Liberal-profession path (freie Berufe, §21 Abs. 5 AufenthG). Cologne does
# not publish the document list for this case — it routes applicants to its
# "Service für ausländische Akademiker*innen und Selbständige". The list below
# is the federal standard, framed as typical requirements (◐/⚠, unverified
# badge by design). See docs/bureaucracy-sources.md (Case 5).
situation: freelancer

tasks:
  - title: Check whether your activity is a Gewerbe
    key: fre.gewerbe_check
    type: decision
    decision_options:
      - label: Freiberufler
        body: A liberal profession under §18 EStG — you report the start of your work directly to the Finanzamt.
      - label: Gewerbe
        body: A trade business — you notify the trade office when you start, and the municipality informs the Finanzamt.
    depends_on: []
    applies_if_mode: explicit
    applies_if:
      purpose: freelance
    review_status: approved
    jurisdiction: de-nrw-cologne
    reviewed_by: automated_source_check
    content_version: 2026-10-08.1
    source_verification: quote_checked
    legal_sources:
      - {kind: primary, label: '§18 EStG', url: 'https://www.gesetze-im-internet.de/estg/__18.html'}
      - {kind: primary, label: '§14 GewO', url: 'https://www.gesetze-im-internet.de/gewo/__14.html'}
      - {kind: primary, label: '§138 AO', url: 'https://www.gesetze-im-internet.de/ao_1977/__138.html'}
      - {kind: implementation, label: 'Stadt Köln · Gewerbemeldung eines Einzelunternehmens', url: 'https://www.stadt-koeln.de/service/produkte/00268/index.html'}
    claims:
      - id: liberal-catalogue
        states: §18 EStG
        source: '§18 EStG'
        quote: Zu der freiberuflichen Tätigkeit gehören die selbständig ausgeübte wissenschaftliche, künstlerische, schriftstellerische, unterrichtende oder erzieherische Tätigkeit
      - id: trade-notice
        states: (§14 GewO)
        source: '§14 GewO'
        quote: Wer den selbständigen Betrieb eines stehenden Gewerbes, einer Zweigniederlassung oder einer unselbständigen Zweigstelle anfängt, muss dies der zuständigen Behörde gleichzeitig anzeigen
      - id: tax-office-notice
        states: report the start of your work directly to the Finanzamt
        source: '§138 AO'
        quote: Wer eine freiberufliche Tätigkeit aufnimmt, hat dies dem nach § 19 zuständigen Finanzamt mitzuteilen
      - id: cologne-trade-office
        states: register it with the Gewerbemeldestelle, online through the NRW business portal or by post or in person
        source: 'Stadt Köln · Gewerbemeldung eines Einzelunternehmens'
        quote: Sie haben die Möglichkeit Gewerbemeldungen online im Wirtschaft- Service -Portal Nordrhein-Westfalen zu tätigen
    description: |
      German law treats freie Berufe (liberal professions) differently from Gewerbe (trade).
      §18 EStG lists the liberal professions: independent scientific, artistic, writing,
      teaching and educational work, and professions such as doctors, lawyers, engineers,
      architects, tax advisers, journalists, interpreters, translators and similar
      professions. Anyone who starts a trade business must notify the trade office at the
      same time (§14 GewO). If you take up a liberal profession, you report the start of
      your work directly to the Finanzamt instead. The answer decides whether you need a
      trade registration, so settle it first.
    phase: first_30_days
    urgency: medium
    deadline_type: none
    documents_required: []
    links:
      - https://www.gesetze-im-internet.de/estg/__18.html
      - https://www.stadt-koeln.de/service/produkte/00268/index.html
    how_to_steps:
      - title: Classify your activity
        body: Compare your work against the list in §18 EStG. If your activity is mixed or unclear, ask the Finanzamt or a tax adviser before you start.
        link: https://www.gesetze-im-internet.de/estg/__18.html
      - title: If it's a Gewerbe, register the trade
        body: In Cologne you register it with the Gewerbemeldestelle, online through the NRW business portal or by post or in person. Non-EU citizens need a residence title that permits the work.
        link: https://www.stadt-koeln.de/service/produkte/00268/index.html

  - title: Apply for the freelance residence permit (§21 Abs. 5)
    key: fre.residence_permit
    eu_filter: non_eu_only
    depends_on: []
    description: |
      Non-EU freelancers in liberal professions need the §21(5) permit before working
      independently — freelance work may not begin before the permit. The condition
      Cologne states: a public interest in your activity. Cologne handles this group
      through a dedicated service desk ("Service für ausländische Akademiker*innen und
      Selbständige"), and the authoritative checklist comes from that desk — the list
      below covers the typical requirements so you can prepare; treat the desk's word
      as final.
    phase: first_30_days
    urgency: critical
    deadline_type: permit_window
    deadline_days: 90
    applies_if:
      entry_mode: [d_visa, visa_free]
    booking_service_key: auslaenderbehoerde
    documents_required:
      - label: Application form (online Erstantrag 33-F07)
      - label: Valid national passport + visa for self-employment
        note: Or the 90-day window if you entered visa-free. A tourist/Schengen visa can never be converted.
      - label: Biometric photo
      - label: CV + qualification proofs (degree, certificates, portfolio)
      - label: Letters of intent (Absichtserklärungen) from prospective clients
        note: The decisive document — ideally from German-based clients. Collect them before the appointment, not after.
      - label: Revenue forecast / financing plan
      - label: Proof of funds for living costs until revenue flows
      - label: Proof of health insurance
      - label: Housing proof (Mietvertrag)
      - label: 'Age 45+: proof of adequate retirement provision'
        note: A statutory requirement in §21 — pension entitlements, assets, or insurance.
      - label: Professional licence, for regulated professions
    links:
      - https://www.stadt-koeln.de/service/produkte/01083/index.html
      - https://www.gesetze-im-internet.de/aufenthg_2004/__21.html
    how_to_steps:
      - title: Contact the Servicestelle first
        body: Cologne routes freelancers and academics to its dedicated desk (Dillenburger Straße 56–66) — appointments by email, contact form or post. Ask them for the current document list for your profession; it's the one list the city doesn't publish.
        link: https://www.stadt-koeln.de/service/produkte/01083/index.html
      - title: Collect client letters of intent early
        body: Two or three written statements from prospective clients — what work, roughly what volume — carry the application. German-based clients weigh most.
      - title: Bring originals plus copies of everything
        body: A missing document means a rebooked appointment and weeks of waiting. Triple-check the financing evidence — it's the most common gap.
