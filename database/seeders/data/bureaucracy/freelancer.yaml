# Shared spine for both self-employment sub-paths. The §21 residence permit
# differs per path: freelancer_liberal.yaml (§21 Abs. 5, freie Berufe) and
# freelancer_gewerbe.yaml (§21 Abs. 1, trade). Source: docs/bureaucracy-sources.md.
situation:
  - freelancer
  - freelancer_gewerbe

tasks:
  # Retired 2026-10-08: covered by core.anmeldung.
  - title: Register your address (Anmeldung)
    key: fre.anmeldung
    is_published: false
    depends_on: []
    verified_at: 2026-06-11
    description: |
      Every resident must register their address within 2 weeks of moving in (§17 BMG).
      For freelancers it's doubly important — the Meldebescheinigung is the key to your
      Steuer-ID, your bank account, and the tax office knowing where to send your
      Steuernummer.
    phase: arrival
    urgency: critical
    deadline_type: days_since_move_in
    deadline_days: 14
    booking_service_key: anmeldung
    documents_required:
      - label: Passport or EU ID card
      - label: Wohnungsgeberbescheinigung (Cologne form, signed by your landlord)
        note: A rental contract or informal letter is NOT sufficient, and it cannot be submitted later — without it the registration doesn't happen that day.
        tone: warn
    links:
      - https://www.stadt-koeln.de/service/produkte/00415/index.html
    how_to_steps:
      - title: Get the Wohnungsgeberbescheinigung from your landlord
        body: Cologne's own form (Formular-Server 02-F17) — your landlord must issue it within two weeks of move-in. This is the number-one trap.
      - title: Pick your route — online, walk-in, or appointment
        body: Cologne offers Anmeldung fully online via the Serviceportal. In person, Kundenzentren take walk-ins on Mondays and Wednesdays; other weekdays need an appointment. Free either way.
        link: https://termine.stadt-koeln.de/
      - title: Mind the religion field on the form
        body: Declaring a recognized denomination enrols you in church tax — 9% of your income tax in NRW. As a freelancer it lands in your prepayments. Leaving later costs a fee at the Amtsgericht.
      - title: Make digital copies
        body: You'll attach the Meldebescheinigung to bank, insurance and tax paperwork repeatedly — keep a PDF handy.

  # Retired 2026-10-08: covered by core.steuer_id.
  - title: Wait for your Steuer-ID (tax identification number)
    key: fre.steuer_id
    is_published: false
    type: wait
    depends_on: []
    description: |
      The Bundeszentralamt für Steuern automatically sends your 11-digit personal tax ID
      by post within 2–4 weeks of Anmeldung. You need it for the Fragebogen zur
      steuerlichen Erfassung — the form that gets you your freelance Steuernummer.
    phase: arrival
    urgency: high
    deadline_type: days_since_arrival
    deadline_days: 28
    documents_required: []
    links:
      - https://www.bzst.de/EN/Private_individuals/Tax_identification_number/tax_identification_number_node.html
    how_to_steps:
      - title: Watch your post
        body: Plain letter from Bonn, easy to miss. Don't bin unbranded mail in your first month.
      - title: Request a copy if it doesn't arrive in 4 weeks
        body: Use the BZSt input form — it's only ever sent by post to your registered address.
        link: https://www.bzst.de/EN/Private_individuals/Tax_identification_number/tax_identification_number_node.html

  - title: Report your self-employment to the Finanzamt
    key: fre.fragebogen
    depends_on: []
    applies_if_mode: explicit
    applies_if:
      purpose: freelance
    review_status: approved
    jurisdiction: de-nrw-cologne
    reviewed_by: automated_source_check
    content_version: 2026-10-08.1
    source_verification: quote_checked
    legal_sources:
      - {kind: primary, label: '§138 AO', url: 'https://www.gesetze-im-internet.de/ao_1977/__138.html'}
      - {kind: primary, label: '§14 UStG', url: 'https://www.gesetze-im-internet.de/ustg_1980/__14.html'}
    claims:
      - id: one-month-notice
        states: within one month (§138 AO)
        source: '§138 AO'
        quote: Mitteilungen nach den Absätzen 1, 1a und 1b sind innerhalb eines Monats nach dem meldepflichtigen Ereignis zu erstatten
      - id: freelance-notice
        states: notify the Finanzamt directly
        source: '§138 AO'
        quote: Wer eine freiberufliche Tätigkeit aufnimmt, hat dies dem nach § 19 zuständigen Finanzamt mitzuteilen
      - id: further-information
        states: give the Finanzamt further information about the tax-relevant facts
        source: '§138 AO'
        quote: haben sie dem in Absatz 1 bezeichneten Finanzamt weitere Auskünfte über die für die Besteuerung erheblichen rechtlichen und tatsächlichen Verhältnisse zu erteilen
      - id: invoice-tax-number
        states: (§14 UStG)
        source: '§14 UStG'
        quote: die dem leistenden Unternehmer vom Finanzamt erteilte Steuernummer oder die ihm vom Bundeszentralamt für Steuern erteilte Umsatzsteuer-Identifikationsnummer
    description: |
      When you start self-employed work, the tax office has to be told within one month (§138 AO).
      If you take up a liberal profession, you notify the Finanzamt directly; a trade business
      is reported to the municipality, which informs the Finanzamt. In both cases you also
      give the Finanzamt further information about the tax-relevant facts of your business,
      electronically in the official data set — on ELSTER this is the Fragebogen zur
      steuerlichen Erfassung. Your invoices must show the Steuernummer the Finanzamt gives
      you, or a VAT identification number (§14 UStG).
    phase: first_30_days
    urgency: critical
    deadline_type: none
    booking_service_key: finanzamt
    documents_required:
      - Steuer-ID
      - ELSTER account
      - Estimates of your expected revenue and profit
    links:
      - https://www.gesetze-im-internet.de/ao_1977/__138.html
      - https://www.elster.de/eportal/formulare-leistungen/alleformulare/fseeun
    how_to_steps:
      - title: Set up your ELSTER access early
        body: The information is submitted electronically, so set up ELSTER before you start work. If electronic submission would be an unreasonable hardship, you can ask the Finanzamt to accept the paper form instead.
        link: https://www.elster.de/eportal/start
      - title: Answer the questionnaire accurately
        body: It asks about the legal and factual details of your business that matter for your taxes. Give realistic figures; the Finanzamt uses them for your taxation.
      - title: Put your Steuernummer on every invoice
        body: Once the Finanzamt has issued your Steuernummer, include it (or your VAT identification number) on your invoices.

  - title: Decide on the Kleinunternehmerregelung (small-business VAT exemption)
    key: fre.kleinunternehmer
    type: decision
    decision_options:
      - label: Kleinunternehmer
        body: No VAT on your invoices and no regular VAT returns, but no reclaiming of VAT on your own business purchases.
      - label: Regular VAT
        body: Charge VAT on your invoices and reclaim the VAT on your business purchases. Usually the better fit when your clients are VAT-registered businesses.
    depends_on: [fre.fragebogen]
    applies_if_mode: explicit
    applies_if:
      purpose: freelance
    review_status: approved
    jurisdiction: de-nrw-cologne
    reviewed_by: automated_source_check
    content_version: 2026-10-08.1
    source_verification: quote_checked
    legal_sources:
      - {kind: primary, label: '§19 UStG', url: 'https://www.gesetze-im-internet.de/ustg_1980/__19.html'}
      - {kind: primary, label: '§12 UStG', url: 'https://www.gesetze-im-internet.de/ustg_1980/__12.html'}
      - {kind: primary, label: '§34a UStDV', url: 'https://www.gesetze-im-internet.de/ustdv_1980/__34a.html'}
    claims:
      - id: exemption-section
        states: (§19 UStG)
        source: '§19 UStG'
        quote: Besteuerung der Kleinunternehmer
      - id: turnover-thresholds
        states: no more than 25 000 euros in the previous calendar year and does not exceed 100 000 euros in the current year
        source: '§19 UStG'
        quote: wenn der Gesamtumsatz nach Absatz 2 im vorangegangenen Kalenderjahr 25 000 Euro nicht überschritten hat und im laufenden Kalenderjahr 100 000 Euro nicht überschreitet
      - id: no-vat-returns
        states: don't file the regular VAT returns
        source: '§19 UStG'
        quote: über die Erklärungspflichten (§ 18 Absatz 1 bis 4) keine Anwendung
      - id: waiver-binding
        states: binds you for at least five calendar years
        source: '§19 UStG'
        quote: Der Verzicht bindet den Unternehmer mindestens für fünf Kalenderjahre
      - id: standard-rate
        states: generally 19%
        source: '§12 UStG'
        quote: Die Steuer beträgt für jeden steuerpflichtigen Umsatz 19 Prozent der Bemessungsgrundlage
      - id: invoice-note
        states: (§34a UStDV)
        source: '§34a UStDV'
        quote: mit einem Hinweis darauf, dass für die Lieferung oder sonstige Leistung die Steuerbefreiung für Kleinunternehmer gilt
    description: |
      When you register with the Finanzamt, you choose whether to use the small-business
      VAT exemption (§19 UStG). It is available when your turnover was no more than 25 000 euros
      in the previous calendar year and does not exceed 100 000 euros in the current year.
      Kleinunternehmer don't charge VAT and don't file the regular VAT returns, but they also
      can't reclaim VAT on their own purchases. Otherwise you charge VAT, generally 19%.
      You can waive the exemption, but the waiver binds you for at least five calendar years.
    phase: first_30_days
    urgency: high
    deadline_type: none
    documents_required: []
    links:
      - https://www.gesetze-im-internet.de/ustg_1980/__19.html
    how_to_steps:
      - title: Check who your clients are
        body: VAT-registered business clients can normally reclaim the VAT you charge them, and opting out of the exemption lets you reclaim VAT on your own business purchases. Consumers can't reclaim VAT, so for them it adds to your price.
      - title: Watch your running turnover
        body: Keep track of your turnover during the year so you notice in time if you approach the current-year limit.
      - title: Put the required note on your invoices
        body: Invoices under the exemption must say that the small-business exemption applies (§34a UStDV).
        link: https://www.gesetze-im-internet.de/ustdv_1980/__34a.html

  # Retired 2026-10-08: covered by core.health_insurance.
  - title: Sort out self-paid health insurance
    key: fre.health_insurance
    is_published: false
    depends_on: []
    description: |
      Health insurance is mandatory and, unlike employees, you pay the full premium
      yourself. Freelancers choose between voluntary statutory insurance (GKV, income-based)
      and private insurance (PKV, risk-based). If you work in an artistic or publicist
      profession, the Künstlersozialkasse can roughly halve your costs.
    phase: arrival
    urgency: critical
    deadline_type: days_since_arrival
    deadline_days: 30
    documents_required:
      - Passport or ID
      - label: Meldebescheinigung
        from: fre.anmeldung
      - Income estimate (for GKV contribution assessment)
    links:
      - https://www.krankenkassen.de/
      - https://www.bundesgesundheitsministerium.de/beitraege
      - https://www.kuenstlersozialkasse.de/
    how_to_steps:
      - title: Understand GKV pricing for the self-employed
        body: Voluntary statutory members pay the general rate of 14.6% of income plus the insurer's Zusatzbeitrag (2026 average 2.9%), plus long-term care insurance — assessed on your total income, with a legal minimum floor even in lean months. Get a quote based on your realistic profit, not your hoped-for one.
        link: https://www.bundesgesundheitsministerium.de/beitraege
      - title: Be careful with PKV
        body: Private insurance can be cheaper while you're young and healthy, but premiums rise with age and switching back to GKV is hard. Practical rule of thumb — don't choose PKV for short-term savings alone; talk to an independent advisor first.
      - title: Check the Künstlersozialkasse if you're a creative or publicist
        body: Designers, writers, journalists, musicians and similar professions can join the KSK, which gives self-employed artists employee-style social cover — you pay roughly the employee half of pension, health and care contributions and the KSK system covers the rest. Applications take months, so file early.
        link: https://www.kuenstlersozialkasse.de/

  # Retired 2026-10-08: covered by core.bank_account.
  - title: Open a bank account for your freelance work
    key: fre.bank_account
    is_published: false
    depends_on: []
    description: |
      You need an account for client payments, tax prepayments, and insurance debits.
      Legally a separate business account is not required for sole-proprietor freelancers,
      but mixing freelance and private money makes your bookkeeping and any tax audit
      far more painful than it needs to be.
    phase: first_30_days
    urgency: high
    deadline_type: days_since_arrival
    deadline_days: 30
    documents_required:
      - Passport or ID
      - label: Meldebescheinigung
        from: fre.anmeldung
      - label: Tax ID (if available)
        from: fre.steuer_id
    links:
      - https://www.n26.com/en-de
      - https://www.qonto.com/de
      - https://www.sparkasse-koelnbonn.de/
    how_to_steps:
      - title: Check your bank's terms before invoicing through a private account
        body: Practical trap — many free private accounts prohibit business use in their terms and banks do cancel accounts over it. Look at freelancer-friendly options (N26 Business, Qonto, Holvi, Kontist) or a classic bank business account.
      - title: Keep freelance money separate
        body: One account for invoices in and tax/insurance out, one for private life. Your future self at tax-return time will be grateful.
      - title: Put the IBAN in the Fragebogen
        body: The Finanzamt uses it for refunds and SEPA collection of prepayments — getting it right avoids paper-cheque chaos.

  # Retired 2026-10-08: covered by core.rundfunkbeitrag.
  - title: Settle your Rundfunkbeitrag (broadcasting fee)
    key: fre.rundfunkbeitrag
    is_published: false
    depends_on: []
    description: |
      Every household pays €18.36/month for public broadcasting — one fee per dwelling,
      regardless of devices or how many people live there. The Beitragsservice learns
      about your Anmeldung automatically and will write to you.
    phase: settling
    urgency: medium
    deadline_type: days_since_arrival
    deadline_days: 60
    documents_required: []
    links:
      - https://www.rundfunkbeitrag.de/welcome/english
    how_to_steps:
      - title: One fee per household
        body: If a flatmate or partner already pays, reply with their Beitragsnummer instead of registering twice.
      - title: Working from home changes nothing for most freelancers
        body: Your household fee covers a home office in your own flat. If you rent separate business premises (office, studio), check the rules for companies on the official site — separate premises can mean a separate fee.
        link: https://www.rundfunkbeitrag.de/welcome/english/companies-institutions-and-public-interest-bodies
      - title: Set up direct debit
        body: Quarterly invoices are easy to miss while you're buried in setup admin — SEPA direct debit removes the risk of reminder fees.
