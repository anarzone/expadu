    key: shared.child_born
    coverage_scope: universal
    type: info
    depends_on: []
    # Source-checked (claims verified daily), not yet mapped to a Paperwork process, so not approved.
    review_status: legacy
    jurisdiction: de-nrw-cologne
    reviewed_by: automated_source_check
    content_version: 2026-10-30.1
    source_verification: quote_checked
    legal_sources:
      - {kind: primary, label: '§4 StAG — Erwerb der Staatsangehörigkeit durch Geburt', url: 'https://www.gesetze-im-internet.de/stag/__4.html'}
      - {kind: primary, label: '§33 AufenthG — Geburt eines Kindes im Bundesgebiet', url: 'https://www.gesetze-im-internet.de/aufenthg_2004/__33.html'}
      - {kind: primary, label: '§81 AufenthG — Beantragung des Aufenthaltstitels', url: 'https://www.gesetze-im-internet.de/aufenthg_2004/__81.html'}
      - {kind: primary, label: '§18 PStG — Anzeige', url: 'https://www.gesetze-im-internet.de/pstg/__18.html'}
      - {kind: primary, label: '§1594 BGB — Anerkennung der Vaterschaft', url: 'https://www.gesetze-im-internet.de/bgb/__1594.html'}
      - {kind: implementation, label: 'Stadt Köln — Erwerb der deutschen Staatsangehörigkeit durch Geburt in Deutschland', url: 'https://www.stadt-koeln.de/service/produkt/erwerb-der-deutschen-staatsangehoerigkeit-durch-geburt-deutschland-1'}
      - {kind: implementation, label: 'Stadt Köln — Beurkundung von Geburten', url: 'https://www.stadt-koeln.de/service/produkte/00466/index.html'}
      - {kind: implementation, label: 'Stadt Köln — Vaterschaftsanerkennung', url: 'https://www.stadt-koeln.de/service/produkt/vaterschaftsanerkennung'}
    claims:
      - id: german-by-birth
        states: A child of foreign parents born in Germany becomes German
        source: '§4 StAG — Erwerb der Staatsangehörigkeit durch Geburt'
        quote: Durch die Geburt im Inland erwirbt ein Kind ausländischer Eltern die deutsche Staatsangehörigkeit
      - id: five-years
        states: has lived here lawfully for five years
        source: '§4 StAG — Erwerb der Staatsangehörigkeit durch Geburt'
        quote: seit fünf Jahren rechtmäßig seinen gewöhnlichen Aufenthalt im Inland hat
      - id: unlimited-right
        states: holds an unlimited right of residence
        source: '§4 StAG — Erwerb der Staatsangehörigkeit durch Geburt'
        quote: ein unbefristetes Aufenthaltsrecht
      - id: eu-citizen
        states: is an EU citizen with free movement rights
        source: 'Stadt Köln — Erwerb der deutschen Staatsangehörigkeit durch Geburt in Deutschland'
        quote: freizügigkeitsberechtigte Unionsbürger*in
      - id: checked-ex-officio
        states: The city checks this automatically, without you applying
        source: 'Stadt Köln — Erwerb der deutschen Staatsangehörigkeit durch Geburt in Deutschland'
        quote: Wir prüfen den Erwerb der deutschen Staatsangehörigkeit von Amts wegen.
      - id: check-duration
        states: the check takes a few weeks
        source: 'Stadt Köln — Erwerb der deutschen Staatsangehörigkeit durch Geburt in Deutschland'
        quote: da die Prüfung auf Erwerb der deutschen Staatsangehörigkeit einige Wochen in Anspruch nimmt
      - id: told-unasked
        states: you are told without asking if your child is German
        source: 'Stadt Köln — Erwerb der deutschen Staatsangehörigkeit durch Geburt in Deutschland'
        quote: Wenn Ihr Kind die deutsche Staatsangehörigkeit erworben hat, werden wir Sie unaufgefordert darüber informieren.
      - id: home-consulate
        states: Your child usually also has your citizenship
        source: 'Stadt Köln — Erwerb der deutschen Staatsangehörigkeit durch Geburt in Deutschland'
        quote: Da Ihr Kind auch die Staatsangehörigkeit seiner Eltern erwirbt, ist es grundsätzlich erforderlich, dass Sie es auch bei Ihrem zuständigen Heimatkonsulat anmelden.
      - id: both-parents-permit
        states: both parents or the parent with sole custody hold a residence permit, a Niederlassungserlaubnis or a Daueraufenthalt-EU
        source: '§33 AufenthG — Geburt eines Kindes im Bundesgebiet'
        quote: Wenn zum Zeitpunkt der Geburt beide Elternteile oder der allein personensorgeberechtigte Elternteil eine Aufenthaltserlaubnis, eine Niederlassungserlaubnis oder eine Erlaubnis zum Daueraufenthalt
      - id: permit-ex-officio
        states: the child gets its own residence permit automatically, without applying
        source: '§33 AufenthG — Geburt eines Kindes im Bundesgebiet'
        quote: wird dem im Bundesgebiet geborenen Kind die Aufenthaltserlaubnis von Amts wegen erteilt
      - id: one-parent-permit
        states: the office can then grant it automatically
        source: '§33 AufenthG — Geburt eines Kindes im Bundesgebiet'
        quote: von Amts wegen eine Aufenthaltserlaubnis erteilt werden, wenn ein Elternteil eine Aufenthaltserlaubnis
      - id: parent-on-visa
        states: "If a parent holds a visa or may stay visa-free at the birth, the child's stay counts as allowed only until the visa or visa-free stay ends"
        source: '§33 AufenthG — Geburt eines Kindes im Bundesgebiet'
        quote: dessen Mutter oder Vater zum Zeitpunkt der Geburt im Besitz eines Visums ist oder sich visumfrei aufhalten darf, gilt bis zum Ablauf des Visums oder des rechtmäßigen visumfreien Aufenthalts als erlaubt
      - id: six-months
        states: Otherwise, apply within six months of the birth
        source: '§81 AufenthG — Beantragung des Aufenthaltstitels'
        quote: Für ein im Bundesgebiet geborenes Kind, dem nicht von Amts wegen ein Aufenthaltstitel zu erteilen ist, ist der Antrag innerhalb von sechs Monaten nach der Geburt zu stellen.
      - id: fiktionsbescheinigung
        states: "a Fiktionsbescheinigung, a paper showing what the application means for the child's stay"
        source: '§81 AufenthG — Beantragung des Aufenthaltstitels'
        quote: Dem Ausländer ist eine Bescheinigung über die Wirkung seiner Antragstellung (Fiktionsbescheinigung) auszustellen.
      - id: report-birth
        states: The birth must be reported to the Standesamt within one week
        source: '§18 PStG — Anzeige'
        quote: Die Geburt eines Kindes ist dem Standesamt, in dessen Zuständigkeitsbereich es geboren ist, binnen einer Woche anzuzeigen
      - id: hospital-registers
        states: if your child is born in a Cologne hospital, the hospital handles this with the Standesamt
        source: 'Stadt Köln — Beurkundung von Geburten'
        quote: Kommt Ihr Kind in einem Kölner Krankenhaus zur Welt, wickeln die Kliniken die Formalitäten der Anmeldung mit uns ab.
      - id: registration-free
        states: Registering the birth is free
        source: 'Stadt Köln — Beurkundung von Geburten'
        quote: Die Beurkundung der Geburt ist gebührenfrei.
      - id: tax-id
        states: "Your child's tax ID arrives automatically by post from the Bundeszentralamt für Steuern"
        source: 'Stadt Köln — Beurkundung von Geburten'
        quote: Die Steueridentifikations-Nummer für Ihr Kind erhalten Sie per Post automatisch vom Bundeszentralamt für Steuern.
      - id: tax-id-kindergeld
        states: you need it to apply for Kindergeld
        source: 'Stadt Köln — Beurkundung von Geburten'
        quote: Die Steuernummer benötigen Sie für für die Beantragung des
      - id: paternity-needed
        states: If you are not married to each other, recognition of paternity is needed
        source: 'Stadt Köln — Vaterschaftsanerkennung'
        quote: Sie ist erforderlich, wenn Sie als Eltern eines gemeinsamen Kindes nicht miteinander verheiratet sind.
      - id: paternity-before-birth
        states: the father can recognise paternity even before the birth
        source: '§1594 BGB — Anerkennung der Vaterschaft'
        quote: Die Anerkennung ist schon vor der Geburt des Kindes zulässig.
      - id: mother-consent
        states: the mother must consent
        source: 'Stadt Köln — Vaterschaftsanerkennung'
        quote: Damit die Anerkennung wirksam wird, ist die Zustimmung der Mutter erforderlich.
      - id: paternity-free
        states: it is free of charge
        source: 'Stadt Köln — Vaterschaftsanerkennung'
        quote: Die Beurkundung der Vaterschaftsanerkennung ist kostenfrei.
      - id: paternity-where
        states: at the Standesamt or the Bezirksjugendamt
        source: 'Stadt Köln — Beurkundung von Geburten'
        quote: Die Vaterschaftsanerkennung können Sie bei uns oder im Bezirksjugendamt erledigen.
    description: |
      Check first whether your child is German by birth.
      A child of foreign parents born in Germany becomes German if, at the birth, one parent
      has lived here lawfully for five years and also either
      holds an unlimited right of residence (a permanent right to stay)
      or is an EU citizen with free movement rights.
      Parents from an EEA country or Switzerland: ask the city how this applies to you.
      The city checks this automatically, without you applying;
      the check takes a few weeks, and you are told without asking if your child is German.
      Your child usually also has your citizenship: check with your home consulate and register the child there too.

      If your child is not German, the parents' permits at the birth decide what happens.
      When both parents or the parent with sole custody hold a residence permit, a Niederlassungserlaubnis or a Daueraufenthalt-EU,
      the child gets its own residence permit automatically, without applying.
      Otherwise, apply within six months of the birth, even if only one parent holds a permit;
      the office can then grant it automatically, but don't wait for that.
      If a parent holds a visa or may stay visa-free at the birth, the child's stay counts as allowed only until the visa or visa-free stay ends,
      so apply before then, even if that is sooner.
      Ask the Ausländerbehörde which documents to bring, and start the child's passport at your consulate early.
      The office may give you a Fiktionsbescheinigung, a paper showing what the application means for the child's stay.

      The birth must be reported to the Standesamt within one week;
      if your child is born in a Cologne hospital, the hospital handles this with the Standesamt.
      Registering the birth is free.
      Your child's tax ID arrives automatically by post from the Bundeszentralamt für Steuern;
      you need it to apply for Kindergeld.
      Tell your Krankenkasse about the birth.
      If you are not married to each other, recognition of paternity is needed:
      the father can recognise paternity even before the birth,
      the mother must consent, and it is free of charge at the Standesamt or the Bezirksjugendamt.
