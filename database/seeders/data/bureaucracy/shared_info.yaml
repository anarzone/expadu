    legal_sources:
      - {kind: primary, label: '§16a AufenthG — Berufsausbildung', url: 'https://www.gesetze-im-internet.de/aufenthg_2004/__16a.html'}
      - {kind: primary, label: '§18d AufenthG — Forschung', url: 'https://www.gesetze-im-internet.de/aufenthg_2004/__18d.html'}
      - {kind: primary, label: '§19 AufenthG — ICT-Karte', url: 'https://www.gesetze-im-internet.de/aufenthg_2004/__19.html'}
      - {kind: primary, label: '§16f AufenthG — Sprachkurse und Schulbesuch', url: 'https://www.gesetze-im-internet.de/aufenthg_2004/__16f.html'}
