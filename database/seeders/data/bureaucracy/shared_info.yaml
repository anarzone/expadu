    source_verification: quote_checked
    legal_sources:
      - {kind: primary, label: '§51 AufenthG — Beendigung der Rechtmäßigkeit des Aufenthalts', url: 'https://www.gesetze-im-internet.de/aufenthg_2004/__51.html'}
      - {kind: implementation, label: 'Stadt Köln · Antworten auf Fragen zum Aufenthalt', url: 'https://www.stadt-koeln.de/artikel/73721/index.html'}
      - {kind: implementation, label: 'Stadt Köln · Niederlassungserlaubnis', url: 'https://www.stadt-koeln.de/leben-in-koeln/soziales/auslaenderamt/niederlassungserlaubnis'}
    claims:
      - id: title-stays-valid
        states: Your residence title stays valid when you get a new national passport
        source: 'Stadt Köln · Antworten auf Fragen zum Aufenthalt'
        quote: Ihr Aufenthaltstitel bleibt weiterhin gültig.
      - id: contact-form
        states: If the old passport number is printed on your residence title, contact the Ausländeramt through its contact form
        source: 'Stadt Köln · Antworten auf Fragen zum Aufenthalt'
        quote: Wenn die alte Passnummer auf Ihrem Aufenthaltstitel vermerkt ist, kontaktieren Sie uns bitte über unser Kontaktformular.
      - id: settlement-transfer
        states: bring your old passport, your new passport and a digital biometric photo
        source: 'Stadt Köln · Niederlassungserlaubnis'
        quote: Bitte bringen Sie Ihren alten Nationalpass, Ihren neuen Nationalpass und ein digitales biometrisches Passfoto zum Termin mit.
      - id: six-months-abroad
        states: stay abroad for longer than six months
        source: '§51 AufenthG — Beendigung der Rechtmäßigkeit des Aufenthalts'
        quote: wenn der Ausländer ausgereist und nicht innerhalb von sechs Monaten oder einer von der Ausländerbehörde bestimmten längeren Frist wieder eingereist ist
    description: |
      Your residence title stays valid when you get a new national passport. Carry
      both the old and the new passport if you kept the old one. If the old passport
      number is printed on your residence title, contact the Ausländeramt through its
      contact form and it will tell you the next steps; if it is not printed there,
      you do not need to do anything. Settlement permit holders whose card shows the
      passport number book an appointment at their Bezirksausländeramt and bring your
      old passport, your new passport and a digital biometric photo. Also worth
      knowing: a residence title generally expires if you leave Germany for a reason
      that is not temporary, or if you stay abroad for longer than six months without
      a longer period set by the Ausländerbehörde. Some exceptions apply, so ask
      before planning long stays away.
    phase: ongoing
    urgency: low
    deadline_type: none
