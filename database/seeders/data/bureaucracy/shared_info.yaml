# Cross-branch content: the driving-licence task (everyone with a foreign
# licence) and the good-to-know info cards. Listed for every branch so each
# user sees them regardless of path. See docs/bureaucracy-sources.md.
situation:
  - core
  - eu_employee
  - non_eu_employee
  - non_eu_employee_blue_card
  - non_eu_employee_chancenkarte
  - student
  - freelancer
  - freelancer_gewerbe
  - family_reunification
  - family_reunification_of_german
  - family_reunification_of_eu_citizen

tasks:
  - title: Sort out your driving licence
    key: shared.driving_licence
    coverage_scope: universal
    depends_on: []
    applies_if:
      license_country: [other]
    verified_at: 2026-06-11
    description: |
      A valid foreign licence works for 6 months after entry + Anmeldung. After that,
      driving in Germany is driving WITHOUT a licence — a criminal offence, not a fine.
      What you must do depends on where the licence was issued: EU/EEA licences keep
      working indefinitely (mark this task as not applicable); "Anlage 11" countries
      (Japan, South Korea, Switzerland, Israel, New Zealand, Singapore, parts of the
      US/Australia and more) exchange test-free; everyone else needs German theory +
      practical exams. Don't drive past month six.
    phase: settling
    urgency: medium
    deadline_type: days_since_arrival
    deadline_days: 180
    booking_service_key: kfz
    # Scoped per route. One flat list made the translation look universal and
    # left the exam-only certificates reading as everyone's problem — the
    # owner's question was literally "does the translation apply to all
    # branches?". Documents with no branch apply to both routes below.
    documents_required:
      - label: Passport or ID
      - label: The valid foreign licence
        note: It must be surrendered when the German card is handed over — plan for that.
      - label: Translation of the licence — by ADAC or a sworn translator
        note: Some English-language licences are exempt; ask before paying.
      - label: Biometric photo
      - label: Proof of when you first registered in Germany, if not first registered in Cologne
      - label: Vision test certificate + first-aid course certificate
        branch: Exam route
        note: Standard for exam-based applications — both are cheap and bookable within days.
    # Links belong to the route they describe, not to a flat list a reader has
    # to guess their way through: 00834 is the Anlage 11 conversion, 00836 the
    # third-country one.
    links: []
    how_to_steps:
      - title: 'Anlage 11 country: test-free exchange'
        branch: Exchange route
        body: Fee €36.30, processing ~2–3 weeks at any Kundenzentrum. Bring the documents listed — the translation is the piece people forget.
        link: https://www.stadt-koeln.de/service/produkte/00834/index.html
      - title: 'All other countries: exams required'
        branch: Exam route
        body: Conversion needs German theory + practical exams, booked through a Fahrschule (no minimum lessons mandated, but the Fahrschule files the exam request). Realistic cost is several hundred euros and exam slots queue — start in month one, not month five.
        link: https://www.stadt-koeln.de/service/produkte/00836/index.html
      - title: Started late? Stop driving, then fix it
        body: 'The 6-month validity can only be extended (up to 6 more months) if you can show you''ll stay under 12 months total. Otherwise: no driving until the German licence is issued.'

  - title: 'Church tax: know before you tick the box'
    key: shared.church_tax
    coverage_scope: universal
    type: info
    depends_on: []
    description: |
      The Anmeldung form asks your religion. Declaring a recognized denomination
      (Catholic, Protestant, Jewish…) enrols you in Kirchensteuer — 9% of your income
      tax in NRW, deducted automatically from every payslip. Leaving later requires a
      formal, fee-charged Kirchenaustritt at the Amtsgericht. Answer accurately — but
      know what the box means before you tick it.
    phase: arrival
    urgency: medium
    deadline_type: none
    documents_required: []
    links:
      - https://www.kirchenaustritt.de/nrw

  - title: 'Schufa: how Germany decides if it trusts you'
    key: shared.schufa
    coverage_scope: universal
    type: info
    depends_on: []
    description: |
      The Schufa is Germany's credit register. No history means no flat, no phone
      contract, no credit card — landlords ask for it before they'll even show you in.
      Bootstrap sequence: Anmeldung → bank account → pay everything on time. After a few
      weeks, request the free Datenkopie (§34 BDSG) to check your record; the paid
      BonitätsAuskunft (~€30) is the version landlords want to see.
    phase: settling
    urgency: low
    deadline_type: none
    documents_required: []
    links:
      - https://www.meineschufa.de/

  - title: 'Inviting family or friends to visit? Verpflichtungserklärung'
    key: shared.verpflichtungserklaerung
    coverage_scope: universal
    type: info
    depends_on: []
    applies_if_mode: explicit
    applies_if: {}
    review_status: approved
    jurisdiction: de-nrw-cologne
    reviewed_by: automated_source_check
    content_version: 2026-10-08.1
    source_verification: quote_checked
    legal_sources:
      - {kind: primary, label: '§68 AufenthG — Haftung für Lebensunterhalt', url: 'https://www.gesetze-im-internet.de/aufenthg_2004/__68.html'}
      - {kind: implementation, label: 'Stadt Köln · Verpflichtungserklärung', url: 'https://www.stadt-koeln.de/service/produkte/00962/index.html'}
    claims:
      - id: liability-period
        states: for five years from their entry
        source: '§68 AufenthG — Haftung für Lebensunterhalt'
        quote: hat für einen Zeitraum von fünf Jahren sämtliche öffentlichen Mittel zu erstatten
      - id: fee
        states: €29 per declaration
        source: 'Stadt Köln · Verpflichtungserklärung'
        quote: Die Verwaltungsgebühr pro Verpflichtungserklärung beträgt 29 Euro.
      - id: lead-time
        states: at least three months before their visa appointment
        source: 'Stadt Köln · Verpflichtungserklärung'
        quote: mindestens drei Monate vor dem Termin zur Visumserteilung bei der deutschen Auslandsvertretung
      - id: recognition-period
        states: up to six months after issue
        source: 'Stadt Köln · Verpflichtungserklärung'
        quote: Die Verpflichtungserklärung wird in der Regel für bis zu sechs Monate nach ihrer Ausstellung von der deutschen Auslandsvertretung anerkannt.
      - id: payslips
        states: payslips for the last three months
        source: 'Stadt Köln · Verpflichtungserklärung'
        quote: Gehaltsbescheinigungen der letzten drei Monate über monatliches Nettoeinkommen
    description: |
      If you invite visa-required family or friends to visit, they can use a
      Verpflichtungserklärung to show the German embassy or consulate that their costs
      are covered. You file it at the Ausländeramt (€29 per declaration; the fee is
      charged even if your income is not sufficient). You commit to covering public
      costs of their stay, for five years from their entry. You need your main
      residence in Cologne. File it at least three months before their visa appointment
      (by post, online contact form, or in person on Tuesday and Thursday mornings);
      the embassy usually recognises it for up to six months after issue. Employees
      bring payslips for the last three months and a bank statement showing the salary;
      self-employed people bring a Steuerberater certificate or their last tax
      assessment instead.
    phase: ongoing
    urgency: low
    deadline_type: none
    documents_required: []
    links:
      - https://www.stadt-koeln.de/service/produkte/00962/index.html

  - title: 'Fiktionsbescheinigung: what that bridging paper really permits'
    key: shared.fiktionsbescheinigung
    coverage_scope: universal
    type: info
    depends_on: []
    applies_if_mode: explicit
    applies_if:
      citizenship_group: non_eu
    review_status: approved
    jurisdiction: de-nrw-cologne
    reviewed_by: automated_source_check
    content_version: 2026-10-08.1
    source_verification: quote_checked
    legal_sources:
      - {kind: primary, label: '§81 AufenthG — Beantragung des Aufenthaltstitels', url: 'https://www.gesetze-im-internet.de/aufenthg_2004/__81.html'}
      - {kind: implementation, label: 'Stadt Köln · Fiktionsbescheinigungen', url: 'https://www.stadt-koeln.de/artikel/71447/index.html'}
    claims:
      - id: two-forms
        states: depends on which of its two forms you hold
        source: 'Stadt Köln · Fiktionsbescheinigungen'
        quote: Es gibt zwei Formen der Fiktionsbescheinigung
      - id: continuation
        states: The continuation form (§81 Abs. 4) keeps your current permit in force
        source: '§81 AufenthG — Beantragung des Aufenthaltstitels'
        quote: gilt der bisherige Aufenthaltstitel vom Zeitpunkt seines Ablaufs bis zur Entscheidung der Ausländerbehörde als fortbestehend
      - id: first-application
        states: The form for a first application without a visa (§81 Abs. 3)
        source: 'Stadt Köln · Fiktionsbescheinigungen'
        quote: 'Fiktionsbescheinigung nach § 81 Absatz 3 Aufenthaltsgesetz Diese Bescheinigung erhalten Sie, wenn: Sie ohne Visum eingereist sind.'
      - id: no-reentry
        states: you may not leave Germany and re-enter on it
        source: 'Stadt Köln · Fiktionsbescheinigungen'
        quote: 'Reisen: Mit dieser Fiktionsbescheinigung dürfen Sie Deutschland nicht verlassen und dann wiedereinreisen.'
    description: |
      While a permit application is processing you may get a Fiktionsbescheinigung —
      and what it allows depends on which of its two forms you hold. The continuation
      form (§81 Abs. 4) keeps your current permit in force until the decision: you may
      keep working if your permit allowed it, and you may travel and return while it is
      valid. The form for a first application without a visa (§81 Abs. 3) does not
      allow work, and you may not leave Germany and re-enter on it. Check which form
      yours is before booking any flight.
    phase: ongoing
    urgency: low
    deadline_type: none
    documents_required: []
    links:
      - https://www.stadt-koeln.de/artikel/71447/index.html
      - https://www.gesetze-im-internet.de/aufenthg_2004/__81.html

  - title: 'New passport? Transfer your permit (Übertrag)'
    key: shared.passport_transfer
    coverage_scope: universal
    type: info
    depends_on: []
    applies_if_mode: explicit
    applies_if:
      citizenship_group: non_eu
    review_status: approved
    jurisdiction: de-nrw-cologne
    reviewed_by: automated_source_check
    content_version: 2026-10-08.1
    source_verification: quote_checked
    legal_sources:
      - {kind: primary, label: '§51 AufenthG — Beendigung der Rechtmäßigkeit des Aufenthalts', url: 'https://www.gesetze-im-internet.de/aufenthg_2004/__51.html'}
      - {kind: implementation, label: 'Stadt Köln · Antworten auf Fragen zum Aufenthalt', url: 'https://www.stadt-koeln.de/artikel/73721/index.html'}
      - {kind: implementation, label: 'Stadt Köln · Niederlassungserlaubnis', url: 'https://www.stadt-koeln.de/leben-in-koeln/soziales/auslaenderamt/niederlassungserlaubnis'}
    claims:
      - id: title-stays-valid
        states: Your residence title stays valid when you get a new national passport
        source: 'Stadt Köln · Antworten auf Fragen zum Aufenthalt'
        quote: Ihr Aufenthaltstitel bleibt weiterhin gültig.
      - id: contact-form
        states: If the old passport number is printed on your residence title, contact the Ausländeramt through its contact form
        source: 'Stadt Köln · Antworten auf Fragen zum Aufenthalt'
        quote: Wenn die alte Passnummer auf Ihrem Aufenthaltstitel vermerkt ist, kontaktieren Sie uns bitte über unser Kontaktformular.
      - id: settlement-transfer
        states: bring your old passport, your new passport and a digital biometric photo
        source: 'Stadt Köln · Niederlassungserlaubnis'
        quote: Bitte bringen Sie Ihren alten Nationalpass, Ihren neuen Nationalpass und ein digitales biometrisches Passfoto zum Termin mit.
      - id: six-months-abroad
        states: stay abroad for longer than six months
        source: '§51 AufenthG — Beendigung der Rechtmäßigkeit des Aufenthalts'
        quote: wenn der Ausländer ausgereist und nicht innerhalb von sechs Monaten oder einer von der Ausländerbehörde bestimmten längeren Frist wieder eingereist ist
    description: |
      Your residence title stays valid when you get a new national passport. Carry
      both the old and the new passport if you kept the old one. If the old passport
      number is printed on your residence title, contact the Ausländeramt through its
      contact form and it will tell you the next steps; if it is not printed there,
      you do not need to do anything. Settlement permit holders whose card shows the
      passport number book an appointment at their Bezirksausländeramt and bring your
      old passport, your new passport and a digital biometric photo. Also worth
      knowing: a residence title generally expires if you leave Germany for a reason
      that is not temporary, or if you stay abroad for longer than six months without
      a longer period set by the Ausländerbehörde. Some exceptions apply, so ask
      before planning long stays away.
    phase: ongoing
    urgency: low
    deadline_type: none
    documents_required: []
    links:
      - https://www.stadt-koeln.de/artikel/73721/index.html
      - https://www.stadt-koeln.de/leben-in-koeln/soziales/auslaenderamt/niederlassungserlaubnis

  - title: 'The long game: permanent residency'
    key: shared.long_game
    coverage_scope: universal
    type: info
    # Do not offer permanent residency to someone who already holds it. Without
    # this the card appeared as "you could apply next" for a user who had told
    # onboarding they hold a settlement permit — while another lane said they
    # were not eligible. Same rule, two contradictory places. The old
    # `settled_at` gate is not a registered fact; the audience is now the
    # non-settled titles of current_residence_title (`other` is left out
    # because it may be a permanent title such as Daueraufenthalt-EU).
    depends_on: []
    applies_if_mode: explicit
    applies_if:
      citizenship_group: non_eu
      current_residence_title: [national_d_visa, standard_work_permit, blue_card, family_reunification]
    review_status: approved
    jurisdiction: de-nrw-cologne
    reviewed_by: automated_source_check
    content_version: 2026-10-08.1
    source_verification: quote_checked
    legal_sources:
      - {kind: primary, label: '§9 AufenthG — Niederlassungserlaubnis', url: 'https://www.gesetze-im-internet.de/aufenthg_2004/__9.html'}
      - {kind: primary, label: '§18c AufenthG — Niederlassungserlaubnis für Fachkräfte', url: 'https://www.gesetze-im-internet.de/aufenthg_2004/__18c.html'}
      - {kind: primary, label: '§28 AufenthG — Familiennachzug zu Deutschen', url: 'https://www.gesetze-im-internet.de/aufenthg_2004/__28.html'}
      - {kind: primary, label: '§9a AufenthG — Erlaubnis zum Daueraufenthalt-EU', url: 'https://www.gesetze-im-internet.de/aufenthg_2004/__9a.html'}
      - {kind: implementation, label: 'Stadt Köln · Allgemeine Niederlassungserlaubnis', url: 'https://www.stadt-koeln.de/service/produkt/allgemeine-niederlassungserlaubnis'}
    claims:
      - id: five-years
        states: usually after holding a residence permit for five years
        source: '§9 AufenthG — Niederlassungserlaubnis'
        quote: er seit fünf Jahren die Aufenthaltserlaubnis besitzt
      - id: pension
        states: at least 60 months of pension contributions
        source: '§9 AufenthG — Niederlassungserlaubnis'
        quote: er mindestens 60 Monate Pflichtbeiträge oder freiwillige Beiträge zur gesetzlichen Rentenversicherung geleistet hat
      - id: spouse-pension
        states: the contributions of one spouse can count for both
        source: '§9 AufenthG — Niederlassungserlaubnis'
        quote: Bei Ehegatten, die in ehelicher Lebensgemeinschaft leben, genügt es, wenn die Voraussetzungen nach Absatz 2 Satz 1 Nr. 3, 5 und 6 durch einen Ehegatten erfüllt werden.
      - id: b1
        states: German at level B1
        source: 'Stadt Köln · Allgemeine Niederlassungserlaubnis'
        quote: Ihre Deutschkenntnisse entsprechen dem Niveau B1 des Gemeinsamen Europäischen Referenzrahmens für Sprachen.
      - id: lid-test
        states: usually shown with the "Leben in Deutschland" test
        source: 'Stadt Köln · Allgemeine Niederlassungserlaubnis'
        quote: Der Nachweis erfolgt in der Regel über den Test "Leben in Deutschland"
      - id: fee
        states: The Cologne fee is €113
        source: 'Stadt Köln · Allgemeine Niederlassungserlaubnis'
        quote: Für die Erteilung einer Niederlassungserlaubnis müssen Sie eine Gebühr in Höhe von 113 Euro bezahlen.
      - id: skilled-worker
        states: three years on a skilled-worker permit
        source: '§18c AufenthG — Niederlassungserlaubnis für Fachkräfte'
        quote: sie seit drei Jahren im Besitz eines Aufenthaltstitels nach den §§ 18a, 18b, 18d oder § 18g ist
      - id: skilled-worker-domestic
        states: two years with a German degree or vocational training
        source: '§18c AufenthG — Niederlassungserlaubnis für Fachkräfte'
        quote: Die Frist nach Satz 1 Nummer 1 verkürzt sich auf zwei Jahre
      - id: skilled-worker-section
        states: under §18c
        source: '§18c AufenthG — Niederlassungserlaubnis für Fachkräfte'
        quote: Einer Fachkraft ist ohne Zustimmung der Bundesagentur für Arbeit eine Niederlassungserlaubnis zu erteilen
      - id: blue-card
        states: 27 months on a Blue Card
        source: '§18c AufenthG — Niederlassungserlaubnis für Fachkräfte'
        quote: wenn er mindestens 27 Monate eine Beschäftigung nach § 18g ausgeübt hat
      - id: blue-card-german
        states: 21 months with sufficient German
        source: '§18c AufenthG — Niederlassungserlaubnis für Fachkräfte'
        quote: Die Frist nach Satz 1 verkürzt sich auf 21 Monate, wenn der Ausländer über ausreichende Kenntnisse der deutschen Sprache verfügt.
      - id: family-of-germans
        states: three years for family members of Germans (§28)
        source: '§28 AufenthG — Familiennachzug zu Deutschen'
        quote: wenn er drei Jahre im Besitz einer Aufenthaltserlaubnis ist, die familiäre Lebensgemeinschaft mit dem Deutschen im Bundesgebiet fortbesteht
      - id: eu-variant
        states: The EU variant (Daueraufenthalt-EU, §9a) also generally needs five years
        source: '§9a AufenthG — Erlaubnis zum Daueraufenthalt-EU'
        quote: er sich seit fünf Jahren mit Aufenthaltstitel im Bundesgebiet aufhält
    description: |
      Germany rewards staying. A Niederlassungserlaubnis (permanent residency) is
      usually after holding a residence permit for five years, with secured
      livelihood, at least 60 months of pension contributions (in a marriage, the
      contributions of one spouse can count for both), German at level B1, basic
      knowledge of the legal and social order (usually shown with the "Leben in
      Deutschland" test) and sufficient housing for your household. The Cologne fee is
      €113. Faster routes exist: three years on a skilled-worker permit (two years with
      a German degree or vocational training) under §18c; 27 months on a Blue Card, or
      21 months with sufficient German; three years for family members of Germans (§28). The EU
      variant (Daueraufenthalt-EU, §9a) also generally needs five years. When a renewal
      comes due, check whether you already meet these conditions.
    phase: ongoing
    urgency: low
    deadline_type: none
    documents_required: []
    links:
      - https://www.stadt-koeln.de/leben-in-koeln/soziales/auslaenderamt/niederlassungserlaubnis
      - https://www.stadt-koeln.de/service/produkt/allgemeine-niederlassungserlaubnis

  # Split out of shared.long_game, which was gated on NOT already being settled.
  # That gate is right for the permanent-residency half and wrong for this one:
  # it hid citizenship from the only people for whom it is the next question.
  # Citizenship counts years of residence, not years since permanent residency,
  # so it carries no settled_at gate at all. Re-sourced 2026-10-08: every figure
  # is quoted from StAG or the Stadt Köln naturalisation page; the unsourced
  # "3-year fast track abolished in October 2025" remark was removed.
  - title: 'German citizenship'
    key: shared.citizenship
    coverage_scope: universal
    type: info
    depends_on: []
    applies_if_mode: explicit
    applies_if:
      citizenship_group: non_eu
    review_status: approved
    jurisdiction: de-nrw-cologne
    reviewed_by: automated_source_check
    content_version: 2026-10-08.1
    source_verification: quote_checked
    legal_sources:
      - {kind: primary, label: '§10 StAG — Einbürgerung', url: 'https://www.gesetze-im-internet.de/stag/__10.html'}
      - {kind: primary, label: '§38 StAG — Gebühren', url: 'https://www.gesetze-im-internet.de/stag/__38.html'}
      - {kind: implementation, label: 'Stadt Köln · Einbürgerung', url: 'https://www.stadt-koeln.de/service/produkt/einbuergerung-den-deutschen-staatsverband'}
    claims:
      - id: five-years
        states: usually after five years of lawful residence in Germany
        source: '§10 StAG — Einbürgerung'
        quote: Ein Ausländer, der seit fünf Jahren rechtmäßig seinen gewöhnlichen Aufenthalt im Inland hat
      - id: b1
        states: German at level B1
        source: 'Stadt Köln · Einbürgerung'
        quote: ein Deutsch-Zertifikat mit mindestens Niveau B1
      - id: test
        states: a passed naturalisation test (Einbürgerungstest)
        source: 'Stadt Köln · Einbürgerung'
        quote: durch einen erfolgreich abgeschlossenen Einbürgerungstest
      - id: fee
        states: The fee is €255
        source: '§38 StAG — Gebühren'
        quote: die Einbürgerung in Höhe von 255 Euro
    description: |
      German citizenship is usually after five years of lawful residence in Germany,
      with German at level B1 (or a German school, study or vocational qualification)
      and proof of knowledge of the legal and social order, for example a passed
      naturalisation test (Einbürgerungstest). The fee is €255. Other conditions, such
      as your residence title and secured livelihood, also apply.
    phase: ongoing
    urgency: low
    deadline_type: none
    documents_required: []
    links:
      - https://www.stadt-koeln.de/service/produkt/einbuergerung-den-deutschen-staatsverband

  - title: 'Foreign professional qualification? Get it recognized'
    key: shared.recognition
    coverage_scope: universal
    type: info
    eu_filter: non_eu_only
    depends_on: []
    description: |
      For regulated professions (healthcare, teaching, engineering titles…) and for
      stronger job applications generally, get your foreign qualification recognized.
      Check the Anabin database first; if your degree isn't listed as equivalent, order
      a ZAB Zeugnisbewertung. Profession-specific authorities (IHK FOSA, Bezirksregierung,
      Ärztekammer) handle regulated fields — start at the official "Anerkennung in
      Deutschland" portal, which routes you to the right one.
    phase: ongoing
    urgency: low
    deadline_type: none
    documents_required: []
    links:
      - https://www.anerkennung-in-deutschland.de/en/
      - https://anabin.kmk.org/anabin.html

  - title: 'Turkish citizens: ask about your ARB 1/80 rights'
    key: shared.arb_turkish
    coverage_scope: universal
    type: info
    eu_filter: non_eu_only
    depends_on: []
    description: |
      Turkish citizens accrue special rights under the EU–Turkey Association Agreement
      (ARB 1/80): after 1 year with the same employer, a renewal right for that job;
      after 3 years, applications in the same occupation; after 4 years, free
      labour-market access. Family members accrue rights after 3–5 years too. It's
      also concretely cheaper in Cologne — e.g. reduced permit fees (€22.80 under 24 /
      €37 from 24). The rights attach automatically, but offices won't volunteer them:
      ask specifically about ARB 1/80 status, and keep contracts, payslips and your
      pension record as proof of the qualifying periods.
    phase: ongoing
    urgency: low
    deadline_type: none
    documents_required: []
    links:
      - https://www.stadt-koeln.de/leben-in-koeln/soziales/auslaenderamt/index.html

  - title: 'A child born in Germany: check citizenship first'
    key: shared.child_born
    coverage_scope: universal
    type: info
    depends_on: []
    description: |
      Before any permit paperwork: your child may be German by birth — if at birth one
      parent had 5+ years of lawful residence and holds a Niederlassungserlaubnis or
      Daueraufenthalt-EU, or is an EU/EEA citizen with free movement. The Standesamt
      registers citizenship when certifying the birth. If not German, the child gets
      its own permit (§33) — often ex officio, no application — needing the birth
      certificate (register the birth within one week!), the child's passport (the
      consulate wait is the bottleneck; a Fiktionsbescheinigung bridges), one biometric
      photo and the parents' documents; fee from ~€25. Then chain the good stuff:
      Kindergeld, free family health insurance, and — if unmarried — the
      Vaterschaftsanerkennung, ideally done before the birth.
    phase: ongoing
    urgency: low
    deadline_type: none
    documents_required: []
    links:
      - https://www.stadt-koeln.de/service/produkte/00237/index.html

  - title: 'Other permit types: where to look'
    key: shared.other_permits
