  - title: 'The long game: permanent residency'
    key: shared.long_game
    coverage_scope: universal
    type: info
    # Do not offer permanent residency to someone who already holds it. Without
    # this the card appeared as "you could apply next" for a user who had told
    # onboarding they hold a settlement permit — while another lane said they
    # were not eligible. Same rule, two contradictory places. The old
    # `settled_at` gate is not a registered fact; the audience is now the
    # non-settled titles of current_residence_title (`other` is left out
    # because it may be a permanent title such as Daueraufenthalt-EU).
    depends_on: []
    applies_if_mode: explicit
    applies_if:
      citizenship_group: non_eu
      current_residence_title: [national_d_visa, standard_work_permit, blue_card, family_reunification]
    review_status: approved
    jurisdiction: de-nrw-cologne
    reviewed_by: automated_source_check
    content_version: 2026-10-08.1
    source_verification: quote_checked
    legal_sources:
      - {kind: primary, label: '§9 AufenthG — Niederlassungserlaubnis', url: 'https://www.gesetze-im-internet.de/aufenthg_2004/__9.html'}
      - {kind: primary, label: '§18c AufenthG — Niederlassungserlaubnis für Fachkräfte', url: 'https://www.gesetze-im-internet.de/aufenthg_2004/__18c.html'}
      - {kind: primary, label: '§28 AufenthG — Familiennachzug zu Deutschen', url: 'https://www.gesetze-im-internet.de/aufenthg_2004/__28.html'}
      - {kind: primary, label: '§9a AufenthG — Erlaubnis zum Daueraufenthalt-EU', url: 'https://www.gesetze-im-internet.de/aufenthg_2004/__9a.html'}
      - {kind: implementation, label: 'Stadt Köln · Allgemeine Niederlassungserlaubnis', url: 'https://www.stadt-koeln.de/service/produkt/allgemeine-niederlassungserlaubnis'}
    claims:
      - id: five-years
        states: usually after holding a residence permit for five years
        source: '§9 AufenthG — Niederlassungserlaubnis'
        quote: er seit fünf Jahren die Aufenthaltserlaubnis besitzt
      - id: pension
        states: at least 60 months of pension contributions
        source: '§9 AufenthG — Niederlassungserlaubnis'
        quote: er mindestens 60 Monate Pflichtbeiträge oder freiwillige Beiträge zur gesetzlichen Rentenversicherung geleistet hat
      - id: spouse-pension
        states: the contributions of one spouse can count for both
        source: '§9 AufenthG — Niederlassungserlaubnis'
        quote: Bei Ehegatten, die in ehelicher Lebensgemeinschaft leben, genügt es, wenn die Voraussetzungen nach Absatz 2 Satz 1 Nr. 3, 5 und 6 durch einen Ehegatten erfüllt werden.
      - id: b1
        states: German at level B1
        source: 'Stadt Köln · Allgemeine Niederlassungserlaubnis'
        quote: Ihre Deutschkenntnisse entsprechen dem Niveau B1 des Gemeinsamen Europäischen Referenzrahmens für Sprachen.
      - id: lid-test
        states: usually shown with the "Leben in Deutschland" test
        source: 'Stadt Köln · Allgemeine Niederlassungserlaubnis'
        quote: Der Nachweis erfolgt in der Regel über den Test "Leben in Deutschland"
      - id: fee
        states: The Cologne fee is €113
        source: 'Stadt Köln · Allgemeine Niederlassungserlaubnis'
        quote: Für die Erteilung einer Niederlassungserlaubnis müssen Sie eine Gebühr in Höhe von 113 Euro bezahlen.
      - id: skilled-worker
        states: three years on a skilled-worker permit
        source: '§18c AufenthG — Niederlassungserlaubnis für Fachkräfte'
        quote: sie seit drei Jahren im Besitz eines Aufenthaltstitels nach den §§ 18a, 18b, 18d oder § 18g ist
      - id: skilled-worker-domestic
        states: two years with a German degree or vocational training
        source: '§18c AufenthG — Niederlassungserlaubnis für Fachkräfte'
        quote: Die Frist nach Satz 1 Nummer 1 verkürzt sich auf zwei Jahre
      - id: skilled-worker-section
        states: under §18c
        source: '§18c AufenthG — Niederlassungserlaubnis für Fachkräfte'
        quote: Einer Fachkraft ist ohne Zustimmung der Bundesagentur für Arbeit eine Niederlassungserlaubnis zu erteilen
      - id: blue-card
        states: 27 months on a Blue Card
        source: '§18c AufenthG — Niederlassungserlaubnis für Fachkräfte'
        quote: wenn er mindestens 27 Monate eine Beschäftigung nach § 18g ausgeübt hat
      - id: blue-card-german
        states: 21 months with sufficient German
        source: '§18c AufenthG — Niederlassungserlaubnis für Fachkräfte'
        quote: Die Frist nach Satz 1 verkürzt sich auf 21 Monate, wenn der Ausländer über ausreichende Kenntnisse der deutschen Sprache verfügt.
      - id: family-of-germans
        states: three years for family members of Germans (§28)
        source: '§28 AufenthG — Familiennachzug zu Deutschen'
        quote: wenn er drei Jahre im Besitz einer Aufenthaltserlaubnis ist, die familiäre Lebensgemeinschaft mit dem Deutschen im Bundesgebiet fortbesteht
      - id: eu-variant
        states: The EU variant (Daueraufenthalt-EU, §9a) also generally needs five years
        source: '§9a AufenthG — Erlaubnis zum Daueraufenthalt-EU'
        quote: er sich seit fünf Jahren mit Aufenthaltstitel im Bundesgebiet aufhält
    description: |
      Germany rewards staying. A Niederlassungserlaubnis (permanent residency) is
      usually after holding a residence permit for five years, with secured
      livelihood, at least 60 months of pension contributions (in a marriage, the
      contributions of one spouse can count for both), German at level B1, basic
      knowledge of the legal and social order (usually shown with the "Leben in
      Deutschland" test) and sufficient housing for your household. The Cologne fee is
      €113. Faster routes exist: three years on a skilled-worker permit (two years with
      a German degree or vocational training) under §18c; 27 months on a Blue Card, or
      21 months with sufficient German; three years for family members of Germans (§28). The EU
      variant (Daueraufenthalt-EU, §9a) also generally needs five years. When a renewal
      comes due, check whether you already meet these conditions.
    phase: ongoing
    urgency: low
    deadline_type: none
    documents_required: []
    links:
      - https://www.stadt-koeln.de/leben-in-koeln/soziales/auslaenderamt/niederlassungserlaubnis
      - https://www.stadt-koeln.de/service/produkt/allgemeine-niederlassungserlaubnis

  # Split out of shared.long_game, which was gated on NOT already being settled.
  # That gate is right for the permanent-residency half and wrong for this one:
  # it hid citizenship from the only people for whom it is the next question.
  # Citizenship counts years of residence, not years since permanent residency,
  # so it carries no settled_at gate at all. Re-sourced 2026-10-08: every figure
  # is quoted from StAG or the Stadt Köln naturalisation page; the unsourced
  # "3-year fast track abolished in October 2025" remark was removed.
  - title: 'German citizenship'
    key: shared.citizenship
    coverage_scope: universal
    type: info
    depends_on: []
    applies_if_mode: explicit
    applies_if:
      citizenship_group: non_eu
    review_status: approved
    jurisdiction: de-nrw-cologne
    reviewed_by: automated_source_check
    content_version: 2026-10-08.1
    source_verification: quote_checked
    legal_sources:
      - {kind: primary, label: '§10 StAG — Einbürgerung', url: 'https://www.gesetze-im-internet.de/stag/__10.html'}
      - {kind: primary, label: '§38 StAG — Gebühren', url: 'https://www.gesetze-im-internet.de/stag/__38.html'}
      - {kind: implementation, label: 'Stadt Köln · Einbürgerung', url: 'https://www.stadt-koeln.de/service/produkt/einbuergerung-den-deutschen-staatsverband'}
    claims:
      - id: five-years
        states: usually after five years of lawful residence in Germany
        source: '§10 StAG — Einbürgerung'
        quote: Ein Ausländer, der seit fünf Jahren rechtmäßig seinen gewöhnlichen Aufenthalt im Inland hat
      - id: b1
        states: German at level B1
        source: 'Stadt Köln · Einbürgerung'
        quote: ein Deutsch-Zertifikat mit mindestens Niveau B1
      - id: test
        states: a passed naturalisation test (Einbürgerungstest)
        source: 'Stadt Köln · Einbürgerung'
        quote: durch einen erfolgreich abgeschlossenen Einbürgerungstest
      - id: fee
        states: The fee is €255
        source: '§38 StAG — Gebühren'
        quote: die Einbürgerung in Höhe von 255 Euro
    description: |
      German citizenship is usually after five years of lawful residence in Germany,
      with German at level B1 (or a German school, study or vocational qualification)
      and proof of knowledge of the legal and social order, for example a passed
      naturalisation test (Einbürgerungstest). The fee is €255. Other conditions, such
      as your residence title and secured livelihood, also apply.
    phase: ongoing
    urgency: low
    deadline_type: none
    documents_required: []
    links:
      - https://www.stadt-koeln.de/service/produkt/einbuergerung-den-deutschen-staatsverband

  - title: 'Foreign professional qualification? Get it recognized'
    key: shared.recognition
    coverage_scope: universal
    type: info
    depends_on: []
    # Source-checked (claims verified daily), not yet mapped to a Paperwork process, so not approved.
    review_status: legacy
    jurisdiction: de-nrw-cologne
    reviewed_by: automated_source_check
    content_version: 2026-10-30.1
    source_verification: quote_checked
    legal_sources:
      - {kind: primary, label: 'Bundesärzteordnung (BÄO)', url: 'https://www.gesetze-im-internet.de/b_o/BJNR018570961.html'}
      - {kind: implementation, label: 'BAMF — Ausländische Berufsabschlüsse', url: 'https://www.bamf.de/DE/Themen/Integration/ZugewanderteTeilnehmende/AnerkennungBerufsabschluesse/anerkennungberufsabschluesse-node.html'}
      - {kind: implementation, label: 'BAMF — To Germany as a graduate', url: 'https://www.bamf.de/EN/Themen/MigrationAufenthalt/ZuwandererDrittstaaten/Arbeit/Hochschulabsolvent/hochschulabsolvent-node.html'}
    claims:
      - id: regulated-meaning
        states: you may only work in them after a state approval procedure and recognition of your qualification
        source: 'BAMF — Ausländische Berufsabschlüsse'
        quote: bedeutet, dass der Beruf ohne ein staatliches Zulassungsverfahren und ohne eine Anerkennung ihrer Berufsqualifikation nicht ausgeübt werden darf
      - id: regulated-examples
        states: jobs in health and education are among the regulated ones, for example doctor, nurse or nursery teacher
        source: 'BAMF — Ausländische Berufsabschlüsse'
        quote: In Deutschland sind unter anderem Berufe im Gesundheits- und Bildungssektor (beispielsweise Ärztin, Krankenpfleger oder Erzieher) reglementiert.
      - id: non-regulated
        states: In other jobs you need no formal recognition to work
        source: 'BAMF — Ausländische Berufsabschlüsse'
        quote: In nicht-reglementierten Berufen brauchen Sie dagegen keine formelle Anerkennung Ihres Abschlusses, um arbeiten zu dürfen
      - id: assessment-helps-employers
        states: having your qualifications assessed can still help employers judge them
        source: 'BAMF — Ausländische Berufsabschlüsse'
        quote: Eine Prüfung Ihrer Qualifikationen kann aber trotzdem sinnvoll sein, damit der Arbeitgeber Ihre Qualifikationen besser einschätzen kann.
      - id: nationality-irrelevant
        states: Your nationality does not matter for the procedure
        source: 'BAMF — Ausländische Berufsabschlüsse'
        quote: Ihre Staatsangehörigkeit ist für das Verfahren nicht entscheidend.
      - id: responsible-office
        states: You apply to the office responsible for your profession
        source: 'BAMF — Ausländische Berufsabschlüsse'
        quote: Um den Antrag zu stellen, müssen sich Interessierte an die Stelle wenden, die für ihre Berufsgruppe zuständig ist.
      - id: portal-and-hotline
        states: www.anerkennung-in-deutschland.de or call the "Working and Living in Germany" hotline (Hotline Arbeiten und Leben in Deutschland) on +49 30-1815-1111
        source: 'BAMF — Ausländische Berufsabschlüsse'
        quote: 'erfahren Sie im Internet unter www.anerkennung-in-deutschland.de oder bei der "Hotline Arbeiten und Leben in Deutschland" unter der Nummer +49 30-1815-1111'
      - id: doctors-licence
        states: Doctors need a licence to practise (Approbation)
        source: 'Bundesärzteordnung (BÄO)'
        quote: Wer im Geltungsbereich dieses Gesetzes den ärztlichen Beruf ausüben will, bedarf der Approbation als Arzt.
      - id: doctors-authority
        states: the authority of the federal state where you want to work as a doctor decides on it
        source: 'Bundesärzteordnung (BÄO)'
        quote: trifft die zuständige Behörde des Landes, in dem der ärztliche Beruf ausgeübt werden soll
      - id: fees
        states: The procedure costs fees, set by the responsible office
        source: 'BAMF — Ausländische Berufsabschlüsse'
        quote: Für das Verfahren fallen Gebühren an. Diese werden von der jeweils zuständigen Stelle festgelegt.
      - id: duration
        states: once all documents are complete, it should as a rule take no longer than three months
        source: 'BAMF — Ausländische Berufsabschlüsse'
        quote: Wenn alle Unterlagen vollständig sind, sollte das Verfahren ab 1. Dezember 2012 in der Regel nicht länger als drei Monate dauern.
      - id: degree-database-overview
        states: gives a good overview of the equivalence of foreign academic degrees
        source: 'BAMF — To Germany as a graduate'
        quote: database of the Standing Conference of Ministers of Education and Cultural Affairs provides a good overview of the equivalence of foreign academic degrees
    description: |
      Some professions are regulated: you may only work in them after a state approval procedure and recognition of your qualification.
      In Germany, jobs in health and education are among the regulated ones, for example doctor, nurse or nursery teacher.
      In other jobs you need no formal recognition to work, but having your qualifications assessed can still help employers judge them. This is only about doing the job itself: if you need a residence permit, check that permit's card for what it asks of your qualification.
      Your nationality does not matter for the procedure.
      You apply to the office responsible for your profession. To find out whether your job is regulated and which office that is, use the portal www.anerkennung-in-deutschland.de or call the "Working and Living in Germany" hotline (Hotline Arbeiten und Leben in Deutschland) on +49 30-1815-1111.
      Doctors need a licence to practise (Approbation); the authority of the federal state where you want to work as a doctor decides on it.
      The procedure costs fees, set by the responsible office; once all documents are complete, it should as a rule take no longer than three months.
      Have a university degree? The database of the education ministers' conference (link below) gives a good overview of the equivalence of foreign academic degrees.
    phase: ongoing
    urgency: low
    deadline_type: none
    documents_required: []
    links:
      - https://www.anerkennung-in-deutschland.de/en/
      - https://anabin.kmk.org/anabin.html

  - title: 'Turkish citizens: ask about your ARB 1/80 rights'
    key: shared.arb_turkish
    coverage_scope: universal
    type: info
    eu_filter: non_eu_only
    depends_on: []
    description: |
      Turkish citizens accrue special rights under the EU–Turkey Association Agreement
      (ARB 1/80): after 1 year with the same employer, a renewal right for that job;
      after 3 years, applications in the same occupation; after 4 years, free
      labour-market access. Family members accrue rights after 3–5 years too. It's
      also concretely cheaper in Cologne — e.g. reduced permit fees (€22.80 under 24 /
      €37 from 24). The rights attach automatically, but offices won't volunteer them:
      ask specifically about ARB 1/80 status, and keep contracts, payslips and your
      pension record as proof of the qualifying periods.
    phase: ongoing
    urgency: low
    deadline_type: none
    documents_required: []
    links:
      - https://www.stadt-koeln.de/leben-in-koeln/soziales/auslaenderamt/index.html

