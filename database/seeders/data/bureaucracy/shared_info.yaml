    claims:
      - id: training
        states: 'Vocational training in a company (§16a)'
        source: '§16a AufenthG — Berufsausbildung'
        quote: Eine Aufenthaltserlaubnis zum Zweck der betrieblichen Aus- und Weiterbildung soll erteilt werden
      - id: research
        states: 'Researchers (§18d)'
        source: '§18d AufenthG — Forschung'
        quote: eine wirksame Aufnahmevereinbarung oder einen entsprechenden Vertrag zur Durchführung eines Forschungsvorhabens mit einer Forschungseinrichtung abgeschlossen hat
      - id: ict
        states: 'intra-corporate transfers (§19)'
        source: '§19 AufenthG — ICT-Karte'
        quote: Eine ICT-Karte ist ein Aufenthaltstitel zum Zweck eines unternehmensinternen Transfers eines Ausländers.
      - id: language-courses
        states: 'Language courses (§16f)'
        source: '§16f AufenthG — Sprachkurse und Schulbesuch'
        quote: Einem Ausländer kann eine Aufenthaltserlaubnis zur Teilnahme an Sprachkursen, die nicht der Studienvorbereitung dienen
      - id: training-search
        states: 'searching for a training place (§17)'
        source: '§17 AufenthG — Suche eines Ausbildungs- oder Studienplatzes'
        quote: Einem Ausländer kann zum Zweck der Suche nach einem Ausbildungsplatz zur Durchführung einer qualifizierten Berufsausbildung eine Aufenthaltserlaubnis erteilt werden
      - id: eu-long-term
        states: 'Long-term residents of another EU country (§38a)'
        source: '§38a AufenthG — Langfristig Aufenthaltsberechtigte anderer EU-Staaten'
        quote: Einem Ausländer, der in einem anderen Mitgliedstaat der Europäischen Union die Rechtsstellung eines langfristig Aufenthaltsberechtigten innehat, wird eine Aufenthaltserlaubnis erteilt
      - id: eu-long-term-period
        states: want to stay in Germany for more than 90 days
        source: '§38a AufenthG — Langfristig Aufenthaltsberechtigte anderer EU-Staaten'
        quote: wenn er sich länger als 90 Tage im Bundesgebiet aufhalten will
    description: |
      Some paths we don't model in full. Here is where the law puts them.
      Vocational training in a company (§16a) has its own residence permit for
      training. Researchers (§18d) need a hosting agreement or contract with a research
      institution; intra-corporate transfers (§19) use the ICT Card for a temporary
      posting within the company group. Language courses (§16f) and searching for a
      training place (§17) have their own residence permits. Long-term residents of
      another EU country (§38a) who hold that status there can get a residence permit
      if they want to stay in Germany for more than 90 days. Ask the Ausländeramt which
      route applies to you.
