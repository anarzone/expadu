# Cross-branch content: the driving-licence task (everyone with a foreign
# licence) and the good-to-know info cards. Listed for every branch so each
# user sees them regardless of path. See docs/bureaucracy-sources.md.
situation:
  - core
  - eu_employee
  - non_eu_employee
  - non_eu_employee_blue_card
  - non_eu_employee_chancenkarte
  - student
  - freelancer
  - freelancer_gewerbe
  - family_reunification
  - family_reunification_of_german
  - family_reunification_of_eu_citizen

tasks:
  - title: Sort out your driving licence
    key: shared.driving_licence
    coverage_scope: universal
    depends_on: []
    applies_if:
      license_country: [other]
    # Source-checked, but its audience reads the profile's license_country, which approved cards may not use.
    review_status: legacy
    jurisdiction: de-nrw-cologne
    reviewed_by: automated_source_check
    content_version: 2026-10-30.1
    source_verification: quote_checked
    legal_sources:
      - {kind: primary, label: '§29 FeV — Ausländische Fahrerlaubnisse', url: 'https://www.gesetze-im-internet.de/fev_2010/__29.html'}
      - {kind: primary, label: '§7 FeV — Ordentlicher Wohnsitz im Inland', url: 'https://www.gesetze-im-internet.de/fev_2010/__7.html'}
      - {kind: primary, label: '§31 FeV — Erteilung einer Fahrerlaubnis an Inhaber einer Fahrerlaubnis aus einem Staat außerhalb des EWR', url: 'https://www.gesetze-im-internet.de/fev_2010/__31.html'}
      - {kind: primary, label: '§21 StVG — Fahren ohne Fahrerlaubnis', url: 'https://www.gesetze-im-internet.de/stvg/__21.html'}
      - {kind: implementation, label: 'Stadt Köln — Umschreibung einer Fahrerlaubnis aus Staaten der Anlage 11', url: 'https://www.stadt-koeln.de/service/produkte/00834/index.html'}
      - {kind: implementation, label: 'Stadt Köln — Umschreibung einer Fahrerlaubnis aus Drittstaaten', url: 'https://www.stadt-koeln.de/service/produkte/00836/index.html'}
    claims:
      - id: eu-licences
        states: those licences follow different rules
        source: '§29 FeV — Ausländische Fahrerlaubnisse'
        quote: richtet sich seine weitere Berechtigung zum Führen von Kraftfahrzeugen nach § 28
      - id: six-months
        states: you may keep driving on your licence for six months once Germany becomes your ordinary residence
        source: '§29 FeV — Ausländische Fahrerlaubnisse'
        quote: Begründet der Inhaber einer in einem anderen Staat erteilten Fahrerlaubnis einen ordentlichen Wohnsitz im Inland, besteht die Berechtigung noch sechs Monate.
      - id: six-month-deadline
        covers: deadline
        source: '§29 FeV — Ausländische Fahrerlaubnisse'
        quote: Begründet der Inhaber einer in einem anderen Staat erteilten Fahrerlaubnis einen ordentlichen Wohnsitz im Inland, besteht die Berechtigung noch sechs Monate.
      - id: ordinary-residence
        states: you usually live here because of personal ties, and work ties if you have them
        source: '§7 FeV — Ordentlicher Wohnsitz im Inland'
        quote: Dies wird angenommen, wenn der Bewerber wegen persönlicher und beruflicher Bindungen oder – bei fehlenden beruflichen Bindungen – wegen persönlicher Bindungen, die enge Beziehungen zwischen ihm und dem Wohnort erkennen lassen, gewöhnlich, das heißt während mindestens 185 Tagen im Jahr, im Inland wohnt.
      - id: criminal-offence
        states: driving without the required licence is a criminal offence, punished with prison or a fine
        source: '§21 StVG — Fahren ohne Fahrerlaubnis'
        quote: Mit Freiheitsstrafe bis zu einem Jahr oder mit Geldstrafe wird bestraft, wer
      - id: eu-students
        states: If you lived in another EU/EEA country before and are here only to attend a university or school, you do not set up an ordinary residence in Germany
        source: '§7 FeV — Ordentlicher Wohnsitz im Inland'
        quote: Bewerber, die bislang ihren ordentlichen Wohnsitz in einem anderen Mitgliedstaat der Europäischen Union oder einem anderen Vertragsstaat des Abkommens über den Europäischen Wirtschaftsraum hatten und die sich ausschließlich wegen des Besuchs einer Hochschule oder Schule im Inland aufhalten, begründen keinen ordentlichen Wohnsitz im Inland.
      - id: eu-students-no-clock
        states: so the six months do not start
        source: '§29 FeV — Ausländische Fahrerlaubnisse'
        quote: Begründet der Inhaber einer in einem anderen Staat erteilten Fahrerlaubnis einen ordentlichen Wohnsitz im Inland, besteht die Berechtigung noch sechs Monate.
      - id: anlage-11-country-class
        states: issued in a country and class listed in Anlage 11 (a list in the licence regulations)
        source: '§31 FeV — Erteilung einer Fahrerlaubnis an Inhaber einer Fahrerlaubnis aus einem Staat außerhalb des EWR'
        quote: die in einem in Anlage 11 aufgeführten Staat und in einer in der Anlage 11 aufgeführten Klasse erteilt worden ist
      - id: anlage-11-test
        states: that list sets whether you still need a test
        source: '§31 FeV — Erteilung einer Fahrerlaubnis an Inhaber einer Fahrerlaubnis aus einem Staat außerhalb des EWR'
        quote: § 15 über die Befähigungsprüfung nach Maßgabe der Anlage 11
      - id: anlage-11-step-title
        states: 'Anlage 11 country: convert your licence'
        source: 'Stadt Köln — Umschreibung einer Fahrerlaubnis aus Staaten der Anlage 11'
        quote: Umschreibung einer Fahrerlaubnis aus Staaten der Anlage 11
      - id: other-countries-tests
        states: you must pass a theory and a practical test in every case
        source: 'Stadt Köln — Umschreibung einer Fahrerlaubnis aus Drittstaaten'
        quote: Sie müssen in jedem Fall eine theoretische und eine praktische Prüfung ablegen.
      - id: kundenzentrum
        states: Go in person to any Kundenzentrum (city service centre) in Cologne
        source: 'Stadt Köln — Umschreibung einer Fahrerlaubnis aus Staaten der Anlage 11'
        quote: Dazu können Sie ein Kundenzentrum Ihrer Wahl in Köln aufsuchen.
      - id: fee-test-free
        states: 'Fee: €36.30 when no test is needed and no probation period (Probezeit) applies'
        source: 'Stadt Köln — Umschreibung einer Fahrerlaubnis aus Staaten der Anlage 11'
        quote: 'Umschreibung prüfungsfrei ohne Probezeit: 36,30 Euro'
      - id: processing-time
        states: Processing takes about two to three weeks
        source: 'Stadt Köln — Umschreibung einer Fahrerlaubnis aus Staaten der Anlage 11'
        quote: Die Bearbeitungszeit dauert ungefähr zwei bis drei Wochen.
      - id: anlage-11-driving-school
        states: If a practical test is needed, you also name a Fahrschule (driving school)
        source: 'Stadt Köln — Umschreibung einer Fahrerlaubnis aus Staaten der Anlage 11'
        quote: Sofern eine praktische Prüfung erforderlich ist, müssen Sie noch eine Fahrschule angeben
      - id: school-registers
        states: it registers you for the tests
        source: 'Stadt Köln — Umschreibung einer Fahrerlaubnis aus Drittstaaten'
        quote: Zur Prüfung werden Sie durch Ihre Fahrschule zugelassen.
      - id: extension
        states: On request, the six months can be extended by up to six months if you show you will have your ordinary residence in Germany for no more than twelve months
        source: '§29 FeV — Ausländische Fahrerlaubnisse'
        quote: Die Fahrerlaubnisbehörde kann die Frist auf Antrag bis zu sechs Monate verlängern, wenn der Antragsteller glaubhaft macht, dass er seinen ordentlichen Wohnsitz nicht länger als zwölf Monate im Inland haben wird.
      - id: surrender-licence
        states: you hand it in when you get the German card
        source: 'Stadt Köln — Umschreibung einer Fahrerlaubnis aus Staaten der Anlage 11'
        quote: bei Aushändigung des deutschen Kartenführerscheines Ihren ausländischen Führerschein abgeben müssen
      - id: first-aid-in-person
        states: The first-aid course must have been in person; online courses are not accepted
        source: 'Stadt Köln — Umschreibung einer Fahrerlaubnis aus Drittstaaten'
        quote: Online-Schulungen können wir nicht anerkennen.
    description: |
      If your licence is from an EU/EEA country, this task doesn't apply to you; those licences follow different rules.
      Otherwise, you may keep driving on your licence for six months once Germany becomes your ordinary residence, meaning you usually live here because of personal ties, and work ties if you have them.
      After that, driving without the required licence is a criminal offence, punished with prison or a fine.
      If you lived in another EU/EEA country before and are here only to attend a university or school, you do not set up an ordinary residence in Germany, so the six months do not start.
      If your licence was issued in a country and class listed in Anlage 11 (a list in the licence regulations), you convert it, and that list sets whether you still need a test.
      With a licence from any other country, you must pass a theory and a practical test in every case.
    phase: settling
    urgency: medium
    deadline_type: days_since_arrival
    deadline_days: 181
    booking_service_key: kfz
    # Scoped per route. One flat list made the translation look universal and
    # left the exam-only certificates reading as everyone's problem — the
    # owner's question was literally "does the translation apply to all
    # branches?". Documents with no branch apply to both routes below.
    documents_required:
      - label: Passport or ID
        note: If you are not an EU citizen, bring your passport with your residence permit.
      - label: The valid foreign licence
        note: It must still be valid when you apply, and you hand it in when you get the German card.
      - label: Translation and classification of the licence — for example by ADAC or a sworn translator
      - label: Biometric photo
      - label: Proof of when you first registered in Germany
        note: Not needed if you first registered in Cologne and have lived here ever since.
      - label: Proof of the date your licence was issued
        note: Only needed if the date is not shown on the licence.
      - label: Vision test certificate + first-aid course certificate
        branch: Exam route
        note: The first-aid course must have been in person; online courses are not accepted.
      - label: Confirmation or training contract from your Fahrschule
        branch: Exam route
    # Links belong to the route they describe, not to a flat list a reader has
    # to guess their way through: 00834 is the Anlage 11 conversion, 00836 the
    # third-country one.
    links: []
    how_to_steps:
      - title: 'Anlage 11 country: convert your licence'
        branch: Exchange route
        body: 'Go in person to any Kundenzentrum (city service centre) in Cologne. Fee: €36.30 when no test is needed and no probation period (Probezeit) applies. Processing takes about two to three weeks. If a practical test is needed, you also name a Fahrschule (driving school). Bring the documents listed.'
        link: https://www.stadt-koeln.de/service/produkte/00834/index.html
      - title: 'All other countries: tests required'
        branch: Exam route
        body: Start early, well before your deadline. Sign up with a Fahrschule (driving school) first; it registers you for the tests. Then apply with the documents listed.
        link: https://www.stadt-koeln.de/service/produkte/00836/index.html
      - title: Started late? Stop driving, then fix it
        body: On request, the six months can be extended by up to six months if you show you will have your ordinary residence in Germany for no more than twelve months. Otherwise, don't drive until you have the German licence.

  - title: 'Church tax: how church membership affects your tax'
    key: shared.church_tax
    coverage_scope: universal
    type: info
    depends_on: []
    # Source-checked (claims verified daily), not yet mapped to a Paperwork process, so not approved.
    review_status: legacy
    jurisdiction: de-nrw-cologne
    reviewed_by: automated_source_check
    content_version: 2026-10-30.1
    source_verification: quote_checked
    legal_sources:
      - {kind: primary, label: '§51a EStG — Festsetzung und Erhebung von Zuschlagsteuern', url: 'https://www.gesetze-im-internet.de/estg/__51a.html'}
      - {kind: primary, label: '§39e EStG — Verfahren zur Bildung und Anwendung der elektronischen Lohnsteuerabzugsmerkmale', url: 'https://www.gesetze-im-internet.de/estg/__39e.html'}
      - {kind: primary, label: '§39 EStG — Lohnsteuerabzugsmerkmale', url: 'https://www.gesetze-im-internet.de/estg/__39.html'}
      - {kind: implementation, label: 'Stadt Köln — Die Zukunft der Lohnsteuerkarte ist elektronisch', url: 'https://www.stadt-koeln.de/artikel/06479/index.html'}
    claims:
      - id: surcharge-on-income-tax
        states: Church tax is calculated from your income tax
        source: '§51a EStG — Festsetzung und Erhebung von Zuschlagsteuern'
        quote: 'Steuern, die nach der Einkommensteuer bemessen werden (Zuschlagsteuern)'
      - id: legal-membership
        states: It follows your legal membership of a religious community that levies tax
        source: '§51a EStG — Festsetzung und Erhebung von Zuschlagsteuern'
        quote: die rechtliche Zugehörigkeit zu einer steuererhebenden Religionsgemeinschaft und den für die Religionsgemeinschaft geltenden Kirchensteuersatz
      - id: register-reports
        states: The registration office reports this membership, and any change to it, to the Federal Central Tax Office
        source: '§39e EStG — Verfahren zur Bildung und Anwendung der elektronischen Lohnsteuerabzugsmerkmale'
        quote: haben dem Bundeszentralamt für Steuern unter Angabe der Identifikationsnummer und des Tages der Geburt die in Satz 1 Nummer 1 bis 3 bezeichneten Daten und deren Änderungen im Melderegister mitzuteilen
      - id: membership-data
        states: legal membership
        source: '§39e EStG — Verfahren zur Bildung und Anwendung der elektronischen Lohnsteuerabzugsmerkmale'
        quote: rechtliche Zugehörigkeit zu einer steuererhebenden Religionsgemeinschaft sowie Datum des Eintritts und Austritts
      - id: employer-withholds
        states: If you are employed, your employer withholds church tax together with the income tax taken from your salary (wage tax)
        source: '§39 EStG — Lohnsteuerabzugsmerkmale'
        quote: nur für die Einbehaltung der Lohn- und Kirchensteuer verarbeiten
      - id: changes-automatic
        states: Once a change such as joining or leaving a church is in the registration register, it is taken into account automatically for wage tax
        source: 'Stadt Köln — Die Zukunft der Lohnsteuerkarte ist elektronisch'
        quote: Steuerlich bedeutsame Änderungen im Melderegister, wie beispielsweise Heirat, Geburt eines Kindes, Kircheneinritt oder Kirchenaustritt, werden automatisch für den Lohnsteuerabzug berücksichtigt
      - id: prepayments
        states: If you pay income tax prepayments, church tax prepayments are due at the same time
        source: '§51a EStG — Festsetzung und Erhebung von Zuschlagsteuern'
        quote: Die Vorauszahlungen auf Zuschlagsteuern sind gleichzeitig mit den festgesetzten Vorauszahlungen auf die Einkommensteuer zu entrichten
    description: |
      Church tax is calculated from your income tax.
      It follows your legal membership of a religious community that levies tax.
      The registration office reports this membership, and any change to it, to the Federal Central Tax Office.
      If you are employed, your employer withholds church tax together with the income tax taken from your salary (wage tax).
      Once a change such as joining or leaving a church is in the registration register, it is taken into account automatically for wage tax.
      No employer? If you pay income tax prepayments, church tax prepayments are due at the same time.
    phase: arrival
    urgency: medium
    deadline_type: none
    documents_required: []
    links:
      - https://www.gesetze-im-internet.de/estg/__51a.html
      - https://www.stadt-koeln.de/artikel/06479/index.html

  - title: 'Schufa: how Germany decides if it trusts you'
    key: shared.schufa
    coverage_scope: universal
    type: info
    depends_on: []
    description: |
      The Schufa is Germany's credit register. No history means no flat, no phone
      contract, no credit card — landlords ask for it before they'll even show you in.
      Bootstrap sequence: Anmeldung → bank account → pay everything on time. After a few
      weeks, request the free Datenkopie to check your record. Some landlords ask for a
      paid Schufa report (BonitätsAuskunft), but a free report is often enough. Ask your
      landlord which report they accept.
    phase: settling
    urgency: low
    deadline_type: none
    documents_required: []
    links:
      - https://www.meineschufa.de/
      - https://www.stadt-koeln.de/mediaasset/content/pdf16/wegweiser_wohnen-englisch.pdf

  - title: 'Inviting family or friends to visit? Verpflichtungserklärung'
    key: shared.verpflichtungserklaerung
    coverage_scope: universal
    type: info
    depends_on: []
    applies_if_mode: explicit
    applies_if: {}
    review_status: approved
    jurisdiction: de-nrw-cologne
    reviewed_by: automated_source_check
    content_version: 2026-10-30.1
    source_verification: quote_checked
    legal_sources:
      - {kind: primary, label: '§68 AufenthG — Haftung für Lebensunterhalt', url: 'https://www.gesetze-im-internet.de/aufenthg_2004/__68.html'}
      - {kind: implementation, label: 'Stadt Köln · Verpflichtungserklärung', url: 'https://www.stadt-koeln.de/service/produkte/00962/index.html'}
    claims:
      - id: liability-period
        states: for five years from their entry
        source: '§68 AufenthG — Haftung für Lebensunterhalt'
        quote: hat für einen Zeitraum von fünf Jahren sämtliche öffentlichen Mittel zu erstatten
      - id: fee
        states: €29 per declaration
        source: 'Stadt Köln · Verpflichtungserklärung'
        quote: Die Verwaltungsgebühr pro Verpflichtungserklärung beträgt 29 Euro.
      - id: main-residence-income
        states: You need your main residence in Cologne and a regular income that could be seized if you don't pay
        source: 'Stadt Köln · Verpflichtungserklärung'
        quote: Als Gastgeber*in müssen Sie in Köln Ihren Hauptwohnsitz haben und über ein regelmäßiges pfändbares Einkommen verfügen.
      - id: income-threshold
        states: your net income must be above the amount protected from seizure (Pfändungsfreigrenze)
        source: 'Stadt Köln · Verpflichtungserklärung'
        quote: Ihr Nettoeinkommen muss hoch genug sein, vergleichen Sie hierzu bitte Ihre Pfändungsfreigrenze.
      - id: no-benefit-recipients
        states: If you receive Bürgergeld, social assistance (Sozialhilfe), Wohngeld or Lastenzuschuss (a housing-cost subsidy for homeowners), you cannot invite visa-required guests
        source: 'Stadt Köln · Verpflichtungserklärung'
        quote: können keine Gäste, die ein Visum benötigen, einladen
      - id: long-stay-definition
        states: more than 90 days
        source: 'Stadt Köln · Verpflichtungserklärung'
        quote: Langfristiger Aufenthalt (mehr als 90 Tage)
      - id: long-stay-permit
        states: your permit must stay valid longer than your guest's stay and your commitment
        source: 'Stadt Köln · Verpflichtungserklärung'
        quote: dann muss diese länger gültig sein als die Dauer der Verpflichtung und/oder des Aufenthalts des Gastes
      - id: lead-time
        states: at least three months before their visa appointment
        source: 'Stadt Köln · Verpflichtungserklärung'
        quote: mindestens drei Monate vor dem Termin zur Visumserteilung bei der deutschen Auslandsvertretung
      - id: recognition-period
        states: up to six months after issue
        source: 'Stadt Köln · Verpflichtungserklärung'
        quote: Die Verpflichtungserklärung wird in der Regel für bis zu sechs Monate nach ihrer Ausstellung von der deutschen Auslandsvertretung anerkannt.
      - id: id-document
        states: a valid ID card, travel document (Reiseausweis) or a residence permit valid for at least six months
        source: 'Stadt Köln · Verpflichtungserklärung'
        quote: gültiger Personalausweis, Reiseausweis oder ein mindestens sechs Monate gültiger Aufenthaltstitel
      - id: payslips
        states: payslips for the last three months
        source: 'Stadt Köln · Verpflichtungserklärung'
        quote: Gehaltsbescheinigungen der letzten drei Monate über monatliches Nettoeinkommen
      - id: employee-bank-statement
        states: a bank statement for the last full month showing the salary
        source: 'Stadt Köln · Verpflichtungserklärung'
        quote: einen Auszug Ihres Bankkontos des letzten Monats (vollständiger Monat), auf dem der Erhalt Ihres Gehaltes zu sehen ist
      - id: self-employed-certificate
        states: a current Steuerberater certificate of your net monthly income for the last three months
        source: 'Stadt Köln · Verpflichtungserklärung'
        quote: aktuelle Bescheinigung der*des Steuerberaters*in über das monatliche Nettoeinkommender letzten drei Monate
      - id: self-employed-bank-statement
        states: Plus a bank statement for the last full month
        source: 'Stadt Köln · Verpflichtungserklärung'
        quote: einen Auszug Ihres Bankkontos des letzten Monats (vollständiger Monat)
      - id: freelancer-bank-statements
        states: bank statements for the last three months
        source: 'Stadt Köln · Verpflichtungserklärung'
        quote: Vorlage von aktuellen Kontoauszügen der letzten drei Monate des eigenen Bankkontos
    description: |
      If you invite visa-required family or friends to visit, they can use a
      Verpflichtungserklärung to show the German embassy or consulate that their costs
      are covered. You commit to covering public costs of their stay, for five years
      from their entry.

      Who can sign: You need your main residence in Cologne and a regular income
      that could be seized if you don't pay; your net income must be above the amount
      protected from seizure (Pfändungsfreigrenze). If you receive Bürgergeld, social
      assistance (Sozialhilfe), Wohngeld or Lastenzuschuss (a housing-cost subsidy for
      homeowners), you cannot invite visa-required guests.

      If your guest stays more than 90 days and you hold a fixed-term residence permit,
      your permit must stay valid longer than your guest's stay and your commitment.

      How to file: at the Ausländeramt, at least three months before their visa
      appointment, by post, online contact form, or in person on Tuesday and Thursday
      mornings. The fee is €29 per declaration and is charged even if your income is
      not sufficient. The embassy usually recognises it for up to six months after issue.

      What to bring:
      - Everyone (employees, self-employed people and freelancers): the application
        form and a valid ID card, travel document (Reiseausweis) or a residence permit
        valid for at least six months.
      - Employees also: payslips for the last three months and a bank statement for
        the last full month showing the salary.
      - Self-employed people also, instead of payslips: a current Steuerberater
        certificate of your net monthly income for the last three months, or your last
        tax assessment. Plus a bank statement for the last full month.
      - Freelancers also: bank statements for the last three months, plus the same
        Steuerberater certificate or your last tax assessment.
    phase: ongoing
    urgency: low
    deadline_type: none
    documents_required: []
    links:
      - https://www.stadt-koeln.de/service/produkte/00962/index.html

  - title: 'Fiktionsbescheinigung: what that bridging paper really permits'
    key: shared.fiktionsbescheinigung
    coverage_scope: universal
    type: info
    depends_on: []
    applies_if_mode: explicit
    applies_if:
      citizenship_group: non_eu
    review_status: approved
    jurisdiction: de-nrw-cologne
    reviewed_by: automated_source_check
    content_version: 2026-10-08.1
    source_verification: quote_checked
    legal_sources:
      - {kind: primary, label: '§81 AufenthG — Beantragung des Aufenthaltstitels', url: 'https://www.gesetze-im-internet.de/aufenthg_2004/__81.html'}
      - {kind: implementation, label: 'Stadt Köln · Fiktionsbescheinigungen', url: 'https://www.stadt-koeln.de/artikel/71447/index.html'}
    claims:
      - id: two-forms
        states: depends on which of its two forms you hold
        source: 'Stadt Köln · Fiktionsbescheinigungen'
        quote: Es gibt zwei Formen der Fiktionsbescheinigung
      - id: continuation
        states: The continuation form (§81 Abs. 4) keeps your current permit in force
        source: '§81 AufenthG — Beantragung des Aufenthaltstitels'
        quote: gilt der bisherige Aufenthaltstitel vom Zeitpunkt seines Ablaufs bis zur Entscheidung der Ausländerbehörde als fortbestehend
      - id: first-application
        states: The form for a first application without a visa (§81 Abs. 3)
        source: 'Stadt Köln · Fiktionsbescheinigungen'
        quote: 'Fiktionsbescheinigung nach § 81 Absatz 3 Aufenthaltsgesetz Diese Bescheinigung erhalten Sie, wenn: Sie ohne Visum eingereist sind.'
      - id: no-reentry
        states: you may not leave Germany and re-enter on it
        source: 'Stadt Köln · Fiktionsbescheinigungen'
        quote: 'Reisen: Mit dieser Fiktionsbescheinigung dürfen Sie Deutschland nicht verlassen und dann wiedereinreisen.'
    description: |
      While a permit application is processing you may get a Fiktionsbescheinigung —
      and what it allows depends on which of its two forms you hold. The continuation
      form (§81 Abs. 4) keeps your current permit in force until the decision: you may
      keep working if your permit allowed it, and you may travel and return while it is
      valid. The form for a first application without a visa (§81 Abs. 3) does not
      allow work, and you may not leave Germany and re-enter on it. Check which form
      yours is before booking any flight.
    phase: ongoing
    urgency: low
    deadline_type: none
    documents_required: []
    links:
      - https://www.stadt-koeln.de/artikel/71447/index.html
      - https://www.gesetze-im-internet.de/aufenthg_2004/__81.html

  - title: 'New passport? Transfer your permit (Übertrag)'
    key: shared.passport_transfer
    coverage_scope: universal
    type: info
    depends_on: []
    applies_if_mode: explicit
    applies_if:
      citizenship_group: non_eu
    review_status: approved
