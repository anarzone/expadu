# Reviewed core preparation units use explicit needs, not this legacy branch label.
# Unreviewed records below retain their original branch scope and publication gate.
situation: core

tasks:
  - title: Check and prepare your address registration (Anmeldung)
    key: core.anmeldung
    depends_on: []
    applies_if_mode: explicit
    applies_if:
      arrival_planned: false
      registration_status: not_registered
    review_status: approved
    jurisdiction: de-nrw-cologne
    reviewed_by: owner_authorised_source_review
    content_version: 2026-09-08.1
    source_verification: dual_source
    verified_at: '2026-09-08'
    legal_sources:
      - {kind: primary, label: '§17 BMG — Anmeldung, Abmeldung', url: 'https://www.gesetze-im-internet.de/bmg/__17.html'}
      - {kind: primary, label: '§19 BMG — Wohnungsgeber confirmation', url: 'https://www.gesetze-im-internet.de/bmg/__19.html'}
      - {kind: primary, label: '§27 BMG — Registration exceptions', url: 'https://www.gesetze-im-internet.de/bmg/__27.html'}
      - {kind: implementation, label: 'Stadt Köln · Anmeldung Ihres Wohnsitzes', url: 'https://www.stadt-koeln.de/service/produkte/00415/index.html'}
    claims:
      - id: registration-period
        states: two-week period under §17 BMG
        source: '§17 BMG — Anmeldung, Abmeldung'
        quote: hat sich innerhalb von zwei Wochen nach dem Einzug bei der Meldebehörde anzumelden
      - id: registration-deadline
        covers: deadline
        source: '§17 BMG — Anmeldung, Abmeldung'
        quote: hat sich innerhalb von zwei Wochen nach dem Einzug bei der Meldebehörde anzumelden
      - id: registration-exceptions
        states: exceptions in §27 BMG
        source: '§27 BMG — Registration exceptions'
        quote: Ausnahmen von der Meldepflicht
      - id: missing-confirmation
        states: notify the registration authority without delay as required by §19(2) BMG
        source: '§19 BMG — Wohnungsgeber confirmation'
        quote: so hat die meldepflichtige Person dies der Meldebehörde unverzüglich mitzuteilen
    description: |
      Registration normally follows moving into a dwelling, with a two-week
      period under §17 BMG. Temporary stays and other situations can fall under
      exceptions in §27 BMG. Check the applicable procedure with the registration
      authority if your circumstances are unclear. Employment or a permanent
      residence title does not by itself answer this question.
      This card helps you prepare; it does not decide that an exception is absent.
      Any displayed preparation target uses your move-in date, not your arrival
      date or an appointment, and is not a confirmed personal legal deadline.
    phase: arrival
    urgency: critical
    deadline_type: days_since_move_in
    deadline_days: 14
    booking_service_key: anmeldung
    documents_required:
      - label: Identity documents appropriate to your nationality and residence status
        note: Check the city list for your case.
      - label: Wohnungsgeberbescheinigung confirming actual move-in
        note: A rental contract alone is not sufficient. Owners use the self-declaration described by the city.
    links:
      - https://www.stadt-koeln.de/service/produkte/00415/index.html
    how_to_steps:
      - title: Check the procedure and documents for your move
        body: Open the city page for online eligibility, attendance and any additional family or foreign civil-status documents. Confirm unclear cases with the authority.
        link: https://www.stadt-koeln.de/service/produkte/00415/index.html
      - title: Get the move-in confirmation
        body: If confirmation is refused or not provided in time, notify the registration authority without delay as required by §19(2) BMG. Do not assume that missing proof or a later appointment extends a deadline.
        link: https://www.gesetze-im-internet.de/bmg/__19.html
      - title: Keep the registration confirmation
        body: Keep the confirmation after registration; completing this preparation card does not mean the authority has registered you.

  - title: Find or recover your Steuer-ID (tax identification number)
    key: core.steuer_id
    type: task
    depends_on: []
    applies_if_mode: explicit
    applies_if:
      arrival_planned: false
      tax_id_available: false
    # single_source_approved: §139b AO is unambiguous, but no allow-listed
    # implementation host covers the tax ID. The BZSt is authoritative and is
    # linked under `links`, yet bzst.de is not on the implementation allowlist,
    # and the only Cologne page mentioning the ID is really about ELStAM.
    review_status: approved
    jurisdiction: de-nrw-cologne
    reviewed_by: owner_authorised_source_review
    content_version: 2026-09-08.1
    source_verification: single_source_approved
    single_source_approved: true
    verified_at: '2026-09-08'
    legal_sources:
      - {kind: primary, label: '§139b AO — Identifikationsnummer', url: 'https://www.gesetze-im-internet.de/ao_1977/__139b.html'}
    description: |
      Your tax identification number stays the same for life, including after a
      move or marriage. Check an existing income tax assessment or wage tax
      certificate before requesting it again. If you do not have it, follow the
      BZSt procedure. This preparation task is not a delivery promise or deadline.
    phase: arrival
    urgency: high
    deadline_type: none
    documents_required: []
    links:
      - https://online.portal.bzst.de/SharedDocs/Leistungsbeschreibung/DE/erneute_mitteilung_der_ID-Nr.html
    how_to_steps:
      - title: Look for an existing number
        body: Check your income tax assessment or wage tax certificate. Do not enter the number in Expadu.
      - title: Use the official recovery instructions if needed
        body: BZSt provides a recovery procedure for a lost number. For first registration, its instructions say to request the number if no letter has arrived within three months. It is not disclosed by phone or email.
        link: https://online.portal.bzst.de/SharedDocs/Leistungsbeschreibung/DE/erneute_mitteilung_der_ID-Nr.html

  - title: Confirm health insurance cover for your stay
    key: core.health_insurance
    depends_on: []
    applies_if_mode: explicit
    applies_if:
      health_coverage_confirmed: false
    review_status: approved
    jurisdiction: de-nrw-cologne
    reviewed_by: owner_authorised_source_review
    content_version: 2026-09-08.1
    source_verification: dual_source
    verified_at: '2026-09-08'
    legal_sources:
      - {kind: primary, label: '§5 SGB V — Versicherungspflicht', url: 'https://www.gesetze-im-internet.de/sgb_5/__5.html'}
      - {kind: primary, label: '§6 SGB V — Versicherungsfreiheit', url: 'https://www.gesetze-im-internet.de/sgb_5/__6.html'}
      - {kind: primary, label: '§193 VVG — Insurance obligation and exceptions', url: 'https://www.gesetze-im-internet.de/vvg_2008/__193.html'}
      - {kind: implementation, label: 'Make it in Germany · Health insurance', url: 'https://www.make-it-in-germany.com/en/living-in-germany/money-insurance/health-insurance'}
    claims:
      - id: cover-obligation
        states: Statutory and private insurance have different entry conditions and exceptions
        source: '§193 VVG — Insurance obligation and exceptions'
        quote: Jede Person mit Wohnsitz im Inland ist verpflichtet, bei einem in Deutschland zum Geschäftsbetrieb zugelassenen Versicherungsunternehmen
    description: |
      Confirm which cover applies to your stay and when it starts. Statutory and
      private insurance have different entry conditions and exceptions; this card
      does not decide which system you qualify for. Check any period between
      arrival and the start of employment with your insurer and, where relevant,
      the German mission abroad. Do not assume you have an uninsured grace period.
    phase: arrival
    urgency: critical
    deadline_type: none
    documents_required: []
    links:
      - https://www.make-it-in-germany.com/en/living-in-germany/money-insurance/health-insurance
    how_to_steps:
      - title: Check your circumstances with the insurer
        body: Explain your work or study situation, existing cover and planned dates. Ask the insurer which cover and documents apply; do not wait for address registration before making this enquiry.
        link: https://www.make-it-in-germany.com/en/living-in-germany/money-insurance/health-insurance
      - title: Confirm continuity
        body: Check the start date and any gap between policies. Keep the insurer's confirmation. Expadu does not approve an insurer or confirm legal sufficiency of your cover.

  - title: Review an account for your everyday payments
    key: core.bank_account
    depends_on: []
    applies_if_mode: explicit
    applies_if:
      bank_account_help_needed: true
    review_status: approved
    jurisdiction: de-nrw-cologne
    reviewed_by: owner_authorised_source_review
    content_version: 2026-09-08.1
    source_verification: dual_source
    verified_at: '2026-09-08'
    legal_sources:
      - {kind: primary, label: '§31 ZKG — Anspruch auf Abschluss eines Basiskontovertrags', url: 'https://www.gesetze-im-internet.de/zkg/__31.html'}
      - {kind: implementation, label: 'Make it in Germany · Bank account', url: 'https://www.make-it-in-germany.com/en/living-in-germany/money-insurance/bank-account'}
    claims:
      - id: basic-account
        states: A basic payment account (Basiskonto) has a separate statutory application framework under the ZKG
        source: '§31 ZKG — Anspruch auf Abschluss eines Basiskontovertrags'
        quote: hat mit einem Berechtigten einen Basiskontovertrag zu schließen, wenn dessen Antrag die Voraussetzungen des § 33 erfüllt
    description: |
      If you need an account, compare costs, payment facilities and access to
      support. Document requirements depend on the provider and account type.
      A basic payment account (Basiskonto) has a separate statutory application
      framework under the ZKG. This card does not decide your entitlement or
      require you to replace an existing account.
    phase: first_30_days
    urgency: high
    deadline_type: none
    documents_required: []
    links:
      - https://www.make-it-in-germany.com/en/living-in-germany/money-insurance/bank-account
      - https://www.gesetze-im-internet.de/zkg/__31.html
    how_to_steps:
      - title: Compare the service you need
        body: Check account fees and whether online-only support or a branch fits your needs. Expadu does not recommend a particular provider.
        link: https://www.make-it-in-germany.com/en/living-in-germany/money-insurance/bank-account
      - title: Check requirements before applying
        body: Ask the provider for its current document list and the appropriate account procedure. Expadu does not promise an opening time or treat address registration as a universal prerequisite.

  - title: Settle your Rundfunkbeitrag (broadcasting fee)
    key: core.rundfunkbeitrag
    depends_on: [core.anmeldung]
    # Stays `legacy` on purpose, and cannot be approved as the allowlist stands.
    # The obligation comes from the Rundfunkbeitragsstaatsvertrag — a treaty
    # between the Länder, not federal law — so it appears on neither
    # gesetze-im-internet.de nor recht.bund.de. Approving it would mean adding a
    # Landesrecht host (recht.nrw.de) to config/bureaucracy_sources.php, which is
    # a publication-policy decision, not a content one. It keeps its checkbox
    # because the obligation is real; it just carries no legal-grade approval.
    description: |
      Every household in Germany pays {{figure:rundfunkbeitrag_monthly}} for public
      broadcasting — one fee per dwelling, no matter how many people live there or
      whether anyone owns a TV. The Beitragsservice is notified of your Anmeldung
      automatically and will write to you.
    phase: settling
    urgency: medium
    deadline_type: days_since_arrival
    deadline_days: 60
    documents_required: []
    links:
      - https://www.rundfunkbeitrag.de/welcome/english
    how_to_steps:
      - title: Check whether your household already pays
        body: One fee per Wohnung. If a flatmate or partner already pays, reply to the Beitragsservice letter with their Beitragsnummer instead of registering again.
      - title: Register and set up SEPA direct debit
        body: Direct debit saves you from missed quarterly invoices and reminder fees.
        link: https://www.rundfunkbeitrag.de/welcome/english
      - title: Apply for exemption or reduction if eligible
        body: Recipients of BAföG or Bürgergeld can be exempted; people with an RF disability code pay a reduced €6.12/month. Details on the official site.

  - title: Get private liability insurance (Haftpflichtversicherung)
    key: core.liability_insurance
    type: info
    depends_on: [core.bank_account]
    # Demoted from a task to an info card. Privathaftpflicht is voluntary —
    # there is no statute behind it, and the only source we had was a price
    # comparison site. As an info card it keeps its advice but loses the
    # checkbox and its weight in the completion count, so "8 of 12 done" stops
    # counting something nobody is actually required to do.
    description: |
      Not legally required, but culturally near-universal (~85% of Germans have it) and
      landlords increasingly expect it — it covers damage you accidentally cause to other
      people or their property. In Germany you are personally liable without limit;
      €3–6/month caps what could otherwise be an unbounded bill.
    phase: settling
    urgency: low
    deadline_type: none
    documents_required: []
    links:
      - https://www.check24.de/haftpflichtversicherung/
    how_to_steps:
      - title: Compare on Check24 or Verivox
        body: Look for "Privathaftpflicht" with at least €10M coverage and no deductible. Annual payment is usually cheaper than monthly.
      - title: Note your policy number
        body: You'll need it the day you break something — a friend's laptop, a rented e-scooter, a neighbour's window.
