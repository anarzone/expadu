      - {kind: implementation, label: 'Stadt Köln · EU Blue Card', url: 'https://www.stadt-koeln.de/service/produkte/20321/index.html'}
    claims:
      - id: blue-card-requirements
        states: every requirement in §18g is met
        source: '§18g AufenthG'
        quote: Einer Fachkraft mit akademischer Ausbildung wird ohne Zustimmung der Bundesagentur für Arbeit eine Blaue Karte EU
      - id: apply-before-expiry
        states: file the Cologne residence application before the visa expires
        source: '§81 AufenthG — Applying for a residence title'
        quote: Beantragt ein Ausländer vor Ablauf seines Aufenthaltstitels dessen Verlängerung oder die Erteilung eines anderen Aufenthaltstitels

  - title: Track the 21-month Blue Card settlement route
    key: case.bc.settlement.track_21_months
    type: info
    description: |
      With B1 German and fewer than 21 documented qualifying months, the time
      requirement for the 21-month Blue Card route is not yet met. Track qualifying
      employment and pension or equivalent contributions. At 21 months, the authority
      must still verify the remaining conditions referenced by §18c(2), including the
      applicable §9 checks. Time in Germany alone is not the statutory counter.
    phase: ongoing
    urgency: medium
    deadline_type: none
    applies_if_mode: explicit
    applies_if:
      citizenship_group: non_eu
      current_residence_title: blue_card
      case_goal: settlement_permit
      blue_card_qualifying_months: {in: [12, 13, 14, 15, 16, 17, 18, 19, 20]}
      german_level: {in: [b1, b2, c1, c2]}
    links:
      - https://www.gesetze-im-internet.de/aufenthg_2004/__18c.html
      - https://www.stadt-koeln.de/service/produkte/20321/index.html
    review_status: approved
    jurisdiction: de-nrw-cologne
    reviewed_by: automated_source_check
    content_version: 2026-10-07.1
    source_verification: quote_checked
    legal_sources:
      - {kind: primary, label: '§18c AufenthG', url: 'https://www.gesetze-im-internet.de/aufenthg_2004/__18c.html'}
      - {kind: implementation, label: 'Stadt Köln · EU Blue Card', url: 'https://www.stadt-koeln.de/service/produkte/20321/index.html'}
      - {kind: primary, label: '§2 AufenthG — Begriffsbestimmungen', url: 'https://www.gesetze-im-internet.de/aufenthg_2004/__2.html'}
    claims:
      - id: route-length
        states: 21-month Blue Card
        source: '§18c AufenthG'
        quote: Die Frist nach Satz 1 verkürzt sich auf 21 Monate, wenn der Ausländer über ausreichende Kenntnisse der deutschen Sprache verfügt.
      - id: language-level
        states: With B1 German
        source: '§2 AufenthG — Begriffsbestimmungen'
        quote: Ausreichende deutsche Sprachkenntnisse entsprechen dem Niveau B 1 des Gemeinsamen Europäischen Referenzrahmens für Sprachen.
      - id: months-so-far
        states: fewer than 21 documented qualifying months
        source: '§18c AufenthG'
        quote: Die Frist nach Satz 1 verkürzt sich auf 21 Monate, wenn der Ausländer über ausreichende Kenntnisse der deutschen Sprache verfügt.
      - id: at-21-months
        states: At 21 months
        source: '§18c AufenthG'
        quote: Die Frist nach Satz 1 verkürzt sich auf 21 Monate, wenn der Ausländer über ausreichende Kenntnisse der deutschen Sprache verfügt.
      - id: remaining-conditions
        states: §18c(2), including the applicable §9 checks
        source: '§18c AufenthG'
        quote: die Voraussetzungen des § 9 Absatz 2 Satz 1 Nummer 2 und 4 bis 6, 8 und 9 vorliegen und er über einfache Kenntnisse der deutschen Sprache verfügt

