      - id: one-qualification
        states: Cologne also needs proof of one of these qualifications
        source: 'Stadt Köln · EU Blue Card'
        quote: 'eine der folgenden Qualifikationen'
      - id: degree-certificate
        states: a university degree certificate
        source: 'Stadt Köln · EU Blue Card'
        quote: 'Hochschulabschlusszeugnis'
      - id: foreign-translation
        states: certified German or English translation
        source: 'Stadt Köln · EU Blue Card'
        quote: 'Bei einem ausländischen Zeugnis müssen Sie eine beglaubigte deutsche oder englische Übersetzung vorlegen'
      - id: foreign-recognition
        states: plus an anabin extract or a certificate evaluation from the Zentralstelle für ausländisches Bildungswesen
        source: 'Stadt Köln · EU Blue Card'
        quote: 'Zentralstelle für ausländisches Bildungswesen'
      - id: tertiary-programme
        states: a certificate of a tertiary education programme and recognition of that qualification
        source: 'Stadt Köln · EU Blue Card'
        quote: 'Abschlusszeugnis eines tertiären Bildungsprogramms und Anerkennung des Abschlusses'
      - id: it-experience
        states: 'for IT specialists without a formal qualification, proof of at least three years'' IT work experience within the last seven years'
        source: 'Stadt Köln · EU Blue Card'
        quote: 'Fachkräften ohne formalen Bildungsabschluss: Nachweise über mindestens drei Jahre Berufserfahrung innerhalb der letzten sieben Jahre'
      - id: it-cv
        states: and a CV
        source: 'Stadt Köln · EU Blue Card'
        quote: 'Bereich sowie einen Lebenslauf'
      - id: professional-licence
        states: For regulated professions, also bring your licence to practise
        source: 'Stadt Köln · EU Blue Card'
        quote: 'bei reglementierten Berufen: Berufsausübungserlaubnis'
      - id: entry-visa
        states: If your entry required a visa, bring your visa for qualified employment
        source: 'Stadt Köln · EU Blue Card'
        quote: 'Soweit es für Ihre Einreise erforderlich ist, benötigen wir Ihr Visum zur Einreise zur Ausübung der qualifizierten Beschäftigung.'
      - id: further-documents
        states: In individual cases Cologne may ask for further documents
        source: 'Stadt Köln · EU Blue Card'
        quote: 'Im Einzelfall kann es vorkommen, dass wir weitere Unterlagen bei Ihnen anfragen.'

  - title: Submit the Blue Card application before your D visa expires
    key: case.bc.first_application.submit
    description: |
      If you are pursuing an EU Blue Card from a national D visa, file the Cologne
      residence application before the visa expires. Keep the submission confirmation and continue checking
      official messages for requests or an appointment. The authority decides whether
      every requirement in §18g is met; Expadu does not decide eligibility.
    phase: first_30_days
    urgency: critical
    deadline_type: fact_date
    deadline_fact_key: visa_expires_at
    applies_if_mode: explicit
    applies_if:
      citizenship_group: non_eu
      purpose: employment
      current_residence_title: national_d_visa
      case_goal: blue_card
      entry_mode: d_visa
    links:
      - https://www.stadt-koeln.de/service/produkte/20321/index.html
      - https://www.gesetze-im-internet.de/aufenthg_2004/__18g.html
    review_status: approved
    jurisdiction: de-nrw-cologne
    reviewed_by: automated_source_check
    content_version: 2026-09-08.1
    source_verification: quote_checked
    legal_sources:
      - {kind: primary, label: '§18g AufenthG', url: 'https://www.gesetze-im-internet.de/aufenthg_2004/__18g.html'}
      - {kind: primary, label: '§81 AufenthG — Applying for a residence title', url: 'https://www.gesetze-im-internet.de/aufenthg_2004/__81.html'}
      - {kind: implementation, label: 'Stadt Köln · EU Blue Card', url: 'https://www.stadt-koeln.de/service/produkte/20321/index.html'}
    claims:
      - id: blue-card-requirements
        states: every requirement in §18g is met
        source: '§18g AufenthG'
        quote: Einer Fachkraft mit akademischer Ausbildung wird ohne Zustimmung der Bundesagentur für Arbeit eine Blaue Karte EU
      - id: apply-before-expiry
        states: file the Cologne residence application before the visa expires
        source: '§81 AufenthG — Applying for a residence title'
        quote: Beantragt ein Ausländer vor Ablauf seines Aufenthaltstitels dessen Verlängerung oder die Erteilung eines anderen Aufenthaltstitels

  - title: Track the 21-month Blue Card settlement route
    key: case.bc.settlement.track_21_months
    type: info
    description: |
      With B1 German and fewer than 21 documented qualifying months, the time
      requirement for the 21-month Blue Card route is not yet met. Track qualifying
      employment and pension or equivalent contributions. At 21 months, the authority
      must still verify the remaining conditions referenced by §18c(2), including the
      applicable §9 checks. Time in Germany alone is not the statutory counter.
    phase: ongoing
    urgency: medium
    deadline_type: none
    applies_if_mode: explicit
    applies_if:
      citizenship_group: non_eu
      current_residence_title: blue_card
      case_goal: settlement_permit
      blue_card_qualifying_months: {in: [12, 13, 14, 15, 16, 17, 18, 19, 20]}
      german_level: {in: [b1, b2, c1, c2]}
    links:
      - https://www.gesetze-im-internet.de/aufenthg_2004/__18c.html
      - https://www.stadt-koeln.de/service/produkte/20321/index.html
    review_status: approved
    jurisdiction: de-nrw-cologne
    reviewed_by: automated_source_check
    content_version: 2026-10-07.1
    source_verification: quote_checked
    legal_sources:
      - {kind: primary, label: '§18c AufenthG', url: 'https://www.gesetze-im-internet.de/aufenthg_2004/__18c.html'}
      - {kind: implementation, label: 'Stadt Köln · EU Blue Card', url: 'https://www.stadt-koeln.de/service/produkte/20321/index.html'}
      - {kind: primary, label: '§2 AufenthG — Begriffsbestimmungen', url: 'https://www.gesetze-im-internet.de/aufenthg_2004/__2.html'}
    claims:
      - id: route-length
        states: 21-month Blue Card
        source: '§18c AufenthG'
        quote: Die Frist nach Satz 1 verkürzt sich auf 21 Monate, wenn der Ausländer über ausreichende Kenntnisse der deutschen Sprache verfügt.
      - id: language-level
        states: With B1 German
        source: '§2 AufenthG — Begriffsbestimmungen'
        quote: Ausreichende deutsche Sprachkenntnisse entsprechen dem Niveau B 1 des Gemeinsamen Europäischen Referenzrahmens für Sprachen.
      - id: months-so-far
        states: fewer than 21 documented qualifying months
        source: '§18c AufenthG'
        quote: Die Frist nach Satz 1 verkürzt sich auf 21 Monate, wenn der Ausländer über ausreichende Kenntnisse der deutschen Sprache verfügt.
      - id: at-21-months
        states: At 21 months
        source: '§18c AufenthG'
        quote: Die Frist nach Satz 1 verkürzt sich auf 21 Monate, wenn der Ausländer über ausreichende Kenntnisse der deutschen Sprache verfügt.
      - id: remaining-conditions
        states: §18c(2), including the applicable §9 checks
        source: '§18c AufenthG'
        quote: die Voraussetzungen des § 9 Absatz 2 Satz 1 Nummer 2 und 4 bis 6, 8 und 9 vorliegen und er über einfache Kenntnisse der deutschen Sprache verfügt

  - title: Verify an unrecognized title against the official source
    key: case.bc.verify_status_source
    type: info
    coverage_scope: universal
    applies_if_mode: explicit
    # Only for a title Expadu has no reviewed rule for: another title, or a settlement permit
    # whose section the person doesn't know (owner decision, 8 October 2026).
    applies_if:
      citizenship_group: non_eu
      current_residence_title: {in: [other, settlement_permit_unknown]}
    description: |
      Expadu does not have a reviewed case rule for every residence title. Check the
