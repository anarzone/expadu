        source: 'Stadt Köln · Niederlassungserlaubnis für Fachkräfte'
        quote: Für die Erteilung einer Niederlassungserlaubnis müssen Sie eine Gebühr in Höhe von 113 Euro bezahlen.
      - id: housing-docs
        states: Rental contract + proof of your current monthly rent (Warmmiete)
        source: 'Stadt Köln · Niederlassungserlaubnis für Fachkräfte'
        quote: Mietvertrag sowie einen Nachweis über die aktuellen monatlichen Kosten (Warmmiete), zum Beispiel durch Kontoauszüge.
      - id: living-space
        states: you need enough living space for yourself and the family members who live with you
        source: '§9 AufenthG — Niederlassungserlaubnis'
        quote: er über ausreichenden Wohnraum für sich und seine mit ihm in häuslicher Gemeinschaft lebenden Familienangehörigen verfügt
      - id: owner-docs
        states: an extract from the land register (Grundbuchauszug), your monthly Hausgeld (building service charges) and any monthly loan costs
        source: 'Stadt Köln · Niederlassungserlaubnis für Fachkräfte'
        quote: Bei einer eigenen Immobilie benötigen wir die dritte Abteilung des Grundbuchauszugs, Kosten des monatlichen Hausgeldes und eventuell monatliche Kreditkosten für die Immobilie.
      - id: civics-required
        states: basic knowledge of the legal and social order and living conditions in Germany
        source: '§9 AufenthG — Niederlassungserlaubnis'
        quote: er über Grundkenntnisse der Rechts- und Gesellschaftsordnung und der Lebensverhältnisse im Bundesgebiet verfügt
      - id: civics-proof
        states: 'Usually the "Leben in Deutschland" test or a school-leaving certificate from at least a Mittelschule'
        source: 'Stadt Köln · Niederlassungserlaubnis für Fachkräfte'
        quote: 'Der Nachweis erfolgt in der Regel über den Test "Leben in Deutschland" oder durch die Vorlage eines Abschlusszeugnisses mindestens einer Mittelschule.'
      - id: integration-course
        states: A successfully completed integration course also counts
        source: '§9 AufenthG — Niederlassungserlaubnis'
        quote: Die Voraussetzungen des Satzes 1 Nr. 7 und 8 sind nachgewiesen, wenn ein Integrationskurs erfolgreich abgeschlossen wurde.
    description: |
      Blue Card holders can get the Niederlassungserlaubnis (permanent residence)
      after 27 months of Blue Card employment with pension or equivalent contributions and A1 German — or
      after 21 months with B1 German. Cologne puts it as 21 or 27 months instead of three or five years.
      The authority still checks the further conditions referenced in §18c, for example
      basic knowledge of the legal and social order and living conditions in Germany
      (usually shown with the "Leben in Deutschland" test). Whether you rent or own,
      you need enough living space for yourself and the family members who live with you.
      Keep your contributions running and book a German course early. The Niederlassungserlaubnis
      fee is €113.
    phase: ongoing
    urgency: low
    deadline_type: none
    applies_if_mode: explicit
    applies_if:
      citizenship_group: non_eu
      current_residence_title: blue_card
    booking_service_key: auslaenderbehoerde
    documents_required:
      - label: Valid national passport + biometric photo
      - label: German language certificate for your route
      - label: Current pension record (Versicherungsverlauf)
        note: Request it from the Deutsche Rentenversicherung early — it shows your contribution months.
      - label: Employment contract + recent payslips
      - label: Rental contract + proof of your current monthly rent (Warmmiete)
        note: Warmmiete is rent including heating and service charges. Bank statements, for example, can serve as proof.
      - label: 'If you own your home: land register extract and monthly costs'
        note: Bring an extract from the land register (Grundbuchauszug), your monthly Hausgeld (building service charges) and any monthly loan costs instead of the rental documents.
      - label: Proof of basic knowledge of life in Germany (civics)
        note: Usually the "Leben in Deutschland" test or a school-leaving certificate from at least a Mittelschule (lower-secondary school). Ask the Ausländeramt whether a school certificate from abroad counts. A successfully completed integration course also counts.
    links:
      - https://www.gesetze-im-internet.de/aufenthg_2004/__18c.html
      - https://www.stadt-koeln.de/service/produkte/20321/index.html
      - https://www.stadt-koeln.de/service/produkte/20359/index.html
    how_to_steps:
      - title: Apply when your window opens
        body: Submit the application to the Ausländeramt once you meet the conditions; the authority checks every requirement before issuing the permit.

  - title: Prepare the evidence for your first Blue Card application
    key: case.bc.first_application.prepare
    description: |
      If you hold a national D visa and plan to apply for an EU Blue Card, get your evidence ready and apply before your visa expires. If you do, your visa is treated as still valid after it expires, until the Ausländerbehörde (foreigners' office) decides (§81 AufenthG).

      Cologne asks for these with every application:
      - a valid passport or passport substitute
      - a biometric passport photo no older than three months
      - the employment contract or a binding job offer
      - if you have it, the Federal Employment Agency's pre-approval; otherwise the completed form "Erklärung zum Beschäftigungsverhältnis" (employment declaration form)
      - if you rent, the rental contract and a bank statement showing the current rent payment
      - if you own your home, a land-register extract and proof of the monthly costs for interest, repayments and running costs
      - proof of full health insurance if you are not statutorily insured

      For a first application, Cologne also needs proof of one of these qualifications:
      - a university degree certificate
        - foreign degree: certified German or English translation, plus an anabin extract or a certificate evaluation from the Zentralstelle für ausländisches Bildungswesen (ZAB, the German office that evaluates foreign degrees; anabin is its online database)
      - a certificate of a tertiary education programme and recognition of that qualification
      - for IT specialists without a formal qualification, proof of at least three years' IT work experience within the last seven years and a CV

      For regulated professions, also bring your licence to practise.
      If your entry required a visa, bring your visa for qualified employment.
      In individual cases Cologne may ask for further documents.

      The job offer must cover at least six months and the statutory Blue Card conditions still have to be checked. This is preparation, not a prediction that the application will be approved.
    phase: arrival
    urgency: critical
    deadline_type: fact_date
    deadline_fact_key: visa_expires_at
    applies_if_mode: explicit
    applies_if:
      citizenship_group: non_eu
      purpose: employment
      current_residence_title: national_d_visa
      case_goal: blue_card
      entry_mode: d_visa
    # The full Cologne document list now sits in this card's description. Keep the appointment step (bc.blue_card) in step with it.
    documents_required: []
    links:
      - https://www.stadt-koeln.de/service/produkte/20321/index.html
      - https://www.gesetze-im-internet.de/aufenthg_2004/__18g.html
      - https://www.gesetze-im-internet.de/aufenthg_2004/__81.html
    review_status: approved
    jurisdiction: de-nrw-cologne
    reviewed_by: automated_source_check
    content_version: 2026-10-30.1
    source_verification: quote_checked
    legal_sources:
