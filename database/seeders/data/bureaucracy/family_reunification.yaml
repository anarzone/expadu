  - title: Sign up for an Integration Course
    key: fam.integration_course
    depends_on: []
    description: |
      The Integrationskurs combines a German language course with an orientation course
      on Germany's legal order, culture and history. The general course runs 700 lessons.
      A first residence permit for family reunification normally gives you a right to
      take part, and that right lapses one year after the permit is issued, so sign up
      early. You must attend if you have that right and cannot yet communicate in simple
      German, or if your permit to join your spouse is issued while your German is not yet
      sufficient (§44a AufenthG). The Ausländerbehörde records it when it issues your permit.
    phase: settling
    urgency: medium
    deadline_type: none
    applies_if_mode: explicit
    applies_if:
      purpose: family
      sponsor: {in: [non_eu, german]}
    documents_required:
      - Berechtigungsschein (certificate of eligibility) from the Ausländerbehörde
    links:
      - https://www.bamf.de/DE/Themen/Integration/ZugewanderteTeilnehmende/Integrationskurse/InhaltAblauf/inhaltablauf-node.html
      - https://www.bamf.de/DE/Themen/Integration/ZugewanderteTeilnehmende/Integrationskurse/TeilnahmeKosten/Titelab2005/titelab2005-node.html
      - https://www.gesetze-im-internet.de/aufenthg_2004/__44.html
      - https://www.gesetze-im-internet.de/aufenthg_2004/__44a.html
    how_to_steps:
      - title: Check whether the course is mandatory for you
        body: The Ausländerbehörde records an obligation to attend when it issues your permit, if one applies to you. Check the papers you receive with your permit.
      - title: Get your Berechtigungsschein
        body: You get the Berechtigungsschein (certificate of eligibility) from the Ausländerbehörde. If you have not received one, ask the Ausländerbehörde for it.
        link: https://www.bamf.de/DE/Themen/Integration/ZugewanderteTeilnehmende/Integrationskurse/TeilnahmeKosten/Titelab2005/titelab2005-node.html
      - title: Find a course provider and register
        body: Once the Ausländerbehörde has given you your Berechtigungsschein, you can choose a course provider. BAMF's BAMF-NAvI search shows integration courses near your home. Go to the provider to hand in the Berechtigungsschein and register.
        link: https://www.bamf.de/DE/Themen/Integration/ZugewanderteTeilnehmende/Integrationskurse/integrationskurse-node.html
      - title: Know how the course ends
        body: The language part ends with the "Deutsch-Test für Zuwanderer". The orientation part ends with the "Leben in Deutschland" test.
    review_status: approved
    jurisdiction: de-nrw-cologne
    reviewed_by: automated_source_check
    content_version: 2026-10-30.2
    source_verification: quote_checked
    legal_sources:
      - {kind: primary, label: '§44 AufenthG', url: 'https://www.gesetze-im-internet.de/aufenthg_2004/__44.html'}
      - {kind: primary, label: '§44a AufenthG', url: 'https://www.gesetze-im-internet.de/aufenthg_2004/__44a.html'}
      - {kind: implementation, label: 'BAMF · Integrationskurs Inhalt und Ablauf', url: 'https://www.bamf.de/DE/Themen/Integration/ZugewanderteTeilnehmende/Integrationskurse/InhaltAblauf/inhaltablauf-node.html'}
      - {kind: implementation, label: 'BAMF · Integrationskurse', url: 'https://www.bamf.de/DE/Themen/Integration/ZugewanderteTeilnehmende/Integrationskurse/integrationskurse-node.html'}
      - {kind: implementation, label: 'BAMF · Aufenthaltstitel ab 2005', url: 'https://www.bamf.de/DE/Themen/Integration/ZugewanderteTeilnehmende/Integrationskurse/TeilnahmeKosten/Titelab2005/titelab2005-node.html'}
    claims:
      - id: course-parts
        states: combines a German language course with an orientation course
        source: 'BAMF · Integrationskurs Inhalt und Ablauf'
        quote: Jeder Integrationskurs besteht aus einem Sprachkurs und einem Orientierungskurs
      - id: orientation-topics
        states: Germany's legal order, culture and history
        source: 'BAMF · Integrationskurs Inhalt und Ablauf'
        quote: die deutsche Rechtsordnung, Geschichte und Kultur
      - id: course-length
        states: The general course runs 700 lessons
        source: 'BAMF · Integrationskurs Inhalt und Ablauf'
        quote: Der allgemeine Integrationskurs dauert 700 Unterrichtseinheiten (UE)
      - id: family-entitlement
        states: A first residence permit for family reunification normally gives you a right to take part
        source: '§44 AufenthG'
        quote: zum Zweck des Familiennachzugs (§§ 28, 29, 30, 32, 36, 36a)
      - id: entitlement-lapses
        states: that right lapses one year after the permit is issued
        source: '§44 AufenthG'
        quote: Der Teilnahmeanspruch nach Absatz 1 erlischt ein Jahr nach Erteilung des den Anspruch begründenden Aufenthaltstitels oder bei dessen Wegfall.
      - id: obligation-simple-german
        states: You must attend if you have that right and cannot yet communicate in simple German
        source: '§44a AufenthG'
        quote: sich nicht zumindest auf einfache Art in deutscher Sprache verständigen kann
      - id: obligation-spouse
        states: or if your permit to join your spouse is issued while your German is not yet sufficient (§44a AufenthG)
        source: '§44a AufenthG'
        quote: zum Zeitpunkt der Erteilung eines Aufenthaltstitels nach § 23 Abs. 2, § 28 Abs. 1 Satz 1 Nr. 1, § 30, oder § 36a Absatz 1 Satz 1 erste Alternative nicht über ausreichende Kenntnisse der deutschen Sprache verfügt
      - id: obligation
        states: The Ausländerbehörde records it when it issues your permit
        source: '§44a AufenthG'
        quote: In den Fällen des Satzes 1 Nr. 1 stellt die Ausländerbehörde bei der Erteilung des Aufenthaltstitels fest, dass der Ausländer zur Teilnahme verpflichtet ist.
      - id: berechtigungsschein-issuer
        states: You get the Berechtigungsschein (certificate of eligibility) from the Ausländerbehörde
        source: 'BAMF · Aufenthaltstitel ab 2005'
        quote: Wenn Sie von der Ausländerbehörde Ihren Berechtigungsschein erhalten haben, können Sie sich einen Integrationskursträger aussuchen.
      - id: berechtigungsschein
        states: Once the Ausländerbehörde has given you your Berechtigungsschein, you can choose a course provider
        source: 'BAMF · Aufenthaltstitel ab 2005'
        quote: Wenn Sie von der Ausländerbehörde Ihren Berechtigungsschein erhalten haben, können Sie sich einen Integrationskursträger aussuchen.
      - id: navi-courses
        states: BAMF-NAvI search shows integration courses near your home
        source: 'BAMF · Integrationskurse'
        quote: führt Sie zu vielfältigen, wohnortnahen Integrationsangeboten
      - id: register-provider
        states: Go to the provider to hand in the Berechtigungsschein and register
        source: 'BAMF · Aufenthaltstitel ab 2005'
        quote: Sobald Sie einen Kursträger gefunden haben, sollten Sie zu ihm gehen, um den Berechtigungsschein abzugeben und sich anzumelden.
      - id: dtz-exam
        states: The language part ends with the "Deutsch-Test für Zuwanderer"
        source: 'BAMF · Integrationskurs Inhalt und Ablauf'
        quote: Der Sprachkurs schließt mit der Prüfung "Deutsch-Test für Zuwanderer" (DTZ) ab.
      - id: lid-test
        states: The orientation part ends with the "Leben in Deutschland" test
        source: 'BAMF · Integrationskurs Inhalt und Ablauf'
        quote: Den Orientierungskurs schließen Sie mit dem Abschlusstest "Leben in Deutschland" ab.

