# Shared spine for all family-reunification sub-paths. The permit task
# differs per sponsor and lives in family_reunification_standard.yaml
# (joining a non-EU sponsor, §§29–32), _of_german.yaml (§28) and
# _of_eu_citizen.yaml (FreizügG). Source: docs/bureaucracy-sources.md.
situation:
  - family_reunification
  - family_reunification_of_german
  - family_reunification_of_eu_citizen

tasks:
  # Retired 2026-10-08: covered by core.anmeldung.
  - title: Register your family's address (Anmeldung)
    key: fam.anmeldung
    is_published: false
    depends_on: []
    verified_at: 2026-06-11
    description: |
      Within 2 weeks of arrival, every family member must be registered at the Bürgeramt
      — including children. Arriving from abroad, you must appear in person (the proxy
      route only exists for domestic moves). Book a single appointment for the whole
      family.
    phase: arrival
    urgency: critical
    deadline_type: days_since_move_in
    deadline_days: 14
    booking_service_key: anmeldung
    documents_required:
      - label: ID documents of ALL persons moving in
        note: For every person 16+, a signed registration form is needed — plus a power of attorney if they don't appear in person.
      - label: Wohnungsgeberbescheinigung (Cologne form, signed by landlord/main tenant)
        note: A rental contract or informal letter is NOT sufficient, and it cannot be submitted later.
        tone: warn
      - label: Marriage or partnership certificate
        note: Foreign certificates need a translation by a publicly appointed/sworn translator in Germany — originals + translations must be shown.
      - label: Birth certificates for children
        note: Same sworn-translation rule. A minor moving with only one parent also needs the other parent's consent declaration (Cologne form).
    links:
      - https://www.stadt-koeln.de/service/produkte/00415/index.html
    how_to_steps:
      - title: Have the certificates translated by a sworn translator in Germany
        body: '"Any translation" fails — the legal standard is a publicly appointed/sworn translator in Germany. Getting originals + apostilles from abroad later is the single most painful retrofit, so bring them now.'
      - title: Book a family Anmeldung slot
        body: Specify the number of persons so the Bürgeramt allocates enough time. Walk-ins work on Mondays and Wednesdays; other days need an appointment.
        link: https://termine.stadt-koeln.de/
      - title: Mind the religion field on the form
        body: Declaring a recognized denomination enrols the earners in church tax — 9% of income tax in NRW, per person. Answer accurately, but know what it means.
      - title: Receive a separate Meldebescheinigung per person
        body: Each family member needs their own — for school, daycare, health insurance, and the permit applications.

  # Retired 2026-10-08: covered by core.health_insurance.
  - title: Enrol health insurance for every dependent
    key: fam.health_insurance
    is_published: false
    depends_on: []
    description: |
      Each family member needs their own coverage. Public insurance through the sponsor
      usually covers spouse + children for free (Familienversicherung) — but you must
      actively register them, it's not automatic.
    phase: arrival
    urgency: critical
    deadline_type: days_since_arrival
    deadline_days: 30
    documents_required:
      - Sponsor's insurance card + member number
      - Passports of dependents
      - Marriage / birth certificates
    links:
      - https://www.tk.de/en
    how_to_steps:
      - title: Contact your insurer to add dependents
        body: Most public insurers have a Familienversicherung form — submit by email or via the member portal. Spouse coverage requires that the spouse has no significant income.
      - title: Wait for individual cards
        body: Each dependent gets their own insurance card, mailed within 2–3 weeks. In the meantime, the membership confirmation works at doctors.
      - title: If spouse has income, switch to separate coverage
        body: Above ~€505/month income, the spouse needs their own paid coverage — choose between public or private depending on situation.

  - title: Register children for school or Kita
    key: fam.school_kita
    depends_on: []
    description: |
      School is compulsory from age 6. Kita (daycare) is widely available from age 1 but
      has long waitlists in Cologne — apply as soon as you have a confirmed address.
    phase: first_30_days
    urgency: high
    deadline_type: days_since_arrival
    deadline_days: 60
    documents_required:
      - Child's passport + birth certificate
      - Child's vaccination record (Impfausweis)
      - Meldebescheinigung
      - Parents' Meldebescheinigung
    links:
      - https://www.stadt-koeln.de/leben-in-koeln/familie-kinder/index.html
    how_to_steps:
      - title: For school-age children
        body: Contact the local Grundschule for your address. Cologne assigns by catchment area — the Schulamt has a map. Submit enrolment forms 6+ months before school start.
      - title: For Kita-age children
        body: Apply via Little Bird (Cologne's central Kita waiting list) — accepts applications up to 12 months in advance. Most Kitas are full; expect to apply to 8–10 to get one offer.
        link: https://www.little-bird.de/koeln
      - title: Check vaccination record
        body: German law requires proof of measles vaccination. If the record is in another language, get a German translation before submitting.

  - title: Apply for Kindergeld (child benefit)
    key: fam.kindergeld
    depends_on: []
    description: |
      €250/month per child until age 18 (or 25 if in education). Available to most
      residents regardless of income. Apply via the Familienkasse — separate from the
      tax office.
    phase: settling
    urgency: medium
    deadline_type: days_since_arrival
    deadline_days: 60
    documents_required:
      - Steuer-ID for each parent + each child
      - Birth certificates (apostilled + translated)
      - Meldebescheinigung
      - Residence permits
    links:
      - https://www.arbeitsagentur.de/familie-und-kinder/kindergeld
    how_to_steps:
      - title: Wait for everyone's Steuer-IDs
        body: Each child gets their own Steuer-ID a few weeks after Anmeldung. You can't file the Kindergeld application without all of them.
      - title: File online via the Familienkasse portal
        body: One application per family. Processing takes 6–10 weeks; payments are backdated to the application month.
      - title: Set up direct deposit
        body: Use the German bank account that receives your salary — they pay into a single household account.

  # Retired 2026-10-08: covered by core.steuer_id.
  - title: Wait for everyone's Steuer-IDs
    key: fam.steuer_ids
    is_published: false
    type: wait
    depends_on: []
    description: |
      Each family member, including children, gets their own 11-digit tax ID by post
      within 2–4 weeks of Anmeldung. Required for school benefits and Kindergeld.
    phase: arrival
    urgency: high
    deadline_type: days_since_arrival
    deadline_days: 28
    documents_required: []
    links:
      - https://www.bzst.de/EN/Private_individuals/Tax_identification_number/tax_identification_number_node.html
    how_to_steps:
      - title: Watch the post daily for the first month
        body: Children's Steuer-IDs arrive in unmarked letters — easy to mistake for junk mail. Keep all post until you've identified the IDs.
      - title: Store the numbers safely
        body: Each family member's Steuer-ID is permanent — keep a digital backup. You'll need them for Kindergeld, school registration, and the annual tax return.

  # Retired 2026-10-08: covered by core.bank_account.
  - title: Open a joint or family bank account
    key: fam.bank_account
    is_published: false
    depends_on: []
    description: |
      Receive salaries, pay rent + utilities, and manage shared expenses. Most banks let
      you add a second account holder (Gemeinschaftskonto) once you're both registered.
    phase: first_30_days
    urgency: high
    deadline_type: days_since_arrival
    deadline_days: 30
    documents_required:
      - Passports for both account holders
      - Meldebescheinigung for both
      - Marriage certificate
    links:
    how_to_steps:
      - title: Pick a joint-friendly bank
        body: Traditional banks (Sparkasse, Commerzbank, Deutsche Bank) handle joint accounts well. Online banks like N26 are personal-only — both spouses need separate accounts.
      - title: Apply with both account holders present
        body: Branch banks usually require both spouses for the initial opening. Bring marriage certificate to confirm joint status.
      - title: Set up direct debits + standing orders
        body: Rent, utilities, Rundfunkbeitrag — move them all to the joint account once active.

  # Retired 2026-10-08: covered by core.rundfunkbeitrag.
  - title: Settle Rundfunkbeitrag (one per household)
    key: fam.rundfunkbeitrag
    is_published: false
    depends_on: []
    description: |
      €18.36/month per household — flat rate regardless of family size. The Beitragsservice
      will contact you automatically a few weeks after Anmeldung.
    phase: settling
    urgency: medium
    deadline_type: days_since_arrival
    deadline_days: 60
    documents_required: []
    links:
      - https://www.rundfunkbeitrag.de/welcome/english
    how_to_steps:
      - title: Register the household at rundfunkbeitrag.de
        body: One registration per household — you don't pay extra for spouse or children.
      - title: Set up SEPA direct debit
        body: From the joint bank account, ideally — keeps household bills together.

  - title: Sign up for an Integration Course
    key: fam.integration_course
    depends_on: []
    description: |
      The Integrationskurs combines a German language course with an orientation course
      on Germany's legal order, culture and history. The general course runs 700 lessons.
      A first residence permit for family reunification normally gives you a right to
      take part, and that right lapses one year after the permit is issued, so sign up
      early. If you cannot yet communicate in simple German, the Ausländerbehörde can
      oblige you to attend when it issues your permit.
    phase: settling
    urgency: low
    deadline_type: none
    applies_if_mode: explicit
    applies_if:
      purpose: family
      sponsor: {in: [non_eu, german]}
    documents_required:
      - Residence permit
      - Passport
    links:
      - https://www.bamf.de/DE/Themen/Integration/ZugewanderteTeilnehmende/Integrationskurse/InhaltAblauf/inhaltablauf-node.html
      - https://www.gesetze-im-internet.de/aufenthg_2004/__44.html
      - https://www.gesetze-im-internet.de/aufenthg_2004/__44a.html
    how_to_steps:
      - title: Check whether the course is mandatory for you
        body: The Ausländerbehörde records an obligation to attend when it issues your permit, if one applies to you. Check the papers you receive with your permit.
      - title: Find a course provider
        body: BAMF's BAMF-NAvI search shows integration courses near your home.
        link: https://www.bamf.de/DE/Themen/Integration/ZugewanderteTeilnehmende/Integrationskurse/integrationskurse-node.html
      - title: Know how the course ends
        body: The language part ends with the "Deutsch-Test für Zuwanderer" and only a B1 exam counts as completing it. The orientation part ends with the "Leben in Deutschland" test.
    review_status: approved
    jurisdiction: de-nrw-cologne
    reviewed_by: automated_source_check
    content_version: 2026-10-08.1
    source_verification: quote_checked
    legal_sources:
      - {kind: primary, label: '§44 AufenthG', url: 'https://www.gesetze-im-internet.de/aufenthg_2004/__44.html'}
      - {kind: primary, label: '§44a AufenthG', url: 'https://www.gesetze-im-internet.de/aufenthg_2004/__44a.html'}
      - {kind: implementation, label: 'BAMF · Integrationskurs Inhalt und Ablauf', url: 'https://www.bamf.de/DE/Themen/Integration/ZugewanderteTeilnehmende/Integrationskurse/InhaltAblauf/inhaltablauf-node.html'}
    claims:
      - id: course-parts
        states: combines a German language course with an orientation course
        source: 'BAMF · Integrationskurs Inhalt und Ablauf'
        quote: Jeder Integrationskurs besteht aus einem Sprachkurs und einem Orientierungskurs
      - id: course-length
        states: The general course runs 700 lessons
        source: 'BAMF · Integrationskurs Inhalt und Ablauf'
        quote: Der allgemeine Integrationskurs dauert 700 Unterrichtseinheiten (UE)
      - id: family-entitlement
        states: A first residence permit for family reunification normally gives you a right to take part
        source: '§44 AufenthG'
        quote: zum Zweck des Familiennachzugs (§§ 28, 29, 30, 32, 36, 36a)
      - id: entitlement-lapses
        states: that right lapses one year after the permit is issued
        source: '§44 AufenthG'
        quote: Der Teilnahmeanspruch nach Absatz 1 erlischt ein Jahr nach Erteilung des den Anspruch begründenden Aufenthaltstitels oder bei dessen Wegfall.
      - id: obligation
        states: the Ausländerbehörde can oblige you to attend when it issues your permit
        source: '§44a AufenthG'
        quote: In den Fällen des Satzes 1 Nr. 1 stellt die Ausländerbehörde bei der Erteilung des Aufenthaltstitels fest, dass der Ausländer zur Teilnahme verpflichtet ist.
      - id: b1-exam
        states: only a B1 exam counts as completing it
        source: 'BAMF · Integrationskurs Inhalt und Ablauf'
        quote: B1 -Prüfung kann für den Abschluss des Integrationskurses anerkannt werden

  - title: Register the joining spouse's address
    key: case.family.register_address
    # Replaced by the reviewed cross-situation core.anmeldung preparation unit.
    # Retain the record/history, but do not publish competing registration steps.
    is_published: false
    description: |
      Register the spouse's Cologne address within two weeks after moving into the
      dwelling. Bring the passport and the landlord's Wohnungsgeberbestätigung; the
      Cologne page lists the additional documents required for people arriving from
      abroad. This deadline is tied to moving into the dwelling, not visa issuance.
    phase: arrival
    urgency: critical
    deadline_type: days_since_move_in
    deadline_days: 14
    applies_if:
      current_residence_title: national_d_visa
      entry_mode: d_visa
    booking_service_key: anmeldung
    links:
      - https://www.gesetze-im-internet.de/bmg/__17.html
      - https://www.stadt-koeln.de/service/produkt/anmeldung-ihres-wohnsitzes-1
    review_status: approved
    jurisdiction: de-nrw-cologne
    reviewed_by: expadu_content_owner
    content_version: 2026-08-03.1
    source_verification: dual_source
    verified_at: '2026-08-03'
    legal_sources:
      - {kind: primary, label: '§17 BMG', url: 'https://www.gesetze-im-internet.de/bmg/__17.html'}
      - {kind: implementation, label: 'Stadt Köln · Anmeldung', url: 'https://www.stadt-koeln.de/service/produkt/anmeldung-ihres-wohnsitzes-1'}
