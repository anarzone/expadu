      within 2–4 weeks of Anmeldung. Required for school benefits and Kindergeld.
    phase: arrival
    urgency: high
    deadline_type: days_since_arrival
    deadline_days: 28
    documents_required: []
    links:
      - https://www.bzst.de/EN/Private_individuals/Tax_identification_number/tax_identification_number_node.html
    how_to_steps:
      - title: Watch the post daily for the first month
        body: Children's Steuer-IDs arrive in unmarked letters — easy to mistake for junk mail. Keep all post until you've identified the IDs.
      - title: Store the numbers safely
        body: Each family member's Steuer-ID is permanent — keep a digital backup. You'll need them for Kindergeld, school registration, and the annual tax return.

  # Retired 2026-10-08: covered by core.bank_account.
  - title: Open a joint or family bank account
    key: fam.bank_account
    is_published: false
    depends_on: []
    description: |
      Receive salaries, pay rent + utilities, and manage shared expenses. Most banks let
      you add a second account holder (Gemeinschaftskonto) once you're both registered.
    phase: first_30_days
    urgency: high
    deadline_type: days_since_arrival
    deadline_days: 30
    documents_required:
      - Passports for both account holders
      - Meldebescheinigung for both
      - Marriage certificate
    links:
    how_to_steps:
      - title: Pick a joint-friendly bank
        body: Traditional banks (Sparkasse, Commerzbank, Deutsche Bank) handle joint accounts well. Online banks like N26 are personal-only — both spouses need separate accounts.
      - title: Apply with both account holders present
        body: Branch banks usually require both spouses for the initial opening. Bring marriage certificate to confirm joint status.
      - title: Set up direct debits + standing orders
        body: Rent, utilities, Rundfunkbeitrag — move them all to the joint account once active.

