# Shared spine for all family-reunification sub-paths. The permit task
# differs per sponsor and lives in family_reunification_standard.yaml
# (joining a non-EU sponsor, §§29–32), _of_german.yaml (§28) and
# _of_eu_citizen.yaml (FreizügG). Source: docs/bureaucracy-sources.md.
situation:
  - family_reunification
  - family_reunification_of_german
  - family_reunification_of_eu_citizen

tasks:
  # Retired 2026-10-08: covered by core.anmeldung.
  - title: Register your family's address (Anmeldung)
    key: fam.anmeldung
    is_published: false
    depends_on: []
    verified_at: 2026-06-11
    description: |
      Within 2 weeks of arrival, every family member must be registered at the Bürgeramt
      — including children. Arriving from abroad, you must appear in person (the proxy
      route only exists for domestic moves). Book a single appointment for the whole
      family.
    phase: arrival
    urgency: critical
    deadline_type: days_since_move_in
    deadline_days: 14
    booking_service_key: anmeldung
    documents_required:
      - label: ID documents of ALL persons moving in
        note: For every person 16+, a signed registration form is needed — plus a power of attorney if they don't appear in person.
      - label: Wohnungsgeberbescheinigung (Cologne form, signed by landlord/main tenant)
        note: A rental contract or informal letter is NOT sufficient, and it cannot be submitted later.
        tone: warn
      - label: Marriage or partnership certificate
        note: Foreign certificates need a translation by a publicly appointed/sworn translator in Germany — originals + translations must be shown.
      - label: Birth certificates for children
        note: Same sworn-translation rule. A minor moving with only one parent also needs the other parent's consent declaration (Cologne form).
    links:
      - https://www.stadt-koeln.de/service/produkte/00415/index.html
    how_to_steps:
      - title: Have the certificates translated by a sworn translator in Germany
        body: '"Any translation" fails — the legal standard is a publicly appointed/sworn translator in Germany. Getting originals + apostilles from abroad later is the single most painful retrofit, so bring them now.'
      - title: Book a family Anmeldung slot
        body: Specify the number of persons so the Bürgeramt allocates enough time. Walk-ins work on Mondays and Wednesdays; other days need an appointment.
        link: https://termine.stadt-koeln.de/
      - title: Mind the religion field on the form
        body: Declaring a recognized denomination enrols the earners in church tax — 9% of income tax in NRW, per person. Answer accurately, but know what it means.
      - title: Receive a separate Meldebescheinigung per person
        body: Each family member needs their own — for school, daycare, health insurance, and the permit applications.

  # Retired 2026-10-08: covered by core.health_insurance.
  - title: Enrol health insurance for every dependent
    key: fam.health_insurance
    is_published: false
    depends_on: []
    description: |
      Each family member needs their own coverage. Public insurance through the sponsor
      usually covers spouse + children for free (Familienversicherung) — but you must
      actively register them, it's not automatic.
    phase: arrival
    urgency: critical
    deadline_type: days_since_arrival
    deadline_days: 30
    documents_required:
      - Sponsor's insurance card + member number
      - Passports of dependents
      - Marriage / birth certificates
    links:
      - https://www.tk.de/en
    how_to_steps:
      - title: Contact your insurer to add dependents
        body: Most public insurers have a Familienversicherung form — submit by email or via the member portal. Spouse coverage requires that the spouse has no significant income.
      - title: Wait for individual cards
        body: Each dependent gets their own insurance card, mailed within 2–3 weeks. In the meantime, the membership confirmation works at doctors.
      - title: If spouse has income, switch to separate coverage
        body: Above ~€505/month income, the spouse needs their own paid coverage — choose between public or private depending on situation.

  - title: Register children for school or Kita
    key: fam.school_kita
    depends_on: []
    description: |
      Compulsory schooling starts on 1 August for children who have turned 6 by 30 September,
      and it applies to all school-age children, including those who move here from abroad.
      From age 1, children have a legal right to a place in a Kita (daycare) or with a
      childminder (Kindertagespflege). Register for Kita as early as you can: you must state
      your need at least six months before the place should start.
    phase: first_30_days
    urgency: high
    deadline_type: none
    documents_required:
      - Child's passport or ID
      - Child's birth certificate (for first-grade registration)
      - Proof of measles protection
      - Proof of your Cologne address (Meldebescheinigung)
      - Your own passport or ID
      - School reports from your previous country, if you have them
    links:
      - https://www.stadt-koeln.de/leben-in-koeln/familie-kinder/index.html
      - https://www.stadt-koeln.de/service/produkte/00083/index.html
      - https://www.stadt-koeln.de/service/produkte/00082/index.html
      - https://www.stadt-koeln.de/service/produkte/00386/index.html
    how_to_steps:
      - title: For school-age children new to Germany
        body: Once you are registered in Cologne, the city sends you a letter so you can book an advice appointment with the Kommunales Integrationszentrum (municipal integration centre, 0221 / 221-29292). After that, the Gesundheitsamt (public health office) gives your child a school medical check, and the Schulamt (school authority) finds a school place. You usually get the letter with the school place after about two weeks. Children who don't yet speak enough German first join a preparatory class (Vorbereitungsklasse).
        link: https://www.stadt-koeln.de/service/produkte/00083/index.html
      - title: For children starting first grade
        body: You can choose which primary school to register at. Your child has a right to a place at the nearest city school if it has enough places. Register at one primary school only, and always give a second choice on the form. There is a fixed registration deadline. For the 2026/27 school year it ended on 15 November 2025, so check the city's Einschulung page for the current one.
        link: https://www.stadt-koeln.de/service/produkte/00082/index.html
      - title: For Kita-age children
        body: |
          Apply online via LITTLE BIRD, Cologne's portal for Kita places, or in person at the Kita. You can register before you move, using your current address. A Kita place is only offered once at least one parent is registered in Cologne with their main residence. You can have up to six active requests per child per year.

          Offers come at the earliest eight months before the start date. You have two weeks to accept or decline. If the Kita you chose has no place, the city offers another place or a childminder.
        link: https://portal-koeln.little-bird.de/
      - title: Check measles protection
        body: Children aged 1 and over who go to a Kita or school must show proof of measles protection. This can be proof of vaccination, proof of immunity, or a certificate that your child can't be vaccinated, for example because of an intolerance.

  - title: Apply for Kindergeld (child benefit)
    key: fam.kindergeld
    applies_if_mode: explicit
    applies_if:
      purpose: family
    depends_on: []
    review_status: approved
    jurisdiction: de-nrw-cologne
    reviewed_by: automated_source_check
    content_version: 2026-10-30.2
    source_verification: quote_checked
    legal_sources:
      - {kind: primary, label: '§70 EStG — Festsetzung und Zahlung des Kindergeldes', url: 'https://www.gesetze-im-internet.de/estg/__70.html'}
      - {kind: primary, label: '§62 EStG — Anspruchsberechtigte', url: 'https://www.gesetze-im-internet.de/estg/__62.html'}
      - {kind: primary, label: '§63 EStG — Kinder', url: 'https://www.gesetze-im-internet.de/estg/__63.html'}
      - {kind: primary, label: '§32 EStG — Kinder, Freibeträge für Kinder', url: 'https://www.gesetze-im-internet.de/estg/__32.html'}
      - {kind: primary, label: '§66 EStG — Höhe des Kindergeldes, Zahlungszeitraum', url: 'https://www.gesetze-im-internet.de/estg/__66.html'}
      - {kind: primary, label: '§67 EStG — Antrag', url: 'https://www.gesetze-im-internet.de/estg/__67.html'}
    claims:
      - id: back-pay-six-months
        states: Payments go back only six months before the month your application arrives, so apply without delay
        source: '§70 EStG — Festsetzung und Zahlung des Kindergeldes'
        quote: Die Auszahlung von festgesetztem Kindergeld erfolgt rückwirkend nur für die letzten sechs Monate vor Beginn des Monats, in dem der Antrag auf Kindergeld eingegangen ist.
      - id: amount
        states: per child
        source: '§66 EStG — Höhe des Kindergeldes, Zahlungszeitraum'
        quote: Das Kindergeld beträgt monatlich für jedes Kind
      - id: until-18
        states: A child counts until they turn 18
        source: '§32 EStG — Kinder, Freibeträge für Kinder'
        quote: zu dessen Beginn es das 18. Lebensjahr noch nicht vollendet hat
      - id: up-to-25
        states: up to 25 in some cases
        source: '§32 EStG — Kinder, Freibeträge für Kinder'
        quote: noch nicht das 25. Lebensjahr vollendet hat und
      - id: in-training
        states: while in school, university or vocational training
        source: '§32 EStG — Kinder, Freibeträge für Kinder'
        quote: für einen Beruf ausgebildet wird
      - id: live-in-germany
        states: You can get it if you live in Germany
        source: '§62 EStG — Anspruchsberechtigte'
        quote: im Inland einen Wohnsitz oder seinen gewöhnlichen Aufenthalt hat oder
      - id: titles-only
        states: only some residence permits qualify
        source: '§62 EStG — Anspruchsberechtigte'
        quote: Ein nicht freizügigkeitsberechtigter Ausländer erhält Kindergeld nur, wenn er
      - id: settlement-permit
        states: a settlement permit
        source: '§62 EStG — Anspruchsberechtigte'
        quote: eine Niederlassungserlaubnis oder eine Erlaubnis zum Daueraufenthalt-EU besitzt
      - id: blue-card-six-months
        states: an EU Blue Card, or a residence permit that lets you work for at least six months
        source: '§62 EStG — Anspruchsberechtigte'
        quote: eine Blaue Karte EU, eine ICT-Karte, eine Mobiler-ICT-Karte oder eine Aufenthaltserlaubnis besitzt, die für einen Zeitraum von mindestens sechs Monaten zur Ausübung einer Erwerbstätigkeit berechtigen
      - id: some-permits-excluded
        states: Some permits don't count
        source: '§62 EStG — Anspruchsberechtigte'
        quote: es sei denn, die Aufenthaltserlaubnis wurde
      - id: student-permit
        states: a student residence permit
        source: '§62 EStG — Anspruchsberechtigte'
        quote: zum Zweck eines Studiums
      - id: student-only-if-working
        states: only counts while you work or take parental leave
        source: '§62 EStG — Anspruchsberechtigte'
        quote: und er ist weder erwerbstätig noch nimmt er Elternzeit
      - id: eu-three-months
        states: EU citizens who move here get no Kindergeld for the first three months
        source: '§62 EStG — Anspruchsberechtigte'
        quote: so hat er für die ersten drei Monate ab Begründung des Wohnsitzes oder des gewöhnlichen Aufenthalts keinen Anspruch auf Kindergeld
      - id: eu-income-exception
        states: unless they show they earn income in Germany
        source: '§62 EStG — Anspruchsberechtigte'
        quote: Dies gilt nicht, wenn er nachweist, dass er inländische Einkünfte
      - id: parent-tax-id
        states: You need your own tax ID (Steuer-ID) to get Kindergeld
        source: '§62 EStG — Anspruchsberechtigte'
        quote: Voraussetzung für den Anspruch nach Satz 1 ist, dass der Berechtigte durch die an ihn vergebene Identifikationsnummer
      - id: child-tax-id
        states: each child needs their own Steuer-ID
        source: '§63 EStG — Kinder'
        quote: Voraussetzung für die Berücksichtigung ist die Identifizierung des Kindes durch die an dieses Kind vergebene Identifikationsnummer
      - id: late-tax-id
        states: you still get Kindergeld for earlier months you qualified for
        source: '§63 EStG — Kinder'
        quote: Die nachträgliche Identifizierung oder nachträgliche Vergabe der Identifikationsnummer wirkt auf Monate zurück
      - id: apply-online
        states: Apply online to your Familienkasse
        source: '§67 EStG — Antrag'
        quote: Das Kindergeld ist bei der zuständigen Familienkasse elektronisch nach amtlich vorgeschriebenem Datensatz über die amtlich vorgeschriebene Schnittstelle zu beantragen
    description: |
      {{figure:kindergeld_monthly}} per child, paid every month.
      Payments go back only six months before the month your application arrives, so apply without delay.
      - You can get it if you live in Germany.
      - A child counts until they turn 18.
      - A child can count up to 25 in some cases, for example while in school, university or vocational training.
      - EU citizens who move here get no Kindergeld for the first three months, unless they show they earn income in Germany.
      - If you're not an EU, EEA or Swiss citizen (or their family member), only some residence permits qualify, such as a settlement permit, an EU Blue Card, or a residence permit that lets you work for at least six months.
      - Some permits don't count, and a student residence permit only counts while you work or take parental leave.
    phase: settling
    urgency: medium
    deadline_type: none
    documents_required:
      - Your Steuer-ID and each child's Steuer-ID
      - Your residence permit, if you're not an EU, EEA or Swiss citizen
    links:
      - https://www.arbeitsagentur.de/familie-und-kinder/kindergeld
    how_to_steps:
      - title: Get everyone's Steuer-IDs
        body: You need your own tax ID (Steuer-ID) to get Kindergeld, and each child needs their own Steuer-ID. Apply as soon as you have them. If an ID only arrives later, you still get Kindergeld for earlier months you qualified for.
      - title: Apply online to your Familienkasse
        body: Have your bank details (IBAN) ready, because Kindergeld is paid into a bank account. The Familienkasse may also ask for proof of your children, such as birth certificates, so keep them at hand.

