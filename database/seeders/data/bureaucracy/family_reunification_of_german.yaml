  - title: 'Permanent residency after three years (§28 Abs. 2)'
    key: famde.ne_three_years
    type: info
    depends_on: []
    description: |
      If you hold a residence permit under §28(1) as the family member of a German, you
      can apply for a Niederlassungserlaubnis after three years. Cologne lists these
      conditions: the family community with your German family member continues (you
      live together, or you regularly care for your German children); your livelihood
      is secured without benefits such as Bürgergeld; you have adequate health
      insurance; you have no criminal convictions in Germany, since even fines can
      prevent it; and your German is at B1 level.
    phase: ongoing
    urgency: low
    deadline_type: none
    documents_required: []
    links:
      - https://www.stadt-koeln.de/service/produkt/niederlassungserlaubnis-fuer-familienangehoerige-von-deutschen-personen
    review_status: approved
    jurisdiction: de-nrw-cologne
    reviewed_by: automated_source_check
    content_version: 2026-10-08.1
    source_verification: quote_checked
    legal_sources:
      - {kind: primary, label: '§28 AufenthG', url: 'https://www.gesetze-im-internet.de/aufenthg_2004/__28.html'}
      - {kind: implementation, label: 'Stadt Köln · settlement permit for family of Germans', url: 'https://www.stadt-koeln.de/service/produkt/niederlassungserlaubnis-fuer-familienangehoerige-von-deutschen-personen'}
    claims:
      - id: title-three-years
        states: 'Permanent residency after three years (§28 Abs. 2)'
        source: '§28 AufenthG'
        quote: Dem Ausländer ist in der Regel eine Niederlassungserlaubnis zu erteilen, wenn er drei Jahre im Besitz einer Aufenthaltserlaubnis ist
      - id: after-three-years
        states: residence permit under §28(1) as the family member of a German, you can apply for a Niederlassungserlaubnis after three years
        source: 'Stadt Köln · settlement permit for family of Germans'
        quote: Wenn Sie eine Aufenthaltserlaubnis nach § 28 Absatz 1 Aufenthaltsgesetz über einen deutschen Familienangehörigen besitzen, können Sie bereits nach drei Jahren eine Niederlassungserlaubnis beantragen.
      - id: family-community
        states: you live together, or you regularly care for your German children
        source: 'Stadt Köln · settlement permit for family of Germans'
        quote: Das bedeutet, Sie wohnen mit Ihrem deutschen Familienmitglied zusammen oder betreuen Ihre deutschen Kinder regelmäßig.
      - id: fines
        states: even fines can prevent it
        source: 'Stadt Köln · settlement permit for family of Germans'
        quote: Hierbei können schon Geldstrafen die Erteilung einer Niederlassungserlaubnis verhindern.
      - id: b1
        states: your German is at B1 level
        source: 'Stadt Köln · settlement permit for family of Germans'
        quote: Ihre Deutschkenntnisse entsprechen dem Niveau B1 des Gemeinsamen Europäischen Referenzrahmens für Sprachen.
