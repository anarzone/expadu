# Joining a German citizen (§28 AufenthG). Source: stadt-koeln.de product
# 20334, verified — see docs/bureaucracy-sources.md (Case 7 variant).
situation: family_reunification_of_german

tasks:
  - title: Submit your §28 permit application online
    key: famde.submit_application
    depends_on: []
    description: |
      Spouses and minor unmarried children of a German, and parents of a minor unmarried
      German child who exercise parental care, apply for a residence permit under §28.
      The German family member must usually live in Germany. Spouses normally need basic
      German (A1); this applies only to spouses and registered partners. File Cologne's
      online application; the authority reviews it and sends an appointment invitation
      once it can issue the permit. If you entered on a D visa, apply before the visa
      expires. If you entered visa-free under §41 AufenthV (for example as a citizen of
      Australia, Canada, Japan, the UK or the USA), apply within 90 days of entry.
    phase: first_30_days
    urgency: critical
    deadline_type: permit_window
    deadline_days: 90
    applies_if:
      entry_mode: [d_visa, visa_free]
    documents_required:
      - label: Cologne's online application for a family-reunification residence permit
        note: Upload scans of the documents listed on the appointment task.
      - label: A1 German certificate (spouses)
        note: Cologne accepts certificates from the Goethe-Institut, TestDaF-Institut or telc, for example the "Deutsch-Test für Zuwandernde".
        tone: warn
    links:
      - https://www.stadt-koeln.de/service/produkte/20334/index.html
    how_to_steps:
      - title: Download Cologne's official checklist
        body: The product page links a "Checkliste Unterlagen" PDF for family members of German citizens.
        link: https://www.stadt-koeln.de/service/produkte/20334/index.html
      - title: Submit the online application
        body: Upload the documents for your situation; bring the originals to the appointment.
    review_status: approved
    jurisdiction: de-nrw-cologne
    reviewed_by: automated_source_check
    content_version: 2026-10-08.1
    source_verification: quote_checked
    legal_sources:
      - {kind: primary, label: '§28 AufenthG', url: 'https://www.gesetze-im-internet.de/aufenthg_2004/__28.html'}
      - {kind: primary, label: '§81 AufenthG', url: 'https://www.gesetze-im-internet.de/aufenthg_2004/__81.html'}
      - {kind: primary, label: '§41 AufenthV', url: 'https://www.gesetze-im-internet.de/aufenthv/__41.html'}
      - {kind: implementation, label: 'Stadt Köln · family of German citizens', url: 'https://www.stadt-koeln.de/service/produkte/20334/index.html'}
    claims:
      - id: title-section
        states: Submit your §28 permit application online
        source: '§28 AufenthG'
        quote: Die Aufenthaltserlaubnis ist dem ausländischen 1. Ehegatten eines Deutschen, 2. minderjährigen ledigen Kind eines Deutschen, 3. Elternteil eines minderjährigen ledigen Deutschen zur Ausübung der Personensorge zu erteilen, wenn der Deutsche seinen gewöhnlichen Aufenthalt im Bundesgebiet hat.
      - id: who-applies
        states: apply for a residence permit under §28
        source: '§28 AufenthG'
        quote: Die Aufenthaltserlaubnis ist dem ausländischen 1. Ehegatten eines Deutschen, 2. minderjährigen ledigen Kind eines Deutschen, 3. Elternteil eines minderjährigen ledigen Deutschen zur Ausübung der Personensorge zu erteilen, wenn der Deutsche seinen gewöhnlichen Aufenthalt im Bundesgebiet hat.
      - id: a1
        states: Spouses normally need basic German (A1)
        source: 'Stadt Köln · family of German citizens'
        quote: Sie müssen in der Regel über einfache deutsche Sprachkenntnisse (A1) verfügen.
      - id: a1-certificate
        states: A1 German certificate (spouses)
        source: 'Stadt Köln · family of German citizens'
        quote: Sie müssen einfache deutsche Sprachkenntnisse Stufe A1 durch ein geeignetes Sprachstandszeugnis der Stufe A1
      - id: invitation
        states: sends an appointment invitation once it can issue the permit
        source: 'Stadt Köln · family of German citizens'
        quote: Sie erhalten eine Termineinladung zur Vorsprache, wenn wir Ihnen die Aufenthaltserlaubnis zur Familienzusammenführung ausstellen können.
      - id: before-expiry
        states: apply before the visa expires
        source: '§81 AufenthG'
        quote: Ein Aufenthaltstitel, der nach Maßgabe der Rechtsverordnung nach § 99 Abs. 1 Nr. 2 nach der Einreise eingeholt werden kann, ist unverzüglich nach der Einreise oder innerhalb der in der Rechtsverordnung bestimmten Frist zu beantragen.
      - id: visa-free-countries
        states: visa-free under §41 AufenthV (for example as a citizen of
        source: '§41 AufenthV'
        quote: Staatsangehörige von Australien, Israel, Japan, Kanada, der Republik Korea, von Neuseeland, des Vereinigten Königreichs
      - id: visa-free-window
        states: apply within 90 days of entry
        source: '§41 AufenthV'
        quote: Ein erforderlicher Aufenthaltstitel ist innerhalb von 90 Tagen nach der Einreise zu beantragen.
      - id: visa-free-deadline
        covers: deadline
        source: '§41 AufenthV'
        quote: Ein erforderlicher Aufenthaltstitel ist innerhalb von 90 Tagen nach der Einreise zu beantragen.

  - title: Attend your permit appointment with the originals (§28)
    key: famde.residence_permit
    depends_on: [famde.submit_application]
    description: |
      After the online application, the Ausländerbehörde invites you to an appointment
      when it can issue the permit. Bring the originals of everything you uploaded;
      Cologne may ask for further documents in individual cases.
    phase: first_30_days
    urgency: critical
    deadline_type: none
    applies_if:
      entry_mode: [d_visa, visa_free]
    booking_service_key: auslaenderbehoerde
    documents_required:
      - label: National passport of each applying family member
      - label: 'German spouse: their Personalausweis'
        note: 'For German spouses the German ID card is enough. For German children the birth certificate is enough.'
      - label: Copy of the entry visa, if you needed one
      - label: A1 German certificate (spouses)
        note: The original of the certificate you uploaded.
      - label: Marriage certificate or child's birth certificate (first application only)
        note: Bring a certified translation of every foreign certificate; depending on the country an apostille or legalisation is also needed.
      - label: Proof that you exercise parental care, if the German parent does not live with the child
      - label: Digital biometric photo
    links:
      - https://www.stadt-koeln.de/service/produkte/20334/index.html
    how_to_steps:
      - title: Bring originals and certified translations
        body: Cologne asks for a certified translation of all foreign certificates, plus an apostille or legalisation depending on the country of origin.
