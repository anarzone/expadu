# Shared spine for all non-EU employee sub-paths. The residence-permit task
# differs per path and lives in non_eu_employee_standard.yaml /
# _blue_card.yaml / _chancenkarte.yaml. Source: docs/bureaucracy-sources.md.
situation:
  - non_eu_employee
  - non_eu_employee_blue_card
  - non_eu_employee_chancenkarte

tasks:
  # Retired 2026-10-08: covered by core.anmeldung.
  - title: Register your address (Anmeldung)
    key: nee.anmeldung
    is_published: false
    depends_on: []
    verified_at: 2026-06-11
    description: |
      Every resident must register their address within 2 weeks of moving in (§17 BMG).
      Without the Meldebescheinigung you can't get a Steuer-ID, open a bank account, or
      finalise your residence permit. Arriving from abroad you must appear in person —
      the proxy route only exists for moves within Germany.
    phase: arrival
    urgency: critical
    deadline_type: days_since_move_in
    deadline_days: 14
    booking_service_key: anmeldung
    documents_required:
      - label: National passport
        note: Plus residence documents if you already hold any — eAT, visa, or Fiktionsbescheinigung.
      - label: Wohnungsgeberbescheinigung (Cologne form, signed by landlord/main tenant)
        note: A rental contract or informal letter is NOT sufficient, and it cannot be submitted later — without it the registration doesn't happen that day.
        tone: warn
      - label: Marriage/partnership certificate, if applicable
        note: Foreign certificates need a translation by a publicly appointed/sworn translator in Germany — originals + translations must be shown.
      - label: Birth certificates for children moving with you, if applicable
        note: Same sworn-translation rule. A minor moving with only one parent also needs the other parent's consent declaration (Cologne form).
    links:
      - https://www.stadt-koeln.de/service/produkte/00415/index.html
    how_to_steps:
      - title: Get the Wohnungsgeberbescheinigung from your landlord
        body: Cologne's own form (Formular-Server 02-F17), filled and signed by the landlord or main tenant. This is the number-one trap — chase it before moving day.
      - title: Pick your route — online, walk-in, or appointment
        body: Cologne offers Anmeldung fully online via the Serviceportal. In person, Kundenzentren take walk-ins on Mondays and Wednesdays; Tuesday/Thursday/Friday need an appointment. Free either way.
        link: https://termine.stadt-koeln.de/
      - title: Mind the religion field on the form
        body: Declaring a recognized denomination enrols you in church tax — 9% of your income tax in NRW, deducted from every payslip. Leaving later costs a fee at the Amtsgericht.
      - title: Make digital copies of the Meldebescheinigung
        body: You'll attach it to bank, insurance and permit paperwork repeatedly — keep a PDF handy.

  # Retired 2026-10-08: covered by core.steuer_id.
  - title: Wait for your Steuer-ID (tax identification number)
    key: nee.steuer_id
    is_published: false
    type: wait
    depends_on: []
    description: |
      The Bundeszentralamt für Steuern automatically sends your 11-digit tax ID by post
      within 2–4 weeks of Anmeldung. You can't legally be paid in Germany without it.
    phase: arrival
    urgency: high
    deadline_type: days_since_arrival
    deadline_days: 28
    documents_required: []
    links:
      - https://www.bzst.de/EN/Private_individuals/Tax_identification_number/tax_identification_number_node.html
    how_to_steps:
      - title: Check your post daily
        body: It arrives as an unbranded letter from Bonn — easy to miss. Don't throw away mail until you've found it.
      - title: If nothing after 4 weeks, request a copy
        body: Use the BZSt online form. They'll send a new letter to your registered address.
        link: https://www.bzst.de/SiteGlobals/Kontaktformulare/EN/Contactform_IDNr/IdNr_node.html
      - title: Give it to your employer immediately
        body: Without your Steuer-ID, payroll defaults to maximum tax class — you'll be over-taxed every payslip until you fix it.

  # Retired 2026-10-08: covered by core.health_insurance.
  - title: Sign up for German health insurance
    key: nee.health_insurance
    is_published: false
    depends_on: []
    description: |
      Health insurance is mandatory in Germany. As an employee, you'll typically be
      enrolled in a gesetzliche Krankenversicherung (public/statutory) — the employer
      handles most of the paperwork, but you choose the insurer.
    phase: arrival
    urgency: critical
    deadline_type: days_since_arrival
    deadline_days: 30
    documents_required:
      - Passport
      - label: Meldebescheinigung
        from: nee.anmeldung
      - Employment contract
    links:
      - https://www.krankenkassen.de/
    how_to_steps:
      - title: Compare public insurers
        body: TK, AOK, Barmer, DAK — same baseline coverage by law, differ on extras (English service, app quality, dental add-ons). For most expats, TK has the best English support.
      - title: Apply online
        body: Most insurers let you sign up online with passport + Meldebescheinigung. They'll send a membership confirmation to your employer.
      - title: Wait for your insurance card
        body: Arrives by post in 2–3 weeks. In the meantime, doctors will accept the membership confirmation letter — and your residence-permit appointment accepts the card alone once issued.

  # Retired 2026-10-08: covered by core.bank_account.
  - title: Open a German bank account
    key: nee.bank_account
    is_published: false
    depends_on: []
    description: |
      Required for receiving your salary and paying rent. Pick a Girokonto from a bank
      that supports IBAN, mobile app, and ideally English service.
    phase: first_30_days
    urgency: high
    deadline_type: days_since_arrival
    deadline_days: 30
    documents_required:
      - Passport
      - label: Meldebescheinigung
        from: nee.anmeldung
      - label: Tax ID (if available)
        from: nee.steuer_id
    links:
      - https://www.n26.com/en-de
    how_to_steps:
      - title: Pick an account type
        body: Online-only banks (N26, Revolut, C24) are fastest to open. Traditional banks (Sparkasse, Deutsche Bank, Commerzbank) are useful if you need a branch or notarised paperwork.
      - title: Apply with passport + Meldebescheinigung
        body: Online banks usually verify identity via video call (PostIdent or self-onboarding via app). Allow 1–3 days for the IBAN to be issued.
      - title: Share the IBAN with employer + landlord
        body: Your IBAN should be on the employer's HR portal before payroll. Same with rent direct-debit.

  # Retired 2026-10-08: covered by core.rundfunkbeitrag.
  - title: Settle your Rundfunkbeitrag (broadcasting fee)
    key: nee.rundfunkbeitrag
    is_published: false
    depends_on: []
    description: |
      Every household in Germany pays €18.36/month for public broadcasting, regardless of
      whether you own a TV. The Beitragsservice will write to you automatically a few
      weeks after Anmeldung — you can also register pre-emptively.
    phase: settling
    urgency: medium
    deadline_type: days_since_arrival
    deadline_days: 60
    documents_required: []
    links:
      - https://www.rundfunkbeitrag.de/welcome/english
    how_to_steps:
      - title: Register at rundfunkbeitrag.de
        body: One Beitrag per household. If your flatmates already pay, you don't have to register again — just give the Beitragsnummer of one of them.
      - title: Set up SEPA direct debit
        body: Saves you from manual transfers; can be cancelled anytime if you move out.
      - title: Apply for exemption if eligible
        body: BAföG recipients, certain low-income workers, and disabled persons can be exempted — full list on the official site.

  # Retired 2026-10-08: covered by core.liability_insurance.
  - title: Get private liability insurance (Haftpflichtversicherung)
    key: nee.liability_insurance
    is_published: false
    depends_on: []
    description: |
      Not legally required, but culturally near-universal and landlords increasingly
      expect it — covers damage you accidentally cause to other people's property.
      €3–6/month against bills that are otherwise unlimited.
    phase: settling
    urgency: low
    deadline_type: none
    documents_required: []
    links:
      - https://www.check24.de/haftpflichtversicherung/
    how_to_steps:
      - title: Compare on Check24 or Verivox
        body: Look for "Privathaftpflicht" with at least €10M coverage. Pay annually if you want a discount.
      - title: Note your policy number
        body: You'll need it if you ever cause damage (e.g., breaking a friend's TV, damaging a rented item).

  # Serves every employee (EU and non-EU): eu_employee's copy (eue.tax_return) is retired.
  - title: File your annual income tax return (Einkommensteuererklärung)
    key: nee.tax_return
    depends_on: []
    applies_if_mode: explicit
    applies_if:
      purpose: employment
    review_status: approved
    jurisdiction: de-nrw-cologne
    reviewed_by: automated_source_check
    content_version: 2026-10-08.1
    source_verification: quote_checked
    legal_sources:
      - {kind: primary, label: '§46 EStG — Veranlagung bei Arbeitnehmern', url: 'https://www.gesetze-im-internet.de/estg/__46.html'}
      - {kind: primary, label: '§149 AO — Abgabe der Steuererklärungen', url: 'https://www.gesetze-im-internet.de/ao_1977/__149.html'}
      - {kind: primary, label: '§41b EStG — Lohnsteuerbescheinigung', url: 'https://www.gesetze-im-internet.de/estg/__41b.html'}
    claims:
      - id: several-employers
        states: if you were paid by several employers at the same time
        source: '§46 EStG — Veranlagung bei Arbeitnehmern'
        quote: wenn der Steuerpflichtige nebeneinander von mehreren Arbeitgebern Arbeitslohn bezogen hat
      - id: section-46
        states: cases listed in §46 EStG
        source: '§46 EStG — Veranlagung bei Arbeitnehmern'
        quote: so wird eine Veranlagung nur durchgeführt
      - id: voluntary-filing
        states: you can still file a return to have the wage tax already withheld credited against your income tax
        source: '§46 EStG — Veranlagung bei Arbeitnehmern'
        quote: wenn die Veranlagung beantragt wird, insbesondere zur Anrechnung von Lohnsteuer auf die Einkommensteuer
      - id: seven-months
        states: due seven months after the end of the calendar year
        source: '§149 AO — Abgabe der Steuererklärungen'
        quote: spätestens sieben Monate nach Ablauf des Kalenderjahres
      - id: wage-tax-certificate
        states: Your employer must hand you a printout of your electronic wage tax certificate or make it available electronically
        source: '§41b EStG — Lohnsteuerbescheinigung'
        quote: Der Arbeitgeber hat dem Arbeitnehmer die elektronische Lohnsteuerbescheinigung nach amtlich vorgeschriebenem Muster binnen angemessener Frist als Ausdruck auszuhändigen oder elektronisch bereitzustellen.
    description: |
      As an employee, wage tax is deducted from your salary. A tax return is
      mandatory in the cases listed in §46 EStG — for example if you were paid by
      several employers at the same time. If none of those cases applies, you can
      still file a return to have the wage tax already withheld credited against
      your income tax. If you are required to file and do it yourself, the return
      is due seven months after the end of the calendar year; a different deadline
      applies when a tax adviser prepares it.
    phase: ongoing
    urgency: medium
    deadline_type: none
    recurrence_months: 12
    documents_required:
      - Lohnsteuerbescheinigung (wage tax certificate) from each employer
      - Receipts for expenses you want to claim
    links:
      - https://www.gesetze-im-internet.de/estg/__46.html
      - https://www.elster.de/eportal/start
    how_to_steps:
      - title: Collect your Lohnsteuerbescheinigung
        body: Your employer must hand you a printout of your electronic wage tax certificate or make it available electronically. It summarises the wage and wage tax of the year.
      - title: Check whether you must file
        body: Read the cases listed in §46 EStG, or ask your tax office or a tax adviser. If you are not required to file, filing is your choice.
        link: https://www.gesetze-im-internet.de/estg/__46.html
