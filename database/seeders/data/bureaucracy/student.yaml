situation: student

tasks:
  # Retired 2026-10-08: covered by core.anmeldung.
  - title: Register your address (Anmeldung)
    key: stu.anmeldung
    is_published: false
    depends_on: []
    verified_at: 2026-06-11
    description: |
      Every resident in Germany must register their address at the Bürgeramt within 14
      days of moving in. Without the Meldebescheinigung you can't enrol at university,
      open a bank account, or finalise your residence permit.
    phase: arrival
    urgency: critical
    deadline_type: days_since_move_in
    deadline_days: 14
    booking_service_key: anmeldung
    documents_required:
      - Passport
      - Wohnungsgeberbestätigung (signed by landlord/dorm)
    links:
      - https://www.stadt-koeln.de/service/produkte/00415/index.html
    how_to_steps:
      - title: Get a Wohnungsgeberbestätigung
        body: Your landlord (or the Studierendenwerk, if you're in a dorm) must give you this form. Without it the Bürgeramt won't proceed.
      - title: Book a Bürgeramt appointment
        body: Slots fill fast in September/October (semester start). Try booking immediately after you have a contract.
        link: https://termine.stadt-koeln.de/
      - title: Make digital + paper copies
        body: You'll need the Meldebescheinigung repeatedly — keep originals safe and PDFs accessible.

  - title: Enrol at your university (Immatrikulation)
    key: stu.enrolment
    depends_on: []
    review_status: approved
    jurisdiction: de-nrw-cologne
    reviewed_by: automated_source_check
    content_version: 2026-10-08.1
    source_verification: quote_checked
    legal_sources:
      - {kind: primary, label: '§199a SGB V — Informationspflichten bei krankenversicherten Studenten', url: 'https://www.gesetze-im-internet.de/sgb_5/__199a.html'}
      - {kind: implementation, label: 'Stadt Köln · Aufenthaltserlaubnis zu Studienzwecken', url: 'https://www.stadt-koeln.de/service/produkte/00973/index.html'}
    claims:
      - id: insurance-before-enrolment
        states: Before enrolment you must prove your health insurance status to the university (§199a SGB V)
        source: '§199a SGB V — Informationspflichten bei krankenversicherten Studenten'
        quote: Jeder Studieninteressierte hat gegenüber der staatlichen oder staatlich anerkannten Hochschule vor der Einschreibung nachzuweisen, dass er in der gesetzlichen Krankenversicherung versichert ist
      - id: insurance-step
        states: §199a SGB V
        source: '§199a SGB V — Informationspflichten bei krankenversicherten Studenten'
        quote: Der Studieninteressierte fordert bei der Krankenkasse an, dass die Krankenkasse den Nachweis über seinen Versichertenstatus nach Satz 1 an die staatliche oder staatlich anerkannte Hochschule meldet.
      - id: permit-evidence
        states: Immatrikulationsbescheinigung or a conditional admission
        source: 'Stadt Köln · Aufenthaltserlaubnis zu Studienzwecken'
        quote: Immatrikulationsbescheinigung oder bedingte Hochschulzulassung
    description: |
      Enrolment is done with your university: follow the instructions in your
      admission letter and on the university's portal. Before enrolment you must
      prove your health insurance status to the university (§199a SGB V). If you
      need a residence permit for study, Cologne asks for your
      Immatrikulationsbescheinigung or a conditional admission.
    phase: arrival
    urgency: critical
    deadline_type: none
    documents_required:
      - Admission letter (Zulassungsbescheid) and the documents your university lists
      - label: Report of your health insurance status
        from: stu.health_insurance
        note: Your health insurer sends it to the university.
    links: []
    how_to_steps:
      - title: Follow your university's enrolment instructions
        body: Check your admission letter and the university portal for the documents, payments and dates your university sets.
      - title: Have your insurance status reported
        body: Ask your health insurer to report your insurance status to the university before you enrol (§199a SGB V).
        link: https://www.gesetze-im-internet.de/sgb_5/__199a.html
      - title: Keep your Immatrikulationsbescheinigung
        body: Non-EU students need it, or a conditional admission, for the residence permit for study.
        link: https://www.stadt-koeln.de/service/produkte/00973/index.html

  - title: Prove your health insurance status before enrolment
    key: stu.health_insurance
    depends_on: []
    review_status: approved
    jurisdiction: de-nrw-cologne
    reviewed_by: automated_source_check
    content_version: 2026-10-08.1
    source_verification: quote_checked
    legal_sources:
      - {kind: primary, label: '§5 SGB V — Versicherungspflicht', url: 'https://www.gesetze-im-internet.de/sgb_5/__5.html'}
      - {kind: primary, label: '§8 SGB V — Befreiung von der Versicherungspflicht', url: 'https://www.gesetze-im-internet.de/sgb_5/__8.html'}
      - {kind: primary, label: '§199a SGB V — Informationspflichten bei krankenversicherten Studenten', url: 'https://www.gesetze-im-internet.de/sgb_5/__199a.html'}
    claims:
      - id: student-compulsory-insurance
        states: generally compulsorily insured in statutory health insurance up to the age of thirty, unless they are entitled to benefits through another country under EU or international rules (§5 SGB V)
        source: '§5 SGB V — Versicherungspflicht'
        quote: Studenten, die an staatlichen oder staatlich anerkannten Hochschulen eingeschrieben sind, unabhängig davon, ob sie ihren Wohnsitz oder gewöhnlichen Aufenthalt im Inland haben, wenn für sie auf Grund über- oder zwischenstaatlichen Rechts kein Anspruch auf Sachleistungen besteht, längstens bis zur Vollendung des dreißigsten Lebensjahres
      - id: exemption
        states: exempted from this, applying within three months of compulsory insurance starting (§8 SGB V)
        source: '§8 SGB V — Befreiung von der Versicherungspflicht'
        quote: Der Antrag ist innerhalb von drei Monaten nach Beginn der Versicherungspflicht bei der Krankenkasse zu stellen.
      - id: exemption-ground
        states: You can apply to a statutory health insurer to be exempted
        source: '§8 SGB V — Befreiung von der Versicherungspflicht'
        quote: durch die Einschreibung als Student oder die berufspraktische Tätigkeit
      - id: proof-before-enrolment
        states: before you enrol you must prove your insurance status to your university
        source: '§199a SGB V — Informationspflichten bei krankenversicherten Studenten'
        quote: Jeder Studieninteressierte hat gegenüber der staatlichen oder staatlich anerkannten Hochschule vor der Einschreibung nachzuweisen, dass er in der gesetzlichen Krankenversicherung versichert ist
      - id: insurer-reports
        states: §199a SGB V
        source: '§199a SGB V — Informationspflichten bei krankenversicherten Studenten'
        quote: Der Studieninteressierte fordert bei der Krankenkasse an, dass die Krankenkasse den Nachweis über seinen Versichertenstatus nach Satz 1 an die staatliche oder staatlich anerkannte Hochschule meldet.
    description: |
      Students enrolled at a state or state-recognised university are
      generally compulsorily insured in statutory health insurance up to the age of thirty, unless they are entitled to benefits through another country under EU or international rules (§5 SGB V).
      You can apply to a statutory health insurer to be exempted from this, applying within three months of compulsory insurance starting (§8 SGB V).
      Either way, before you enrol you must prove your insurance status to your
      university: a statutory health insurer reports it to the university at your
      request, also if you are exempt or not compulsorily insured (§199a SGB V).
    phase: arrival
    urgency: critical
    deadline_type: none
    documents_required: []
    links:
      - https://www.gesetze-im-internet.de/sgb_5/__199a.html
    how_to_steps:
      - title: Check your situation with a statutory health insurer
        body: Explain your studies and any cover you already have, including cover from your home country. The insurer tells you whether you are compulsorily insured; Expadu does not decide this.
      - title: Ask for the report to your university
        body: Ask the insurer to send your insurance status to your university, so that your enrolment can go ahead (§199a SGB V).
        link: https://www.gesetze-im-internet.de/sgb_5/__199a.html

  # Book-before-ready: the application can go in with a conditional admission
  # letter — don't wait for full enrolment.
  - title: Apply for your student residence permit (§16b)
    key: stu.submit_application
    depends_on: []
    review_status: approved
    jurisdiction: de-nrw-cologne
    reviewed_by: automated_source_check
    content_version: 2026-10-08.1
    source_verification: quote_checked
    legal_sources:
      - {kind: primary, label: '§16b AufenthG — Studium', url: 'https://www.gesetze-im-internet.de/aufenthg_2004/__16b.html'}
      - {kind: primary, label: '§41 AufenthV — Vergünstigung für Angehörige bestimmter Staaten', url: 'https://www.gesetze-im-internet.de/aufenthv/__41.html'}
      - {kind: implementation, label: 'Stadt Köln · Aufenthaltserlaubnis zu Studienzwecken', url: 'https://www.stadt-koeln.de/service/produkte/00973/index.html'}
    claims:
      - id: study-permit
        states: residence permit (§16b)
        source: '§16b AufenthG — Studium'
        quote: Einem Ausländer wird zum Zweck des Vollzeitstudiums an einer staatlichen Hochschule, an einer staatlich anerkannten Hochschule oder an einer vergleichbaren Bildungseinrichtung eine Aufenthaltserlaubnis erteilt, wenn er von der Bildungseinrichtung zugelassen worden ist.
      - id: study-permit-law
        states: residence permit for study under §16b AufenthG
        source: '§16b AufenthG — Studium'
        quote: Einem Ausländer wird zum Zweck des Vollzeitstudiums an einer staatlichen Hochschule, an einer staatlich anerkannten Hochschule oder an einer vergleichbaren Bildungseinrichtung eine Aufenthaltserlaubnis erteilt, wenn er von der Bildungseinrichtung zugelassen worden ist.
      - id: application-window
        states: within your visa's validity, or within 90 days of entry if you entered without a visa
        source: 'Stadt Köln · Aufenthaltserlaubnis zu Studienzwecken'
        quote: Anschließend beantragen Sie bitte innerhalb des erlaubten Visumszeitraums beziehungsweise innerhalb von 90 Tagen (bei Befreiung von der Visumpflicht) einen Aufenthaltstitel (Erstantrag).
      - id: visa-free-deadline
        covers: deadline
        source: '§41 AufenthV — Vergünstigung für Angehörige bestimmter Staaten'
        quote: Ein erforderlicher Aufenthaltstitel ist innerhalb von 90 Tagen nach der Einreise zu beantragen.
      - id: register-first
        states: Register your address in Cologne first
        source: 'Stadt Köln · Aufenthaltserlaubnis zu Studienzwecken'
        quote: dann müssen Sie zuerst Ihren offiziellen Wohnsitz in Köln anmelden
      - id: conditional-admission
        states: A conditional university admission is accepted
        source: 'Stadt Köln · Aufenthaltserlaubnis zu Studienzwecken'
        quote: Immatrikulationsbescheinigung oder bedingte Hochschulzulassung
      - id: finance-alternatives
        states: a Verpflichtungserklärung, a scholarship certificate, or your parents' declaration that they will fund your studies
        source: 'Stadt Köln · Aufenthaltserlaubnis zu Studienzwecken'
        quote: Verpflichtungserklärung / Stipendienbescheinigung / Erklärung der Eltern, für die Dauer des Studiums den Lebensunterhalt zu sichern
    description: |
      Non-EU students turn their entry visa into a residence permit for study under
      §16b AufenthG. Register your address in Cologne first, then apply (Erstantrag)
      within your visa's validity, or within 90 days of entry if you entered without a visa.
      A conditional university admission is accepted with the application, so you
      do not need to wait for full enrolment.
    phase: first_30_days
    urgency: critical
    deadline_type: permit_window
    deadline_days: 90
    applies_if:
      citizenship_group: non_eu
      entry_mode: [d_visa, visa_free]
    documents_required:
      - label: Residence permit application (Erstantrag)
        note: Apply online via the city page or book an appointment at your Bezirksausländeramt. A conditional university admission works if you're not enrolled yet.
      - label: 'Finance proof, for example a Sperrkonto with {{figure:sperrkonto_students}}'
        note: Cologne also accepts a Verpflichtungserklärung, a scholarship certificate, or your parents' declaration that they will fund your studies.
    links:
      - https://www.stadt-koeln.de/service/produkte/00973/index.html
    how_to_steps:
      - title: Line up your finance proof
        body: For a first permit Cologne accepts, for example, a blocked account (Sperrkonto) at a German bank with {{figure:sperrkonto_students}}. See the city page for the other accepted proofs.
        link: https://www.stadt-koeln.de/service/produkte/00973/index.html
      - title: File your Erstantrag
        body: Apply online or book an appointment at your district immigration office (Bezirksausländeramt), as the city page describes.
        link: https://www.stadt-koeln.de/service/produkte/00973/index.html

  - title: Attend your permit appointment with the originals
    key: stu.residence_permit
    depends_on: [stu.submit_application]
    review_status: approved
    jurisdiction: de-nrw-cologne
    reviewed_by: automated_source_check
    content_version: 2026-10-08.1
    source_verification: quote_checked
    legal_sources:
      - {kind: primary, label: '§16b AufenthG — Studium', url: 'https://www.gesetze-im-internet.de/aufenthg_2004/__16b.html'}
      - {kind: implementation, label: 'Stadt Köln · Aufenthaltserlaubnis zu Studienzwecken', url: 'https://www.stadt-koeln.de/service/produkte/00973/index.html'}
    claims:
      - id: work-account
        states: work of up to 140 working days per year (§16b(3) AufenthG)
        source: '§16b AufenthG — Studium'
        quote: Die Aufenthaltserlaubnis berechtigt nach Maßgabe der folgenden Sätze nur zur Ausübung von Beschäftigungen, die insgesamt bis zu 140 Arbeitstage im Jahr nicht überschreiten dürfen (Arbeitstagekonto).
      - id: bring-documents
        states: Bring all the required documents to your appointment
        source: 'Stadt Köln · Aufenthaltserlaubnis zu Studienzwecken'
        quote: Bringen Sie bitte alle benötigten Unterlagen zum Termin mit.
      - id: further-documents
        states: the office can ask for further documents and give you another appointment
        source: 'Stadt Köln · Aufenthaltserlaubnis zu Studienzwecken'
        quote: Im Einzelfall kann es erforderlich sein, dass im Termin weitere Unterlagen und Nachweise angefordert werden.
      - id: language-course-hours
        states: at least 18 lessons per week
        source: 'Stadt Köln · Aufenthaltserlaubnis zu Studienzwecken'
        quote: mindestens 18 Unterrichtsstunden pro Woche
      - id: visitor-visa
        states: A visitor visa does not lead to a residence permit for study
        source: 'Stadt Köln · Aufenthaltserlaubnis zu Studienzwecken'
        quote: dass ein Besuchsvisum nicht zur Erteilung einer Aufenthaltserlaubnis zu Studienzwecken führt
    description: |
      Bring all the required documents to your appointment at the Bezirksausländeramt.
      In some cases the office can ask for further documents and give you another appointment.
      The permit covers your studies and allows work of up to 140 working days per year (§16b(3) AufenthG);
      the work card explains how days are counted.
    phase: first_30_days
    urgency: critical
    deadline_type: none
    applies_if:
      citizenship_group: non_eu
      entry_mode: [d_visa, visa_free]
    booking_service_key: auslaenderbehoerde
    documents_required:
      - label: Valid national passport including copies of ALL printed pages
        note: Cologne asks for copies of every printed page; bring them with you.
      - label: Digital biometric photo
      - label: Valid study visa, if one was required for entry
        note: A visitor visa does not lead to a residence permit for study.
      - label: Immatrikulationsbescheinigung or conditional university admission
        note: 'If you''re still in study preparation: proof of the preparatory language course with its length and weekly hours (at least 18 lessons per week), or your Studienkolleg enrolment certificate.'
      - label: Studienverlaufsplan (study plan), if already in degree study
        note: Renewals additionally need a certificate of orderly study progress.
      - label: 'Finance proof, for example a Sperrkonto with {{figure:sperrkonto_students}}'
        note: The blocked account confirmation, Verpflichtungserklärung, scholarship certificate or your parents' funding declaration.
      - label: Proof of sufficient health insurance
        note: Renewals also need your insurer's confirmation of continuous cover.
      - label: Copy of your rental contract (Mietvertrag)
    links:
      - https://www.stadt-koeln.de/service/produkte/00973/index.html
    how_to_steps:
      - title: Bring originals and copies of everything
        body: Check the city's document list before the appointment. A missing document can mean a further appointment.
        link: https://www.stadt-koeln.de/service/produkte/00973/index.html

  # Retired 2026-10-08: covered by core.steuer_id.
  - title: Wait for your Steuer-ID
    key: stu.steuer_id
    is_published: false
    type: wait
    depends_on: []
    description: |
      Automatically sent by post 2–4 weeks after Anmeldung. As a student you'll need
      it for any paid work (mini-jobs, working student contracts, tutoring) and to file
      your first tax return.
    phase: arrival
    urgency: medium
    deadline_type: days_since_arrival
    deadline_days: 28
    documents_required: []
    links:
      - https://www.bzst.de/EN/Private_individuals/Tax_identification_number/tax_identification_number_node.html
    how_to_steps:
      - title: Watch your post
        body: Plain letter from Bonn — don't throw out unbranded mail in your first month.
      - title: Request a copy if it doesn't arrive in 4 weeks
        body: Use the BZSt online contact form.

  # Retired 2026-10-08: covered by core.bank_account.
  - title: Open a student bank account
    key: stu.bank_account
    is_published: false
    depends_on: []
    description: |
      Most German banks offer free Girokonto accounts to students under 30 — no monthly
      fee, free debit card, English support at the bigger banks.
    phase: first_30_days
    urgency: high
    deadline_type: days_since_arrival
    deadline_days: 30
    documents_required:
      - Passport
      - label: Meldebescheinigung
        from: stu.anmeldung
      - label: Immatrikulationsbescheinigung (proves student status)
        from: stu.enrolment
    links:
      - https://www.n26.com/en-de
    how_to_steps:
      - title: Pick online-only or branch-based
        body: N26 and C24 are fast and English-friendly. Deutsche Bank, Commerzbank offer student accounts with branch service.
      - title: Apply with student certificate
        body: Many "free" accounts require proof you're under 30 + an active student — your Immatrikulationsbescheinigung is what unlocks the student rate.
      - title: Activate online banking + share IBAN with university
        body: For getting refunds (e.g., dropped courses) you'll need the IBAN on file with the registrar.

  - title: Register with Studierendenwerk for housing + meals
    key: stu.studierendenwerk
    depends_on: [stu.enrolment]
    description: |
      Studierendenwerk Köln runs the dorms, mensa cards, and student support services.
      Even if you live off-campus, your student ID gives you discounted meals at the
      mensa — load it with the Studierendenwerk card.
    phase: settling
    urgency: low
    deadline_type: none
    documents_required:
      - Student ID
    links:
      - https://www.kstw.de/
    how_to_steps:
      - title: Set up your mensa card
        body: Either via your student ID directly (if your uni supports it) or by picking up a separate Studierendenwerk card.
      - title: Top it up online
        body: Most dorms have charging stations. Meals are €3–6 vs. €10+ outside.

  # Retired 2026-10-08: covered by core.rundfunkbeitrag.
  - title: Settle your Rundfunkbeitrag (or apply for exemption)
    key: stu.rundfunkbeitrag
    is_published: false
    depends_on: []
    description: |
      €18.36/month per household. If you receive BAföG you can apply for exemption
      and skip the fee entirely.
    phase: settling
    urgency: medium
    deadline_type: days_since_arrival
    deadline_days: 60
    documents_required: []
    links:
      - https://www.rundfunkbeitrag.de/welcome/english
    how_to_steps:
      - title: Register or be added to flatmates' account
        body: One Beitrag per shared household. Ask flatmates for their Beitragsnummer before signing up separately.
      - title: Apply for BAföG exemption if eligible
        body: BAföG recipients pay €0/month — submit your BAföG-Bescheid as proof.

  - title: 'Working as a student: 140 working days per year'
    key: stu.work_rules
    type: info
    depends_on: []
    review_status: approved
    jurisdiction: de-nrw-cologne
    reviewed_by: automated_source_check
    content_version: 2026-10-08.1
    source_verification: quote_checked
    legal_sources:
      - {kind: primary, label: '§16b AufenthG — Studium', url: 'https://www.gesetze-im-internet.de/aufenthg_2004/__16b.html'}
      - {kind: primary, label: '§4a AufenthG — Zugang zur Erwerbstätigkeit', url: 'https://www.gesetze-im-internet.de/aufenthg_2004/__4a.html'}
      - {kind: implementation, label: 'Stadt Köln · Aufenthaltserlaubnis zu Studienzwecken', url: 'https://www.stadt-koeln.de/service/produkte/00973/index.html'}
    claims:
      - id: work-account
        states: 140 working days per year
        source: '§16b AufenthG — Studium'
        quote: Die Aufenthaltserlaubnis berechtigt nach Maßgabe der folgenden Sätze nur zur Ausübung von Beschäftigungen, die insgesamt bis zu 140 Arbeitstage im Jahr nicht überschreiten dürfen (Arbeitstagekonto).
      - id: half-days
        states: days with up to four hours of work count as half days
        source: '§16b AufenthG — Studium'
        quote: Die Beschäftigungen können für jeden Tag, an dem die Arbeitszeit bis zu vier Stunden beträgt, als halber Arbeitstag
      - id: lecture-time-weeks
        states: if you work up to 20 hours in a lecture-time week, that week counts as two and a half days
        source: '§16b AufenthG — Studium'
        quote: während der Vorlesungszeit, wenn sie bis zu 20 Stunden je Kalenderwoche ausgeübt werden
      - id: outside-lecture-time
        states: outside lecture time each week counts as two and a half days however the hours are spread
        source: '§16b AufenthG — Studium'
        quote: außerhalb der Vorlesungszeit unabhängig von der Verteilung der Arbeitszeit als zweieinhalb Arbeitstage auf das Arbeitstagekonto angerechnet werden
      - id: weekly-choice
        states: For each calendar week the more favourable way of counting applies
        source: '§16b AufenthG — Studium'
        quote: Die Günstigkeitsprüfung nach Satz 3 erfolgt derart, dass einzeln für jede Kalenderwoche bestimmt wird
      - id: student-jobs
        states: Student jobs at a university or other research institution (studentische Nebentätigkeiten) don't count
        source: 'Stadt Köln · Aufenthaltserlaubnis zu Studienzwecken'
        quote: Studentische Nebentätigkeiten sind ohne zeitliche Beschränkungen erlaubt und werden nicht auf das Arbeitstagekonto angerechnet.
      - id: beyond-needs-permission
        states: Work beyond this account needs separate permission
        source: '§4a AufenthG — Zugang zur Erwerbstätigkeit'
        quote: Die Ausübung einer über das Verbot oder die Beschränkung hinausgehenden Erwerbstätigkeit bedarf der Erlaubnis.
    description: |
      Your student permit includes an Arbeitstagekonto: employment of up to
      140 working days per year. For each calendar week the more favourable way of counting applies:
      either days with up to four hours of work count as half days, or
      if you work up to 20 hours in a lecture-time week, that week counts as two and a half days;
      outside lecture time each week counts as two and a half days however the hours are spread.
      Student jobs at a university or other research institution (studentische Nebentätigkeiten) don't count.
      Work beyond this account needs separate permission, so keep a simple tally.
    phase: ongoing
    urgency: low
    deadline_type: none
    applies_if:
      citizenship_group: non_eu
    documents_required: []
    links:
      - https://www.stadt-koeln.de/service/produkte/00973/index.html
      - https://www.gesetze-im-internet.de/aufenthg_2004/__16b.html

  - title: 'After graduation: 18 months to find your job'
    key: stu.post_graduation
    type: info
    depends_on: []
    review_status: approved
    jurisdiction: de-nrw-cologne
    reviewed_by: automated_source_check
    content_version: 2026-10-08.1
    source_verification: quote_checked
    legal_sources:
      - {kind: primary, label: '§20 AufenthG — Arbeitsplatzsuche', url: 'https://www.gesetze-im-internet.de/aufenthg_2004/__20.html'}
      - {kind: implementation, label: 'Stadt Köln · Aufenthaltserlaubnis zu Studienzwecken', url: 'https://www.stadt-koeln.de/service/produkte/00973/index.html'}
    claims:
      - id: title-period
        states: 18 months to find your job
        source: '§20 AufenthG — Arbeitsplatzsuche'
        quote: Sie wird in den Fällen des Absatzes 1 Nummer 1 bis 4 für einen Zeitraum von bis zu 18 Monaten erteilt.
      - id: job-search-permit
        states: a residence permit for up to 18 months to look for a job (§20 AufenthG)
        source: '§20 AufenthG — Arbeitsplatzsuche'
        quote: Sie wird in den Fällen des Absatzes 1 Nummer 1 bis 4 für einen Zeitraum von bis zu 18 Monaten erteilt.
      - id: after-degree
        states: After successfully completing your degree in Germany
        source: '§20 AufenthG — Arbeitsplatzsuche'
        quote: wird einem Ausländer nach erfolgreichem Abschluss eines Studiums im Bundesgebiet im Rahmen eines Aufenthalts nach § 16b oder § 16c eine Aufenthaltserlaubnis erteilt
      - id: livelihood
        states: Your livelihood must be secured for the whole period
        source: 'Stadt Köln · Aufenthaltserlaubnis zu Studienzwecken'
        quote: Ihr Lebensunterhalt muss während der gesamten Dauer der Aufenthaltserlaubnis gesichert sein.
      - id: no-extension
        states: the permit cannot be extended
        source: 'Stadt Köln · Aufenthaltserlaubnis zu Studienzwecken'
        quote: Eine Verlängerung der Aufenthaltserlaubnis zur Arbeitsplatzsuche ist nicht möglich.
      - id: job-need-not-match
        states: The job you find does not have to match your degree
        source: 'Stadt Köln · Aufenthaltserlaubnis zu Studienzwecken'
        quote: Ab diesem Zeitpunkt muss die von Ihnen gefundene Arbeitsstelle keinen Zusammenhang mit Ihrem Studienabschluss erkennen lassen.
      - id: next-permit
        states: as long as you meet the requirements of a permit such as the one for skilled workers with an academic qualification or the EU Blue Card
        source: 'Stadt Köln · Aufenthaltserlaubnis zu Studienzwecken'
        quote: Es genügt, wenn Sie die Voraussetzungen zum Erhalt einer Aufenthaltserlaubnis als Fachkraft mit akademischer Ausbildung, zur Forschung, als Beamter oder die Voraussetzungen der Blauen Karte EU erfüllen.
      - id: self-employment
        states: You can also use the permit to prepare self-employment
        source: 'Stadt Köln · Aufenthaltserlaubnis zu Studienzwecken'
        quote: Die Aufenthaltserlaubnis kann weiterhin zur Vorbereitung einer Unternehmensgründung oder freiberuflichen Selbstständigkeit erteilt werden.
    description: |
      After successfully completing your degree in Germany, you can get
      a residence permit for up to 18 months to look for a job (§20 AufenthG).
      Your livelihood must be secured for the whole period, and the permit cannot be extended.
      The job you find does not have to match your degree,
      as long as you meet the requirements of a permit such as the one for skilled workers with an academic qualification or the EU Blue Card.
      You can also use the permit to prepare self-employment.
    phase: ongoing
    urgency: low
    deadline_type: none
    applies_if:
      citizenship_group: non_eu
    documents_required: []
    links:
      - https://www.stadt-koeln.de/service/produkte/00973/index.html
      - https://www.gesetze-im-internet.de/aufenthg_2004/__20.html

  - title: Apply for BAföG (if eligible)
    key: stu.bafoeg
    depends_on: [stu.enrolment]
    description: |
      Federal student aid for low-income students, including some non-EU students with
      certain residence titles. The amount depends on your housing, insurance, income,
      and family circumstances; use the official portal for the current calculation.
    phase: settling
    urgency: low
    deadline_type: none
    documents_required:
      - Immatrikulationsbescheinigung
      - Income statements (yours + parents')
      - Bank statements
      - Tax IDs
    links:
      - https://www.bafoeg-digital.de/
    how_to_steps:
      - title: Check eligibility
        body: Generally for German citizens, EU citizens, or non-EU students with at least 5 years of legal residence. The official portal has an eligibility quiz.
      - title: File online via bafoeg-digital.de
        body: Fully digital application; takes 6–10 weeks to process. Submit early in the semester to start receiving funds sooner.
      - title: Submit yearly updates
        body: BAföG is recalculated each year — keep income + enrolment docs ready every September.

