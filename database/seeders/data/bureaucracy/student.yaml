  - title: 'Working as a student: 140 working days per year'
    key: stu.work_rules
    type: info
    depends_on: []
    review_status: approved
    jurisdiction: de-nrw-cologne
    reviewed_by: automated_source_check
    content_version: 2026-10-08.1
    source_verification: quote_checked
    legal_sources:
      - {kind: primary, label: '§16b AufenthG — Studium', url: 'https://www.gesetze-im-internet.de/aufenthg_2004/__16b.html'}
      - {kind: primary, label: '§4a AufenthG — Zugang zur Erwerbstätigkeit', url: 'https://www.gesetze-im-internet.de/aufenthg_2004/__4a.html'}
      - {kind: implementation, label: 'Stadt Köln · Aufenthaltserlaubnis zu Studienzwecken', url: 'https://www.stadt-koeln.de/service/produkte/00973/index.html'}
    claims:
      - id: work-account
        states: 140 working days per year
        source: '§16b AufenthG — Studium'
        quote: Die Aufenthaltserlaubnis berechtigt nach Maßgabe der folgenden Sätze nur zur Ausübung von Beschäftigungen, die insgesamt bis zu 140 Arbeitstage im Jahr nicht überschreiten dürfen (Arbeitstagekonto).
      - id: half-days
        states: days with up to four hours of work count as half days
        source: '§16b AufenthG — Studium'
        quote: Die Beschäftigungen können für jeden Tag, an dem die Arbeitszeit bis zu vier Stunden beträgt, als halber Arbeitstag
      - id: lecture-time-weeks
        states: if you work up to 20 hours in a lecture-time week, that week counts as two and a half days
        source: '§16b AufenthG — Studium'
        quote: während der Vorlesungszeit, wenn sie bis zu 20 Stunden je Kalenderwoche ausgeübt werden
      - id: outside-lecture-time
        states: outside lecture time each week counts as two and a half days however the hours are spread
        source: '§16b AufenthG — Studium'
        quote: außerhalb der Vorlesungszeit unabhängig von der Verteilung der Arbeitszeit als zweieinhalb Arbeitstage auf das Arbeitstagekonto angerechnet werden
      - id: weekly-choice
        states: For each calendar week the more favourable way of counting applies
        source: '§16b AufenthG — Studium'
        quote: Die Günstigkeitsprüfung nach Satz 3 erfolgt derart, dass einzeln für jede Kalenderwoche bestimmt wird
      - id: student-jobs
        states: Student jobs at a university or other research institution (studentische Nebentätigkeiten) don't count
        source: 'Stadt Köln · Aufenthaltserlaubnis zu Studienzwecken'
        quote: Studentische Nebentätigkeiten sind ohne zeitliche Beschränkungen erlaubt und werden nicht auf das Arbeitstagekonto angerechnet.
      - id: beyond-needs-permission
        states: Work beyond this account needs separate permission
        source: '§4a AufenthG — Zugang zur Erwerbstätigkeit'
        quote: Die Ausübung einer über das Verbot oder die Beschränkung hinausgehenden Erwerbstätigkeit bedarf der Erlaubnis.
    description: |
      Your student permit includes an Arbeitstagekonto: employment of up to
      140 working days per year. For each calendar week the more favourable way of counting applies:
      either days with up to four hours of work count as half days, or
      if you work up to 20 hours in a lecture-time week, that week counts as two and a half days;
      outside lecture time each week counts as two and a half days however the hours are spread.
      Student jobs at a university or other research institution (studentische Nebentätigkeiten) don't count.
      Work beyond this account needs separate permission, so keep a simple tally.
    phase: ongoing
    urgency: low
    deadline_type: none
    applies_if:
      citizenship_group: non_eu
    documents_required: []
    links:
      - https://www.stadt-koeln.de/service/produkte/00973/index.html
      - https://www.gesetze-im-internet.de/aufenthg_2004/__16b.html

  - title: 'After graduation: 18 months to find your job'
    key: stu.post_graduation
    type: info
    depends_on: []
    review_status: approved
    jurisdiction: de-nrw-cologne
    reviewed_by: automated_source_check
    content_version: 2026-10-30.1
    source_verification: quote_checked
    legal_sources:
      - {kind: primary, label: '§20 AufenthG — Arbeitsplatzsuche', url: 'https://www.gesetze-im-internet.de/aufenthg_2004/__20.html'}
      - {kind: implementation, label: 'Stadt Köln · Aufenthaltserlaubnis zu Studienzwecken', url: 'https://www.stadt-koeln.de/service/produkte/00973/index.html'}
      - {kind: primary, label: '§81 AufenthG — Beantragung des Aufenthaltstitels', url: 'https://www.gesetze-im-internet.de/aufenthg_2004/__81.html'}
    claims:
      - id: apply-before-expiry
        states: If you apply before your student permit expires, it stays valid until the Ausländerbehörde decides
        source: '§81 AufenthG — Beantragung des Aufenthaltstitels'
        quote: Beantragt ein Ausländer vor Ablauf seines Aufenthaltstitels dessen Verlängerung oder die Erteilung eines anderen Aufenthaltstitels, gilt der bisherige Aufenthaltstitel vom Zeitpunkt seines Ablaufs bis zur Entscheidung der Ausländerbehörde als fortbestehend
      - id: title-period
        states: 18 months to find your job
        source: '§20 AufenthG — Arbeitsplatzsuche'
        quote: Sie wird in den Fällen des Absatzes 1 Nummer 1 bis 4 für einen Zeitraum von bis zu 18 Monaten erteilt.
      - id: job-search-permit
        states: a residence permit for up to 18 months to look for a job (§20 AufenthG)
        source: '§20 AufenthG — Arbeitsplatzsuche'
        quote: Sie wird in den Fällen des Absatzes 1 Nummer 1 bis 4 für einen Zeitraum von bis zu 18 Monaten erteilt.
      - id: after-degree
        states: After successfully completing your degree in Germany
        source: '§20 AufenthG — Arbeitsplatzsuche'
        quote: wird einem Ausländer nach erfolgreichem Abschluss eines Studiums im Bundesgebiet im Rahmen eines Aufenthalts nach § 16b oder § 16c eine Aufenthaltserlaubnis erteilt
      - id: livelihood
        states: Your livelihood must be secured for the whole period
        source: 'Stadt Köln · Aufenthaltserlaubnis zu Studienzwecken'
        quote: Ihr Lebensunterhalt muss während der gesamten Dauer der Aufenthaltserlaubnis gesichert sein.
      - id: no-extension
        states: the permit cannot be extended
        source: 'Stadt Köln · Aufenthaltserlaubnis zu Studienzwecken'
        quote: Eine Verlängerung der Aufenthaltserlaubnis zur Arbeitsplatzsuche ist nicht möglich.
      - id: job-need-not-match
        states: The job you find does not have to match your degree
        source: 'Stadt Köln · Aufenthaltserlaubnis zu Studienzwecken'
        quote: Ab diesem Zeitpunkt muss die von Ihnen gefundene Arbeitsstelle keinen Zusammenhang mit Ihrem Studienabschluss erkennen lassen.
      - id: next-permit
        states: as long as you meet the requirements of a permit such as the one for skilled workers with an academic qualification or the EU Blue Card
        source: 'Stadt Köln · Aufenthaltserlaubnis zu Studienzwecken'
        quote: Es genügt, wenn Sie die Voraussetzungen zum Erhalt einer Aufenthaltserlaubnis als Fachkraft mit akademischer Ausbildung, zur Forschung, als Beamter oder die Voraussetzungen der Blauen Karte EU erfüllen.
      - id: self-employment
        states: You can also use the permit to prepare self-employment
        source: 'Stadt Köln · Aufenthaltserlaubnis zu Studienzwecken'
        quote: Die Aufenthaltserlaubnis kann weiterhin zur Vorbereitung einer Unternehmensgründung oder freiberuflichen Selbstständigkeit erteilt werden.
    description: |
      After successfully completing your degree in Germany, you can get
      a residence permit for up to 18 months to look for a job (§20 AufenthG).
      Your livelihood must be secured for the whole period, and the permit cannot be extended.
      The job you find does not have to match your degree,
      as long as you meet the requirements of a permit such as the one for skilled workers with an academic qualification or the EU Blue Card.
      You can also use the permit to prepare self-employment.
      If you apply before your student permit expires, it stays valid until the Ausländerbehörde decides.
    phase: ongoing
    urgency: medium
    deadline_type: none
    applies_if:
      citizenship_group: non_eu
    documents_required: []
    links:
      - https://www.stadt-koeln.de/service/produkte/00973/index.html
      - https://www.gesetze-im-internet.de/aufenthg_2004/__20.html

  - title: Apply for BAföG (if eligible)
    key: stu.bafoeg
    depends_on: [stu.enrolment]
    # Source-checked (claims verified daily), not yet mapped to a Paperwork process, so not approved.
    review_status: legacy
    jurisdiction: de-nrw-cologne
    reviewed_by: automated_source_check
    content_version: 2026-10-30.1
    source_verification: quote_checked
    legal_sources:
      - {kind: primary, label: '§8 BAföG — Staatsangehörigkeit', url: 'https://www.gesetze-im-internet.de/baf_g/__8.html'}
      - {kind: primary, label: '§15 BAföG — Förderungsdauer', url: 'https://www.gesetze-im-internet.de/baf_g/__15.html'}
      - {kind: primary, label: '§46 BAföG — Antrag', url: 'https://www.gesetze-im-internet.de/baf_g/__46.html'}
      - {kind: primary, label: '§50 BAföG — Bescheid', url: 'https://www.gesetze-im-internet.de/baf_g/__50.html'}
    claims:
      - id: federal-support
        states: federal support for your education
        source: '§8 BAföG — Staatsangehörigkeit'
        quote: Bundesgesetz über individuelle Förderung der Ausbildung
      - id: need-minus-income
        states: your need, minus your own income and assets and your parents' (and spouse's or partner's) income
        source: '§50 BAföG — Bescheid'
        quote: die Höhe der auf den Bedarf angerechneten Beträge von Einkommen und Vermögen des Auszubildenden sowie vom Einkommen seines Ehegatten oder Lebenspartners und seiner Eltern
      - id: germans
        states: German citizens qualify
        source: '§8 BAföG — Staatsangehörigkeit'
        quote: Deutschen im Sinne des Grundgesetzes
      - id: eu-permanent-residence
        states: with a right of permanent residence
        source: '§8 BAföG — Staatsangehörigkeit'
        quote: die ein Recht auf Daueraufenthalt im Sinne des Freizügigkeitsgesetzes/EU besitzen
      - id: eu-workers
        states: as workers or self-employed people
        source: '§8 BAföG — Staatsangehörigkeit'
        quote: als Arbeitnehmer oder Selbständige unionsrechtlich freizügigkeitsberechtigt sind
      - id: settlement-permit
        states: Non-EU citizens qualify with a settlement permit or an EU long-term residence permit
        source: '§8 BAföG — Staatsangehörigkeit'
        quote: Ausländern, die eine Niederlassungserlaubnis oder eine Erlaubnis zum Daueraufenthalt – EU nach dem Aufenthaltsgesetz besitzen
      - id: other-permits
        states: If you live in Germany permanently, certain other residence permits listed in the law also count
        source: '§8 BAföG — Staatsangehörigkeit'
        quote: Anderen Ausländern wird Ausbildungsförderung geleistet, wenn sie ihren ständigen Wohnsitz im Inland haben
      - id: fifteen-months
        states: some only after 15 months in Germany
        source: '§8 BAföG — Staatsangehörigkeit'
        quote: sich seit mindestens 15 Monaten in Deutschland ununterbrochen rechtmäßig, gestattet oder geduldet aufhalten
      - id: own-five-years-work
        states: you lived in Germany for a total of five years and worked lawfully before your course
        source: '§8 BAföG — Staatsangehörigkeit'
        quote: sie selbst sich vor Beginn des förderungsfähigen Teils des Ausbildungsabschnitts insgesamt fünf Jahre im Inland aufgehalten haben und rechtmäßig erwerbstätig gewesen sind
      - id: parent-three-of-six-years
        states: a parent lived and worked lawfully here for a total of three years during the last six years before it
        source: '§8 BAföG — Staatsangehörigkeit'
        quote: zumindest ein Elternteil während der letzten sechs Jahre vor Beginn des förderungsfähigen Teils des Ausbildungsabschnitts sich insgesamt drei Jahre im Inland aufgehalten hat und rechtmäßig erwerbstätig gewesen ist
      - id: section-8
        states: §8 BAföG
        source: '§8 BAföG — Staatsangehörigkeit'
        quote: Ausbildungsförderung wird geleistet
      - id: paid-from-month
        states: BAföG is paid from the start of the month you start your course, but at the earliest from the start of the month you apply
        source: '§15 BAföG — Förderungsdauer'
        quote: Ausbildungsförderung wird vom Beginn des Monats an geleistet, in dem die Ausbildung aufgenommen wird, frühestens jedoch vom Beginn des Antragsmonats an.
      - id: no-back-pay
        states: Months before you apply are not paid
        source: '§15 BAföG — Förderungsdauer'
        quote: frühestens jedoch vom Beginn des Antragsmonats an
      - id: section-15
        states: §15 BAföG
        source: '§15 BAföG — Förderungsdauer'
        quote: Ausbildungsförderung wird vom Beginn des Monats an geleistet
      - id: written-or-online
        states: Apply in writing or online
        source: '§46 BAföG — Antrag'
        quote: auf schriftlichen oder elektronischen Antrag entschieden
      - id: responsible-office
        states: to the BAföG office (Amt für Ausbildungsförderung) responsible for you
        source: '§46 BAföG — Antrag'
        quote: Der Antrag ist an das örtlich zuständige Amt für Ausbildungsförderung zu richten.
      - id: official-forms
        states: using the official forms
        source: '§46 BAföG — Antrag'
        quote: Die zur Feststellung des Anspruchs erforderlichen Tatsachen sind auf den Formblättern anzugeben
      - id: one-year-approval
        states: BAföG is usually granted for one year at a time
        source: '§50 BAföG — Bescheid'
        quote: Über die Ausbildungsförderung wird in der Regel für ein Jahr (Bewilligungszeitraum) entschieden.
      - id: renew-two-months-before
        states: Send your complete new application with the required proof at least two calendar months before your approval period ends
        source: '§50 BAföG — Bescheid'
        quote: wenn der neue Antrag im Wesentlichen vollständig zwei Kalendermonate vor Ablauf des Bewilligungszeitraums gestellt war und ihm die erforderlichen Nachweise beigefügt wurden
      - id: payments-continue
        states: you keep getting payments based on the old decision, but you may have to pay some back
        source: '§50 BAföG — Bescheid'
        quote: nach Maßgabe des früheren Bewilligungsbescheids unter dem Vorbehalt der Rückforderung geleistet
    description: |
      BAföG is federal support for your education while you study. Not every student qualifies, so check the conditions below first.
      The amount depends on your need, minus your own income and assets and your parents' (and spouse's or partner's) income.
    phase: settling
    urgency: high
    deadline_type: none
    documents_required: []
    links:
      - https://www.gesetze-im-internet.de/baf_g/__8.html
      - https://www.bafoeg-digital.de/
    how_to_steps:
      - title: Check eligibility
        body: |
          - German citizens qualify.
          - EU citizens qualify in certain cases, for example with a right of permanent residence or as workers or self-employed people.
          - Non-EU citizens qualify with a settlement permit or an EU long-term residence permit.
          - If you live in Germany permanently, certain other residence permits listed in the law also count, some only after 15 months in Germany.
          - Otherwise you qualify only if you lived in Germany for a total of five years and worked lawfully before your course, or if a parent lived and worked lawfully here for a total of three years during the last six years before it (§8 BAföG).
      - title: Apply before or in the month your course starts
        body: BAföG is paid from the start of the month you start your course, but at the earliest from the start of the month you apply (§15 BAföG). Months before you apply are not paid, so don't wait.
      - title: Send your application to the BAföG office
        body: Apply in writing or online to the BAföG office (Amt für Ausbildungsförderung) responsible for you, using the official forms.
      - title: Apply again each year
        body: BAföG is usually granted for one year at a time (the approval period, Bewilligungszeitraum). Send your complete new application with the required proof at least two calendar months before your approval period ends. Then, if the new decision is late, you keep getting payments based on the old decision, but you may have to pay some back.

  - title: 'Your first tax return: you can file one yourself'
    key: stu.tax_return
    type: info
    depends_on: []
    review_status: approved
    jurisdiction: de-nrw-cologne
    reviewed_by: automated_source_check
    content_version: 2026-10-30.1
    source_verification: quote_checked
    legal_sources:
      - {kind: primary, label: '§46 EStG — Veranlagung bei Einkünften aus nichtselbständiger Arbeit', url: 'https://www.gesetze-im-internet.de/estg/__46.html'}
      - {kind: primary, label: '§169 AO — Festsetzungsfrist', url: 'https://www.gesetze-im-internet.de/ao_1977/__169.html'}
    claims:
      - id: time-limit
        states: the time limit for a tax assessment is four years (§169 AO)
        source: '§169 AO — Festsetzungsfrist'
        quote: vier Jahre für Steuern und Steuervergütungen
      - id: mandatory-cases
        states: §46 EStG lists cases in which an assessment is required
        source: '§46 EStG — Veranlagung bei Einkünften aus nichtselbständiger Arbeit'
        quote: so wird eine Veranlagung nur durchgeführt
      - id: several-employers
        states: for example if you were paid by several employers at the same time
        source: '§46 EStG — Veranlagung bei Einkünften aus nichtselbständiger Arbeit'
        quote: wenn der Steuerpflichtige nebeneinander von mehreren Arbeitgebern Arbeitslohn bezogen hat
      - id: voluntary-assessment
        states: you can still apply for an assessment yourself, in particular to have the withheld wage tax credited against your income tax
        source: '§46 EStG — Veranlagung bei Einkünften aus nichtselbständiger Arbeit'
        quote: wenn die Veranlagung beantragt wird, insbesondere zur Anrechnung von Lohnsteuer auf die Einkommensteuer
      - id: by-return
        states: You apply by filing an income tax return
        source: '§46 EStG — Veranlagung bei Einkünften aus nichtselbständiger Arbeit'
        quote: Der Antrag ist durch Abgabe einer Einkommensteuererklärung zu stellen
    description: |
      Had wage tax deducted from your pay, for example on a Werkstudent contract?
      §46 EStG lists cases in which an assessment is required,
      for example if you were paid by several employers at the same time. Otherwise
      you can still apply for an assessment yourself, in particular to have the withheld wage tax credited against your income tax.
      You apply by filing an income tax return. Don't leave it too long: the time limit for a tax assessment is four years (§169 AO).
    phase: ongoing
    urgency: low
    deadline_type: none
    documents_required: []
    links:
      - https://www.gesetze-im-internet.de/estg/__46.html
      - https://www.elster.de/eportal/start
