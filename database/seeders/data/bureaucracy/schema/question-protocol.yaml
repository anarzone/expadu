# Minimal orientation; remaining questions require a current reviewed dependency.
orientation:
  - {fact_key: citizenship_group, when: []}
  - {fact_key: arrival_planned, when: []}
  - fact_key: current_residence_title
    when:
      - {citizenship_group: non_eu, arrival_planned: false}
  - fact_key: visa_expires_at
    when:
      - {current_residence_title: national_d_visa}
  - fact_key: residence_title_expires_at
    when:
      - {current_residence_title: [standard_work_permit, blue_card, family_reunification]}
