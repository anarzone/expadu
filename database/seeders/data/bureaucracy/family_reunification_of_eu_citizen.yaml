# Non-EU family member of an EU citizen (FreizügG — Aufenthaltskarte).
# Freedom-of-movement law, not the AufenthG: easier, fee-free, declaratory.
# Federal rules (◐); Köln intake flow unconfirmed → typical-requirements
# framing, no verified badge. See docs/bureaucracy-sources.md (Case 10).
situation: family_reunification_of_eu_citizen

tasks:
  - title: Get your Aufenthaltskarte (family member of an EU citizen)
    key: fameu.aufenthaltskarte
    depends_on: []
    description: |
      Contact the Bezirksausländeramt (district foreigners' office) for the district you live in:
      an in-person appointment is required within the first three months after entry.
      If you meet the conditions, Cologne issues you an Aufenthaltskarte, which should be valid for
      five years. Cologne lists a fee of €22.80 for under-24s and €37 for over-24s.
      Who qualifies: as the non-EU family member of an EU citizen who has freedom of movement,
      you can come to Germany together with them. This applies to spouses, registered partners and
      children under 21. Older children, grandchildren, parents and grandparents can also come
      if the EU citizen is financially supporting them. If the EU citizen is studying, a special
      rule applies; check Cologne's page.
    phase: first_30_days
    urgency: critical
    deadline_type: days_since_arrival
    deadline_days: 89
    applies_if:
      entry_mode: [d_visa, visa_free]
    booking_service_key: auslaenderbehoerde
    documents_required: []
    links:
      - https://www.stadt-koeln.de/service/produkt/freizuegigkeit-angehoerige-der-europaeischen-union
      - https://www.gesetze-im-internet.de/freiz_gg_eu_2004/__5.html
    how_to_steps:
      - title: 'Before you travel: check if you need a visa'
        body: Depending on your nationality, you may need a family-reunification visa to enter Germany.
      - title: Request an appointment with your Bezirksausländeramt
        body: You can request the appointment online through Cologne's page. Say you are applying for an Aufenthaltskarte as the family member of an EU citizen. Ask which documents to bring.
        link: https://www.stadt-koeln.de/service/produkt/freizuegigkeit-angehoerige-der-europaeischen-union
      - title: Keep the confirmation you receive
        body: Once you have given the required information, you receive a certificate confirming it straight away. The card itself is issued within six months.
