  - title: 'Apply for permanent residency after five years (§9)'
    key: fam.ne_apply
    depends_on: []
    description: |
      Once you have held a residence permit for at least five years, you can apply for
      the general Niederlassungserlaubnis (permanent residence). Cologne lists these
      conditions: you are at least 18; your livelihood is secured without benefits such
      as Bürgergeld; at least 60 months of mandatory or voluntary pension contributions
      (in a marriage, your spouse's contributions can count); health insurance; B1
      German; basic knowledge of the legal and social order, usually shown with the
      "Leben in Deutschland" test; and enough living space: 12 square metres for each
      family member aged six or older and 10 square metres for each child under six.
      Fee: €113 (Turkish citizens with association rights: €27.60 up to 24 years, €46
      from 24 years). Apply online, then attend an appointment in person at your
      Bezirksausländeramt.
    phase: ongoing
    urgency: low
    deadline_type: none
    applies_if:
      current_residence_title: family_reunification
      family_residence_permit_held_since: {at_least_months_ago: 60}
    booking_service_key: auslaenderbehoerde
    documents_required:
      - label: Valid national passport and digital biometric photo
      - label: B1 German certificate
      - label: Proof of basic knowledge of the legal and social order
        note: Usually the "Leben in Deutschland" test, or a school-leaving certificate from at least a Mittelschule.
      - label: Current pension record (Rentenversicherungsverlauf)
        note: Available from the Deutsche Rentenversicherung.
      - label: Employment contract and payslips for the last three months
      - label: Rental contract plus proof of current monthly housing costs (Warmmiete)
      - label: Proof of health insurance, if you are self-employed
        from: core.health_insurance
    links:
      - https://www.stadt-koeln.de/service/produkt/allgemeine-niederlassungserlaubnis
    how_to_steps:
      - title: Book an appointment at your Bezirksausländeramt
        body: You must apply in person. Bring all documents; Cologne may ask for more at the appointment and give you a further date.
    review_status: approved
    jurisdiction: de-nrw-cologne
    reviewed_by: automated_source_check
    content_version: 2026-10-08.1
    source_verification: quote_checked
    legal_sources:
      - {kind: primary, label: '§9 AufenthG', url: 'https://www.gesetze-im-internet.de/aufenthg_2004/__9.html'}
      - {kind: implementation, label: 'Stadt Köln · general settlement permit', url: 'https://www.stadt-koeln.de/service/produkt/allgemeine-niederlassungserlaubnis'}
    claims:
      - id: title-five-years
        states: 'Apply for permanent residency after five years (§9)'
        source: '§9 AufenthG'
        quote: er seit fünf Jahren die Aufenthaltserlaubnis besitzt
      - id: five-years
        states: held a residence permit for at least five years
        source: 'Stadt Köln · general settlement permit'
        quote: Sie sind seit mindestens fünf Jahren im Besitz einer Aufenthaltserlaubnis.
      - id: age
        states: you are at least 18
        source: 'Stadt Köln · general settlement permit'
        quote: Sie haben das 18. Lebensjahr vollendet.
      - id: pension
        states: at least 60 months of mandatory or voluntary pension contributions
        source: 'Stadt Köln · general settlement permit'
        quote: Sie können mindestens 60 Monate Pflichtbeiträge oder freiwillige Beiträge zur gesetzlichen Rentenversicherungen nachweisen.
      - id: spouse-pension
        states: in a marriage, your spouse's contributions can count
        source: 'Stadt Köln · general settlement permit'
        quote: Bei einer familiären Lebensgemeinschaft in einer Ehe oder gleichgeschlechtlichen Lebenspartnerschaft können die Nachweise zur Altersvorsorge auch durch den*die Ehegatt*in oder Lebenspartner*in erbracht werden.
      - id: b1
