    key: case.family.renew.continuing_household
    conflicts_with: [case.family.independent_after_separation]
    description: |
      Because the marital household continues, prepare the family-permit renewal and
      file it before the current residence title expires. Section 30(3) says the permit
      may be extended while the marital household continues; it is not an automatic
      entitlement to approval. A timely application can preserve the existing title's
      effect while the authority decides, subject to §81 and its exceptions.
