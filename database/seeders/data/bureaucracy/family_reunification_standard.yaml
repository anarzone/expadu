  - title: Review an independent residence right after separation
    key: case.family.independent_after_separation
    type: info
    conflicts_with: [case.family.renew.continuing_household]
    description: |
      If the marital household (living together as a married couple) has ended, §31—not the continuing-household renewal rule—may apply.
      - It extends your residence permit for one year as an independent right of residence, no longer tied to family reunification.
      - Apply for the extension before your current permit expires: if you apply in time, your current permit counts as continuing until the immigration office decides (§81).
      - One condition is that the marital household lawfully existed in Germany for at least three years, or that your spouse died while the marital household existed in Germany.
      - If your spouse holds an EU Blue Card, it is enough that the marital household lasted lawfully at least two years in Germany after at least one year in another EU member state.
      - The three years are not required where this is needed to avoid particular hardship, unless extending your spouse's own permit is excluded.
      - This extension is not available if your spouse's own permit cannot be extended or turned into permanent residence because a legal rule on its purpose, or a condition attached to it, rules this out.
      How long your current permit has run does not tell you whether you qualify; get advice on your case before relying on this rule.
    phase: options
    urgency: high
    deadline_type: fact_date
    deadline_fact_key: residence_title_expires_at
    applies_if:
      current_residence_title: family_reunification
      case_goal: {in: [renew_current_title, understand_options]}
      marital_household_continues: false
    links:
      - https://www.gesetze-im-internet.de/aufenthg_2004/__31.html
      - https://www.gesetze-im-internet.de/aufenthg_2004/__81.html
    review_status: approved
    jurisdiction: de-nrw-cologne
    reviewed_by: automated_source_check
    content_version: 2026-10-30.1
    source_verification: quote_checked
    legal_sources:
      - {kind: primary, label: '§31 AufenthG', url: 'https://www.gesetze-im-internet.de/aufenthg_2004/__31.html'}
      - {kind: primary, label: '§81 AufenthG', url: 'https://www.gesetze-im-internet.de/aufenthg_2004/__81.html'}
    claims:
      - id: independent-right
        states: the marital household (living together as a married couple) has ended, §31
        source: '§31 AufenthG'
        quote: Die Aufenthaltserlaubnis des Ehegatten wird im Falle der Aufhebung der ehelichen Lebensgemeinschaft als eigenständiges, vom Zweck des Familiennachzugs unabhängiges Aufenthaltsrecht für ein Jahr verlängert
      - id: one-year-extension
        states: extends your residence permit for one year as an independent right of residence, no longer tied to family reunification
        source: '§31 AufenthG'
        quote: Die Aufenthaltserlaubnis des Ehegatten wird im Falle der Aufhebung der ehelichen Lebensgemeinschaft als eigenständiges, vom Zweck des Familiennachzugs unabhängiges Aufenthaltsrecht für ein Jahr verlängert
      - id: apply-in-time
        states: 'Apply for the extension before your current permit expires: if you apply in time, your current permit counts as continuing until the immigration office decides (§81)'
        source: '§81 AufenthG'
        quote: Beantragt ein Ausländer vor Ablauf seines Aufenthaltstitels dessen Verlängerung oder die Erteilung eines anderen Aufenthaltstitels, gilt der bisherige Aufenthaltstitel vom Zeitpunkt seines Ablaufs bis zur Entscheidung der Ausländerbehörde als fortbestehend.
      - id: three-years
        states: the marital household lawfully existed in Germany for at least three years
        source: '§31 AufenthG'
        quote: die eheliche Lebensgemeinschaft seit mindestens drei Jahren rechtmäßig im Bundesgebiet bestanden hat
      - id: spouse-died
        states: your spouse died while the marital household existed in Germany
        source: '§31 AufenthG'
        quote: der Ausländer gestorben ist, während die eheliche Lebensgemeinschaft im Bundesgebiet bestand
      - id: blue-card-period
        states: If your spouse holds an EU Blue Card, it is enough that the marital household lasted lawfully at least two years in Germany after at least one year in another EU member state
        source: '§31 AufenthG'
        quote: Ist der Ausländer im Besitz einer Blauen Karte EU, gilt Absatz 1 für den Ehegatten des Ausländers mit der Maßgabe, dass der in Absatz 1 Satz 1 Nummer 1 genannte Zeitraum auch als erfüllt gilt, wenn die eheliche Lebensgemeinschaft seit mindestens zwei Jahren rechtmäßig im Bundesgebiet und zuvor bereits mindestens ein Jahr in einem anderen Mitgliedstaat der Europäischen Union bestanden hat.
      - id: hardship-three-years
        states: The three years
        source: '§31 AufenthG'
        quote: die eheliche Lebensgemeinschaft seit mindestens drei Jahren rechtmäßig im Bundesgebiet bestanden hat
      - id: hardship
        states: 'are not required where this is needed to avoid particular hardship, unless extending your spouse''s own permit is excluded'
        source: '§31 AufenthG'
        quote: soweit es zur Vermeidung einer besonderen Härte erforderlich ist, dem Ehegatten den weiteren Aufenthalt zu ermöglichen, es sei denn, für den Ausländer ist die Verlängerung der Aufenthaltserlaubnis ausgeschlossen
      - id: exclusion
        states: 'This extension is not available if your spouse''s own permit cannot be extended or turned into permanent residence because a legal rule on its purpose, or a condition attached to it, rules this out'
        source: '§31 AufenthG'
        quote: Satz 1 ist nicht anzuwenden, wenn die Aufenthaltserlaubnis des Ausländers nicht verlängert oder dem Ausländer keine Niederlassungserlaubnis oder Erlaubnis zum Daueraufenthalt – EU erteilt werden darf, weil dies durch eine Rechtsnorm wegen des Zwecks des Aufenthalts oder durch eine Nebenbestimmung zur Aufenthaltserlaubnis
