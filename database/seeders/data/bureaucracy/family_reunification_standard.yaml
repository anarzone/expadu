# Joining a non-EU sponsor (§§29–32 AufenthG). Source: stadt-koeln.de
# product 20335, fetched 2026-06 — see docs/bureaucracy-sources.md (Case 7).
situation: family_reunification

tasks:
  # Visa-free entrants only: D-visa entrants are covered by
  # case.family.first_permit.prepare (deadline = visa expiry).
  - title: Apply for the joining spouse's permit within 90 days of visa-free entry
    key: fam.submit_application
    depends_on: []
    description: |
      As the spouse of a non-EU national you need your own residence permit. Cologne
      lists the usual conditions: your partner holds a residence title and lives in
      Germany, you have basic German (A1), your shared main residence is in Germany,
      both of you are at least 18, and your livelihood is fully secured without benefits
      such as Bürgergeld. If your partner holds an EU Blue Card, the language requirement
      does not apply. If you entered visa-free under §41 AufenthV (for example as a citizen of
      Australia, Canada, Japan, the UK or the USA), apply within 90 days of entry. If you
      entered visa-free on any other basis, ask the Ausländerbehörde whether you can apply
      from inside Germany.
    phase: first_30_days
    urgency: critical
    deadline_type: permit_window
    deadline_days: 90
    applies_if:
      entry_mode: visa_free
    documents_required:
      - label: Cologne's online application for a family-reunification residence permit
        note: Upload scans of the documents listed on the appointment task.
      - label: A1 German certificate for the joining spouse
        note: Cologne accepts certificates from the Goethe-Institut, TestDaF-Institut or telc, for example the "Deutsch-Test für Zuwanderer".
        tone: warn
    links:
      - https://www.stadt-koeln.de/service/produkte/20335/index.html
    how_to_steps:
      - title: File the online application
        body: Cologne reviews the digital application and sends an appointment invitation once it can issue the permit.
        link: https://www.stadt-koeln.de/service/produkte/20335/index.html
    review_status: approved
    jurisdiction: de-nrw-cologne
    reviewed_by: automated_source_check
    content_version: 2026-10-08.1
    source_verification: quote_checked
    legal_sources:
      - {kind: primary, label: '§30 AufenthG', url: 'https://www.gesetze-im-internet.de/aufenthg_2004/__30.html'}
      - {kind: primary, label: '§41 AufenthV', url: 'https://www.gesetze-im-internet.de/aufenthv/__41.html'}
      - {kind: implementation, label: 'Stadt Köln · family reunification', url: 'https://www.stadt-koeln.de/service/produkte/20335/index.html'}
    claims:
      - id: title-window
        states: Apply for the joining spouse's permit within 90 days of visa-free entry
        source: '§41 AufenthV'
        quote: Ein erforderlicher Aufenthaltstitel ist innerhalb von 90 Tagen nach der Einreise zu beantragen.
      - id: own-permit
        states: you need your own residence permit
        source: '§30 AufenthG'
        quote: Dem Ehegatten eines Ausländers ist eine Aufenthaltserlaubnis zu erteilen, wenn
      - id: sponsor-title
