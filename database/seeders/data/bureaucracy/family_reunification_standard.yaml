# Joining a non-EU sponsor (§§29–32 AufenthG). Source: stadt-koeln.de
# product 20335, fetched 2026-06 — see docs/bureaucracy-sources.md (Case 7).
situation: family_reunification

tasks:
  # Visa-free entrants only: D-visa entrants are covered by
  # case.family.first_permit.prepare (deadline = visa expiry).
  - title: Apply for the joining spouse's permit within 90 days of visa-free entry
    key: fam.submit_application
    depends_on: []
    description: |
      As the spouse of a non-EU national you need your own residence permit.
      Cologne lists the usual conditions: your partner holds a residence title and lives in Germany, you have basic German (A1), your shared main residence is in Germany, both of you are at least 18, and your livelihood is fully secured without benefits such as Bürgergeld.
      The language requirement does not apply in several cases listed in §30 AufenthG, for example:
      It does not apply if your partner holds an EU Blue Card or an ICT Card.
      It does not apply if your partner holds a skilled-worker permit under §18a or §18b AufenthG. Check your partner's residence permit, or ask the Ausländerbehörde which section it was issued under.
      It does not apply if your partner may enter visa-free even for long stays because of their nationality, for example as a US or Canadian citizen.
      It does not apply if the authorities find you clearly need little integration support.
      Ask the Ausländerbehörde whether an exemption applies to you.
      If you entered visa-free under §41 AufenthV (for example as a citizen of Australia, Canada, Japan, the UK or the USA), apply within 90 days of entry.
      If you entered visa-free on any other basis, ask the Ausländerbehörde whether you can apply from inside Germany.
    phase: first_30_days
    urgency: critical
    deadline_type: permit_window
    deadline_days: 90
    applies_if:
      entry_mode: visa_free
    documents_required:
      - label: Cologne's online application for a family-reunification residence permit
        note: If you have no BundID, you can continue without logging in. Cologne may ask for further documents in individual cases.
      - label: A recognised, valid national passport
      - label: A digital biometric passport photo
      - label: Marriage certificate (first application only)
        note: Foreign certificates need a certified translation and, depending on the country, an apostille or legalisation.
        tone: warn
      - label: Rental contract with proof of the current rent
        note: For example a recent bank statement. If you own your home, upload the purchase contract stating its size in square metres.
      - label: A1 German certificate for the joining spouse
        note: Cologne accepts certificates from the Goethe-Institut, TestDaF-Institut or telc, for example the "Deutsch-Test für Zuwanderer". Not needed if one of the language exemptions in the description applies.
        tone: warn
      - label: Proof that your livelihood is fully secured
        note: 'Needed for every working family member. Employees provide payslips for the last three months. Self-employed or freelance: your latest income tax assessment and a current profit and loss statement from your tax adviser, plus, where applicable, your trade registration and proof of pension or life insurance.'
      - label: Proof of full health insurance
        note: Only if you do not have statutory (public) health insurance.
    links:
      - https://www.stadt-koeln.de/service/produkte/20335/index.html
    how_to_steps:
      - title: File the online application
        body: Cologne reviews the digital application and sends an appointment invitation once it can issue the permit.
        link: https://www.stadt-koeln.de/service/produkte/20335/index.html
    review_status: approved
    jurisdiction: de-nrw-cologne
