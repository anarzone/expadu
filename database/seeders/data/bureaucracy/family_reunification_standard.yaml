  - title: Review the special settlement option for spouses of §18c holders
    key: case.family.settlement.spouse_18c_option
    type: info
    description: |
      Section 9(3a) creates a conditional settlement-permit route for a spouse living
      in a marital household with a person who holds a settlement permit under §18c.
      Your recorded facts cover the three-year residence-permit period, at least 20
      working hours, B1 German, livelihood, housing, and legal/social knowledge. The
      authority must verify all referenced §9 conditions, including public-safety,
      employment-permission and professional-licence checks; this card is not an
      eligibility decision.
    phase: options
    urgency: medium
    deadline_type: none
    applies_if:
      current_residence_title: family_reunification
      case_goal: {in: [settlement_permit, renew_current_title]}
      sponsor_current_title: settlement_permit_18c
      family_residence_permit_held_since: {at_least_months_ago: 36}
      marital_household_continues: true
      weekly_work_hours: {gte: 20}
      livelihood_secured: 'yes'
      housing_sufficient: 'yes'
      legal_social_knowledge_proved: 'yes'
      german_level: {in: [b1, b2, c1, c2]}
    links:
      - https://www.gesetze-im-internet.de/aufenthg_2004/__9.html
      - https://www.make-it-in-germany.com/de/visum-aufenthalt/dauerhaft-in-deutschland/niederlassungserlaubnis
    review_status: approved
    jurisdiction: de-nrw-cologne
    reviewed_by: expadu_content_owner
    content_version: 2026-08-03.1
    source_verification: dual_source
    verified_at: '2026-08-03'
    legal_sources:
      - {kind: primary, label: '§9(3a) AufenthG', url: 'https://www.gesetze-im-internet.de/aufenthg_2004/__9.html'}
      - {kind: implementation, label: 'Make it in Germany · settlement permit', url: 'https://www.make-it-in-germany.com/de/visum-aufenthalt/dauerhaft-in-deutschland/niederlassungserlaubnis'}

  - title: Track the general five-year settlement route
    key: case.family.settlement.general_coming_up
    type: info
    description: |
      Your family residence permit is between three and five years old, so the general
      §9 route is coming up but is not yet established by duration alone. The usual
      route requires five years with a residence permit plus the other statutory
      checks, including livelihood, 60 months of pension contributions where required,
      B1 German, legal/social knowledge, and sufficient housing. Confirm the complete
      list with Cologne before applying.
    phase: ongoing
    urgency: low
    deadline_type: none
    applies_if:
      current_residence_title: family_reunification
      case_goal: {in: [renew_current_title, understand_options]}
      family_residence_permit_held_since: {months_ago_between: [36, 59]}
    links:
      - https://www.gesetze-im-internet.de/aufenthg_2004/__9.html
      - https://www.stadt-koeln.de/service/produkte/20356/index.html
    review_status: approved
    jurisdiction: de-nrw-cologne
    reviewed_by: expadu_content_owner
