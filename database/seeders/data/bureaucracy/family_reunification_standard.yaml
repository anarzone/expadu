      - {kind: implementation, label: 'Stadt Köln · family reunification', url: 'https://www.stadt-koeln.de/service/produkte/20335/index.html'}

  - title: Confirm which sponsor rules apply while the Blue Card is pending
    key: case.family.first_permit.sponsor_pending_review
    type: info
    description: |
      The sponsor's Blue Card application is still pending. Cologne's holder-specific
      family guidance should not be treated as an issuance promise before the sponsor's
      status is confirmed. Provide the household livelihood information, file the
      spouse's application on time, and ask the authority which requirements apply to
      the pending sponsor status.
    phase: waiting
    urgency: critical
    deadline_type: none
    applies_if:
      current_residence_title: national_d_visa
      case_goal: family_reunification_permit
      sponsor_current_title: blue_card_pending
      livelihood_secured: {in: ['yes', 'no', unsure]}
    links:
      - https://www.gesetze-im-internet.de/aufenthg_2004/__30.html
      - https://www.stadt-koeln.de/service/produkte/20335/index.html
    review_status: approved
