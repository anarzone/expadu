  - title: Review an independent residence right after separation
    key: case.family.independent_after_separation
    type: info
    conflicts_with: [case.family.renew.continuing_household]
    description: |
      If the marital household has ended, §31—not the continuing-household renewal
      rule—may apply. The authority must verify whether the marital household lawfully
      existed in Germany for the required period, whether the sponsor died, or whether
      a statutory hardship exception applies. Do not infer this from the age of the
      current permit alone; obtain case-specific advice before relying on §31.
    phase: options
    urgency: high
    deadline_type: none
    applies_if:
      current_residence_title: family_reunification
      case_goal: {in: [renew_current_title, understand_options]}
      marital_household_continues: false
    links:
      - https://www.gesetze-im-internet.de/aufenthg_2004/__31.html
    review_status: approved
