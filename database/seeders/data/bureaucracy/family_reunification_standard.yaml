  - title: Attend the permit appointment with the originals
    key: fam.residence_permits
    depends_on: []
    description: |
      After you apply online, Cologne reviews the application and invites you to an
      appointment when it can issue the permit. Bring the originals of the documents
      below; Cologne may ask for further documents in individual cases.
    phase: first_30_days
    urgency: critical
    deadline_type: none
    applies_if:
      entry_mode: [d_visa, visa_free]
    booking_service_key: auslaenderbehoerde
    documents_required:
      - label: Recognised, valid national passport
      - label: Copy of the entry visa, if you needed one
      - label: Digital biometric photo
      - label: Marriage certificate (first application only)
        note: Bring a certified translation of every foreign certificate; depending on the country an apostille or legalisation is also needed.
      - label: Rental contract plus proof of the current rent
        note: For example a recent bank statement. Owners bring the purchase contract showing the flat's size in square metres and, where relevant, proof of loan instalments and the monthly Hausgeld.
      - label: A1 German certificate for the joining spouse
        note: Goethe-Institut, TestDaF-Institut or telc certificates.
      - label: Proof that the livelihood of all working family members is secured
        note: 'Employees: payslips for the last three months. Self-employed: last income-tax assessment, current profit-and-loss statement from the tax adviser, business registration if applicable, pension or life-insurance proof.'
      - label: Proof of full health insurance, if you are not publicly insured
        from: core.health_insurance
    links:
      - https://www.stadt-koeln.de/service/produkte/20335/index.html
    how_to_steps:
      - title: Bring originals and certified translations
        body: Cologne asks for a certified translation of all foreign certificates, plus an apostille or legalisation depending on the country of origin.
      - title: Pay the fee at the appointment
        body: 'First issue from 18 years: €100. Renewal from 18 years: €93. Turkish citizens with association rights pay €27.60 up to 24 years and €46 from 24 years.'
