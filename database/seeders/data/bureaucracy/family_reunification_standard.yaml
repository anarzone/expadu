  - title: Renew the family permit before it expires
    key: case.family.renew.continuing_household
    conflicts_with: [case.family.independent_after_separation]
    description: |
      Because the marital household continues, prepare the family-permit renewal and
      file it before the current residence title expires. Section 30(3) says the permit
      may be extended while the marital household continues; it is not an automatic
      entitlement to approval. A timely application can preserve the existing title's
      effect while the authority decides, subject to §81 and its exceptions.
    phase: arrival
    urgency: critical
    deadline_type: fact_date
    deadline_fact_key: residence_title_expires_at
    applies_if:
      current_residence_title: family_reunification
      case_goal: renew_current_title
      marital_household_continues: true
    links:
      - https://www.gesetze-im-internet.de/aufenthg_2004/__30.html
      - https://www.gesetze-im-internet.de/aufenthg_2004/__81.html
      - https://www.stadt-koeln.de/service/produkte/20335/index.html
    review_status: approved
    jurisdiction: de-nrw-cologne
    reviewed_by: expadu_content_owner
    content_version: 2026-08-03.1
    source_verification: dual_source
    verified_at: '2026-08-03'
