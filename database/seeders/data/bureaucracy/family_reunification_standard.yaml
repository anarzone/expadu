  - title: Prepare the joining spouse's first residence application
    key: case.family.first_permit.prepare
    description: |
      Prepare and file the joining spouse's own residence application before the national D visa expires.
      Use the Cologne family-reunification checklist:
      - the application form
      - a valid national passport
      - a copy of the entry visa if required
      - a digital biometric passport photo
      - the marriage certificate
      - a suitable A1 German certificate, for example Deutsch-Test für Zuwanderer; ask the office which certificates it accepts
      - the rental contract with proof of the current rent
      - proof from all working family members that the family's living costs are fully covered, for example payslips for the last three months
      - proof of the joining spouse's full health insurance if they are not publicly insured
      - certified translations of all foreign certificates, with an apostille or legalisation depending on the country
      The office may ask for other documents in individual cases. Do not leave out the German certificate because of an exception the office has not confirmed. A sponsor whose Blue Card is still pending needs a separate authority check; do not assume that holder-specific exceptions already apply.
    phase: arrival
    urgency: critical
    deadline_type: fact_date
    deadline_fact_key: visa_expires_at
    applies_if:
      current_residence_title: national_d_visa
      case_goal: family_reunification_permit
      sponsor_current_title: {in: [national_d_visa, standard_work_permit, blue_card_pending, blue_card, settlement_permit_9, settlement_permit_18c, settlement_permit_unknown, other]}
      entry_mode: d_visa
    links:
      - https://www.gesetze-im-internet.de/aufenthg_2004/__30.html
      - https://www.gesetze-im-internet.de/aufenthg_2004/__81.html
      - https://www.stadt-koeln.de/service/produkte/20335/index.html
    review_status: approved
