# Standard work permit path (§18a/b AufenthG). Source: stadt-koeln.de
# product 01083, fetched 2026-06 — see docs/bureaucracy-sources.md (Case 2).
situation: non_eu_employee

tasks:
  # Book-before-ready: the online application goes in on day one — the
  # appointment wait only starts once the application is submitted.
  - title: Submit your work-permit application online
    key: nee.submit_application
    depends_on: []
    review_status: approved
    jurisdiction: de-nrw-cologne
    reviewed_by: automated_source_check
    content_version: 2026-10-08.1
    source_verification: quote_checked
    legal_sources:
      - {kind: primary, label: '§41 AufenthV — Vergünstigung für Angehörige bestimmter Staaten', url: 'https://www.gesetze-im-internet.de/aufenthv/__41.html'}
      - {kind: primary, label: '§81 AufenthG — Beantragung des Aufenthaltstitels', url: 'https://www.gesetze-im-internet.de/aufenthg_2004/__81.html'}
      - {kind: primary, label: '§4a AufenthG — Zugang zur Erwerbstätigkeit', url: 'https://www.gesetze-im-internet.de/aufenthg_2004/__4a.html'}
      - {kind: implementation, label: 'Stadt Köln · Aufenthaltserlaubnis für die nichtselbständige Erwerbstätigkeit', url: 'https://www.stadt-koeln.de/service/produkte/01083/index.html'}
    claims:
      - id: ninety-days
        states: within 90 days of arrival
        source: '§41 AufenthV — Vergünstigung für Angehörige bestimmter Staaten'
        quote: Ein erforderlicher Aufenthaltstitel ist innerhalb von 90 Tagen nach der Einreise zu beantragen.
      - id: filing-deadline
        covers: deadline
        source: '§41 AufenthV — Vergünstigung für Angehörige bestimmter Staaten'
        quote: Ein erforderlicher Aufenthaltstitel ist innerhalb von 90 Tagen nach der Einreise zu beantragen.
      - id: visa-free-countries
        states: citizen of Australia, Israel, Japan, Canada, South Korea, New Zealand, the UK or the USA
        source: '§41 AufenthV — Vergünstigung für Angehörige bestimmter Staaten'
        quote: Staatsangehörige von Australien, Israel, Japan, Kanada, der Republik Korea, von Neuseeland, des Vereinigten Königreichs Großbritannien und Nordirland
      - id: apply-before-expiry
        states: apply before the visa expires so that it continues to count until the decision
        source: '§81 AufenthG — Beantragung des Aufenthaltstitels'
        quote: gilt der bisherige Aufenthaltstitel vom Zeitpunkt seines Ablaufs bis zur Entscheidung der Ausländerbehörde als fortbestehend
      - id: work-shown-on-title
        states: every residence title shows whether employment is allowed
        source: '§4a AufenthG — Zugang zur Erwerbstätigkeit'
        quote: Jeder Aufenthaltstitel muss erkennen lassen, ob die Ausübung einer Erwerbstätigkeit erlaubt ist
      - id: ba-internal
        states: the Ausländeramt obtains that approval internally
        source: 'Stadt Köln · Aufenthaltserlaubnis für die nichtselbständige Erwerbstätigkeit'
        quote: geschieht dies in einem internen Zustimmungsverfahren zwischen der Ausländerbehörde und der Bundesagentur für Arbeit
      - id: no-visitor-visa
        states: a visitor or business visa is not enough
        source: 'Stadt Köln · Aufenthaltserlaubnis für die nichtselbständige Erwerbstätigkeit'
        quote: Ein Besuchs- oder Geschäftsvisum reicht nicht aus für die Erteilung einer Aufenthaltserlaubnis zum Zweck der Erwerbstätigkeit.
    description: |
      To stay and work in Germany you need a residence permit for employment. In
      Cologne you apply to the Bezirksausländeramt for the Stadtteil you live in, and
      you can submit the application digitally. The application is tied to a
      concrete job offer. Where the Federal Employment Agency (BA) has to approve the
      job, the Ausländeramt obtains that approval internally. Your filing window: if
      you entered on a national D visa, apply before the visa expires so that it
      continues to count until the decision. If you entered visa-free as a
      citizen of Australia, Israel, Japan, Canada, South Korea, New Zealand, the UK or the USA,
      you must apply within 90 days of arrival.
    phase: first_30_days
    urgency: critical
    deadline_type: permit_window
    deadline_days: 90
    applies_if:
      entry_mode: [d_visa, visa_free]
    documents_required:
      - label: Cologne's online application for a residence permit for employment
        note: Upload scans of the documents listed on the appointment task.
      - label: Job offer + Vordruck Stellenbeschreibung (job-description form)
        note: The form describes the position planned for you. Ask your employer for it early.
        tone: warn
    links:
      - https://www.stadt-koeln.de/service/produkte/01083/index.html
    how_to_steps:
      - title: File the online application now
        body: Cologne accepts the application for a residence permit for employment digitally. If the BA has to approve the job, that happens between the authorities without a separate application from you.
        link: https://www.stadt-koeln.de/service/produkte/01083/index.html
      - title: Check your visa's purpose
        body: Your visa must have been issued for taking up work — a visitor or business visa is not enough.
      - title: Check before you start working
        body: Every residence title shows whether employment is allowed. Check your visa or permit with your employer before your first working day.

  - title: Attend your work-permit appointment with the originals
    key: nee.residence_permit
    depends_on: [nee.submit_application]
    review_status: approved
    jurisdiction: de-nrw-cologne
    reviewed_by: automated_source_check
    content_version: 2026-10-08.1
    source_verification: quote_checked
    legal_sources:
      - {kind: primary, label: '§45 AufenthV — Gebühren für die Aufenthaltserlaubnis', url: 'https://www.gesetze-im-internet.de/aufenthv/__45.html'}
      - {kind: primary, label: '§81 AufenthG — Beantragung des Aufenthaltstitels', url: 'https://www.gesetze-im-internet.de/aufenthg_2004/__81.html'}
      - {kind: implementation, label: 'Stadt Köln · Aufenthaltserlaubnis für die nichtselbständige Erwerbstätigkeit', url: 'https://www.stadt-koeln.de/service/produkte/01083/index.html'}
    claims:
      - id: issue-fee
        states: issuing the residence permit costs €100
        source: '§45 AufenthV — Gebühren für die Aufenthaltserlaubnis'
        quote: mit einer Geltungsdauer von mehr als einem Jahr 100 Euro
      - id: permission-free
        states: The employment permission itself is free
        source: 'Stadt Köln · Aufenthaltserlaubnis für die nichtselbständige Erwerbstätigkeit'
        quote: Für die Beschäftigungserlaubnis fallen keine Gebühren an.
      - id: in-person
        states: You have to appear in person
        source: 'Stadt Köln · Aufenthaltserlaubnis für die nichtselbständige Erwerbstätigkeit'
        quote: Eine persönliche Vorsprache ist erforderlich.
      - id: two-photos
        states: Two current passport photos
        source: 'Stadt Köln · Aufenthaltserlaubnis für die nichtselbständige Erwerbstätigkeit'
        quote: Zwei aktuelle Passfotos
      - id: fiktionsbescheinigung
        states: you receive a certificate confirming the effect of your application (Fiktionsbescheinigung)
        source: '§81 AufenthG — Beantragung des Aufenthaltstitels'
        quote: Dem Ausländer ist eine Bescheinigung über die Wirkung seiner Antragstellung (Fiktionsbescheinigung) auszustellen.
    description: |
      You have to appear in person at the Bezirksausländeramt responsible for your
      Stadtteil. Bring the originals of the documents on Cologne's checklist below —
      use the waiting time to assemble them. If the Federal Employment Agency
      approves the job, the residence permit can be issued with the matching employment
      permission.
    phase: first_30_days
    urgency: critical
    deadline_type: none
    applies_if:
      entry_mode: [d_visa, visa_free]
    booking_service_key: auslaenderbehoerde
    documents_required:
      - label: Valid visa issued for taking up work, or your current residence permit
        note: Cologne warns that a visitor or business visa is not enough for a residence permit for employment.
        tone: warn
      - label: Valid national passport
      - label: Mietvertrag (rental contract)
        note: Cologne's checklist asks for the rental contract.
      - label: Job offer + Vordruck Stellenbeschreibung (job-description form)
        note: The original of the form describing the position planned for you.
      - label: Proof of health insurance
        note: If you have an insurance card, showing it is enough; otherwise ask your insurer for a confirmation.
      - label: Two current passport photos
    links:
      - https://www.stadt-koeln.de/service/produkte/01083/index.html
    how_to_steps:
      - title: Gather every document while you wait
        body: Check your folder against the list below and bring the originals of everything you uploaded.
      - title: Know the fees
        body: The employment permission itself is free; under the federal fee rules, issuing the residence permit costs €100.
      - title: Keep proof of your pending application
        body: If your application keeps your previous permission in force, you receive a certificate confirming the effect of your application (Fiktionsbescheinigung).

  - title: 'After 3 years: permanent residence instead of another renewal (§18c)'
    key: nee.ne_check
    depends_on: []
    review_status: approved
    jurisdiction: de-nrw-cologne
    reviewed_by: automated_source_check
    content_version: 2026-10-08.1
    source_verification: quote_checked
    legal_sources:
      - {kind: primary, label: '§18c AufenthG', url: 'https://www.gesetze-im-internet.de/aufenthg_2004/__18c.html'}
      - {kind: implementation, label: 'Stadt Köln · Niederlassungserlaubnis für Fachkräfte', url: 'https://www.stadt-koeln.de/service/produkt/niederlassungserlaubnis-fuer-fachkraefte'}
    claims:
      - id: three-years
        states: After 3 years
        source: '§18c AufenthG'
        quote: sie seit drei Jahren im Besitz eines Aufenthaltstitels
      - id: section
        states: (§18c)
        source: '§18c AufenthG'
        quote: Einer Fachkraft ist ohne Zustimmung der Bundesagentur für Arbeit eine Niederlassungserlaubnis zu erteilen
      - id: two-years-german-qualification
        states: 2 years if you completed vocational training or a degree in Germany
        source: '§18c AufenthG'
        quote: Die Frist nach Satz 1 Nummer 1 verkürzt sich auf zwei Jahre
      - id: thirty-six-months
        states: 36 months of pension contributions
        source: '§18c AufenthG'
        quote: sie mindestens 36 Monate Pflichtbeiträge oder freiwillige Beiträge zur gesetzlichen Rentenversicherung geleistet hat
      - id: twenty-four-months
        states: 24 months with a German qualification
        source: '§18c AufenthG'
        quote: die Frist nach Satz 1 Nummer 3 verkürzt sich auf 24 Monate
      - id: b1
        states: B1 German
        source: 'Stadt Köln · Niederlassungserlaubnis für Fachkräfte'
        quote: Ihre Deutschkenntnisse entsprechen dem Niveau B1 des Gemeinsamen Europäischen Referenzrahmens für Sprachen.
      - id: fee
        states: 'Fee: €113'
        source: 'Stadt Köln · Niederlassungserlaubnis für Fachkräfte'
        quote: Für die Erteilung einer Niederlassungserlaubnis müssen Sie eine Gebühr in Höhe von 113 Euro bezahlen.
      - id: turkish-fee
        states: €22.80 up to 24 years of age, €37 from 24 years
        source: 'Stadt Köln · Niederlassungserlaubnis für Fachkräfte'
        quote: 'bis 24 Jahre: 22,80 Euro ab 24 Jahre: 37 Euro'
      - id: payslips
        states: Payslips for the last three months
        source: 'Stadt Köln · Niederlassungserlaubnis für Fachkräfte'
        quote: Gehaltsabrechnungen der letzten drei Monate
      - id: b1-certificate
        states: B1 German certificate
        source: 'Stadt Köln · Niederlassungserlaubnis für Fachkräfte'
        quote: Nachweis in Form eines Sprachzertifikats über Deutschkenntnisse auf B1 Niveau
    description: |
      After 3 years with a skilled-worker residence permit — or 2 years if you completed vocational training or a degree in Germany —
      you can apply for the Niederlassungserlaubnis (permanent residence). Cologne's
      skilled-worker page lists, among other conditions: continued work as a skilled
      worker, 36 months of pension contributions (24 months with a German qualification), B1 German,
      basic knowledge of the legal and social order, secured livelihood without
      benefits such as Bürgergeld, sufficient housing and health insurance.
      Fee: €113 (Turkish citizens with association rights: €22.80 up to 24 years of age, €37 from 24 years).
      You can apply digitally; the Ausländeramt sends an appointment invitation once
      it can issue the permit.
    phase: ongoing
    urgency: low
    deadline_type: none
    booking_service_key: auslaenderbehoerde
    documents_required:
      - label: Valid national passport + digital biometric photo
      - label: Employment contract
      - label: Payslips for the last three months
      - label: Rental contract + proof of current monthly housing costs
      - label: Current pension record (Rentenversicherungsverlauf)
        note: Request it from the Deutsche Rentenversicherung.
      - label: B1 German certificate
      - label: Proof of basic knowledge of the legal and social order
        note: Usually the "Leben in Deutschland" test.
    links:
      - https://www.stadt-koeln.de/service/produkt/niederlassungserlaubnis-fuer-fachkraefte
    how_to_steps:
      - title: Check eligibility before every renewal
        body: When a renewal comes due, check first whether you already meet the conditions for permanent residence.
      - title: Expect a possible request for more documents
        body: Cologne may ask for further documents in individual cases and will tell you if so.
