    description: |
      To stay and work in Germany you need a residence permit for employment. In
      Cologne you apply to the Bezirksausländeramt for the Stadtteil you live in.
      You can submit the application digitally, but a personal appointment is still required.
      The application is tied to a concrete job offer. Where the Federal Employment
      Agency (BA) has to approve the job, the Ausländeramt obtains that approval internally.
      Your filing window: if you entered on a national D visa,
      apply before the visa expires so that it continues to count until the decision.
      If you entered visa-free as a
      citizen of Australia, Israel, Japan, Canada, South Korea, New Zealand, the UK or the USA,
      you must apply within 90 days of arrival.
    phase: first_30_days
    urgency: critical
    # A D visa's own expiry; after visa-free entry, 90 days (Task::deadlineDate).
    deadline_type: permit_window
    deadline_days: 90
    applies_if:
      entry_mode: [d_visa, visa_free]
    documents_required:
      - label: Application for a residence permit for employment
        note: You can submit the application digitally. If you have no BundID, you can continue without logging in.
      - label: Valid visa for taking up work, or your current residence permit
        note: Check the purpose of your visa — a visitor or business visa is not enough.
      - label: Valid national passport
      - label: Rental contract
      - label: Job offer + Vordruck Stellenbeschreibung (job-description form)
        note: Describes the job planned for you. Ask your employer for it early.
        tone: warn
      - label: Proof of health insurance
        note: If you have an insurance card, showing it is enough. Otherwise ask your health insurer for proof.
      - label: Two current passport photos
    links:
      - https://www.stadt-koeln.de/service/produkte/01083/index.html
    how_to_steps:
      - title: File the online application now
        body: Cologne accepts the application for a residence permit for employment digitally, but a personal appointment is still required. If the BA has to approve the job, that happens between the authorities without a separate application from you.
        link: https://www.stadt-koeln.de/service/produkte/01083/index.html
      - title: Science, research or highly qualified? Use the special service
        body: If you work in science, research or development, or are highly qualified within the meaning of the law the Cologne page cites, send questions about your permit only to Cologne's Service für ausländische Akademiker*innen und Selbständige (Cologne's service point for foreign academics and self-employed people). The Cologne page linked here names this service point.
        link: https://www.stadt-koeln.de/service/produkte/01083/index.html
      - title: Check your visa's purpose
        body: If you entered on a visa, it must have been issued for taking up work — a visitor or business visa is not enough. If you entered visa-free as a citizen of one of the countries listed above, you can apply for the permit in Germany.
      - title: Check before you start working
        body: Every residence title shows whether employment is allowed. Check your visa or permit with your employer before your first working day.

