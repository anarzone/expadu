    description: |
      From outside the EU or EEA and want to work for yourself? You need a residence permit to work self-employed.
      If you entered visa-free, don't start working until you have it.
      Under §21 AufenthG (the Residence Act), it can be granted if there is an economic interest or a regional need,
      the business is expected to have positive effects on the economy, and its financing is secured by your own capital or a loan commitment.
      The check looks in particular at how viable your business idea is, your experience as an entrepreneur and how much capital you put in.
      Cologne's special service desk for the self-employed checks and decides on the permit after you arrive.
      Citizens of Australia, Israel, Japan, Canada, South Korea, New Zealand, the UK or the USA can enter visa-free and get the permit here;
      they must apply within 90 days of entry (§41 AufenthV, the Residence Ordinance).
      If you came on a national visa, apply before it expires; it then counts as still valid until the office decides (§81 AufenthG).
    phase: first_30_days
    urgency: critical
    deadline_type: permit_window
    deadline_days: 90
    applies_if:
      entry_mode: [d_visa, visa_free]
    booking_service_key: auslaenderbehoerde
    documents_required:
      - label: Valid passport
        note: As a rule you must have entered with the required visa. Cologne's general guidance on work permits says a visitor or business visa is not enough for a residence permit for work. The visa-free route above is the exception.
      - label: CV
        note: List your schooling, training, jobs and any self-employment in a table.
      - label: Certificates and proof of qualifications and past jobs
        note: Certain self-employed activities need proof of vocational training or a degree, and your qualification should relate to your planned business.
      - label: Proof of German skills (usually required)
        note: German is usually required, especially if you need customer contact, open or take over a restaurant, found a company or provide services.
      - label: Business concept, in German
        note: 'Cologne needs a coherent concept in German about your planned business to check whether your business idea is viable and in the public interest. Include: a financing plan; your experience in this field; any existing client contacts; for a new business, a revenue and profit forecast; and proof that you can support yourself.'
      - label: 'Proof of your own capital: a bank certificate or other credible proof'
      - label: 'If you are older than 45 years: proof of adequate retirement provision'
        note: The law says the permit should otherwise not be granted.
    links:
      - https://www.stadt-koeln.de/service/produkte/00947/index.html
      - https://www.gesetze-im-internet.de/aufenthg_2004/__21.html
    how_to_steps:
      - title: Ask the service desk for an appointment
        body: Cologne sends the self-employed to its special service desk at Dillenburger Straße 56-66 in Kalk. First, ask for an appointment in writing by email, contact form or post. Go only once you have both an appointment and an invitation letter from the Ausländeramt (immigration office). Some types of business need extra proof, so ask which documents apply to your business before the appointment.
      - title: Write your business concept in German
        body: For more on starting a business, Cologne points you to contacts at the IHK Köln.
      - title: Go in person with your documents
        body: You must go in person. Bring the documents listed on this card.

  - title: Register your trade (Gewerbeanmeldung)
