    claims:
      - id: non-eu-scope
        states: not from the EU, the EEA or Switzerland
        source: 'Stadt Köln — Gewerbemeldung eines Einzelunternehmens'
        quote: Wenn Sie nicht aus einem Staat der Europäischen Union, dem Europäischen Wirtschaftsraum (EWR) oder der Schweiz kommen.
      - id: permit-work-allowed
        states: your residence permit must say Erwerbstätigkeit gestattet
        source: 'Stadt Köln — Gewerbemeldung eines Einzelunternehmens'
        quote: 'Aufenthaltstitel mit dem Vermerk "Erwerbstätigkeit gestattet"'
      - id: register-at-start
        states: at the same time as you start the business (§14 GewO)
        source: '§14 GewO — Anzeigepflicht; Verordnungsermächtigung'
        quote: muss dies der zuständigen Behörde gleichzeitig anzeigen
      - id: fee
        states: costs €26 per registration
        source: 'Stadt Köln — Gewerbemeldung eines Einzelunternehmens'
        quote: 26 Euro pro Gewerbeanmeldung/Gewerbeummeldung
      - id: fee-notice
        states: you get a fee notice for it
        source: 'Stadt Köln — Gewerbemeldung eines Einzelunternehmens'
        quote: Über diese Gebühren erhalten Sie einen Gebührenbescheid.
      - id: late-is-offence
        states: Under §146 GewO, not registering or registering late is an Ordnungswidrigkeit
        source: '§146 GewO — Verletzung sonstiger Vorschriften über die Ausübung eines Gewerbes'
        quote: eine Anzeige nicht, nicht richtig, nicht vollständig oder nicht rechtzeitig erstattet
      - id: finanzamt-informed
        states: informs the Finanzamt without delay
        source: '§138 AO — Anzeigen über die Erwerbstätigkeit'
        quote: die Gemeinde unterrichtet unverzüglich das nach § 22 Absatz 1 zuständige Finanzamt von dem Inhalt der Mitteilung
      - id: further-tax-info
        states: you still have to give the Finanzamt further tax information yourself
        source: '§138 AO — Anzeigen über die Erwerbstätigkeit'
        quote: haben sie dem in Absatz 1 bezeichneten Finanzamt weitere Auskünfte über die für die Besteuerung erheblichen rechtlichen und tatsächlichen Verhältnisse zu erteilen
      - id: fragebogen
        states: New businesses send the Fragebogen zur steuerlichen Erfassung (tax registration questionnaire) to their Finanzamt
        source: 'BZSt — Vergabe der USt-IdNr.'
        quote: Neugegründete Unternehmen übermitteln den Fragebogen zur steuerlichen Erfassung an ihr zuständiges Finanzamt.
      - id: one-month
        states: within one month of opening the business (§138 AO)
        source: '§138 AO — Anzeigen über die Erwerbstätigkeit'
        quote: Mitteilungen nach den Absätzen 1, 1a und 1b sind innerhalb eines Monats nach dem meldepflichtigen Ereignis zu erstatten.
      - id: data-passed-on
        states: passes your data on regularly
        source: '§14 GewO — Anzeigepflicht; Verordnungsermächtigung'
        quote: Daten aus der Gewerbeanzeige regelmäßig an
      - id: data-to-ihk
        states: to the Industrie- und Handelskammer (IHK)
        source: '§14 GewO — Anzeigepflicht; Verordnungsermächtigung'
        quote: die Industrie- und Handelskammer zur Wahrnehmung der in den
      - id: ihk-membership
        states: You belong to the IHK if you are assessed for Gewerbesteuer (trade tax) and have business premises in its district
        source: '§2 IHKG'
        quote: Zur Industrie- und Handelskammer gehören, sofern sie zur Gewerbesteuer veranlagt sind, natürliche Personen, Handelsgesellschaften, andere Personenmehrheiten und juristische Personen des privaten und des öffentlichen Rechts, welche im Bezirk der Industrie- und Handelskammer eine Betriebsstätte unterhalten (Kammerzugehörige).
      - id: ihk-fee-exemption
        states: Sole traders not entered in the Handelsregister (commercial register) pay no IHK fee if their trade profit stays under a limit set by law
        source: '§3 IHKG'
        quote: sind vom Beitrag freigestellt, soweit ihr Gewerbeertrag nach dem Gewerbesteuergesetz
      - id: ihk-information-duty
        states: you must give the IHK the information it needs to set your fee
        source: '§3 IHKG'
        quote: Die Kammerzugehörigen sind verpflichtet, der Kammer Auskunft über die zur Festsetzung der Beiträge erforderlichen Grundlagen zu geben
      - id: id-document
        states: ID card or national passport
        source: 'Stadt Köln — Gewerbemeldung eines Einzelunternehmens'
        quote: Personalausweis oder Nationalpass
      - id: anmeldung-proof
        states: if your ID document shows no private address
        source: 'Stadt Köln — Gewerbemeldung eines Einzelunternehmens'
        quote: sofern in Ihrem Ausweisdokument keine Privatanschrift vermerkt ist
    description: |
      Register your trade at the same time as you start the business (§14 GewO). In Cologne it costs €26 per registration, and you can do it online.
      If you are not from the EU, the EEA or Switzerland, your residence permit must say Erwerbstätigkeit gestattet (work, including self-employment, allowed).
      You also send the Finanzamt (tax office) a separate form.
    phase: first_30_days
    urgency: high
    deadline_type: none
    documents_required:
      - label: ID card or national passport
      - label: Residence permit marked Erwerbstätigkeit gestattet
        note: Only if you are not from the EU, the EEA or Switzerland
      - label: Current Anmeldebestätigung (proof of address registration)
        note: Only if your ID document shows no private address
    links:
      - https://www.stadt-koeln.de/service/produkte/00268/index.html
      - https://www.gesetze-im-internet.de/gewo/__14.html
    how_to_steps:
      - title: Register with the Gewerbemeldestelle (trade office)
        body: You can register online in the Wirtschafts-Service-Portal Nordrhein-Westfalen. If you do, you get your Gewerbeschein (proof of your trade registration) right after you finish. It costs €26 per registration, and you get a fee notice for it. Under §146 GewO, not registering or registering late is an Ordnungswidrigkeit (regulatory offence).
        link: https://www.stadt-koeln.de/service/produkte/00268/index.html
      - title: Expect IHK membership
        body: The city passes your data on regularly to the Industrie- und Handelskammer (IHK). You belong to the IHK if you are assessed for Gewerbesteuer (trade tax) and have business premises in its district. Sole traders not entered in the Handelsregister (commercial register) pay no IHK fee if their trade profit stays under a limit set by law. Answer their letters, because you must give the IHK the information it needs to set your fee.
        link: https://www.ihk.de/koeln/
      - title: Still file the Fragebogen
        body: The city informs the Finanzamt without delay, but you still have to give the Finanzamt further tax information yourself. New businesses send the Fragebogen zur steuerlichen Erfassung (tax registration questionnaire) to their Finanzamt. Do it within one month of opening the business (§138 AO).
        link: https://www.gesetze-im-internet.de/ao_1977/__138.html
