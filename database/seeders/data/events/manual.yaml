# Manually curated Cologne events — the ManualSource. Same philosophy
# as the bureaucracy catalogue: hand-written, trusted (verified_at is
# set at import), summaries in our own words. Recurring events are ONE
# record with an RRULE; `schedule.weekday` anchors one-offs and series
# starts on the next such weekday at import time.
#
# chips vocabulary: English-friendly · newcomers welcome · solo-OK · free

events:
  - uid: cologne-language-exchange
    title: Cologne Language Exchange
    title_en: Cologne Language Exchange
    summary_en: >-
      Table-based language swap in a brewery hall — find your languages'
      table, sit down, switch halfway. No sign-up, no level requirement.
    tip_en: Mostly internationals — arrive by 19:15, the popular tables fill fast.
    category: language_exchange
    language: mixed
    chips: [English-friendly, newcomers welcome, solo-OK, free]
    price_text: free
    is_free: true
    relevance: 1.0
    source_url: https://www.meetup.com/colognelanguageexchange/
    venue:
      name: Gilden im Zims
      address: Heumarkt 77, Altstadt
      lat: 50.9358
      lng: 6.9601
    schedule:
      weekday: TH
      time: "19:00"
      duration_min: 150
      rrule: FREQ=WEEKLY;BYDAY=TH

