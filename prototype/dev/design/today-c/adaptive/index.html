    <body
        class="shell-review today-c today-adaptive"
        data-today-layout="everyday"
    >
        <nav class="adaptive-review" aria-label="Today layout previews">
            <span>Layout preview</span>
            <div
                class="adaptive-scenarios"
                role="group"
                aria-label="Choose a sample day"
            >
                <button
                    type="button"
                    data-scenario="everyday"
                    aria-pressed="true"
                >
                    Everyday
                </button>
                <button
                    type="button"
                    data-scenario="event"
                    aria-pressed="false"
                >
                    Big event
                </button>
                <button
                    type="button"
                    data-scenario="delay"
                    aria-pressed="false"
                >
                    Route delay
                </button>
            </div>
            <a
                href="./"
                aria-label="Back to the restored Today design"
                title="Restored Today"
                ><span data-icon="back"></span
            ></a>
        </nav>
        <div id="home">
            <header class="app-header">
                <a class="brand" href="./" aria-label="Expadu home"
                    ><svg viewBox="13 22 74 60" aria-hidden="true">
                        <g transform="translate(2.45 2.05)">
                            <circle cx="20.5" cy="50" r="6" fill="#05badd" />
                            <rect
                                x="30"
                                y="24"
                                width="13"
                                height="52"
                                rx="6"
                                fill="currentColor"
                            />
                            <rect
                                x="46"
                                y="24"
                                width="34"
                                height="13"
                                rx="6"
                                fill="#ff3902"
                                transform="rotate(-7 46 30)"
                            />
                            <rect
                                x="46"
                                y="43.5"
                                width="25"
                                height="13"
                                rx="6"
                                fill="#ff3902"
                                transform="rotate(-4 46 50)"
                            />
                            <rect
                                x="46"
                                y="63"
                                width="34"
                                height="13"
                                rx="6"
                                fill="#ff3902"
                                transform="rotate(-2 46 69)"
                            />
                        </g></svg
                    >Expadu</a
                >
                <div class="header-context">
                    <button class="location-button" data-action="location">
                        <span data-icon="pin"></span>Cologne<span
                            data-icon="down"
                        ></span></button
                    ><button class="weather-button" data-action="weather">
                        <span class="weather-sun" data-icon="sun"></span
                        ><span
                            ><strong>Weather</strong
                            ><small>Unavailable</small></span
                        >
                    </button>
                </div>
                <div class="header-actions">
                    <button
                        class="day-button"
                        data-action="plan"
                        aria-label="Saved ideas"
                    >
                        <span data-icon="bookmark"></span><span>Saved</span
                        ><b class="day-count" hidden>0</b></button
                    ><button
                        class="account-button"
                        data-action="account"
                        aria-label="Your account"
                    >
                        A
                    </button>
                </div>
            </header>
            <nav class="service-nav" aria-label="Main navigation">
                <a
                    class="today-link"
                    data-page="today"
                    href="../today-c/"
                    aria-current="page"
                    ><svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.7"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        aria-hidden="true"
                    >
                        <path d="m3 10 9-7 9 7M5 9v12h14V9M9 21v-8h6v8" /></svg
                    ><span>Today</span></a
                >
                <button data-action="events" data-page="events">
                    <span data-icon="calendar"></span
                    ><strong>Events</strong></button
                ><button data-action="paperwork" data-page="bureaucracy">
                    <span data-icon="document"></span
                    ><strong>Bureaucracy</strong></button
                ><button data-action="journey" data-page="departures">
                    <span data-icon="train"></span
                    ><strong>Departures</strong></button
                ><button data-action="services" data-page="services">
                    <span data-icon="grid"></span><strong>Services</strong>
                </button>
            </nav>
            <main class="page">
                <section class="welcome-row" aria-labelledby="greeting">
                    <div class="welcome-copy">
                        <h1 id="greeting">
                            Good afternoon, Anar<span class="orange-period"
                                >.</span
                            >
                        </h1>
                        <p id="day-date">Fri, 26 June</p>
                    </div>
                </section>

                <div class="adaptive-top">
                    <section
                        id="adaptive-feature"
                        class="adaptive-feature"
                        aria-label="Today's featured event"
                        hidden
                    >
                        <div class="adaptive-feature-label">
                            <span data-icon="spark"></span>Today’s highlight
                        </div>
                    </section>
                    <section class="clarity" aria-labelledby="clarity-title">
                        <div class="section-heading">
                            <h2 id="clarity-title">Your day</h2>
                            <span class="section-dot" aria-hidden="true"></span>
                        </div>
                        <section
                            id="today-next"
                            class="today-next"
                            aria-label="Your next action"
                            hidden
                        ></section>
                        <div class="clarity-panel">
                            <article
                                id="today-paperwork"
                                class="clarity-item paperwork"
                            ></article>
                            <article
                                id="today-connections"
                                class="clarity-item connections"
                            ></article>
                            <article
                                id="today-forecast"
                                class="clarity-item forecast"
                            ></article>
                        </div>
                    </section>
                </div>
                <section
                    id="saved-strip"
                    aria-label="Your saved day"
                    hidden
                ></section>
                <aside
                    id="optional-welcome"
                    class="optional-welcome"
                    aria-label="Welcome to Expadu"
                    hidden
                ></aside>
                <section
                    class="daily-board"
                    aria-label="Your day and useful next steps"
                >
                    <article class="board-card journey-card">
                        <button
                            class="journey-content"
                            data-action="journey-prompt"
                        >
                            <span class="card-topline"
                                ><span
                                    ><span data-icon="train"></span
                                    >Journey</span
                                ><span data-icon="arrow"></span
                            ></span>
                            <strong class="setup-title"
                                >Where are you heading?</strong
                            >
                            <span class="ticket-footer"
                                ><span>Plan a route</span
                                ><span data-icon="arrow"></span
                            ></span>
                        </button>
                    </article>
                    <article class="board-card music-card">
                        <button class="music-content" data-action="plan">
                            <span class="card-topline"
                                ><span>Your day</span
                                ><span
                                    class="music-symbol"
                                    data-icon="calendar"
                                ></span
                            ></span>
                            <strong id="board-plan-title"
                                >Open your plan</strong
                            >
                            <span class="card-footline"
                                ><span id="board-plan-note">Open Composer</span
                                ><span data-icon="arrow"></span
                            ></span>
                        </button>
                    </article>
                    <article
                        id="today-paperwork-card"
                        class="board-card paperwork-card"
                    ></article>
                    <div class="today-board-discovery">
                        <div class="today-discovery-heading">
                            <span>Events</span>
                            <a
                                href="../events-next/?discover=1&amp;date=2026-09-08"
                                aria-label="Explore all events"
                                ><span data-icon="arrow"></span
                            ></a>
                        </div>
                        <div
                            class="today-event-rail"
                            tabindex="0"
                            aria-label="Events. Swipe, drag or use the arrow keys."
                        ></div>
                    </div>
                </section>
                <footer class="page-footer">
                    <span>Captured events · sample overview</span
                    ><button data-action="about">
                        About this preview<span data-icon="arrow"></span>
                    </button>
                </footer>
                <p class="event-board-credit">
                    Original event illustrations · Sample programme, 8 September
                    2026
                </p>
            </main>
        </div>
        <div class="composer-tray" id="composer-tray">
            <button
                type="button"
                class="composer-launcher"
                aria-label="Open Composer"
                aria-expanded="false"
                aria-controls="compose-form"
                title="Composer"
            >
                <span data-icon="spark"></span>
            </button>
            <button
                type="button"
                class="composer-dismiss"
                aria-label="Close Composer"
                title="Close Composer"
            >
                <span data-icon="close"></span>
            </button>
            <button
                class="included-ideas"
                id="included-ideas"
                data-action="plan"
                hidden
            >
                <span data-icon="bookmark"></span
                ><span id="included-label"></span
                ><span data-icon="arrow"></span>
            </button>
            <form id="compose-form" class="composer-form">
                <div class="composer-entry">
                    <textarea
                        id="request"
                        rows="1"
                        maxlength="700"
                        aria-label="Your request to Composer"
                        placeholder="Ask, discover, or plan…"
                    ></textarea>
                </div>
                <div class="today-composer-tools">
                    <details class="today-composer-actions">
                        <summary aria-label="Composer actions">
                            <span data-icon="plus"></span>
                        </summary>
                        <div
                            class="today-control-menu"
                            aria-label="Composer actions"
                        >
                            <button type="button" data-composer-panel="plans">
                                <span data-icon="calendar"></span>My Plans
                            </button>
                            <button type="button" data-composer-panel="saved">
                                <span data-icon="bookmark"></span>Saved
                            </button>
                            <button type="button" data-composer-panel="history">
                                <span data-icon="clock"></span>History
                            </button>
                            <button
                                type="button"
                                data-composer-action="appointment"
                            >
                                <span data-icon="calendar"></span>Add
                                appointment
                            </button>
                            <button
                                type="button"
                                data-composer-action="examples"
                            >
                                <span data-icon="spark"></span>Try Composer
                            </button>
                            <button type="button" data-composer-action="new">
                                <span data-icon="plus"></span>Start fresh
                            </button>
                        </div>
                    </details>
                    <details class="today-approval">
                        <summary aria-label="Plan change approval">
                            <span data-approval-label>Ask first</span
                            ><span data-icon="down"></span>
                        </summary>
                        <div
                            class="today-control-menu"
                            role="menu"
                            aria-label="Plan change approval"
                        >
                            <button
                                type="button"
                                role="menuitemradio"
                                aria-checked="true"
                                data-today-approval="ask"
                            >
                                <span
                                    ><strong>Ask before changes</strong
                                    ><small
                                        >Review and apply changes
                                        yourself.</small
                                    ></span
                                ><span data-icon="check"></span>
                            </button>
                            <button
                                type="button"
                                role="menuitemradio"
                                aria-checked="false"
                                data-today-approval="routine"
                            >
                                <span
                                    ><strong>Allow routine changes</strong
                                    ><small
                                        >Automatically apply reversible plan
                                        edits.</small
                                    ></span
                                ><span data-icon="check"></span>
                            </button>
                            <p>Bookings and payments always need approval.</p>
                        </div>
                    </details>
                    <button
                        class="compose-button"
                        type="submit"
                        aria-label="Send request"
                        disabled
                    >
                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.8"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            aria-hidden="true"
                        >
                            <path d="M12 19V5m-7 7 7-7 7 7" />
                        </svg>
                    </button>
                </div>
            </form>
        </div>
        <dialog
            id="composer"
            class="composer-workspace"
            aria-labelledby="composer-title"
        >
            <header class="workspace-header">
                <button class="plain-button" data-action="close-composer">
                    <span data-icon="back"></span>Today
                </button>
                <h2 id="composer-title">
                    <span data-icon="spark"></span>Composer
                </h2>
                <button class="plain-button" data-action="plan">
                    <span data-icon="bookmark"></span>My day
                </button>
            </header>
            <div id="workspace-scroll">
                <div id="response" aria-live="polite"></div>
            </div>
            <form id="refine-form" class="refine-form">
                <label class="sr-only" for="refine-request"
                    >Edit your request</label
                ><textarea
                    id="refine-request"
                    rows="1"
                    maxlength="700"
                    placeholder="Change your request…"
                ></textarea
                ><button
                    class="compose-button"
                    type="submit"
                    aria-label="Compose again"
                >
                    <span data-icon="arrow"></span>
                </button>
            </form>
        </dialog>
        <dialog id="sheet" class="detail-sheet" aria-labelledby="sheet-title">
            <header class="sheet-header">
                <h2 id="sheet-title"></h2>
                <button
                    class="icon-button"
                    data-action="close-sheet"
                    aria-label="Close details"
                >
                    <span data-icon="close"></span>
                </button>
            </header>
            <div id="sheet-content"></div>
        </dialog>
        <div class="toast" role="status" id="toast">
            <span id="toast-icon" aria-hidden="true" hidden></span>
            <span id="toast-text"></span><button id="undo" hidden>Undo</button>
        </div>
    </body>
</html>
