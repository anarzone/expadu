<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light"><title>Expadu — Today at a glance</title><link rel="stylesheet" href="./style.css"><link rel="stylesheet" href="./overview.css?v=2"><link rel="stylesheet" href="./refinement.css?v=3"><script defer src="./app.js?v=5"></script><script defer src="./overview.js?v=3"></script></head><body class="context-refinement">

 <header class="app-header"><a href="./" class="brand" aria-label="Expadu home"><svg viewBox="13 22 74 60" aria-hidden="true"><g transform="translate(2.45 2.05)"><circle cx="20.5" cy="50" r="6" fill="#05badd"/><rect x="30" y="24" width="13" height="52" rx="6" fill="currentColor"/><rect x="46" y="24" width="34" height="13" rx="6" fill="#ff3902" transform="rotate(-7 46 30)"/><rect x="46" y="43.5" width="25" height="13" rx="6" fill="#ff3902" transform="rotate(-4 46 50)"/><rect x="46" y="63" width="34" height="13" rx="6" fill="#ff3902" transform="rotate(-2 46 69)"/></g></svg>Expadu</a><button class="location-button" data-action="location"><span data-icon="pin"></span>Your city<span data-icon="down"></span></button><div class="header-right"><button class="my-day" data-action="day"><span data-icon="bookmark"></span><span>My day</span><b id="count" hidden>0</b></button><button class="avatar" data-action="account" aria-label="Your account">A</button></div></header>
 <main class="today-board">

  <nav class="service-nav" aria-label="Your services"><button data-action="places"><span data-icon="pin"></span><strong>Places</strong></button><button data-action="events"><span data-icon="calendar"></span><strong>Events</strong></button><button data-action="paperwork"><span data-icon="document"></span><strong>Bureaucracy</strong></button><button data-action="departures"><span data-icon="train"></span><strong>Departures</strong></button><button data-action="services"><span data-icon="grid"></span><strong>Services</strong></button></nav>
  <div id="day-flow">
  <section id="at-a-glance" class="at-a-glance" aria-labelledby="glance-title"></section>
  <section id="your-day-overview" class="your-day-overview" aria-label="Your day" hidden></section>
  <div class="board-body" id="discovery-board">
   <section class="places-section" aria-labelledby="places-title"><div class="board-section-heading"><div><h2 id="places-title">A little discovery</h2></div><button class="all-link" data-action="places">All places<span data-icon="arrow"></span></button></div><div class="place-pair">
    <article class="place-tile walk-tile"><button class="place-image" data-detail="walk" aria-label="View a waterside walk"><img src="./assets/waterside.png" alt="Generated sample scene of a waterside park"><span class="image-provenance">Illustration</span><span class="category-label"><span data-icon="leaf"></span>Outdoors</span></button><div class="place-summary"><button data-detail="walk"><h3>A waterside walk</h3></button><button class="keep-round" data-keep="walk" aria-label="Keep a waterside walk" aria-pressed="false"><span data-icon="plus"></span></button></div><div class="place-context"><span data-icon="leaf"></span><span>Waterside path</span></div><p class="place-check">Access unverified</p></article>
    <article class="place-tile cafe-tile"><button class="place-image" data-detail="cafe" aria-label="View a courtyard café"><img src="./assets/courtyard.png" alt="Generated sample scene of a neighbourhood café"><span class="image-provenance">Illustration</span><span class="category-label"><span data-icon="coffee"></span>Cafés</span></button><div class="place-summary"><button data-detail="cafe"><h3>A courtyard café</h3></button><button class="keep-round" data-keep="cafe" aria-label="Keep a courtyard café" aria-pressed="false"><span data-icon="plus"></span></button></div><div class="place-context"><span data-icon="coffee"></span><span>Outdoor seating</span></div><p class="place-check">Hours unverified</p></article>

    <button class="event-item" data-detail="music"><span class="event-symbol music"><span data-icon="music"></span></span><span class="event-copy"><small>Live music</small><strong>Open-air music</strong><em class="event-meta">Open air <i></i> Date to confirm</em></span><span class="event-arrow" data-icon="arrow"></span></button>

  </div>
  </div>

 </main>
</div>
