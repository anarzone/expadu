<svg xmlns="http://www.w3.org/2000/svg" width="32" height="40" viewBox="0 0 32 40" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Expadu — original Concept B, subtle polish</title>
  <desc id="description">Minimal cleanup of the original Concept B reconstruction. Two separate ribbon pieces, upper cap, cutouts, size, orange gradients and typography retained. Small inner-corner fillets and a one-unit reduction of the mark-to-wordmark gap.</desc>
