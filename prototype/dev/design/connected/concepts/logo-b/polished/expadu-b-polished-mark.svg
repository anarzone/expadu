  <stop offset=".42" stop-color="#ff7c4b"/>
  <stop offset="1" stop-color="#ff632e"/>
  </radialGradient>
  <linearGradient id="orange-lower" gradientUnits="userSpaceOnUse" x1="3" y1="24" x2="22" y2="32">
  <stop stop-color="#ff7038"/>
  <stop offset="1" stop-color="#ff602b"/>
  </linearGradient>
  </defs>
