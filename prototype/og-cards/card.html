<!doctype html>
<!--
    Open Graph card template (1200×630) for the marketing pages, matching the
    original public/marketing/og-landing.png. render.mjs fills it per page.
-->
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <style>
            @font-face {
                font-family: Fraunces;
                font-weight: 500;
                src: url(../../public/fonts/fraunces-500.woff2) format('woff2');
            }
            @font-face {
                font-family: 'Geist Mono';
                font-weight: 500;
                src: url(../../public/fonts/geist-mono-500.woff2)
                    format('woff2');
            }

            * {
                box-sizing: border-box;
                margin: 0;
            }
            html,
            body {
                width: 1200px;
                height: 630px;
                overflow: hidden;
            }
            body {
                position: relative;
                background: radial-gradient(
                    circle at 1085px 585px,
                    #521d06 0,
                    #311607 120px,
                    #241408 185px,
                    #161208 330px
                );
                color: #f7f3e9;
                font-family: Fraunces, serif;
                font-weight: 500;
                -webkit-font-smoothing: antialiased;
            }
            .mark {
                position: absolute;
                left: 80px;
                top: 76px;
                display: flex;
                align-items: center;
                gap: 14px;
                font-size: 44px;
                letter-spacing: -0.01em;
            }
            .mark::before {
                content: '';
                width: 16px;
                height: 16px;
                border-radius: 50%;
                background: #ff3902;
            }
            .eyebrow {
                position: absolute;
                left: 80px;
                top: 164px;
                font:
                    500 20px 'Geist Mono',
                    monospace;
                letter-spacing: 0.14em;
                text-transform: uppercase;
                color: #ff5c33;
            }
            h1 {
                position: absolute;
                left: 80px;
                width: 820px;
                top: 200px;
                font-size: var(--size, 76px);
                line-height: 1.15;
                letter-spacing: -0.012em;
                font-weight: 500;
            }
            h1 em {
                font-style: normal;
                color: #ff5c33;
            }
            .tags {
                position: absolute;
                left: 80px;
                bottom: 72px;
                display: flex;
                gap: 28px;
                font:
                    500 20px 'Geist Mono',
                    monospace;
                color: #a89e8a;
            }
            .tags span::before {
                content: '';
                display: inline-block;
                width: 6px;
                height: 6px;
                border-radius: 50%;
                background: #ff3902;
                margin-right: 10px;
                vertical-align: middle;
            }
        </style>
    </head>
    <body>
        <div class="mark">Expadu</div>
        <div class="eyebrow" id="eyebrow"></div>
        <h1 id="title"></h1>
        <div class="tags" id="tags"></div>
    </body>
</html>
