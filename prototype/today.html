<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Expadu v2 — Today</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F6F5F1; --surface: #FFFFFF; --surface-2: #EFEDE7; --border: #E2DFD6;
  --text-1: #18170F; --text-2: #6B6860; --text-3: #AAA89F;
  --accent: #1A4CD4; --accent-h: #1540B8; --accent-soft: #EBF0FD;
  --success: #0A7C52; --success-s: #D4F0E6; --warn: #C47D0E; --warn-s: #FDF0D4;
  --danger: #C4271A; --danger-s: #FDE8E6;
  --r: 14px; --r-sm: 9px; --r-lg: 20px;
  --shadow: 0 1px 3px rgba(24,23,15,.05), 0 6px 24px rgba(24,23,15,.06);
}
.dark {
  --bg: #14130D; --surface: #1E1D15; --surface-2: #2A2920; --border: #3A3930;
  --text-1: #F6F5F1; --text-2: #AAA89F; --text-3: #6B6860;
  --accent-soft: rgba(26,76,212,.2);
  --success-s: rgba(10,124,82,.18); --warn-s: rgba(196,125,14,.16); --danger-s: rgba(196,39,26,.16);
  --shadow: 0 1px 3px rgba(0,0,0,.3), 0 6px 24px rgba(0,0,0,.25);
}
.dark .tile.danger  { border-color: rgba(196,39,26,.4); border-left-color: var(--danger); }
.dark .tile.warn    { border-color: rgba(196,125,14,.4); border-left-color: var(--warn); }
.dark .tile.info    { border-color: rgba(26,76,212,.4); border-left-color: var(--accent); }

* { margin: 0; padding: 0; box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: 'Geist', system-ui, sans-serif;
  background: var(--bg); color: var(--text-1);
  transition: background .25s, color .25s;
}
.shell { max-width: 600px; margin: 0 auto; padding: 24px 16px 120px; }

/* ── Dark toggle ── */
.mode-toggle {
  position: fixed; top: 14px; right: 14px; z-index: 50;
  width: 38px; height: 38px; border-radius: 100px;
  border: 1px solid var(--border); background: var(--surface);
  font-size: 16px; cursor: pointer; box-shadow: var(--shadow);
  display: flex; align-items: center; justify-content: center;
  transition: all .2s;
}
.mode-toggle:hover { border-color: var(--accent); }

/* ── Header ── */
.date-line {
  font-family: 'Geist Mono', monospace; font-size: 11px; font-weight: 500;
  text-transform: uppercase; letter-spacing: .1em; color: var(--text-3);
  margin-bottom: 8px;
}
.head-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 24px; }
.greeting {
  font-family: 'Fraunces', serif; font-weight: 500; font-size: 28px;
  letter-spacing: -.02em; line-height: 1.15; color: var(--text-1);
}
.weather-chip {
  display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0;
  padding: 7px 12px; border-radius: 100px; margin-top: 2px;
  background: var(--surface); border: 1px solid var(--border);
  font-size: 13px; font-weight: 600; color: var(--text-1);
  box-shadow: var(--shadow);
}

/* ── Day Composer prompt ── */
.composer {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r-lg); padding: 18px; margin-bottom: 12px;
  box-shadow: var(--shadow); transition: border-color .2s;
}
.composer:focus-within { border-color: var(--accent); }
.composer-label {
  font-family: 'Geist Mono', monospace; font-size: 11px; font-weight: 500;
  text-transform: uppercase; letter-spacing: .1em; color: var(--text-3);
  margin-bottom: 10px; display: flex; align-items: center; gap: 6px;
}
.composer-input-row { display: flex; align-items: center; gap: 10px; }
.composer-input {
  flex: 1; border: none; outline: none; background: transparent;
  font-family: 'Geist', sans-serif; font-size: 16px; color: var(--text-1);
  min-width: 0;
}
.composer-input::placeholder { color: var(--text-3); }
.composer-go {
  width: 38px; height: 38px; flex-shrink: 0; border-radius: 100px;
  border: none; background: var(--accent); color: #fff;
  font-size: 16px; cursor: pointer; transition: background .2s;
  display: flex; align-items: center; justify-content: center;
}
.composer-go:hover { background: var(--accent-h); }

.chip-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 28px; }
.chip {
  padding: 8px 14px; border-radius: 100px;
  border: 1px solid var(--border); background: var(--surface);
  font-family: 'Geist', sans-serif; font-size: 13px; font-weight: 500;
  color: var(--text-2); cursor: pointer; transition: all .15s;
}
.chip:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }

/* ── Section label ── */
.section-label {
  font-family: 'Geist Mono', monospace; font-size: 11px; font-weight: 500;
  text-transform: uppercase; letter-spacing: .1em; color: var(--text-3);
  margin-bottom: 12px;
}

/* ── Urgency tiles ── */
.tiles { display: flex; flex-direction: column; gap: 10px; }
.tile {
  display: flex; align-items: center; gap: 14px;
  background: var(--surface); border: 1px solid var(--border);
  border-left: 3px solid var(--border);
  border-radius: var(--r); padding: 16px; cursor: pointer;
  transition: all .15s; text-align: left; width: 100%;
}
.tile:hover { box-shadow: var(--shadow); transform: translateY(-1px); }
.tile-emoji { font-size: 22px; flex-shrink: 0; width: 28px; text-align: center; }
.tile-body { flex: 1; min-width: 0; }
.tile-title { font-size: 14px; font-weight: 600; color: var(--text-1); line-height: 1.35; }
.tile-sub { font-size: 13px; color: var(--text-2); margin-top: 3px; line-height: 1.4; }
.tile-chevron { color: var(--text-3); font-size: 16px; flex-shrink: 0; transition: transform .15s, color .15s; }
.tile:hover .tile-chevron { transform: translateX(2px); color: var(--text-2); }

.tile.danger { background: var(--danger-s); border-color: var(--danger-s); border-left-color: var(--danger); }
.tile.danger .tile-title { color: var(--danger); }
.dark .tile.danger .tile-title { color: #F08A80; }
.tile.warn { background: var(--warn-s); border-color: var(--warn-s); border-left-color: var(--warn); }
.tile.info { background: var(--accent-soft); border-color: var(--accent-soft); border-left-color: var(--accent); }
.tile.info .tile-title { color: var(--accent); }
.dark .tile.info .tile-title { color: #8FAAF0; }

/* ── Bottom dock ── */
.dock {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 40;
  background: var(--surface); border-top: 1px solid var(--border);
  padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
}
.dock-inner { max-width: 600px; margin: 0 auto; display: flex; }
.dock-item {
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 6px 0; border: none; background: transparent; cursor: pointer;
  font-family: 'Geist', sans-serif; font-size: 10.5px; font-weight: 500;
  color: var(--text-3); border-radius: var(--r-sm); transition: color .15s;
}
.dock-item:hover { color: var(--text-2); }
.dock-item .ic { font-size: 19px; line-height: 1; }
.dock-item.active { color: var(--accent); font-weight: 600; }
</style>
</head>
<body>

<button class="mode-toggle" onclick="document.documentElement.classList.toggle('dark'); this.textContent = document.documentElement.classList.contains('dark') ? '☀️' : '🌙';" title="Toggle dark mode">🌙</button>

<div class="shell">

  <!-- Header -->
  <div class="date-line">Wed · 10 June 2026 · Cologne</div>
  <div class="head-row">
    <h1 class="greeting">Good afternoon,<br>Anar</h1>
    <span class="weather-chip">☀️ 22°C</span>
  </div>

  <!-- Day Composer prompt -->
  <div class="composer">
    <div class="composer-label">✨ Day Composer</div>
    <div class="composer-input-row">
      <input class="composer-input" type="text" placeholder="What do you want to do? Try: free Saturday afternoon…">
      <button class="composer-go" title="Compose">→</button>
    </div>
  </div>
  <div class="chip-row">
    <button class="chip">🌳 Free Saturday afternoon</button>
    <button class="chip">👶 Something with kids tomorrow</button>
    <button class="chip">🍻 Meet people tonight</button>
  </div>

  <!-- Urgency-ranked tiles -->
  <div class="section-label">Needs your attention</div>
  <div class="tiles">

    <button class="tile danger">
      <span class="tile-emoji">📋</span>
      <span class="tile-body">
        <span class="tile-title">Register your address (Anmeldung)</span>
        <span class="tile-sub" style="display:block;">Overdue by 2 days — usually fixable, see next steps</span>
      </span>
      <span class="tile-chevron">›</span>
    </button>

    <button class="tile warn">
      <span class="tile-emoji">⚠️</span>
      <span class="tile-body">
        <span class="tile-title">Line 12, 15 disrupted</span>
        <span class="tile-sub" style="display:block;">Strike today — KVB tram network affected until 18:00</span>
      </span>
      <span class="tile-chevron">›</span>
    </button>

    <button class="tile warn">
      <span class="tile-emoji">🛒</span>
      <span class="tile-body">
        <span class="tile-title">Tomorrow is Fronleichnam — everything closed</span>
        <span class="tile-sub" style="display:block;">Supermarkets and most shops shut. Shop today.</span>
      </span>
      <span class="tile-chevron">›</span>
    </button>

    <button class="tile info">
      <span class="tile-emoji">📅</span>
      <span class="tile-body">
        <span class="tile-title">Bürgeramt slot available</span>
        <span class="tile-sub" style="display:block;">2 dates at Bürgeramt Ehrenfeld — tap to book</span>
      </span>
      <span class="tile-chevron">›</span>
    </button>

    <button class="tile">
      <span class="tile-emoji">🎟️</span>
      <span class="tile-body">
        <span class="tile-title">Tonight: International Expat Mixer</span>
        <span class="tile-sub" style="display:block;">18:00 · Startplatz · +3 more events</span>
      </span>
      <span class="tile-chevron">›</span>
    </button>

    <button class="tile">
      <span class="tile-emoji">🗓️</span>
      <span class="tile-body">
        <span class="tile-title">Plan your weekend</span>
        <span class="tile-sub" style="display:block;">Tell the composer what kind of day you want.</span>
      </span>
      <span class="tile-chevron">›</span>
    </button>

  </div>
</div>

<!-- Bottom dock -->
<nav class="dock">
  <div class="dock-inner">
    <button class="dock-item active"><span class="ic">🏠</span>Today</button>
    <button class="dock-item"><span class="ic">🌳</span>Places</button>
    <button class="dock-item"><span class="ic">🎟️</span>Events</button>
    <button class="dock-item"><span class="ic">📋</span>Bureaucracy</button>
    <button class="dock-item"><span class="ic">⋯</span>More</button>
  </div>
</nav>

</body>
</html>
