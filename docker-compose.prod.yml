services:
  app:
    image: ghcr.io/anarzone/expadu/app:latest
    pull_policy: always
    restart: always
    environment:
      APP_ENV: production
      APP_DEBUG: '0'
      APP_URL: ${APP_URL}
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: pgsql
      DB_HOST: pgsql
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_PERSISTENT: ${DB_PERSISTENT:-false}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # The cache gets its own bounded, evicting instance (EXP-95).
      REDIS_CACHE_HOST: redis-cache
      REDIS_CACHE_PORT: 6379
      REDIS_CLIENT: phpredis
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      MAIL_MAILER: ${MAIL_MAILER:-log}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-hello@expadu.com}
      BCRYPT_ROUNDS: 12
      LOG_CHANNEL: stack
    ports:
      - '8080:8080'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://127.0.0.1:8080/up']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      pgsql:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-cache:
        condition: service_healthy

  pgsql:
    image: imresamu/postgis:16-3.4
    environment:
      PGPASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgsql-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD', 'pg_isready', '-q', '-d', '${DB_DATABASE}', '-U', '${DB_USERNAME}']
      interval: 10s
      retries: 3
      timeout: 5s
    restart: always

  # State: sessions, queues, locks, alert buses, location history. Bounded
  # but never evicted — a write fails loudly instead of a session or queued
  # job vanishing, and api:health reports to Sentry from 80%. Check
  # `redis-cli INFO memory` before lowering REDIS_MAXMEMORY.
  redis:
    image: redis:alpine
    command: redis-server --appendonly yes --maxmemory ${REDIS_MAXMEMORY:-256mb} --maxmemory-policy noeviction
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      retries: 3
      timeout: 5s
    restart: always

  # Cache only: bounded, least-recently-used keys evicted, nothing persisted.
  redis-cache:
    image: redis:alpine
    command: redis-server --maxmemory ${REDIS_CACHE_MAXMEMORY:-128mb} --maxmemory-policy allkeys-lru --save '' --appendonly no
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      retries: 3
      timeout: 5s
    restart: always

volumes:
  pgsql-data:
  redis-data:
