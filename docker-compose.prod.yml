services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        ports:
            - '${APP_PORT:-8080}:8080'
        environment:
            - APP_ENV=production
            - APP_DEBUG=false
        env_file:
            - .env
        depends_on:
            pgsql:
                condition: service_healthy
            redis:
                condition: service_healthy
        networks:
            - expadu
        restart: unless-stopped

    pgsql:
        image: 'postgis/postgis:16-3.4'
        environment:
            PGPASSWORD: '${DB_PASSWORD}'
            POSTGRES_DB: '${DB_DATABASE}'
            POSTGRES_USER: '${DB_USERNAME}'
            POSTGRES_PASSWORD: '${DB_PASSWORD}'
        volumes:
            - 'pgsql-data:/var/lib/postgresql/data'
            - './docker/pgsql/create-postgis-extensions.sql:/docker-entrypoint-initdb.d/20-create-postgis-extensions.sql'
        networks:
            - expadu
        healthcheck:
            test: ['CMD', 'pg_isready', '-q', '-d', '${DB_DATABASE}', '-U', '${DB_USERNAME}']
            retries: 3
            timeout: 5s
        restart: unless-stopped

    redis:
        image: 'redis:alpine'
        volumes:
            - 'redis-data:/data'
        networks:
            - expadu
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            retries: 3
            timeout: 5s
        restart: unless-stopped

    valhalla:
        image: 'ghcr.io/gis-ops/docker-valhalla/valhalla:latest'
        volumes:
            - 'valhalla-data:/custom_files'
        environment:
            - use_tiles_ignore_pbf=True
            - force_rebuild=False
            - serve_tiles=True
            - build_elevation=False
            - build_admins=False
        networks:
            - expadu
        restart: unless-stopped

networks:
    expadu:
        driver: bridge

volumes:
    pgsql-data:
        driver: local
    redis-data:
        driver: local
    valhalla-data:
        driver: local
