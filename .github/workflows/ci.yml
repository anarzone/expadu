name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Install Dependencies
        run: |
          composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
          npm ci --legacy-peer-deps

      - name: PHP Code Style
        run: composer lint:check

      - name: Prettier
        run: npm run format:check

      - name: ESLint
        run: npm run lint:check || true # TODO: fix remaining ESLint errors

  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 3s
          --health-retries 5

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: testing
      DB_USERNAME: sail
      DB_PASSWORD: password
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: pdo_pgsql, redis

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Build Postgres image (postgis + pgvector)
        run: docker build -t expadu-pgsql ./docker/pgsql

      - name: Start Postgres
        run: |
          docker run -d --name pgsql \
            -e POSTGRES_USER=sail \
            -e POSTGRES_PASSWORD=password \
            -e POSTGRES_DB=testing \
            -p 5432:5432 \
            expadu-pgsql
          # Wait for the entrypoint to finish ALL init scripts, not just
          # the moment pg_isready first returns success — pg_isready can
          # flicker green during postgis setup and crash if a host-side
          # client connects mid-init.
          for i in $(seq 1 60); do
            if docker exec pgsql psql -U sail -d testing -c "SELECT 1" >/dev/null 2>&1; then
              # Confirm both extensions are loadable (proves init finished)
              if docker exec pgsql psql -U sail -d testing -c "SELECT extname FROM pg_extension WHERE extname IN ('postgis','vector')" 2>/dev/null | grep -q vector; then
                echo "postgres ready after ${i}s"
                exit 0
              fi
            fi
            sleep 1
          done
          echo "postgres did not become ready or extensions not installed"
          docker logs pgsql
          exit 1

      - name: Prepare Environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Setup Test Databases
        # Use docker exec (peer auth, no host TCP) — the host networking
        # path was racy with the postgis entrypoint's restart cycle.
        run: |
          for i in $(seq 1 10); do
            docker exec pgsql createdb -U sail "testing_test_$i" 2>/dev/null || true
            docker exec pgsql psql -U sail -d "testing_test_$i" \
              -c "CREATE EXTENSION IF NOT EXISTS postgis; CREATE EXTENSION IF NOT EXISTS vector;" >/dev/null
          done
          docker exec pgsql psql -U sail -d testing \
            -c "CREATE EXTENSION IF NOT EXISTS postgis; CREATE EXTENSION IF NOT EXISTS vector;" >/dev/null

      - name: Run Tests
        run: vendor/bin/pest --compact --parallel --exclude-group=slow

  browser-test:
    name: Browser Tests
    runs-on: ubuntu-latest
    # Gates deploys: deploy-staging / deploy-production list this in `needs`, so
    # a red Playwright suite blocks the ship. Runs the auth + chromium projects
    # against a freshly built app + seeded DB (+ the E2E user), serves on :8080,
    # and uploads the report so any regression is visible.
    timeout-minutes: 25

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 3s
          --health-retries 5

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: testing
      DB_USERNAME: sail
      DB_PASSWORD: password
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      APP_URL: http://localhost:8080

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: pdo_pgsql, redis

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Install Dependencies
        run: |
          composer install --no-interaction --prefer-dist --optimize-autoloader
          npm ci --legacy-peer-deps

      - name: Build frontend
        run: npm run build

      - name: Build Postgres image (postgis + pgvector)
        run: docker build -t expadu-pgsql ./docker/pgsql

      - name: Start Postgres
        run: |
          docker run -d --name pgsql \
            -e POSTGRES_USER=sail \
            -e POSTGRES_PASSWORD=password \
            -e POSTGRES_DB=testing \
            -p 5432:5432 \
            expadu-pgsql
          for i in $(seq 1 60); do
            if docker exec pgsql psql -U sail -d testing -c "SELECT 1" >/dev/null 2>&1; then
              if docker exec pgsql psql -U sail -d testing -c "SELECT extname FROM pg_extension WHERE extname IN ('postgis','vector')" 2>/dev/null | grep -q vector; then
                echo "postgres ready after ${i}s"
                break
              fi
            fi
            sleep 1
          done
          docker exec pgsql psql -U sail -d testing \
            -c "CREATE EXTENSION IF NOT EXISTS postgis; CREATE EXTENSION IF NOT EXISTS vector;" >/dev/null

      - name: Prepare Environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Migrate + seed (content + E2E user)
        run: |
          php artisan migrate --force --seed
          php artisan db:seed --force --class=E2ETestUserSeeder

      - name: Install Playwright (chromium)
        run: npx playwright install --with-deps chromium

      - name: Start app server
        run: |
          php artisan serve --port=8080 --no-interaction > /tmp/serve.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/login >/dev/null; then
              echo "server up after ${i}s"
              break
            fi
            sleep 1
          done

      - name: Run browser tests
        run: npx playwright test --project=auth --project=chromium

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  detect-changes:
    name: Detect path changes
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    outputs:
      pgsql: ${{ steps.filter.outputs.pgsql }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            pgsql:
              - 'docker/pgsql/**'

  build-and-push:
    name: Build & Push Image
    # Build only waits on lint, runs in parallel with test. Deploy waits on both.
    needs: [lint]
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}/app

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image tag
        id: tag
        run: |
          if [ "${{ github.ref }}" = "refs/heads/staging" ]; then
            echo "tag=staging" >> $GITHUB_OUTPUT
          else
            echo "tag=latest" >> $GITHUB_OUTPUT
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          # Frontend Sentry is baked at build time. DSN comes from a repo secret
          # (it's public — shipped to browsers — but a secret keeps the log clean);
          # the environment is derived from the branch, the release from the sha.
          build-args: |
            VITE_SENTRY_DSN_PUBLIC=${{ secrets.VITE_SENTRY_DSN_PUBLIC }}
            VITE_SENTRY_ENVIRONMENT=${{ steps.tag.outputs.tag == 'staging' && 'staging' || 'production' }}
            VITE_SENTRY_RELEASE=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-pgsql:
    name: Build & Push pgsql Image
    needs: [lint, detect-changes]
    if: needs.detect-changes.outputs.pgsql == 'true' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}/pgsql

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image tag
        id: tag
        run: |
          if [ "${{ github.ref }}" = "refs/heads/staging" ]; then
            echo "tag=staging" >> $GITHUB_OUTPUT
          else
            echo "tag=latest" >> $GITHUB_OUTPUT
          fi

      - name: Build and push pgsql
        uses: docker/build-push-action@v6
        with:
          context: ./docker/pgsql
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha,scope=pgsql
          cache-to: type=gha,scope=pgsql,mode=max

  deploy-staging:
    name: Deploy to Staging
    # Tests must pass before we deploy — build runs in parallel with them but
    # the image only ships if the unit/feature suite and the browser suite come
    # back green.
    needs: [build-and-push, test, browser-test]
    if: github.ref == 'refs/heads/staging' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /data/staging
            docker compose pull
            docker compose up -d --force-recreate
            sleep 5
            docker exec staging-app php artisan migrate --force
            docker exec staging-app php artisan bureaucracy:import-tasks --prune

  deploy-production:
    name: Deploy to Production
    needs: [build-and-push, test, browser-test]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /data/coolify/services/eg4gsc4ok8g0cwkcsso48wso
            docker pull ghcr.io/anarzone/expadu/app:latest
            docker compose up -d app
            sleep 5
            docker exec app-eg4gsc4ok8g0cwkcsso48wso php artisan migrate --force
            docker exec app-eg4gsc4ok8g0cwkcsso48wso php artisan bureaucracy:import-tasks --prune
