name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    # The launch branch too: its PRs get the same lint, tests and browser specs as a
    # release, on GitHub's machines. Deploy jobs still run only for main and staging.
    branches: [main, staging, 'launch/**']
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Install Dependencies
        run: |
          composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
          npm ci --legacy-peer-deps

      - name: PHP Code Style
        run: composer lint:check

      - name: Prettier
        run: npm run format:check

      - name: ESLint
        run: npm run lint:check

      - name: Frontend behavior tests
        run: node --experimental-strip-types --import ./tests/Frontend/support/register.mjs --test tests/Frontend/*.test.mjs tests/Unit/Frontend/*.test.cjs

  test:
    # Three shards in parallel: the suite took ~15 min as one job and gated every
    # PR and staging deploy. Deploy jobs' `needs: [test]` waits for all three.
    name: Test (${{ matrix.shard }}/3)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 3s
          --health-retries 5

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: testing
      DB_USERNAME: sail
      DB_PASSWORD: password
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: pdo_pgsql, redis

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Build Postgres image (postgis + pgvector)
        run: docker build -t expadu-pgsql ./docker/pgsql

      - name: Start Postgres
        run: |
          docker run -d --name pgsql \
            -e POSTGRES_USER=sail \
            -e POSTGRES_PASSWORD=password \
            -e POSTGRES_DB=testing \
            -p 5432:5432 \
            expadu-pgsql
          # Wait for the entrypoint to finish ALL init scripts, not just
          # the moment pg_isready first returns success — pg_isready can
          # flicker green during postgis setup and crash if a host-side
          # client connects mid-init.
          for i in $(seq 1 60); do
            if docker exec pgsql psql -U sail -d testing -c "SELECT 1" >/dev/null 2>&1; then
              # Confirm both extensions are loadable (proves init finished)
              if docker exec pgsql psql -U sail -d testing -c "SELECT extname FROM pg_extension WHERE extname IN ('postgis','vector')" 2>/dev/null | grep -q vector; then
                echo "postgres ready after ${i}s"
                exit 0
              fi
            fi
            sleep 1
          done
          echo "postgres did not become ready or extensions not installed"
          docker logs pgsql
          exit 1

      - name: Prepare Environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Setup Test Databases
        # Use docker exec (peer auth, no host TCP) — the host networking
        # path was racy with the postgis entrypoint's restart cycle.
        run: |
          for i in $(seq 1 10); do
            docker exec pgsql createdb -U sail "testing_test_$i" 2>/dev/null || true
            docker exec pgsql psql -U sail -d "testing_test_$i" \
              -c "CREATE EXTENSION IF NOT EXISTS postgis; CREATE EXTENSION IF NOT EXISTS vector;" >/dev/null
          done
          docker exec pgsql psql -U sail -d testing \
            -c "CREATE EXTENSION IF NOT EXISTS postgis; CREATE EXTENSION IF NOT EXISTS vector;" >/dev/null

      - name: Run Tests
        run: vendor/bin/pest --compact --parallel --exclude-group=slow --filter "$(php tests/shard.php ${{ matrix.shard }} 3)"

      # Two worker processes meet at a database lock barrier; that only
      # behaves deterministically outside the parallel runner, so run it alone.
      - name: Run concurrency tests (serial)
        if: matrix.shard == 1
        run: vendor/bin/pest --compact --group=serial-concurrency

  browser-test:
    name: Browser Tests
    runs-on: ubuntu-latest
    # Gates deploys: deploy-staging / deploy-production list this in `needs`, so
    # a red Playwright suite blocks the ship. Runs the auth + desktop + mobile projects
    # against a freshly built app + seeded DB (+ the E2E user), serves on :8080,
    # and uploads the report so any regression is visible.
    timeout-minutes: 40

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 3s
          --health-retries 5

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: testing
      DB_USERNAME: sail
      DB_PASSWORD: password
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      APP_URL: http://localhost:8080
      # `npm run build` runs before `.env` exists, so without this Laravel
      # defaults APP_ENV to production — which flips on URL::forceScheme('https')
      # and makes Wayfinder bake absolute https://localhost:8080/* route URLs
      # into the bundle. The real login POST then targets https on the http-only
      # dev server and dies with "Couldn't reach the server". Pin local so the
      # build emits relative route URLs.
      APP_ENV: local

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: pdo_pgsql, redis

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Install Dependencies
        run: |
          composer install --no-interaction --prefer-dist --optimize-autoloader
          npm ci --legacy-peer-deps

      - name: Build frontend
        run: |
          npm run build
          npx vite build --ssr

      - name: TypeScript (after generated routes)
        run: |
          npm run types:check
          npx tsc --noEmit --skipLibCheck --target ES2022 --module ESNext --moduleResolution bundler --lib WebWorker resources/sw.ts

      - name: Build Postgres image (postgis + pgvector)
        run: docker build -t expadu-pgsql ./docker/pgsql

      - name: Start Postgres
        run: |
          docker run -d --name pgsql \
            -e POSTGRES_USER=sail \
            -e POSTGRES_PASSWORD=password \
            -e POSTGRES_DB=testing \
            -p 5432:5432 \
            expadu-pgsql
          for i in $(seq 1 60); do
            if docker exec pgsql psql -U sail -d testing -c "SELECT 1" >/dev/null 2>&1; then
              if docker exec pgsql psql -U sail -d testing -c "SELECT extname FROM pg_extension WHERE extname IN ('postgis','vector')" 2>/dev/null | grep -q vector; then
                echo "postgres ready after ${i}s"
                break
              fi
            fi
            sleep 1
          done
          docker exec pgsql psql -U sail -d testing \
            -c "CREATE EXTENSION IF NOT EXISTS postgis; CREATE EXTENSION IF NOT EXISTS vector;" >/dev/null

      - name: Prepare Environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # Relative persona dates and Node assertions must share the app calendar,
      # including the UTC/Berlin month boundary after local midnight.
      - name: Match browser-test calendar to application
        run: |
          browser_test_timezone="$(php -r 'require "vendor/autoload.php"; echo (require "config/app.php")["timezone"];')"
          echo "TZ=$browser_test_timezone" >> "$GITHUB_ENV"

      - name: Migrate + seed (content + E2E user)
        run: |
          php artisan migrate --force --seed
          php artisan db:seed --force --class=E2ETestUserSeeder
          # composer-workspace.spec plans a day from these test-only places.
          php artisan db:seed --force --class=E2EComposerCatalogueSeeder

      # The browser download from Playwright's CDN failed several runs on 21–22 Oct
      # and blocked deploys; a cached copy skips it (system deps still install).
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright (chromium)
        run: npx playwright install --with-deps chromium

      - name: Start app server
        run: |
          node bootstrap/ssr/ssr.js > /tmp/ssr.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:13714/health >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -sf http://localhost:13714/health >/dev/null
          php artisan serve --port=8080 --no-interaction > /tmp/serve.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/login >/dev/null; then
              echo "server up after ${i}s"
              break
            fi
            sleep 1
          done

      - name: Run browser tests
        run: npx playwright test --project=auth --project=chromium --project=mobile

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  detect-changes:
    name: Detect path changes
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    outputs:
      pgsql: ${{ steps.filter.outputs.pgsql }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            pgsql:
              - 'docker/pgsql/**'

  build-and-push:
    name: Build & Push Image
    # Build only waits on lint, runs in parallel with test. Deploy waits on both.
    needs: [lint]
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}/app

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image tag
        id: tag
        run: |
          if [ "${{ github.ref }}" = "refs/heads/staging" ]; then
            echo "tag=staging" >> $GITHUB_OUTPUT
          else
            echo "tag=latest" >> $GITHUB_OUTPUT
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          # Frontend Sentry is baked at build time. DSN comes from a repo secret
          # (it's public — shipped to browsers — but a secret keeps the log clean);
          # the environment is derived from the branch, the release from the sha.
          build-args: |
            APP_COMMIT=${{ github.sha }}
            VITE_SENTRY_DSN_PUBLIC=${{ secrets.VITE_SENTRY_DSN_PUBLIC }}
            VITE_SENTRY_ENVIRONMENT=${{ steps.tag.outputs.tag == 'staging' && 'staging' || 'production' }}
            VITE_SENTRY_RELEASE=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-pgsql:
    name: Build & Push pgsql Image
    needs: [lint, detect-changes]
    if: needs.detect-changes.outputs.pgsql == 'true' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}/pgsql

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image tag
        id: tag
        run: |
          if [ "${{ github.ref }}" = "refs/heads/staging" ]; then
            echo "tag=staging" >> $GITHUB_OUTPUT
          else
            echo "tag=latest" >> $GITHUB_OUTPUT
          fi

      - name: Build and push pgsql
        uses: docker/build-push-action@v6
        with:
          context: ./docker/pgsql
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha,scope=pgsql
          cache-to: type=gha,scope=pgsql,mode=max

  deploy-staging:
    name: Deploy to Staging
    # Tests must pass before we deploy — build runs in parallel with them but
    # the image only ships if the unit/feature suite and the browser suite come
    # back green.
    # Browser tests still run and report, but don't hold staging back (owner, 30 Oct 2026):
    # 14 specs test the pre-redesign screens and are being rewritten. Production keeps the gate.
    needs: [build-and-push, test]
    if: github.ref == 'refs/heads/staging' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            # A failing step fails the job; without it the catalogue steps hit
            # missing tables and the deploy still showed green.
            set -e
            cd /data/staging
            # The image running now, so a deploy that doesn't come up can be rolled back.
            PREVIOUS=$(docker inspect --format '{{.Image}}' staging-app 2>/dev/null || true)
            docker compose pull
            docker compose up -d --force-recreate
            sleep 5
            # Staging's compose replaces the image entrypoint (fix-nginx.sh), so
            # nothing migrates or caches on boot: migrate and build the framework
            # caches here (as the image's entrypoint does on prod), before the
            # deploy-time catalogue steps (import, source check, release, dossiers),
            # all run as www-data so the files they write stay writable by the app.
            docker exec -u www-data staging-app php artisan migrate --force
            docker exec -u www-data staging-app php artisan config:cache
            docker exec -u www-data staging-app php artisan route:cache
            docker exec -u www-data staging-app php artisan view:cache
            docker exec -u www-data staging-app php artisan event:cache || echo "event:cache failed; events are discovered at runtime"
            docker exec -u www-data staging-app php artisan filament:optimize || echo "filament:optimize failed; panels resolve at runtime"
            docker exec -u www-data staging-app php artisan schedule:clear-cache || echo "Could not clear schedule locks"
            docker exec -u www-data staging-app php artisan bureaucracy:import-tasks --retire-missing
            docker exec -u www-data staging-app php artisan bureaucracy:verify-sources
            docker exec -u www-data staging-app php artisan bureaucracy:compile-catalogue --deploy
            docker exec -u www-data staging-app php artisan bureaucracy:migrate-dossiers --apply --all
            # Health: /up answers within a minute, or the previous image comes back and the job fails.
            # Pruned only after, so the previous image is still there to return to.
            for attempt in $(seq 1 12); do
              if curl -fsS -o /dev/null https://app.staging.expadu.com/up; then docker image prune -f; exit 0; fi
              sleep 5
            done
            echo "Staging did not answer /up after the deploy; rolling back."
            if [ -n "$PREVIOUS" ]; then
              docker tag "$PREVIOUS" "$(docker inspect --format '{{.Config.Image}}' staging-app)"
              docker compose up -d --force-recreate
            fi
            exit 1

  deploy-production:
    name: Deploy to Production
    needs: [build-and-push, test, browser-test]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /data/coolify/services/eg4gsc4ok8g0cwkcsso48wso
            # Coolify names the container app-<service dir>; derived so the literal never
            # appears here (it matches the Dify API-key pattern secret scanners look for).
            APP_CONTAINER="app-$(basename "$PWD")"
            # The image running now, so a deploy that doesn't come up can be rolled back.
            PREVIOUS=$(docker inspect --format '{{.Image}}' "$APP_CONTAINER" 2>/dev/null || true)
            docker pull ghcr.io/anarzone/expadu/app:latest
            docker compose up -d app
            sleep 5
            # The entrypoint migrates before PHP-FPM starts; these are the
            # deploy-time catalogue steps (import, source check, release, dossiers),
            # run as www-data so the log files they create stay writable by the app.
            docker exec -u www-data "$APP_CONTAINER" php artisan bureaucracy:import-tasks --retire-missing
            docker exec -u www-data "$APP_CONTAINER" php artisan bureaucracy:verify-sources
            docker exec -u www-data "$APP_CONTAINER" php artisan bureaucracy:compile-catalogue --deploy
            docker exec -u www-data "$APP_CONTAINER" php artisan bureaucracy:migrate-dossiers --apply --all
            # Health: /up answers within a minute, or the previous image comes back and the job fails.
            for attempt in $(seq 1 12); do
              if curl -fsS -o /dev/null https://app.expadu.com/up; then docker image prune -f; exit 0; fi
              sleep 5
            done
            echo "Production did not answer /up after the deploy; rolling back."
            if [ -n "$PREVIOUS" ]; then
              docker tag "$PREVIOUS" ghcr.io/anarzone/expadu/app:latest
              docker compose up -d app
            fi
            exit 1
