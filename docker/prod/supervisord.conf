[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:php-fpm]
command=php-fpm -F
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
priority=5

[program:nginx]
command=nginx -g "daemon off;"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
priority=10

[program:ssr]
command=php /var/www/html/artisan inertia:start-ssr
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
priority=15
user=www-data

; Alert evaluators and their per-user pushes. Runs on the redis-commute
; connection (same Redis queues, retry_after 120 s) so a job killed mid-run is
; retried in two minutes, not an hour. --timeout must stay below retry_after.
[program:queue-commute]
command=php /var/www/html/artisan queue:work redis-commute --queue=commute --sleep=1 --tries=3 --timeout=90 --max-time=3600
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
priority=20
stopwaitsecs=90
stopasgroup=true
killasgroup=true
user=www-data

[program:queue-default]
command=php /var/www/html/artisan queue:work redis --queue=default --sleep=3 --tries=3 --max-time=3600
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
priority=21
stopwaitsecs=90
stopasgroup=true
killasgroup=true
user=www-data

; LLM work (event classification and translation, up to 900 s per job) gets its
; own worker so it never holds weather refreshes, mail or media checks behind it.
[program:queue-llm]
command=php /var/www/html/artisan queue:work redis --queue=llm --sleep=3 --tries=2 --max-time=3600
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
priority=22
stopwaitsecs=930
stopasgroup=true
killasgroup=true
user=www-data

; stopasgroup/killasgroup send the stop signal to the commands the scheduler
; started too, so none is left running against a stopped container.
[program:scheduler]
command=php /var/www/html/artisan schedule:work
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
priority=20
stopasgroup=true
killasgroup=true
user=www-data
