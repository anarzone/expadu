; PHP-FPM pool for the app container. Loaded after the image's www.conf, so
; these override its defaults (pm.max_children = 5, no request timeout).
;
; Sizing (EXP-84): prod and staging share one 3.7 GiB / 2 vCPU box with
; ~1.6 GiB free (probed 2026-06-17). A normal request peaks around 45 MB and
; Today's deferred request around 110 MB, so 8 children cost ~360 MB typical
; and ~880 MB if all eight are Today requests at once. Most slow requests wait
; on the network (MOTIS, TRIAS, weather), not CPU, so more children than vCPUs
; pays off. Tune per environment with PHP_FPM_* env vars, no rebuild needed.

[www]
pm = dynamic
pm.max_children = ${PHP_FPM_MAX_CHILDREN}
pm.start_servers = ${PHP_FPM_START_SERVERS}
pm.min_spare_servers = ${PHP_FPM_MIN_SPARE_SERVERS}
pm.max_spare_servers = ${PHP_FPM_MAX_SPARE_SERVERS}

; Recycle workers so a slow leak can't grow a child without bound.
pm.max_requests = 500

; Wall-clock cap. max_execution_time does not count time spent waiting on
; the network, so a hung upstream used to hold a worker forever. Just past
; nginx's fastcgi_read_timeout (60s): nginx has already answered 504 by then.
request_terminate_timeout = 65s

; Pool health for EXP-74's checks — nginx serves it to localhost only.
pm.status_path = /fpm-status
