server {
    listen 8080;
    server_name _;

    root /var/www/html/public;
    index index.php;

    charset utf-8;
    client_max_body_size 20M;

    # Gzip compression — reduces JS/CSS transfer by ~70%.
    # woff2 is already Brotli-compressed, so it is deliberately not listed;
    # TrueType is not, so it is (see the .ttf location below for its MIME type).
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml application/wasm application/manifest+json font/ttf application/x-font-ttf;
    gzip_static on;

    # Pre-compressed Brotli (.br) siblings emitted by vite-plugin-compression2
    # are served to clients that accept `br`; clients that do not still get the
    # .gz sibling via gzip_static. Needs ngx_http_brotli_static_module, which the
    # Dockerfile installs (nginx-mod-http-brotli) and loads via
    # /etc/nginx/modules/*.conf from the stock nginx.conf.
    brotli_static on;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; expires 7d; }
    # robots.txt is a Laravel route (per-host rules), not a file in public/.
    location = /robots.txt {
        access_log off;
        try_files $uri /index.php?$query_string;
    }

    error_page 404 /index.php;

    # PHP-FPM pool status (pm.status_path) — container-local only, for health checks.
    location = /fpm-status {
        allow 127.0.0.1;
        deny all;
        access_log off;
        fastcgi_pass 127.0.0.1:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_NAME /fpm-status;
        fastcgi_param SCRIPT_FILENAME /fpm-status;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        # nginx's default, made explicit: PHP-FPM's request_terminate_timeout
        # (65s, docker/prod/php-fpm.conf) frees the worker just after this.
        fastcgi_read_timeout 60s;

        # Room for large response headers (Link preloads, cookies); nginx's
        # 4k default answered 502 "upstream sent too big header".
        fastcgi_buffer_size 32k;
        fastcgi_buffers 8 32k;
        fastcgi_busy_buffers_size 64k;

        # Ensure Laravel sees HTTPS — Cloudflare terminates TLS upstream
        fastcgi_param HTTP_X_FORWARDED_PROTO "https";
        fastcgi_param HTTP_X_FORWARDED_PORT "443";

        fastcgi_hide_header X-Powered-By;
        fastcgi_hide_header Cache-Control;

        # Revalidate on each request but allow bfcache (instant back-button)
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Alpine's mime.types has no TrueType entry, so .ttf would be sent as
    # application/octet-stream and never match gzip_types. A types block in a
    # location replaces the inherited map, which is fine for a font-only path.
    # Kept after the dotfile rule above so that rule still wins first.
    # A regex location wins over the /fonts/ prefix below, so it repeats the
    # year-long expiry that prefix gives the other fonts.
    location ~* ^/fonts/.+\.ttf$ {
        types { font/ttf ttf; }
        expires 1y;
        access_log off;
    }

    # Favicons and touch icons: no content hash, so a week rather than a year.
    location ~* ^/(favicon[^/]*|apple-touch-icon[^/]*)$ {
        expires 7d;
        access_log off;
    }

    # SW, manifest, and registerSW have no content hash — must revalidate
    location ~ /build/(sw\.js|manifest\.webmanifest|registerSW\.js)$ {
        add_header Cache-Control "no-cache" always;
    }

    # The worker the browser actually registers is /sw.js (npm run build copies
    # it from public/build/sw.js), and the linked manifest is /site.webmanifest.
    # Neither has a content hash, so a cached copy would delay updates; the
    # worker pre-caches /offline.html, so keep that one fresh as well.
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
    }

    location = /site.webmanifest {
        types { application/manifest+json webmanifest; }
        add_header Cache-Control "no-cache" always;
    }

    location = /offline.html {
        add_header Cache-Control "no-cache" always;
    }

    # Vite's manifest keeps its name across builds, so it revalidates.
    location = /build/manifest.json {
        add_header Cache-Control "no-cache" always;
    }

    # Hashed build output: one Cache-Control header (expires plus add_header
    # sent two).
    location /build/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Self-hosted fonts and marketing images: a year, like /build. They carry
    # no content hash, so give a changed file a new name (or purge Cloudflare).
    # Prefix locations, so the dotfile deny above still wins.
    location /fonts/ {
        expires 1y;
        access_log off;
    }

    location /marketing/ {
        expires 1y;
        access_log off;
    }

    location /images/ {
        expires 1y;
        access_log off;
    }
}
