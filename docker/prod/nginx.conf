server {
    listen 8080;
    server_name _;

    root /var/www/html/public;
    index index.php;

    charset utf-8;
    client_max_body_size 20M;

    # Gzip compression — reduces JS/CSS transfer by ~70%.
    # woff2 is already Brotli-compressed, so it is deliberately not listed;
    # TrueType is not, so it is (see the .ttf location below for its MIME type).
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml application/wasm font/ttf application/x-font-ttf;
    gzip_static on;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        # Ensure Laravel sees HTTPS — Cloudflare terminates TLS upstream
        fastcgi_param HTTP_X_FORWARDED_PROTO "https";
        fastcgi_param HTTP_X_FORWARDED_PORT "443";

        fastcgi_hide_header X-Powered-By;
        fastcgi_hide_header Cache-Control;

        # Revalidate on each request but allow bfcache (instant back-button)
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Alpine's mime.types has no TrueType entry, so .ttf would be sent as
    # application/octet-stream and never match gzip_types. A types block in a
    # location replaces the inherited map, which is fine for a font-only path.
    # Kept after the dotfile rule above so that rule still wins first.
    location ~* ^/fonts/.+\.ttf$ {
        types { font/ttf ttf; }
    }

    # SW, manifest, and registerSW have no content hash — must revalidate
    location ~ /build/(sw\.js|manifest\.webmanifest|registerSW\.js)$ {
        add_header Cache-Control "no-cache" always;
    }

    location /build/ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }
}
