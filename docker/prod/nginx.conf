server {
    listen 8080;
    server_name _;

    root /var/www/html/public;
    index index.php;

    charset utf-8;
    client_max_body_size 20M;

    # Gzip compression — reduces JS/CSS transfer by ~70%
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml application/wasm font/woff2;
    gzip_static on;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_hide_header Cache-Control;

        # Revalidate on each request but allow bfcache (instant back-button)
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    # SW, manifest, and registerSW have no content hash — must revalidate
    location ~ /build/(sw\.js|manifest\.webmanifest|registerSW\.js)$ {
        add_header Cache-Control "no-cache" always;
    }

    location /build/ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }
}
