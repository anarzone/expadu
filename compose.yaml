services:
    pgsql:
        build:
            context: ./docker/pgsql
            dockerfile: Dockerfile
        image: expadu-pgsql:16-3.4-pgvector
        ports:
            - '${FORWARD_DB_PORT:-5432}:5432'
        environment:
            PGPASSWORD: '${DB_PASSWORD:-secret}'
            POSTGRES_DB: '${DB_DATABASE}'
            POSTGRES_USER: '${DB_USERNAME}'
            POSTGRES_PASSWORD: '${DB_PASSWORD:-secret}'
        volumes:
            - 'sail-pgsql:/var/lib/postgresql/data'
            - './docker/pgsql/create-testing-database.sql:/docker-entrypoint-initdb.d/10-create-testing-database.sql'
            - './docker/pgsql/create-postgis-extensions.sql:/docker-entrypoint-initdb.d/20-create-postgis-extensions.sql'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - pg_isready
                - '-q'
                - '-d'
                - '${DB_DATABASE}'
                - '-U'
                - '${DB_USERNAME}'
            retries: 3
            timeout: 5s
    redis:
        image: 'redis:alpine'
        ports:
            - '${FORWARD_REDIS_PORT:-6379}:6379'
        volumes:
            - 'sail-redis:/data'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - redis-cli
                - ping
            retries: 3
            timeout: 5s
    embedding:
        build:
            context: ./services/embedding
            dockerfile: Dockerfile
        image: expadu-embedding:latest
        ports:
            - '${FORWARD_EMBEDDING_PORT:-8001}:8000'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - python
                - -c
                - import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()
            interval: 30s
            retries: 3
            start_period: 90s
            timeout: 5s
        restart: unless-stopped
    valhalla:
        image: 'ghcr.io/gis-ops/docker-valhalla/valhalla:latest'
        ports:
            - '${FORWARD_VALHALLA_PORT:-8002}:8002'
        volumes:
            - 'valhalla-data:/custom_files'
        environment:
            - use_tiles_ignore_pbf=True
            - force_rebuild=False
            - serve_tiles=True
            - build_elevation=False
            - build_admins=False
        networks:
            - sail
        restart: unless-stopped
networks:
    sail:
        driver: bridge
volumes:
    sail-pgsql:
        driver: local
    sail-redis:
        driver: local
    valhalla-data:
        driver: local
